- id: AI20-011
  statement: In low-risk pregnancies the heart is examined as part of the standard second-trimester obstetric scan. When risk
    is above that of the general population, referral for fetal echocardiography may be indicated depending on local
    resources, clinical setting, examiner availability and the screening result.
  source: AIUM-2020-FETALECHO
  locator: p. E6, Indications
