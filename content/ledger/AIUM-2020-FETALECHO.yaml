- id: AI20-030
  statement: 'The fetal echocardiogram is a detailed evaluation of cardiac structure and function done as a sequential segmental
    analysis of four areas: the situs, the atria, the ventricles, and the great arteries with their connections. It
    begins by assessing the fetal right/left orientation.'
  source: AIUM-2020-FETALECHO
  locator: 'p. E8, Cardiac Imaging Guidelines: Basic Approach'
  status: ai-extracted
  extracted_by: Claude (Sonnet 5.5), from the full PDF supplied by the project owner, 23 Nov 2026. Locators are the journal's E-page numbers.
  checked_by: null
  verified_by: null
  note: null
- id: AI20-031
  statement: Situs assessment covers the position of the stomach, portal vein, descending aorta and inferior vena cava in the
    axial view of the abdomen, and the cardiac apex position and cardiac axis in the axial view of the chest.
  source: AIUM-2020-FETALECHO
  locator: 'p. E8, Cardiac Imaging Guidelines: Basic Approach'
  status: ai-extracted
  extracted_by: Claude (Sonnet 5.5), from the full PDF supplied by the project owner, 23 Nov 2026. Locators are the journal's E-page numbers.
  checked_by: null
  verified_by: null
  note: null
- id: AI20-032
  statement: Atrial assessment covers the situs, systemic and pulmonary venous connections (including normal and abnormal variations
    such as the ductus venosus), normal connection of at least one right and one left pulmonary vein, and the atrial
    septum, foramen ovale and septum primum.
  source: AIUM-2020-FETALECHO
  locator: 'p. E8, Cardiac Imaging Guidelines: Basic Approach'
  status: ai-extracted
  extracted_by: Claude (Sonnet 5.5), from the full PDF supplied by the project owner, 23 Nov 2026. Locators are the journal's E-page numbers.
  checked_by: null
  verified_by: null
  note: null
- id: AI20-033
  statement: Ventricular assessment covers position, atrioventricular connections including offsetting of the mitral and tricuspid
    valves, right and left ventricular anatomy including the septum, relative and absolute sizes, systolic function
    and the pericardium.
  source: AIUM-2020-FETALECHO
  locator: 'p. E8, Cardiac Imaging Guidelines: Basic Approach'
  status: ai-extracted
  extracted_by: Claude (Sonnet 5.5), from the full PDF supplied by the project owner, 23 Nov 2026. Locators are the journal's E-page numbers.
  checked_by: null
  verified_by: null
  note: null
- id: AI20-034
  statement: Great artery assessment covers ventricular connections; vessel size, patency and flow (velocity and direction);
    relative and absolute sizes of the aortic isthmus and ductus arteriosus; the pulmonary artery bifurcation; and
    the position of the transverse aortic arch and ductus arteriosus relative to the trachea.
  source: AIUM-2020-FETALECHO
  locator: 'p. E8, Cardiac Imaging Guidelines: Basic Approach'
  status: ai-extracted
  extracted_by: Claude (Sonnet 5.5), from the full PDF supplied by the project owner, 23 Nov 2026. Locators are the journal's E-page numbers.
  checked_by: null
  verified_by: null
  note: null
- id: AI20-035
  statement: The atrioventricular junction (valve anatomy, size and function, including stenosis or regurgitation) and the ventriculoarterial
    junction (semilunar valve anatomy, size and function, including the subpulmonary and subaortic regions) should
    also be evaluated.
  source: AIUM-2020-FETALECHO
  locator: 'p. E8, Cardiac Imaging Guidelines: Basic Approach'
  status: ai-extracted
