- id: AI20-047
  statement: 'Additional biometry may be done for a suspected structural or functional anomaly: right and left ventricular lengths;
    aortic arch and isthmus diameters (from the sagittal arch view or the three-vessel and trachea view) with the
    isthmus compared with the ductus; main pulmonary artery and ductus measurements; end-diastolic ventricular diameter
    just below the atrioventricular valve leaflets; free wall and septal thickness in diastole; cardiothoracic ratio.
    Systolic ventricular dimensions, transverse atrial dimensions and branch pulmonary artery diameters may be added
    if clinically relevant.'
  source: AIUM-2020-FETALECHO
  locator: p. E12, Cardiac Biometry
  status: ai-extracted
