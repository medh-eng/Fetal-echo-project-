- id: AI20-061
  statement: 'The transducer should operate at the highest clinically appropriate frequency within ALARA. Resolution trades off
    against penetration: from the anterior abdominal wall frequencies of 1 to 9 MHz are usable depending on maternal
    habitus, and endovaginal scans should use 5 MHz or higher.'
  source: AIUM-2020-FETALECHO
