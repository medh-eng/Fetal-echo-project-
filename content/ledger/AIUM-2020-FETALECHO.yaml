  note: null
- id: AI20-040
  statement: 'Required grayscale views: four-chamber view including the pulmonary veins; left ventricular outflow tract; right
    ventricular outflow tract; branch pulmonary artery bifurcation; three-vessel view (including a view with the pulmonary
    artery bifurcation and a more superior view with the ductal arch); short-axis views (low for the ventricles, high
    for the outflow tracts); long-axis view if clinically relevant; aortic arch; ductal arch; superior and inferior
    venae cavae.'
  source: AIUM-2020-FETALECHO
  locator: p. E8, Grayscale Imaging (Required)
  status: ai-extracted
