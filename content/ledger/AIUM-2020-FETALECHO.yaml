- id: AI20-048
  statement: Right and left heart function should be assessed qualitatively. Cardiomegaly, atrioventricular valve regurgitation
    and hydrops are key signs of cardiac dysfunction. If function is thought to be compromised, quantitative measures
    may be used, including fractional shortening, ventricular strain and the myocardial performance index.
  source: AIUM-2020-FETALECHO
  locator: p. E12, Cardiac Function Assessment
  status: ai-extracted
