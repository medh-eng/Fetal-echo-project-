- id: AI20-051
  statement: Additional motion clips should be considered when a structural or functional anomaly is suspected. Motion clips
    together with still images are a standard part of every fetal echocardiogram; a complete evaluation cannot be
    achieved otherwise.
  source: AIUM-2020-FETALECHO
  locator: p. E13, Specific Documentation of Heart Views; Documentation
