- id: AI20-050
  statement: 'Besides still images of the grayscale, colour and pulsed Doppler views, these motion clips are required for routine
  documentation: an axial sweep from the stomach to the upper mediastinum (including the four-chamber view, outflow
    tracts and three-vessel and trachea view); the four-chamber view, 2D and colour Doppler; the left ventricular
    outflow tract view, 2D and colour Doppler; the right ventricular outflow tract view, 2D and colour Doppler; the
    three-vessel and trachea view, 2D and colour Doppler; the sagittal view of the aortic and ductal arches, 2D and
    colour Doppler.'
  source: AIUM-2020-FETALECHO
  locator: p. E13, Specific Documentation of Heart Views
  status: ai-extracted
