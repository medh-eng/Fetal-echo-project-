  verified_by: null
  note: null
- id: AI20-044
  statement: Pulsed-wave Doppler may also be relevant for the ductus arteriosus, systemic veins, the aortic arch at the isthmus,
    branch pulmonary arteries, the middle cerebral artery and the umbilical artery or vein.
  source: AIUM-2020-FETALECHO
  locator: p. E12, Pulsed Doppler Ultrasound (Required)
  status: ai-extracted
