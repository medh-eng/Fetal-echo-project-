- id: AI20-041
  statement: Not every view may be seen from a single cephalic sweep of the transducer; minor adjustments of transducer position
    and orientation may be needed because of anatomic variation and fetal lie.
  source: AIUM-2020-FETALECHO
  locator: p. E9, Figure 1 legend
