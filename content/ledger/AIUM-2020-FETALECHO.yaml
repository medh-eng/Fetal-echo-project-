- id: AI20-023
  statement: System settings should favour a high frame rate (for example a narrow field of view, small imaging depth, single
    focus and a narrow colour Doppler region of interest) within the ALARA principle. Magnification should be adjusted
    so that the heart fills about one third of the sector display.
  source: AIUM-2020-FETALECHO
  locator: pp. E7-E8, Technical Considerations
