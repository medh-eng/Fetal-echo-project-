- id: AI20-049
  statement: Three- and four-dimensional ultrasound, tissue Doppler and continuous-wave Doppler are adjunctive. Tricuspid annular
    plane systolic excursion and the sphericity index have been reported, but their role in clinical care should be
    considered investigational.
  source: AIUM-2020-FETALECHO
  locator: p. E12, Complementary Imaging Strategies
