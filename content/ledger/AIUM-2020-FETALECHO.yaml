- id: AI20-020
  statement: Fetal echocardiography is commonly performed between 18 and 22 weeks of gestation, although some cardiac structures
    may be better seen before or after that period. Various forms of congenital heart disease may be recognised early
    in pregnancy, including at the nuchal translucency scan.
  source: AIUM-2020-FETALECHO
  locator: p. E7, Technical Considerations
  status: ai-extracted
