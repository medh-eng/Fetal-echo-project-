- id: AI20-021
  statement: Maternal obesity, fetal position and advanced gestation can limit a detailed examination through poor penetration
    and posterior acoustic shadowing, especially in the third trimester.
  source: AIUM-2020-FETALECHO
  locator: p. E7, Technical Considerations
  status: ai-extracted
