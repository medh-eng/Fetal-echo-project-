- id: AI20-010
  statement: Most congenital heart disease occurs without known maternal or fetal risk factors and is often first suspected on
    an anatomic ultrasound survey. A fetus with a suspected abnormal heart on a basic or detailed anatomic scan should
    be referred for fetal echocardiography, because the risk of significant disease is high.
  source: AIUM-2020-FETALECHO
  locator: p. E6, Indications
