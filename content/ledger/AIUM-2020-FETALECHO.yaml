  note: null
- id: AI20-046
  statement: Normal ranges for fetal cardiac measurements are published as percentiles and Z scores based on gestational age
    or fetal biometry. Required measurements, taken on two-dimensional images, are the aortic and pulmonary valve
    annuli in systole and the tricuspid and mitral valve annuli in diastole, each as absolute size and compared left
    with right.
  source: AIUM-2020-FETALECHO
  locator: p. E12, Cardiac Biometry (Required)
  status: ai-extracted
