- id: AI20-060
  statement: The ultrasound system should provide M-mode, pulsed Doppler and power or colour Doppler. Sector, curvilinear and
    endovaginal transducers are used; three- and four-dimensional technology and continuous-wave Doppler are optional
    if clinically relevant.
  source: AIUM-2020-FETALECHO
