- id: AI20-045
  statement: Heart rate and rhythm should be documented by cardiac cycle length measurements using Doppler or M-mode. A normal
    fetal heart rate at mid-gestation is 120 to 180 beats per minute. If bradycardia, tachycardia or an irregular
    rhythm is found, a detailed assessment of atrial and ventricular contractions should follow.
  source: AIUM-2020-FETALECHO
  locator: p. E12, Heart Rate and Rhythm Assessment (Required)
  status: ai-extracted
  extracted_by: Claude (Sonnet 5.5), from the full PDF supplied by the project owner, 23 Nov 2026. Locators are the journal's E-page numbers.
