- id: AI20-062
  statement: The on-screen thermal and mechanical indices should be monitored and dwell time kept to a minimum. The soft-tissue
    thermal index is used before 10 weeks and the bone thermal index at or after 10 weeks. Spectral pulsed Doppler
    has higher energy output and should be used judiciously.
  source: AIUM-2020-FETALECHO
