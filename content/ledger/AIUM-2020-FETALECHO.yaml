- id: AI20-022
  statement: Image quality and fetal position may be improved by optimising transducer placement on the maternal abdomen, applying
    adequate transducer pressure and changing the mother's position.
  source: AIUM-2020-FETALECHO
  locator: p. E7, Technical Considerations
  status: ai-extracted
