- id: AI20-042
  statement: 'Colour Doppler is required to look for flow disturbance in the systemic veins (superior and inferior venae cavae
    and ductus venosus), pulmonary veins (at least two: one right and one left), atrial septum and foramen ovale,
    atrioventricular valves, ventricular septum, semilunar valves, ductal arch and aortic arch.'
  source: AIUM-2020-FETALECHO
  locator: pp. E8, E12, Color Doppler Ultrasound (Required)
  status: ai-extracted
  extracted_by: Claude (Sonnet 5.5), from the full PDF supplied by the project owner, 23 Nov 2026. Locators are the journal's E-page numbers.
  checked_by: null
  verified_by: null
  note: null
- id: AI20-043
  statement: 'Pulsed-wave Doppler is required for the right and left atrioventricular valves, the right and left semilunar valves,
    the pulmonary veins (at least two: one right and one left), the ductus venosus, and any structural or flow abnormality
    suspected on colour Doppler.'
  source: AIUM-2020-FETALECHO
  locator: p. E12, Pulsed Doppler Ultrasound (Required)
  status: ai-extracted
  extracted_by: Claude (Sonnet 5.5), from the full PDF supplied by the project owner, 23 Nov 2026. Locators are the journal's E-page numbers.
