- id: AI20-013
  statement: 'Fetal factors for which fetal echocardiography is indicated: suspected cardiac structural anomaly; suspected abnormal
    cardiac function; hydrops fetalis; persistent tachycardia (above 180 beats per minute); persistent bradycardia
    (below 120 beats per minute) or suspected heart block; frequent episodes of, or persistently irregular, rhythm;
    major extracardiac anomaly; nuchal translucency of 3.5 mm or more, or at or above the 99th percentile for gestational
    age; chromosomal abnormality on invasive testing or cell-free fetal DNA screening; monochorionic twinning.'
  source: AIUM-2020-FETALECHO
  locator: p. E6, Fetal Factors
  status: ai-extracted
  extracted_by: Claude (Sonnet 5.5), from the full PDF supplied by the project owner, 23 Nov 2026. Locators are the journal's E-page numbers.
  checked_by: null
  verified_by: null
  note: null
- id: AI20-014
  statement: 'Fetal factors for which fetal echocardiography may be considered: a systemic venous anomaly (for example a persistent
    right umbilical vein, left superior vena cava or absent ductus venosus), and nuchal translucency between 3.0 and
    3.4 mm.'
  source: AIUM-2020-FETALECHO
  locator: p. E6, Fetal Factors
  status: ai-extracted
  extracted_by: Claude (Sonnet 5.5), from the full PDF supplied by the project owner, 23 Nov 2026. Locators are the journal's E-page numbers.
  checked_by: null
  verified_by: null
  note: null
- id: AI20-015
  statement: 'Maternal or familial factors for which fetal echocardiography is indicated: pregestational diabetes regardless
    of haemoglobin A1c; gestational diabetes diagnosed in the first or early second trimester; in vitro fertilisation
    including intracytoplasmic sperm injection; phenylketonuria (unknown status, or a periconceptional phenylalanine
    level above 10 mg/dL); autoimmune disease with anti-SSA antibodies and a prior affected fetus; a first-degree
    relative with congenital heart disease (parents, siblings or a prior pregnancy); a first- or second-degree relative
    with a Mendelian disease and childhood cardiac manifestations; retinoid exposure; first-trimester rubella infection.'
  source: AIUM-2020-FETALECHO
  locator: pp. E6-E7, Maternal or Familial Disease or Maternal Environmental Exposure
  status: ai-extracted
  extracted_by: Claude (Sonnet 5.5), from the full PDF supplied by the project owner, 23 Nov 2026. Locators are the journal's E-page numbers.
  checked_by: null
  verified_by: null
  note: null
- id: AI20-016
  statement: 'Maternal or familial factors for which fetal echocardiography may be considered: selected teratogen exposure (for
    example paroxetine, carbamazepine or lithium); antihypertensive medication limited to angiotensin-converting enzyme
    inhibitors; anti-SSA positivity without a prior affected fetus; a second-degree relative with congenital heart
    disease.'
  source: AIUM-2020-FETALECHO
  locator: p. E7, Maternal or Familial Disease or Maternal Environmental Exposure
  status: ai-extracted
  extracted_by: Claude (Sonnet 5.5), from the full PDF supplied by the project owner, 23 Nov 2026. Locators are the journal's E-page numbers.
  checked_by: null
  verified_by: null
  note: null
- id: AI20-017
  statement: 'Data are limited for fetal echocardiography in these isolated conditions: obesity (body mass index 30 kg/m2 or
    more); SSRI exposure other than paroxetine; a noncardiac soft marker for aneuploidy without karyotype information;
    abnormal maternal serum analytes such as alpha-fetoprotein; isolated single umbilical artery. A detailed anatomic
    scan that includes the heart may be appropriate instead, with fetal echocardiography only if an abnormality is
    suspected.'
  source: AIUM-2020-FETALECHO
  locator: p. E7, Other Considerations
  status: ai-extracted
  extracted_by: Claude (Sonnet 5.5), from the full PDF supplied by the project owner, 23 Nov 2026. Locators are the journal's E-page numbers.
  checked_by: null
  verified_by: null
  note: null
- id: AI20-018
  statement: 'Some conditions once thought to raise the risk of fetal heart disease were not borne out in larger studies. Fetal
    echocardiography is indicated for them only if a detailed anatomic scan is abnormal: gestational diabetes diagnosed
    after the second trimester; warfarin exposure; alcohol exposure; echogenic intracardiac focus; maternal fever
    or viral infection with seroconversion only; isolated congenital heart disease in a relative more distant than
    second degree.'
  source: AIUM-2020-FETALECHO
  locator: p. E7, Other Considerations
  status: ai-extracted
  extracted_by: Claude (Sonnet 5.5), from the full PDF supplied by the project owner, 23 Nov 2026. Locators are the journal's E-page numbers.
