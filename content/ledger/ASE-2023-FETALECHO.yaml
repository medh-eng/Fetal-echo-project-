  note: 'Reworded after the cross-check found: III.A, Equipment, p. 683 recommends a 2–7 MHz range for late second- and
    third-trimester scanning. The 5–12 MHz range for the earlier window is a possible aid. The claim treats the first
    range as merely suitable.'
- id: AS23-005
  statement: Fetal echocardiographic studies follow the 'as low as reasonably achievable' principle; operators should
    be aware of the thermal and mechanical indices and limit power output and exposure time.
  source: ASE-2023-FETALECHO
  locator: III.B Safety, p. 684
  status: expert-verified
  extracted_by: Claude; reworded 16 Nov 2026 from the ChatGPT cross-check of the PDF. Needs re-check against the PDF
    by a model other than Claude.
  checked_by: ChatGPT (Codex, 2026-11-16)
  verified_by: "Dr Kunda Shahane, 2026-11-21 (review pack of 19 Nov approved in full; approval relayed by the project owner)"
  note: 'Reworded after the cross-check found: III.B, Acoustic Bioeffects, p. 684 applies ALARA to fetal echocardiographic
    studies. It says operators should be aware of TI and MI and limit power and exposure time. “Every fetal study” broadens
    the scope beyond the examination discussed.'
- id: AS23-006
  statement: In early gestation the thermal and mechanical indices should be kept at or below 1.0 and Doppler modalities
    used sparingly.
  source: ASE-2023-FETALECHO
