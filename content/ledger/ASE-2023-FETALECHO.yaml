- id: AS23-004
  statement: Curvilinear transducers are preferred; linear and sector transducers may also be used. A frequency range
    of 2 to 7 MHz is recommended for the late second and third trimesters; 5 to 12 MHz may help in the late first and
    early second trimesters.
  source: ASE-2023-FETALECHO
  locator: III.A Equipment, p. 683
  status: expert-verified
  extracted_by: Claude; reworded 16 Nov 2026 from the ChatGPT cross-check of the PDF. Needs re-check against the PDF
