- id: AS23-014
  statement: 'Table 6 marks these pulsed-wave sites optional: hepatic vein, superior and inferior venae cavae, a great-artery
    and arch row that names the transverse aortic segment and the isthmus, branch pulmonary arteries, middle cerebral
    artery, a combined left ventricular inflow and outflow recording for isovolumic relaxation time, and tissue Doppler
    at the lateral tricuspid and mitral annulus.'
  source: ASE-2023-FETALECHO
  locator: Table 6, p. 693
  status: expert-verified
  note: The guideline text (III.G PW Doppler, p. 689; Figure 10, p. 694) includes 'arches' generically in its minimum
    pulsed-wave assessment, while Table 6 (p. 693) marks the transverse aortic segment and isthmus optional and separately
    requires the distal ductus arteriosus at its aortic insertion. The guideline does not reconcile the two. Confirmed
