- id: AS23-021
  statement: Three-dimensional imaging and spatiotemporal image correlation (STIC) can add anatomical and functional
    information, but STIC has not been validated for clinical use.
  source: ASE-2023-FETALECHO
  locator: III.I Alternative ultrasound modalities, p. 693
