  note: null
- id: AS23-012
  statement: Pulsed-wave Doppler gives the flow profile and direction at a chosen site. The beam should run along the
    flow or at an angle of less than 20 degrees to it; a small sample gate reduces the chance of sampling more than one
    site.
  source: ASE-2023-FETALECHO
  locator: III.G Doppler ultrasonography, p. 689
  status: expert-verified
  extracted_by: Claude; reworded 16 Nov 2026 from the ChatGPT cross-check of the PDF. Needs re-check against the PDF
    by a model other than Claude.
  checked_by: ChatGPT (Codex, 2026-11-16)
  verified_by: "Dr Kunda Shahane, 2026-11-21 (review pack of 19 Nov approved in full; approval relayed by the project owner)"
  note: 'Reworded after the cross-check found: III.G, PW Doppler Ultrasound, p. 689 specifies alignment along flow or
    an angle strictly below 20°, excluding 20°. A small gate reduces the chance of sampling multiple sites. It does not
    guarantee a single-site signal.'
- id: AS23-013
  statement: 'Sites where pulsed-wave Doppler is required in a fetal echocardiogram: umbilical vein, ductus venosus,
    at least one pulmonary vein on each side, tricuspid and mitral inflow, aortic and pulmonary outflow, the distal ductus
    arteriosus and the umbilical artery.'
  source: ASE-2023-FETALECHO
  locator: Table 6, p. 693
  status: expert-verified
  extracted_by: Claude, from the PDF on asecho.org read through a web reader, first 100,000 characters only (13 Nov 2026).
