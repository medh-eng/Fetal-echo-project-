- id: AS23-007
  statement: Scanning frame rates above 30 to 40 Hz are recommended; rates of 80 to 100 Hz may be needed to capture
    important events at heart rates above 140 beats per minute, or for speckle tracking. Narrowing the sector and
    choosing an appropriate depth help achieve this.
  source: ASE-2023-FETALECHO
  locator: III.D Image optimization, p. 684
  status: ai-cross-checked
  extracted_by: Claude; reworded 16 Nov 2026 from the ChatGPT cross-check of the PDF. Needs re-check against the
    PDF by a model other than Claude.
  checked_by: "ChatGPT (Codex, 2026-11-16)"
  verified_by: null
  note: 'Reworded after the cross-check found: III.D, Image Optimization, p. 684 gives the higher 80–100 Hz range
    for capturing important events at heart rates above 140 beats/min or for speckle tracking. “Faster” omits the
    stated threshold. The baseline frame rate and adjustment techniques agree.'
- id: AS23-008
  statement: The study should include still images, moving clips and a structured report. A sweep from the abdomen
    at the level of the stomach to the upper mediastinum is required, together with both two-dimensional and colour
    clips of the individual views the guideline names, including both the three-vessel view and the three-vessel-and-trachea
    view.
  source: ASE-2023-FETALECHO
  locator: III.A Storage, p. 684; III.E, p. 684-688
  status: ai-cross-checked
  extracted_by: Claude; reworded 16 Nov 2026 from the ChatGPT cross-check of the PDF. Needs re-check against the
    PDF by a model other than Claude.
  checked_by: "ChatGPT (Codex, 2026-11-16)"
  verified_by: null
  note: 'Reworded after the cross-check found: III.A, Storage, p. 684 says the study should include stills, motion
    and a structured report. It requires an abdominal-stomach to upper-mediastinal sweep and both 2D and colour
    clips for the named individual views, including both 3VV and 3VT. The claim drops the mode requirements.'
- id: AS23-009
  statement: Colour Doppler shows whether flow is present and in which direction; it is used to look for valve stenosis
    and regurgitation, flow across the foramen ovale, the integrity of the septa and the patency of vessels.
  source: ASE-2023-FETALECHO
  locator: 'III.E Standard views: four-chamber view, p. 687; LV outflow tract, p. 688; RV outflow, three-vessel-and-trachea,
