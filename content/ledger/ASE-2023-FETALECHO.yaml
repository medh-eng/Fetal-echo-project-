- id: AS23-022
  statement: Tissue Doppler and strain imaging, including two-dimensional speckle tracking, are well studied after
    birth and may detect subtle dysfunction, but their routine use in the fetus is not established and needs further
    investigation.
  source: ASE-2023-FETALECHO
