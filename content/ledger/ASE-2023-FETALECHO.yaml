  verified_by: null
  note: null
- id: AS23-012
  statement: Pulsed-wave Doppler gives the flow profile and direction at a chosen site. The beam should run along
    the flow or at an angle of less than 20 degrees to it; a small sample gate reduces the chance of sampling more
    than one site.
  source: ASE-2023-FETALECHO
  locator: III.G Doppler ultrasonography, p. 689
  status: ai-cross-checked
  extracted_by: Claude; reworded 16 Nov 2026 from the ChatGPT cross-check of the PDF. Needs re-check against the
    PDF by a model other than Claude.
  checked_by: "ChatGPT (Codex, 2026-11-16)"
  verified_by: null
  note: 'Reworded after the cross-check found: III.G, PW Doppler Ultrasound, p. 689 specifies alignment along flow
    or an angle strictly below 20°, excluding 20°. A small gate reduces the chance of sampling multiple sites. It
    does not guarantee a single-site signal.'
- id: AS23-013
  statement: 'Sites where pulsed-wave Doppler is required in a fetal echocardiogram: umbilical vein, ductus venosus,
    at least one pulmonary vein on each side, tricuspid and mitral inflow, aortic and pulmonary outflow, the distal
    ductus arteriosus and the umbilical artery.'
  source: ASE-2023-FETALECHO
  locator: Table 6, p. 693
  status: ai-cross-checked
  extracted_by: Claude, from the PDF on asecho.org read through a web reader, first 100,000 characters only (13
    Nov 2026). Page numbers must be confirmed against the PDF at cross-check.
  checked_by: ChatGPT (GPT-6, 2026-11-16)
  verified_by: null
  note: null
- id: AS23-014
  statement: 'Table 6 marks these pulsed-wave sites optional: hepatic vein, superior and inferior venae cavae, a
    great-artery and arch row that names the transverse aortic segment and the isthmus, branch pulmonary arteries,
    middle cerebral artery, a combined left ventricular inflow and outflow recording for isovolumic relaxation time,
    and tissue Doppler at the lateral tricuspid and mitral annulus.'
  source: ASE-2023-FETALECHO
  locator: Table 6, p. 693
  status: ai-cross-checked
  note: The guideline text (III.G PW Doppler, p. 689; Figure 10, p. 694) includes 'arches' generically in its minimum
    pulsed-wave assessment, while Table 6 (p. 693) marks the transverse aortic segment and isthmus optional and
    separately requires the distal ductus arteriosus at its aortic insertion. The guideline does not reconcile the
    two. Confirmed by the ChatGPT cross-check of 16 Nov 2026. Editor to decide how the course teaches this (question
    Q1).
  extracted_by: Claude; reworded 16 Nov 2026 from the ChatGPT cross-check of the PDF. Needs re-check against the
