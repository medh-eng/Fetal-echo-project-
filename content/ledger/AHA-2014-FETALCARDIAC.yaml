- id: AH14-325
  topic: delivery planning
  statement: 'In d-TGA, foramen ovale findings reported to predict restriction are: septum primum angle below 30° to
    the atrial septum, bowing of septum primum more than 50% into the left atrium, loss of normal swinging motion, and
    a hypermobile septum primum; these call for planned urgent balloon atrial septostomy, on site if possible (Class
    I, LOE B), and prostaglandin E1 (I, B).'
  source: AHA-2014-FETALCARDIAC
  locator: Table 20 (fetal predictors for delivery planning), p. 2225
  status: ai-cross-checked
