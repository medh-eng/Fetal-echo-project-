- id: AH14-319
  topic: delivery planning
  statement: 'Level of care 2: minimal risk of instability in the delivery room but needing catheterisation or surgery
    after birth (ductal-dependent lesions such as HLHS, critical coarctation, severe aortic stenosis, interrupted arch,
    PA/IVS, severe tetralogy); consider planned induction near term, delivery at a hospital with a neonatologist and
    accessible cardiology, start prostaglandin if indicated, then transfer.'
