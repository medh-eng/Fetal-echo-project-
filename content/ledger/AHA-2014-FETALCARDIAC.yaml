- id: AH14-328
  topic: delivery planning
  statement: In Ebstein anomaly with hydrops or uncontrolled arrhythmia, early delivery may be considered, with measures
    to lower pulmonary resistance, treat arrhythmia and support output (Class IIb, LOE C).
  source: AHA-2014-FETALCARDIAC
