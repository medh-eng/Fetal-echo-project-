source: AHA-2014-FETALCARDIAC
claims:
- id: AH14-001
  topic: referral
  statement: 'Referral for fetal cardiac evaluation is indicated for: pregestational diabetes or diabetes diagnosed in
    the first trimester (Class I, LOE A); uncontrolled phenylketonuria (I, A); SSA/SSB autoantibodies with a previously
    affected child (I, B); retinoic acid (I, B) or NSAIDs in the third trimester (I, A); first-trimester rubella (I,
    C); infection with suspected fetal myocarditis (I, C).'
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Cardiac Evaluation, p. 2226, recommendation 1
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
    then checked by the extractor against the PDF pages
  checked_by: "ChatGPT (GPT-6, 2026-11-19)"
  verified_by: null
  note: "Checked by the extractor (Claude) against the printed page or table on 17 Nov 2026."
- id: AH14-002
  topic: referral
  statement: "Referral is indicated for: congenital heart disease (CHD) in a first-degree relative of the fetus - mother, father or sibling (Class I, LOE B); a relative with a Mendelian disorder associated with CHD (I, C); a suspected cardiac abnormality on obstetric ultrasound (I, B); an extracardiac abnormality on obstetric ultrasound (I, B); a suspected or confirmed chromosome abnormality (I, C); fetal tachycardia, bradycardia or frequent or persistent irregular rhythm (I, C); nuchal translucency above the 99th centile (3.5 mm or more), or above the 95th centile (3 mm or more) with abnormal ductus venosus flow (I, A); monochorionic twins (I, A); hydrops or effusions (I, B)."
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Cardiac Evaluation, p. 2226, recommendation 2
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
    then checked by the extractor against the PDF pages
  checked_by: "ChatGPT (GPT-6, 2026-11-21)"
  verified_by: null
  note: "REWORDED 21 Nov 2026 by the extractor (Claude (Opus 5.5, 2026-11-21)) against the printed page, after ChatGPT (GPT-6, 2026-11-19) found it DISTORTED: p. 2226, recommendation 2. The familial indication is congenital heart disease (CHD), both for the first-degree relative and for the Mendelian association. Generic heart disease broadens referral. The remaining indications, both NT cutoffs, the ductus venosus condition and the individual grades match. Needs re-check by a non-Claude model (round 5, task J)."
- id: AH14-003
  topic: referral
  statement: 'Referral is reasonable for: SSA/SSB autoantibodies without a previously affected child (Class IIa, LOE
    B); ACE inhibitors (IIa, B); pregnancy by assisted reproduction (IIa, A); nuchal translucency above the 95th centile
    (3.0 mm or more) (IIa, A).'
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Cardiac Evaluation, p. 2226, recommendation 3
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
    then checked by the extractor against the PDF pages
  checked_by: "ChatGPT (GPT-6, 2026-11-19)"
  verified_by: null
  note: "Checked by the extractor (Claude) against the printed page or table on 17 Nov 2026."
- id: AH14-004
  topic: referral
  statement: "Referral may be considered for: anticonvulsants (Class IIb, LOE A); lithium (IIb, B); vitamin A (IIb, B); SSRIs, paroxetine only (IIb, A); NSAIDs in the first or second trimester (IIb, B); CHD in a second-degree relative (IIb, B); abnormality of the umbilical cord, placenta or intra-abdominal veins (IIb, C)."
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Cardiac Evaluation, p. 2226, recommendation 4
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
    then checked by the extractor against the PDF pages
  checked_by: "ChatGPT (GPT-6, 2026-11-21)"
  verified_by: null
  note: "REWORDED 21 Nov 2026 by the extractor (Claude (Opus 5.5, 2026-11-21)) against the printed page, after ChatGPT (GPT-6, 2026-11-19) found it DISTORTED: p. 2226, recommendation 4. The second-degree relative must have congenital heart disease. Generic heart disease expands this IIb/B indication. The listed exposures, anatomical finding and other grades match. Needs re-check by a non-Claude model (round 5, task J)."
- id: AH14-005
  topic: referral
  statement: "Referral is not indicated for: gestational diabetes with HbA1c below 6% (Class III, LOE B); SSRIs other than paroxetine (III, A); vitamin K agonists, as printed, although a fetal survey is recommended (III, B); infection other than rubella with seroconversion only (III, C); isolated CHD in a relative beyond the second degree (III, B)."
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Cardiac Evaluation, p. 2226, recommendation 5
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
    then checked by the extractor against the PDF pages
  checked_by: "ChatGPT (GPT-6, 2026-11-21)"
  verified_by: null
  note: "Vitamin K agonists'' is as printed; vitamin K antagonists (warfarin) are probably meant. For the editor. REWORDED 21 Nov 2026 by the extractor (Claude (Opus 5.5, 2026-11-21)) against the printed page, after ChatGPT (GPT-6, 2026-11-19) found it DISTORTED: p. 2226, recommendation 5. The family-history exception refers specifically to isolated congenital heart disease. The HbA1c cutoff and all III grades match. The vitamin K caveat accurately flags an internal inconsistency: recommendation 5 prints “agonists”, whereas Table 2 lists antagonists. Refer the discrepancy to the editor. Needs re-check by a non-Claude model (round 5, task J)."
- id: AH14-006
  topic: fetal echocardiogram
  statement: A fetal echocardiogram should include still and cine images of the standard views - four-chamber sweeping
    posterior to anterior, both outflow tracts, three-vessel-and-trachea, aortic and ductal arches, superior and inferior
    vena cava (Class I, LOE A) - and short- and long-axis views (I, B).
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Echocardiogram, p. 2226, recommendation 6
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
    then checked by the extractor against the PDF pages
  checked_by: "ChatGPT (GPT-6, 2026-11-19)"
  verified_by: null
  note: "Checked by the extractor (Claude) against the printed page or table on 17 Nov 2026."
- id: AH14-007
  topic: fetal echocardiogram
  statement: A fetal echocardiogram should include 2D still and cine clips of the atria (size, septum), ventricles (size
    compared right and left, function, septum), atrioventricular and semilunar valves (sizes compared), great arteries
    (size, position to each other and to the trachea), ductal and aortic arches, systemic and pulmonary veins (Class
    I, LOE A).
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Echocardiogram, p. 2226, recommendation 7
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
    then checked by the extractor against the PDF pages
  checked_by: "ChatGPT (GPT-6, 2026-11-19)"
  verified_by: null
  note: "Checked by the extractor (Claude) against the printed page or table on 17 Nov 2026."
- id: AH14-008
  topic: fetal echocardiogram
  statement: A fetal echocardiogram should include colour Doppler of the systemic veins, pulmonary veins, atrioventricular
    valves, atrial and ventricular septa, semilunar valves, ductus arteriosus, aortic arch and ductus venosus (Class
    I, LOE B), and pulsed Doppler of the atrioventricular and semilunar valves and ductus venosus (I, B/C).
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Echocardiogram, p. 2226, recommendation 8
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
    then checked by the extractor against the PDF pages
  checked_by: "ChatGPT (GPT-6, 2026-11-19)"
  verified_by: null
  note: "Checked by the extractor (Claude) against the printed page or table on 17 Nov 2026."
- id: AH14-009
  topic: fetal echocardiogram
  statement: A fetal echocardiogram should assess heart rate and rhythm with pulsed Doppler, M-mode or tissue Doppler,
    and assess function qualitatively, excluding cardiomegaly and hydrops (Class I, LOE B).
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Echocardiogram, p. 2226, recommendation 9
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
    then checked by the extractor against the PDF pages
  checked_by: "ChatGPT (GPT-6, 2026-11-19)"
  verified_by: null
  note: "Checked by the extractor (Claude) against the printed page or table on 17 Nov 2026."
- id: AH14-010
  topic: fetal echocardiogram
  statement: In specific situations a fetal echocardiogram should add valve measurements with gestational-age Z-scores,
    the cardiothoracic ratio, detailed rhythm assessment and advanced function assessment (right and left output, inflow
    for diastolic function, systemic and pulmonary vein Doppler, myocardial performance index, isovolumic times, shortening
    fraction, cardiovascular profile score) (Class I, LOE B/C).
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Echocardiogram, p. 2226, recommendation 10
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
    then checked by the extractor against the PDF pages
  checked_by: "ChatGPT (GPT-6, 2026-11-19)"
  verified_by: null
  note: "Checked by the extractor (Claude) against the printed page or table on 17 Nov 2026."
- id: AH14-011
  topic: fetal echocardiogram
  statement: It is reasonable to include valve measurements and ventricular length compared right with left, and pulsed
    Doppler of the systemic and pulmonary veins, aortic and ductal arches, and umbilical artery and vein (Class IIa,
    LOE B).
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Echocardiogram, p. 2226, recommendation 11
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
