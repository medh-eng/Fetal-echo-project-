  topic: delivery planning
  statement: 'In d-TGA, foramen ovale findings reported to predict restriction are: septum primum angle below 30° to
    the atrial septum, bowing of septum primum more than 50% into the left atrium, loss of normal swinging motion, and
    a hypermobile septum primum; these call for planned urgent balloon atrial septostomy, on site if possible (Class
    I, LOE B), and prostaglandin E1 (I, B).'
  source: AHA-2014-FETALCARDIAC
  locator: Table 20 (fetal predictors for delivery planning), p. 2225
  status: ai-extracted
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
    then checked by the extractor against the PDF pages
  checked_by: null
  verified_by: null
  note: The table adds that all fetuses with d-TGA and a concerning septum primum should be considered at risk. Checked
    by the extractor (Claude) against the printed page or table on 17 Nov 2026; still needs an independent cross-check.
- id: AH14-326
  topic: delivery planning
  statement: In d-TGA, an abnormal ductus (small, or with accelerated, bidirectional or reversed diastolic flow) should
    lead to consideration of treatment for pulmonary hypertension (Class IIb, LOE C).
  source: AHA-2014-FETALCARDIAC
