- id: AH14-013
  topic: advanced techniques
  statement: "Research tools reasonable for specific indications: cardiac MRI (heterotaxy, venous anatomy, extracardiac anomalies), tissue Doppler (time intervals, rhythm), fetal electrocardiography (monitoring after rupture of membranes) and fetal magnetocardiography (conduction and rhythm in known or suspected conduction system disease) (Class IIa, LOE B/C)."
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Advanced Techniques, p. 2227, recommendation 13
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
    then checked by the extractor against the PDF pages
  checked_by: "ChatGPT (GPT-6, 2026-11-21)"
  verified_by: null
  note: "REWORDED 21 Nov 2026 by the extractor (Claude (Opus 5.5, 2026-11-21)) against the printed page, after ChatGPT (GPT-6, 2026-11-19) found it DISTORTED: p. 2227, recommendation 13. The fetal magnetocardiography indication includes known as well as suspected conduction system abnormalities. The ledger gives only suspected disease. The research status, other indications and IIa/B/C grade match. Needs re-check by a non-Claude model (round 5, task J)."
- id: AH14-014
  topic: genetics
  statement: "Fetuses with known congenital heart disease should have genetic counselling with an offer of testing for aneuploidy, and a detailed anatomy ultrasound (Class I, LOE A)."
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Extracardiac Assessment, p. 2227, recommendation 14
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
    then checked by the extractor against the PDF pages
  checked_by: "ChatGPT (GPT-6, 2026-11-21)"
  verified_by: null
  note: "REWORDED 21 Nov 2026 by the extractor (Claude (Opus 5.5, 2026-11-21)) against the printed page, after ChatGPT (GPT-6, 2026-11-19) found it DISTORTED: p. 2227, recommendation 14. The I/A recommendation applies to fetuses with known congenital heart disease. The ledger expands this to known heart disease generally. The counselling, testing offer and detailed survey match. Needs re-check by a non-Claude model (round 5, task J)."
- id: AH14-015
  topic: extracardiac
  statement: "Fetal brain MRI is reasonable when a brain abnormality is suspected in known congenital heart disease, and chest MRI to assess lung volume with congenital diaphragmatic hernia (Class IIa, LOE B)."
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Extracardiac Assessment, p. 2227, recommendation 15
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
