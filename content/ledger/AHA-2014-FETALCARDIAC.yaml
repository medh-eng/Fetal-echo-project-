- id: AH14-009
  topic: fetal echocardiogram
  statement: A fetal echocardiogram should assess heart rate and rhythm with pulsed Doppler, M-mode or tissue Doppler,
    and assess function qualitatively, excluding cardiomegaly and hydrops (Class I, LOE B).
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Echocardiogram, p. 2226, recommendation 9
