- id: AH14-022
  topic: arrhythmia treatment
  statement: Medical therapy gives no benefit for sinus bradycardia or irregular rhythm from extrasystoles (Class III,
    LOE A), or for intermittent SVT, or intermittent VT below 200 beats/min (accelerated ventricular rhythm), without
    compromise or hydrops (III, B/C).
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Medical Therapy, p. 2227, recommendation 22
  status: ai-cross-checked
