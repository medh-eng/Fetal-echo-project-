- id: AH14-004
  topic: referral
  statement: 'Referral may be considered for: anticonvulsants (Class IIb, LOE A); lithium (IIb, B); vitamin A (IIb, B);
    SSRIs, paroxetine only (IIb, A); NSAIDs in the first or second trimester (IIb, B); heart disease in a second-degree
    relative (IIb, B); abnormality of the umbilical cord, placenta or intra-abdominal veins (IIb, C).'
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Cardiac Evaluation, p. 2226, recommendation 4
