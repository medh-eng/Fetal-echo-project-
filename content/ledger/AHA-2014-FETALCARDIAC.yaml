  topic: arrhythmia treatment
  statement: Dexamethasone may be considered for immune-mediated second-degree atrioventricular block, or first-degree
    block with signs of cardiac inflammation (Class IIb, LOE B); digoxin may be considered for signs of heart failure
    (IIb, A).
  source: AHA-2014-FETALCARDIAC
