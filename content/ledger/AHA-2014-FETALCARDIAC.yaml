  topic: fetal intervention
  statement: Fetal catheter intervention may be considered for aortic stenosis with antegrade flow and evolving hypoplastic
    left heart; aortic stenosis with severe mitral regurgitation and restrictive atrial septum; hypoplastic left heart
    with severely restrictive or intact atrial septum; and pulmonary atresia with intact septum (Class IIb, LOE B/C).
  source: AHA-2014-FETALCARDIAC
