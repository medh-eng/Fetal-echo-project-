  note: "REWORDED 21 Nov 2026 by the extractor (Claude (Opus 5.5, 2026-11-21)) against the printed page, after ChatGPT (GPT-6, 2026-11-19) found it DISTORTED: p. 2227, recommendation 15. The brain MRI indication concerns a suspected brain abnormality in known congenital heart disease. The ledger omits congenital. The separate lung-volume indication in diaphragmatic hernia and IIa/B grade agree. Needs re-check by a non-Claude model (round 5, task J)."
- id: AH14-016
  topic: extracardiac
  statement: "Brain MRI to screen for cerebral anomalies in known congenital heart disease, or chest MRI to assess lung volumes when pulmonary hypoplasia is suspected, may be reasonable (Class IIb, LOE B)."
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Extracardiac Assessment, p. 2227, recommendation 16
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
