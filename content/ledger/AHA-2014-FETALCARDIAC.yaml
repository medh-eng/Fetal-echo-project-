- id: AH14-320
  topic: delivery planning
  statement: 'Level of care 3: likely instability in the delivery room needing immediate specialist stabilisation (d-TGA
    with concerning atrial septum primum - all d-TGA without an atrial septal defect may reasonably be considered at
    risk - uncontrolled arrhythmias, complete heart block with heart failure); planned induction at 38-39 weeks, caesarean
    if needed to coordinate, delivery where rapid stabilising care is possible, neonatologist and cardiac specialist
    in the delivery room.'
