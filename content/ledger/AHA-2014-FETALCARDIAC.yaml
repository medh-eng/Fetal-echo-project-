- id: AH14-017
  topic: fetal wellness
  statement: "Fetal wellness assessment in known congenital heart disease may be reasonable: maternal kick counts, and non-stress testing and biophysical profile from the third trimester in fetuses at risk of hypoxaemia or acidosis (Class IIb, LOE C)."
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Wellness Assessment, p. 2227, recommendation 17
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
