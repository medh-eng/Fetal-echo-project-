  verified_by: null
  note: "REWORDED 21 Nov 2026 by the extractor (Claude (Opus 5.5, 2026-11-21)) against the printed page, after ChatGPT (GPT-6, 2026-11-19) found it DISTORTED: p. 2227, recommendation 17. The statement limits this IIb/C recommendation to known congenital heart disease. The timing and hypoxaemia/acidosis risk conditions on nonstress testing and biophysical profiling are otherwise preserved. Needs re-check by a non-Claude model (round 5, task J)."
- id: AH14-018
  topic: arrhythmia treatment
  statement: Medical therapy should be offered for sustained SVT or VT or other sustained tachycardias (multifocal atrial,
    atrial ectopic, permanent junctional reciprocating, junctional ectopic) with average rates above 200 beats/min if
    the fetus is not near term, and for hydropic fetuses whose arrhythmia is thought to cause the compromise (Class I,
    LOE A).
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Medical Therapy, p. 2227, recommendation 18
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
    then checked by the extractor against the PDF pages
  checked_by: "ChatGPT (GPT-6, 2026-11-19)"
  verified_by: null
  note: "Printed wording leaves open whether 'above 200 beats/min' qualifies every tachycardia listed. 2014; check against AHA-2024-ARRHYTHMIA-DRUGS. Checked by the extractor (Claude) against the printed page or table on 17 Nov 2026."
- id: AH14-019
  topic: arrhythmia treatment
  statement: "It is reasonable to consider sympathomimetic therapy for atrioventricular block with a ventricular rate below 55 beats/min, or at a higher rate with severe congenital heart disease, heart failure or hydrops (Class IIa, LOE B)."
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Medical Therapy, p. 2227, recommendation 19
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
    then checked by the extractor against the PDF pages
  checked_by: "ChatGPT (GPT-6, 2026-11-21)"
  verified_by: null
  note: "2014; check against AHA-2024-ARRHYTHMIA-DRUGS. REWORDED 21 Nov 2026 by the extractor (Claude (Opus 5.5, 2026-11-21)) against the printed page, after ChatGPT (GPT-6, 2026-11-19) found it DISTORTED: p. 2227, recommendation 19. For AV block the IIa/B recommendation is to consider sympathomimetics. At higher ventricular rates its structural criterion is severe congenital heart disease, not severe heart disease of any cause. The less-than-55 bpm cutoff and heart failure or hydrops alternatives match. Needs re-check by a non-Claude model (round 5, task J)."
- id: AH14-020
  topic: arrhythmia treatment
  statement: "It is reasonable to consider medical therapy for intermittent VT at rates above 200 beats/min (Class IIa, LOE B)."
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Medical Therapy, p. 2227, recommendation 20
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
