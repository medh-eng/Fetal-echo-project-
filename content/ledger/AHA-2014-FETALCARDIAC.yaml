- id: AH14-025
  topic: delivery planning
  statement: Specialised delivery room planning is reasonable for hypoplastic left heart with restrictive or intact atrial
    septum and abnormal pulmonary vein flow (forward-to-reverse ratio below 3) or an abnormal third-trimester hyperoxia
    test, and for complete heart block with low ventricular rate, dysfunction or hydrops (Class IIa, LOE B/C).
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Specialized Delivery Room Care, p. 2227, recommendation 25
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
