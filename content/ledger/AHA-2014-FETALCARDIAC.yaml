    diagnosed in the first trimester, uncontrolled phenylketonuria, anti-SSA/SSB antibodies with a previously affected
    child, retinoic acid exposure, third-trimester NSAID use, first-trimester rubella, and infection with suspected fetal
    myocarditis.
  source: AHA-2014-FETALCARDIAC
