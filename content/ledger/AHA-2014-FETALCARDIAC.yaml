- id: AH14-023
  topic: fetal intervention
  statement: "Fetal catheter intervention may be considered for aortic stenosis with antegrade flow and evolving hypoplastic left heart; aortic stenosis with severe mitral regurgitation and restrictive atrial septum; hypoplastic left heart with severely restrictive or intact atrial septum; and pulmonary atresia with intact ventricular septum (Class IIb, LOE B/C)."
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Intervention, p. 2227, recommendation 23
  status: ai-cross-checked
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
    then checked by the extractor against the PDF pages
  checked_by: "ChatGPT (GPT-6, 2026-11-21)"
  verified_by: null
  note: "REWORDED 21 Nov 2026 by the extractor (Claude (Opus 5.5, 2026-11-21)) against the printed page, after ChatGPT (GPT-6, 2026-11-19) found it DISTORTED: p. 2227, recommendation 23. The fourth IIb/B/C indication specifies pulmonary atresia with an intact ventricular septum (PA/IVS). The ledger leaves the septum unspecified in a list also discussing the atrial septum. The three other lesion combinations match. Needs re-check by a non-Claude model (round 5, task J)."
- id: AH14-024
  topic: delivery planning
  statement: Specialised delivery room care should be planned for d-TGA, and for sustained or uncontrolled tachyarrhythmia
    with heart failure or hydrops (Class I, LOE B/C).
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Specialized Delivery Room Care, p. 2227, recommendation 24
  status: ai-cross-checked
