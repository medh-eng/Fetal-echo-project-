# Evidence ledger: claims from AHA-2014-FETALCARDIAC (Donofrio et al., Circulation 2014;129:2183-2242).
# All extracted by Claude on 17 Nov 2026 from the published PDF in the University of California
# eScholarship repository, first through a web reader, then checked against the PDF pages by the
# extractor (Recommendations section and Tables 10, 11, 19, 20 read as printed; every number and
# page number matched). The PDF carries the published correction (Circulation 2014;129:e512),
# which changes only the endorsements. They need a cross-check against the PDF by a
# model other than Claude. Paraphrased. A 2014 statement: where ASE 2023 or AHA 2024 says
# otherwise, the later document is to be preferred; differences are flagged in `note`.
# Statements the document calls uncertain or investigational are marked in `note`.

source: AHA-2014-FETALCARDIAC
claims:
- id: AH14-001
  topic: referral
  statement: 'Referral for fetal cardiac evaluation is indicated for: pregestational diabetes or diabetes diagnosed in
    the first trimester (Class I, LOE A); uncontrolled phenylketonuria (I, A); SSA/SSB autoantibodies with a previously
    affected child (I, B); retinoic acid (I, B) or NSAIDs in the third trimester (I, A); first-trimester rubella (I,
    C); infection with suspected fetal myocarditis (I, C).'
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Cardiac Evaluation, p. 2226, recommendation 1
  status: ai-extracted
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
    then checked by the extractor against the PDF pages
  checked_by: null
  verified_by: null
  note: Checked by the extractor (Claude) against the printed page or table on 17 Nov 2026; still needs an independent
    cross-check.
- id: AH14-002
  topic: referral
  statement: 'Referral is indicated for: heart disease in a first-degree relative of the fetus - mother, father or sibling
    (Class I, LOE B); a relative with a Mendelian disorder associated with heart disease (I, C); a suspected cardiac
    abnormality on obstetric ultrasound (I, B); an extracardiac abnormality on obstetric ultrasound (I, B); a suspected
    or confirmed chromosome abnormality (I, C); fetal tachycardia, bradycardia or frequent or persistent irregular rhythm
    (I, C); nuchal translucency above the 99th centile (3.5 mm or more), or above the 95th centile (3 mm or more) with
    abnormal ductus venosus flow (I, A); monochorionic twins (I, A); hydrops or effusions (I, B).'
  source: AHA-2014-FETALCARDIAC
  locator: Recommendations, Fetal Cardiac Evaluation, p. 2226, recommendation 2
  status: ai-extracted
  extracted_by: Claude (Opus 5.5, 2026-11-17), from the published PDF (eScholarship copy), first through a web reader,
