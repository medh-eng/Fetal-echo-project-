- id: AH14-013
  topic: advanced techniques
  statement: 'Research tools reasonable for specific indications: cardiac MRI (heterotaxy, venous anatomy, extracardiac
    anomalies), tissue Doppler (time intervals, rhythm), fetal electrocardiography (monitoring after rupture of membranes)
    and fetal magnetocardiography (conduction and rhythm in suspected conduction disease) (Class IIa, LOE B/C).'
