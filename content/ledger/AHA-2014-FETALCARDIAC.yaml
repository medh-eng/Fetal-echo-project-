- id: AH14-329
  topic: delivery planning
  statement: In tachyarrhythmia with rapid rate, reduced function, or pericardial effusion or hydrops, early delivery
    should be considered if gestation is appropriate, with urgent cardioversion or medical therapy in the delivery room
    if possible (Class I, LOE C).
  source: AHA-2014-FETALCARDIAC
