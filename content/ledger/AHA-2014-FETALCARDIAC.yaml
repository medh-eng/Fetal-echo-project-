- id: AH14-321
  topic: delivery planning
  statement: 'Level of care 4: expected instability at placental separation needing immediate catheterisation or surgery
    in the delivery room (HLHS with severely restrictive or intact atrial septum; d-TGA with severely restrictive or
    intact atrial septum and abnormal ductus; obstructed TAPVR; Ebstein with hydrops; tetralogy with absent pulmonary
    valve and severe airway obstruction; uncontrolled arrhythmia with hydrops; complete heart block with low ventricular
    rate, endocardial fibroelastosis or hydrops); caesarean in a cardiac facility with specialists in the delivery room,
    usually at 38-39 weeks.'
