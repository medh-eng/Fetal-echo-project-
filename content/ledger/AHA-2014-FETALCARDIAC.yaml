- id: AH14-327
  topic: delivery planning
  statement: In tetralogy with absent pulmonary valve, lung findings of lobar emphysema (fluid trapping) on MRI suggest
    planning specialised ventilation and considering ECMO (Class IIb, LOE C).
  source: AHA-2014-FETALCARDIAC
