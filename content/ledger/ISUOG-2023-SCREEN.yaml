- id: IS23-021
  statement: To assess situs, fetal laterality (fetal right and left, from the position of the fetus in utero) must
    be determined first, before confirming that both stomach and heart are on the fetal left.
  source: ISUOG-2023-SCREEN
  locator: 'Situs and the four-chamber view: Sonographic technique, p. 789'
