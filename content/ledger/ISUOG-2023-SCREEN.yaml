- id: IS23-068
  statement: The three-vessel-and-trachea view is a slightly oblique transverse plane cephalad to the three-vessel
    view, showing the main pulmonary artery continuous with the ductus arteriosus and the transverse aortic arch
    just to its right; the trachea appears as a bright ring around a small fluid-filled space.
  source: ISUOG-2023-SCREEN
  locator: RVOT view, 3VV and 3VTV, p. 796; Figure 9
