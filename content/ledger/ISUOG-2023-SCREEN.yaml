- id: IS23-052
  statement: 'Three things are confirmed at the outflow tracts: the vessel leaving the left ventricle has its anterior
    wall continuous with the ventricular septum and does not bifurcate (aorta); the vessel leaving the right ventricle
    bifurcates (pulmonary artery); and the two great arteries cross each other.'
