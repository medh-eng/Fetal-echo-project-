- id: IS23-020
  statement: The standardised workflow can also identify semilunar valve abnormalities such as aortic and pulmonary
    stenosis, which may progress in severity as pregnancy advances.
  source: ISUOG-2023-SCREEN
  locator: Cardiac examination, p. 789
  status: ai-extracted
