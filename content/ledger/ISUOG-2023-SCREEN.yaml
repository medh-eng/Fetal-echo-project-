- id: IS23-034
  statement: Ectopic (skipped) beats are the most common rhythm disturbance; they are often benign, resolve spontaneously,
    and in low-risk populations are not associated with increased risk of structural heart disease.
  source: ISUOG-2023-SCREEN
  locator: Four-chamber view, p. 791
