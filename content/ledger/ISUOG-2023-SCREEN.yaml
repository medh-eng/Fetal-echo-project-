- id: IS23-018
  statement: The cardiac screening examination should include fetal situs and the four-chamber, outflow-tract and
    great-vessel views (grade of recommendation C).
  source: ISUOG-2023-SCREEN
  locator: Cardiac examination, p. 789
  status: ai-extracted
