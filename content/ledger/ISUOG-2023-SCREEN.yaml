- id: IS23-043
  statement: The ventricles should look similar in size with no wall thickening. Mild disproportion can be a normal
    variant in the third trimester, but right-left asymmetry in mid-gestation warrants further examination; important
    causes are coarctation of the aorta, evolving hypoplastic left heart syndrome and anomalous pulmonary venous
    return.
  source: ISUOG-2023-SCREEN
  locator: Four-chamber view, p. 793
