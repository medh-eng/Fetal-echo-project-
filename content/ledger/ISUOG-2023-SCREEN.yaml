- id: IS23-032
  statement: Displacement of the heart from its normal position can be caused by diaphragmatic hernia, a space-occupying
    lesion such as congenital pulmonary airway malformation, or lung hypoplasia or agenesis; a leftward shift of
    the axis may also occur with gastroschisis and omphalocele.
  source: ISUOG-2023-SCREEN
