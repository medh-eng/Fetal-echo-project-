- id: IS23-082
  statement: 'Common fetal indications for fetal echocardiography: suspected structural anomaly; extracardiac anomaly
    associated with heart disease; suspected abnormal function or cardiomegaly; hydrops; persistent tachycardia
    (180 bpm or more); suspected heart block or persistent bradycardia (110 bpm or less); frequent or persistently
    irregular rhythm; nuchal translucency 3.5 mm or more; confirmed or suspected genetic abnormality; monochorionic
    twinning (if resources allow).'
  source: ISUOG-2023-SCREEN
  locator: Table 2, 'Fetal factors', p. 797
  status: ai-extracted
  extracted_by: Claude, from the full PDF (13 Nov 2026)
  checked_by: null
  verified_by: null
- id: IS23-083
  statement: 'Common patient or familial indications: first-degree relative of the fetus with congenital heart disease;
    first- or second-degree relative with Mendelian disease and childhood cardiac manifestations; pregestational
    diabetes regardless of HbA1c; anti-Ro/SSA antibodies; phenylketonuria (unknown status or periconceptional phenylalanine
    above 10 mg/dL); retinoid exposure; confirmed fetal infection (TORCH or parvovirus B19).'
  source: ISUOG-2023-SCREEN
  locator: Table 2, 'Patient or familial disease or environmental exposure', p. 797
  status: ai-extracted
  extracted_by: Claude, from the full PDF (13 Nov 2026)
  checked_by: null
  verified_by: null
- id: IS23-084
  statement: 'Fetal echocardiography may be considered for: second-degree relative with congenital heart disease;
    gestational diabetes diagnosed in the first or early second trimester; nuchal translucency 3.0-3.4 mm; selected
    teratogens (for example paroxetine, carbamazepine, lithium, sodium valproate); conception by IVF including ICSI;
    use of ACE inhibitors.'
  source: ISUOG-2023-SCREEN
  locator: Table 2, 'Other indications when fetal echo may be considered', p. 797
  status: ai-extracted
  extracted_by: Claude, from the full PDF (13 Nov 2026)
  checked_by: null
  verified_by: null
- id: IS23-085
  statement: 'Evidence is insufficient that risk is significantly above baseline for: obesity (BMI 35 or more),
    SSRI exposure other than paroxetine, non-cardiac soft markers, abnormal serum analytes, isolated single umbilical
    artery, gestational diabetes diagnosed after the second trimester, warfarin or alcohol exposure, echogenic intracardiac
    focus, fever or viral infection with seroconversion only, or isolated heart disease in a relative more distant
    than second degree.'
  source: ISUOG-2023-SCREEN
  locator: Table 2, 'Other considerations', p. 797
  status: ai-extracted
  extracted_by: Claude, from the full PDF (13 Nov 2026)
  checked_by: null
  verified_by: null
