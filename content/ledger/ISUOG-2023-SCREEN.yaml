- id: IS23-074
  statement: In a normal heart, colour shows antegrade flow across the atrioventricular and semilunar valves and
    great arteries; it helps show the V-sign and highlights abnormal patterns such as atrioventricular valve regurgitation
    and flow reversal in the ductus arteriosus or aortic arch.
