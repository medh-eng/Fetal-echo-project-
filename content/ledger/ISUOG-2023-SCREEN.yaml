- id: IS23-019
  statement: Including outflow-tract and great-vessel views raises detection of major malformations above the four-chamber
    view alone and enables detection of anomalies such as tetralogy of Fallot, transposition of the great arteries,
    double-outlet right ventricle and truncus arteriosus.
  source: ISUOG-2023-SCREEN
  locator: Cardiac examination, p. 789
  status: ai-extracted
