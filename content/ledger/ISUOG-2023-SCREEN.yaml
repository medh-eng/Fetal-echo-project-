- id: IS23-065
  statement: The normal pulmonary artery runs to the left of the more posterior ascending aorta, is usually slightly
    larger than the ascending aorta in fetal life, and crosses it at almost a right angle; the superior vena cava
    lies to the right of the aorta.
  source: ISUOG-2023-SCREEN
