- id: IS23-066
  statement: The three-vessel view is assessed for vessel number, size, alignment and arrangement. From left to
    right the vessels are pulmonary artery, aorta and right superior vena cava; the pulmonary artery is most anterior
    and the vena cava most posterior; diameters decrease from left to right.
  source: ISUOG-2023-SCREEN
  locator: RVOT view, 3VV and 3VTV, p. 794; Figure 7, p. 795
