- id: IS23-024
  statement: 'Abdominal situs is assessed at the level of the standard abdominal circumference: stomach on the left,
    with the descending aorta on the left and the inferior vena cava on the right side of the spine.'
  source: ISUOG-2023-SCREEN
  locator: Situs, p. 791; Figure 3; Table 1
