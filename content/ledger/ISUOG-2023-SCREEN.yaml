- id: IS23-023
  statement: 'The examination moves through five sequential axial planes: (I) upper abdomen, (II) four-chamber view,
    (III) left ventricular outflow-tract view, (IV) right ventricular outflow-tract view with the three-vessel view
    variants, (V) three-vessel-and-trachea view.'
  source: ISUOG-2023-SCREEN
  locator: Figure 1 legend, p. 789; Figure 2, p. 790
  status: ai-extracted
