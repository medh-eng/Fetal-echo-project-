- id: IS23-022
  statement: A transverse sweep with cephalad movement of the transducer from the fetal abdomen towards the chest
    shows the abdominal situs and then the four-chamber view.
  source: ISUOG-2023-SCREEN
  locator: 'Situs and the four-chamber view: Sonographic technique, p. 789'
