  statement: In a survey of over 18 000 fetuses, 93% of examinations with an adequate four-chamber view also achieved
    satisfactory outflow-tract evaluation; non-visualisation rates were 4.2% for the left outflow tract, 1.6% for
    the right and 1.3% for both.
