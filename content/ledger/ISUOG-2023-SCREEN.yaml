- id: IS23-036
  statement: Transient bradycardia, often from transducer pressure, is seen in normal second-trimester fetuses;
    persistent bradycardia (110 bpm or less) in a well fetus needs timely evaluation by a fetal cardiac specialist.
    Possible causes include frequent blocked atrial ectopic beats, atrioventricular block and sinus bradycardia.
  source: ISUOG-2023-SCREEN
  locator: Four-chamber view, p. 792
  status: ai-extracted
  extracted_by: Claude, from the full PDF (13 Nov 2026)
  checked_by: null
  verified_by: null
- id: IS23-037
  statement: Mild transient tachycardia (160-180 bpm) can be a normal variant during fetal movement; persistent
    tachycardia (180 bpm or more) should be evaluated further for tachyarrhythmia or fetal hypoxia.
  source: ISUOG-2023-SCREEN
