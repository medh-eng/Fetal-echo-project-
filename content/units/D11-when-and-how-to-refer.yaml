# Unit D11. Every text block and drill lists the claim IDs it rests on.
# A block with no claims must be `kind: framing` (orientation only, no clinical facts).

id: D11
title: "When and how to refer"
tier: Detect
version: 0.2
summary: "Which findings and risk factors are indications for a fetal echocardiogram, how the guideline grades the others, and who should do it."
drafted_by: "Claude (15 Nov 2026)"
audited_by: "ChatGPT (Codex), 16 Nov 2026, against the ledger only; findings applied by Claude (Fable). One finding not applied, see docs/log.md."
signed_by: null

objectives:
  - "Apply the basic rule: a fetus with a suspected abnormality on screening is a candidate for fetal echocardiography."
  - "List the fetal findings that are indications for fetal echocardiography."
  - "List the maternal and family factors that are indications."
  - "Tell apart factors where echocardiography may be considered and factors with insufficient evidence."
  - "Say who should perform the fetal echocardiogram and what counselling should take into account."

sections:

  - heading: "The basic rule"
    blocks:
      - text: "A fetus with a known or suspected abnormality on cardiac screening is a candidate for fetal echocardiography."
        claims: [IS23-078]
      - text: "The echocardiography guideline says the same from its side: fetal echocardiography is indicated when the screening ultrasound of the heart is abnormal, whether or not there are other risk factors."
        claims: [AS23-023]
      - text: "A low threshold for referral is one of the measures that can improve a screening programme."
        claims: [IS23-006]
      - text: "You do not need to name the lesion: suspicion on an adequate view is enough. A view that could not be obtained is a different situation. With an unfavourable fetal lie, extra examination time or a second examination may be needed."
        claims: [IS23-078, IS23-056]

  - heading: "Risk factors add to screening; they do not replace it"
    blocks:
      - text: "When there is a significant risk factor for congenital heart disease, fetal echocardiography is indicated in addition to routine screening, depending on local resources, the setting, the availability of examiners and the screening results."
        claims: [IS23-079]
      - text: "A high proportion of detectable heart disease occurs in pregnancies with no risk factor and no extracardiac anomaly. This is why quality screening and timely referral matter."
        claims: [IS23-080]

  - heading: "Fetal indications"
    blocks:
      - text: "The guideline lists these fetal factors as common indications for fetal echocardiography."
        claims: [IS23-082, IS23-081]
        table:
          columns: ["Fetal factor", "Detail"]
          rows:
            - ["Suspected structural anomaly of the heart", ""]
            - ["Extracardiac structural anomaly", "With a known association with congenital heart disease"]
            - ["Suspected abnormal function or a large heart", ""]
            - ["Hydrops", ""]
            - ["Persistent tachycardia", "180 beats per minute or more"]
            - ["Suspected heart block", ""]
            - ["Persistent bradycardia", "110 beats per minute or less"]
            - ["Irregular rhythm", "Frequent or persistent"]
            - ["Increased nuchal translucency", "3.5 mm or more at 11 to 14 weeks"]
            - ["Genetic abnormality", "Confirmed or suspected"]
            - ["Monochorionic twins", "If resources allow"]
      - text: "A nuchal translucency of 3.5 mm or more at 11 to 14 weeks remains an indication even if the measurement later becomes normal."
        claims: [IS23-081]

  - heading: "Findings on the screen that should not be passed"
    blocks:
      - text: "Right-left asymmetry of the ventricles in mid-gestation warrants further examination. Important causes are coarctation of the aorta, an evolving hypoplastic left heart and anomalous pulmonary venous return."
        claims: [IS23-043]
      - text: "A major difference in size between the two great arteries should lead to further evaluation."
        claims: [IS23-051]
      - text: "An abnormal cardiac axis raises the risk of a cardiac malformation, especially of the outflow tracts, and may be associated with a chromosomal anomaly."
        claims: [IS23-031]
      - text: "If the heart or the stomach is not on the left, suspect a situs abnormality."
        claims: [IS23-030]

  - heading: "Maternal and family indications"
    blocks:
      - text: "The guideline lists these maternal, family and exposure factors as common indications."
        claims: [IS23-083]
        table:
          columns: ["Factor", "Detail"]
          rows:
            - ["Congenital heart disease in a first-degree relative of the fetus", "Parents, siblings and half-siblings"]
            - ["Mendelian disease with childhood cardiac manifestations", "In a first- or second-degree relative"]
            - ["Pregestational diabetes", "Whatever the HbA1c"]
            - ["Anti-Ro/SSA antibodies", ""]
            - ["Phenylketonuria", "Unknown status, or periconceptional phenylalanine above 10 mg/dL"]
            - ["Retinoid exposure", ""]
            - ["Confirmed fetal infection", "TORCH or parvovirus B19"]

  - heading: "May be considered"
    blocks:
      - text: "For some factors the guideline says fetal echocardiography may be considered."
        claims: [IS23-084]
        table:
          columns: ["Factor", "Detail"]
          rows:
            - ["Congenital heart disease in a second-degree relative", ""]
            - ["Gestational diabetes", "Diagnosed in the first or early second trimester"]
            - ["Nuchal translucency", "3.0 to 3.4 mm"]
            - ["Selected teratogens", "For example paroxetine, carbamazepine, lithium, sodium valproate"]
            - ["Conception by IVF", "Including ICSI"]
            - ["ACE inhibitor use", ""]

  - heading: "Not enough evidence of raised risk"
    blocks:
      - text: "For each of these factors, taken on its own, the guideline finds insufficient evidence that the risk of congenital heart disease is significantly above baseline."
        claims: [IS23-085]
        table:
          columns: ["Factor", "Detail"]
          rows:
            - ["Obesity", "BMI 35 kg/m2 or more"]
            - ["SSRI exposure", "Other than paroxetine"]
            - ["Non-cardiac soft markers", "For aneuploidy"]
            - ["Abnormal serum analytes", ""]
            - ["Single umbilical artery", "Isolated"]
            - ["Gestational diabetes", "Diagnosed after the second trimester"]
            - ["Warfarin or alcohol exposure", ""]
            - ["Echogenic intracardiac focus", ""]
            - ["Prenatal fever, or viral infection with seroconversion only", ""]
            - ["Congenital heart disease in a distant relative", "Isolated; more distant than second degree"]
      - text: "This is a statement about the factor alone. A suspected abnormality on the screen makes the fetus a candidate for fetal echocardiography whatever the history, and a significant risk factor that is also present still counts."
        claims: [IS23-078, IS23-079]
      - text: "These pregnancies have the same routine cardiac screen as every other: situs, four-chamber view, outflow tracts and great-vessel views."
        claims: [IS23-018]

  - heading: "How the echocardiography guideline compares"
    blocks:
      - kind: framing
        text: "The American echocardiography guideline has its own table of indications. Most entries agree with the screening guideline. The points below are where its wording adds something."
      - text: "It lists as indications: pregestational diabetes, maternal SSA/SSB antibodies, congenital heart disease in a first-degree relative, hydrops, an extracardiac anomaly, monochorionic twins, and a nuchal translucency of 3.5 mm or more."
        claims: [AS23-024, AS23-025, AS23-026, AS23-028, AS23-029, AS23-030, AS23-032]
      - text: "After IVF, or with a nuchal translucency of 3.0 to 3.4 mm, it says fetal echocardiography may be considered, and that after a normal cardiac screen the decision should take the accuracy of local screening into account."
        claims: [AS23-027, AS23-031]
      - text: "An isolated single umbilical artery does not by itself indicate fetal echocardiography when the second-trimester cardiac screen is normal."
        claims: [AS23-033]

  - heading: "Who does the echocardiogram, and what families need"
    blocks:
      - text: "Fetal echocardiography is best performed by a trained specialist who is familiar with prenatal diagnosis and with the course, management and prognosis after birth."
        claims: [IS23-086]
      - text: "Counselling after a heart problem is detected should take into account the high prevalence of psychological distress in the mother."
        claims: [IS23-086]
      - text: "Findings on the three-vessel views can change what happens next: testing for 22q11 microdeletion, the planned place of delivery as in complete transposition, readiness to give prostaglandin, or readiness for airway problems from vascular compression."
        claims: [IS23-072]

missing_claims:
  - "What a referral letter should contain (views obtained, what failed, gestation, stored clips) - needs a source or the editor's template."
  - "How urgently each kind of finding should be seen - not in the screening guideline; needs a source and the editor's decision."
  - "Indian referral pathways, and timing in relation to the legal limits for termination of pregnancy - needs an Indian source and the editor's input."
  - "What to tell the parents at the moment of referral - unit D12."

drills:
  - id: D11-Q01
    question: "On a technically adequate view, the anatomy in one plane looks abnormal, but you cannot say what the lesion is. What next?"
    options:
      - "The fetus is a candidate for fetal echocardiography: a suspected abnormality is enough"
      - "Wait until you can name the lesion"
      - "Report the heart as normal if the four-chamber view is normal"
      - "Repeat the scan after delivery"
    answer: 0
    explanation: "Fetuses with a known or suspected abnormality on cardiac screening are candidates for fetal echocardiography."
    claims: [IS23-078]

  - id: D11-Q02
    question: "The mother has pregestational diabetes with a good HbA1c. How does the guideline list this?"
    options:
      - "As an indication for fetal echocardiography, whatever the HbA1c"
      - "As an indication only if the HbA1c is raised"
      - "Among factors with insufficient evidence of raised risk"
      - "Among factors where echocardiography may be considered"
    answer: 0
    explanation: "Pregestational diabetes is listed as an indication regardless of HbA1c."
    claims: [IS23-083]

  - id: D11-Q03
    question: "Gestational diabetes was diagnosed in the third trimester. How does the guideline class this factor?"
    options:
      - "Insufficient evidence that risk is significantly above baseline"
      - "A common indication, like all diabetes"
      - "A factor where echocardiography may be considered"
      - "Not mentioned in the guideline"
    answer: 0
    explanation: "Gestational diabetes diagnosed after the second trimester is among the factors with insufficient evidence of raised risk. Pregestational diabetes is different."
    claims: [IS23-085, IS23-083]

  - id: D11-Q04
    question: "An isolated echogenic intracardiac focus is seen and the heart is otherwise normal on screening. What does the guideline say about risk?"
    options:
      - "Evidence is insufficient that risk of heart disease is significantly above baseline"
      - "It is a common indication for fetal echocardiography"
      - "It indicates a ventricular septal defect"
      - "It indicates an arrhythmia"
    answer: 0
    explanation: "Echogenic intracardiac focus is listed among factors with insufficient evidence of risk significantly above baseline."
    claims: [IS23-085]

  - id: D11-Q05
    question: "The fetus's older sibling had surgery for congenital heart disease. How does the guideline list this?"
    options:
      - "As an indication: congenital heart disease in a first-degree relative of the fetus"
      - "Not listed: only parents count as first-degree relatives"
      - "Among factors where echocardiography may be considered"
      - "Among factors with insufficient evidence of raised risk"
    answer: 0
    explanation: "Congenital heart disease in a first-degree relative of the fetus (parents, siblings and half-siblings) is a listed indication. A second-degree relative falls under 'may be considered'."
    claims: [IS23-083, IS23-084]

  - id: D11-Q06
    question: "The pregnancy was conceived by IVF with ICSI. What does the guideline say?"
    options:
      - "Fetal echocardiography may be considered"
      - "Fetal echocardiography is a firm indication"
      - "Evidence is insufficient that risk is raised"
      - "The routine cardiac screen can be omitted"
    answer: 0
    explanation: "Conception by IVF, including ICSI, is in the group where fetal echocardiography may be considered."
    claims: [IS23-084]

  - id: D11-Q07
    question: "Which of these is a listed fetal indication for fetal echocardiography?"
    options:
      - "Hydrops"
      - "Isolated single umbilical artery"
      - "A non-cardiac soft marker"
      - "Abnormal serum analytes"
    answer: 0
    explanation: "Hydrops is a listed fetal indication. The other three are among factors with insufficient evidence of raised risk."
    claims: [IS23-082, IS23-085]

  - id: D11-Q08
    question: "The mother takes paroxetine. Another mother takes a different SSRI. How does the guideline treat them?"
    options:
      - "Paroxetine: echocardiography may be considered. Other SSRIs: insufficient evidence of raised risk"
      - "Both are firm indications"
      - "Neither is mentioned"
      - "Other SSRIs are an indication; paroxetine is not"
    answer: 0
    explanation: "Paroxetine is named among selected teratogens where echocardiography may be considered. SSRI exposure other than paroxetine is in the insufficient-evidence group."
    claims: [IS23-084, IS23-085]

  - id: D11-Q09
    question: "The mother is known to have anti-Ro/SSA antibodies. How does the guideline list this?"
    options:
      - "As an indication for fetal echocardiography"
      - "As an indication only once the fetal heart rate is slow"
      - "Among factors with insufficient evidence of raised risk"
      - "It is not mentioned"
    answer: 0
    explanation: "Anti-Ro/SSA antibodies are among the listed maternal indications."
    claims: [IS23-083]

  - id: D11-Q10
    question: "At 20 weeks the left ventricle is clearly smaller than the right. What is the correct reading?"
    options:
      - "It warrants further examination; causes include coarctation and an evolving hypoplastic left heart"
      - "A normal variant at this gestation"
      - "Normal if the heart rate is regular"
      - "Recheck only in the third trimester"
    answer: 0
    explanation: "Mild disproportion can be a variant in the third trimester, but right-left asymmetry in mid-gestation warrants further examination."
    claims: [IS23-043]

  - id: D11-Q11
    question: "Who is best placed to perform the fetal echocardiogram?"
    options:
      - "A trained specialist familiar with prenatal diagnosis and with postnatal course, management and prognosis"
      - "Any sonologist with a machine that has colour Doppler"
      - "A general paediatrician after delivery"
      - "Whoever made the referral, with or without specialist training"
    answer: 0
    explanation: "Fetal echocardiography is best performed by a trained specialist familiar with prenatal diagnosis, postnatal course, postnatal management and prognosis."
    claims: [IS23-086]

  - id: D11-Q12
    question: "Which observation explains why quality routine screening of every pregnancy matters?"
    options:
      - "A high proportion of prenatally detectable heart disease occurs in pregnancies with no risk factor"
      - "Risk factors are rarely recorded correctly"
      - "Fetal echocardiography is unreliable when a risk factor is present"
      - "Heart disease cannot be detected before birth unless a risk factor is present"
    answer: 0
    explanation: "A high proportion of prenatally detectable heart disease occurs in pregnancies with no risk factor or extracardiac anomaly, so quality screening and timely referral matter."
    claims: [IS23-080]

checklist:
  title: "Before you close the report: common reasons to refer (not a complete list)"
  items:
    - text: "Suspected cardiac abnormality on any plane. (A view that could not be obtained is an incomplete scan: more time or a second examination.)"
      claims: [IS23-078, IS23-056]
    - text: "Rate stays at 110 or below, or at 180 or above; suspected heart block; frequent or persistently irregular rhythm"
      claims: [IS23-082]
    - text: "Ventricles asymmetric in mid-gestation: further examination. Major difference in size between the great arteries: further evaluation"
      claims: [IS23-043, IS23-051]
    - text: "Heart or stomach not on the left: suspect a situs abnormality. Abnormal axis: raised risk of a cardiac malformation"
      claims: [IS23-030, IS23-031]
    - text: "Extracardiac structural anomaly known to go with heart disease; hydrops; confirmed or suspected genetic abnormality; monochorionic twins if resources allow"
      claims: [IS23-082]
    - text: "Nuchal translucency was 3.5 mm or more at 11 to 14 weeks, even if it later became normal"
      claims: [IS23-081]
    - text: "Maternal or family indication: check the full table in this unit (examples: congenital heart disease in a parent, sibling or half-sibling; pregestational diabetes; anti-Ro/SSA antibodies)"
      claims: [IS23-083]

video:
  title: "Refer or not?"
  target_minutes: 5
  beats:
    - shot: "Presenter to camera"
      narration: "You do not need a diagnosis to refer. A suspicion is enough."
      claims: [IS23-078]
    - shot: "Graphic: list of fetal indications appearing one by one"
      narration: "Examples from the scan: a suspected structural heart anomaly; an anomaly outside the heart that is known to go with heart disease; suspected poor function or a large heart; hydrops; a rate that stays at one-ten or below, or at one-eighty or above; a frequent or persistently irregular rhythm; a nuchal translucency of three and a half millimetres or more."
      claims: [IS23-082]
    - shot: "Graphic: list of maternal and family indications"
      narration: "Examples from the history: congenital heart disease in a parent, sibling or half-sibling of this fetus; diabetes before pregnancy; anti-Ro antibodies. The full list is in the unit."
      claims: [IS23-083]
    - shot: "Graphic: 'not enough evidence' list"
      narration: "Some factors, taken alone, lack enough evidence of a clearly raised risk: an isolated bright spot in the heart, a single umbilical artery on its own, soft markers for aneuploidy outside the heart. A suspicious screen still counts, whatever the history."
      claims: [IS23-085, IS23-078]
    - shot: "Presenter"
      narration: "A high proportion of detectable heart disease is in pregnancies with no risk factor. Quality screening of every pregnancy, and timely referral, are what matter."
      claims: [IS23-080]
