# Unit D6. Every text block and drill lists the claim IDs it rests on.
# IS23 claims: ISUOG screening guideline. AS23 claims: ASE fetal echocardiography guideline.

id: D6
title: "Three-vessel and three-vessel-and-trachea views"
tier: Detect
version: 0.1
summary: "The two highest planes of the sweep: which vessels, in what order and size, where the arches lie against the trachea, and what goes wrong here."
drafted_by: "Claude (16 Nov 2026)"
audited_by: null
signed_by: null

objectives:
  - "Assess the three-vessel view for number, size, alignment and arrangement."
  - "Describe the normal three-vessel-and-trachea view: the V, its side, and the trachea."
  - "Name the lesions these two views help to detect."
  - "Explain how a finding here changes what happens next."

sections:

  - heading: "A continuum, not two pictures"
    blocks:
      - text: "The axial appearances of the right outflow tract, the branch pulmonary arteries and the ductal and aortic arches form a continuum of views. What you see varies with the orientation of the transducer and the lie of the fetus."
        claims: [IS23-063]
      - text: "Assessment is likely to be more reliable live or on cine-loop than from still images alone."
        claims: [IS23-063]

  - heading: "The three-vessel view"
    blocks:
      - text: "Assess four things: the number of vessels, their size, their alignment and their arrangement."
        claims: [IS23-066]
      - text: "From left to right the vessels are the pulmonary artery, the aorta and the right superior vena cava. The pulmonary artery is the most anterior and the vena cava the most posterior. The diameters decrease from left to right."
        claims: [IS23-066]
        table:
          columns: ["Vessel", "Side", "Front to back", "Size"]
          rows:
            - ["Pulmonary artery", "Left", "Most anterior", "Largest"]
            - ["Aorta", "Middle", "Middle", "Middle"]
            - ["Superior vena cava", "Right", "Most posterior", "Smallest"]
      - text: "The pulmonary artery is usually slightly larger than the ascending aorta in fetal life. The superior vena cava lies to the right of the aorta."
        claims: [IS23-065]

  - heading: "The three-vessel-and-trachea view"
    blocks:
      - text: "This is a slightly oblique transverse plane, towards the head from the three-vessel view. It shows the main pulmonary artery continuing into the ductus arteriosus, with the transverse aortic arch just to its right."
        claims: [IS23-068]
      - text: "The trachea appears as a bright ring around a small fluid-filled space."
        claims: [IS23-068]
      - text: "Normally the ductus arteriosus and the aortic arch both run to the left of the trachea and meet at an acute angle, forming a V. The right superior vena cava and the thymus are also seen in this plane."
        claims: [IS23-069]
      - text: "The screening checklist asks for two things here: the V-sign, with both arches to the left of the trachea, and ductal and aortic arches of similar size."
        claims: [IS23-096]
      - text: "The thymus appears as a relatively dark area between the great vessels and the front of the chest."
        claims: [IS23-100]
      - text: "The aortic arch lies slightly nearer the head than the ductal arch, so showing both together may need a small adjustment away from a true axial plane."
        claims: [IS23-070]

  - heading: "Adding colour"
    blocks:
      - text: "Colour helps to show the V-sign and can highlight reversed flow in the ductus arteriosus or the aortic arch."
        claims: [IS23-074]

  - heading: "What these views detect"
    blocks:
      - text: "The two views help to detect anomalies of the outflow tracts, the aortic arch and the systemic veins, including a persistent left superior vena cava, and anomalies of the thymus."
        claims: [IS23-053]
      - text: "The three-vessel-and-trachea view is particularly useful for abnormalities of the aortic arch such as coarctation, vascular rings and an aberrant right subclavian artery. It is likely to enable detection of coarctation, right aortic arch and double aortic arch."
        claims: [IS23-054, IS23-071]
      - text: "Complete transposition, tetralogy of Fallot, double-outlet right ventricle, common arterial trunk and pulmonary atresia with a ventricular septal defect can have a four-chamber view that looks normal. They are typically abnormal in the three-vessel view."
        claims: [IS23-067]
        table:
          columns: ["Check", "Normal", "Question to ask if not"]
          rows:
            - ["Number", "Three vessels", "Is there a fourth vessel, or only two?"]
            - ["Size", "Decreasing from left to right; arches similar in size", "Is one great artery or one arch much smaller?"]
            - ["Alignment and arrangement", "Pulmonary artery, aorta, vena cava in a line from left-front to right-back", "Is the order or the line wrong?"]
            - ["Side of the arches", "Both left of the trachea, meeting in a V", "Does an arch pass to the right of the trachea, or on both sides?"]

  - heading: "Why a finding here matters"
    blocks:
      - text: "Anomalies found on the three-vessel views can change counselling and management. Examples: testing for 22q11 microdeletion; planning where delivery takes place, as in complete transposition; being ready to give prostaglandin; being ready for airway problems from vascular compression."
        claims: [IS23-072]
      - text: "A fetus with a suspected abnormality on screening is a candidate for fetal echocardiography."
        claims: [IS23-078]

  - heading: "What the fetal echocardiogram adds"
    blocks:
      - kind: framing
        text: "These points are from the echocardiography guideline. They describe the specialist examination, not the screen."
      - text: "In the three-vessel view, abnormalities of vessel number, size, alignment or arrangement should be recorded."
        claims: [AS23-056]
      - text: "In the normal three-vessel-and-trachea view the two arches join the descending aorta on the left of the trachea. Colour Doppler should demonstrate patency and direction of flow in both arches."
        claims: [AS23-057, AS23-058]
      - text: "The side of each arch relative to the trachea should be documented at every fetal echocardiogram."
        claims: [AS23-100]
      - text: "Colour and power Doppler in the three-vessel-and-trachea view can help to identify an aberrant subclavian artery."
        claims: [AS23-101]

