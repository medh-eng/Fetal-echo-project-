      claims: [IS23-066]
    - text: "Sizes decrease from left to right"
      claims: [IS23-066]
    - text: "Vessels in line, pulmonary artery most anterior, vena cava most posterior"
      claims: [IS23-066]
    - text: "Three-vessel-and-trachea view: ductal and aortic arches meet in a V"
      claims: [IS23-069]
    - text: "Both arches to the left of the trachea"
      claims: [IS23-069, IS23-096]
    - text: "Arches similar in size"
      claims: [IS23-096]
    - text: "Clip of these views stored"
      claims: [IS23-063, IS23-017]

