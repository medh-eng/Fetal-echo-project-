# Unit D0. Every text block and drill lists the claim IDs it rests on.
# A block with no claims must be `kind: framing` (orientation only, no clinical facts).

id: D0
title: "Why hearts are missed"
tier: Detect
version: 0.1
summary: "How often heart disease is missed before birth, where the miss happens, and what a screening service can do about it."
drafted_by: "Claude (15 Nov 2026)"
audited_by: null
signed_by: null

objectives:
  - "State how common congenital heart disease is and how much of it is found before birth."
  - "Name the two main ways a heart lesion is missed on a screening scan."
  - "Explain why the four-chamber view alone is not enough."
  - "List the features of a screening service that detects more."

sections:

  - heading: "The size of the gap"
    blocks:
      - text: "Congenital heart disease affects about 8 in every 1000 live births and is a leading cause of illness and death in infancy."
        claims: [IS23-003]
      - text: "Detection before birth varies widely between regions and between lesions. Overall, fewer than half of cardiac anomalies are identified before birth."
        claims: [IS23-004]

  - heading: "You cannot screen by risk factor"
    blocks:
      - text: "A high proportion of the heart disease that could be detected before birth occurs in pregnancies with no risk factor and no other anomaly. The routine scan, done well on every patient, is what finds it."
        claims: [IS23-080]

  - heading: "Where the miss happens"
    blocks:
      - text: "In one retrospective study of missed diagnoses, views that did not meet technical criteria contributed to about half of the misses. In nearly a third, the view was technically adequate but the abnormal anatomy was not recognised."
        claims: [IS23-088]
      - kind: framing
        text: "These are two different failures and they need two different habits. The first is fixed by obtaining every plane to a standard. The second is fixed by knowing exactly what normal looks like, so that anything else stands out. This course trains both."

  - heading: "Why detection varies"
    blocks:
      - text: "Part of the variation is explained by the examiner's ability, transducer frequency, maternal body habitus, abdominal scars, gestational age, amniotic fluid volume and fetal position."
        claims: [IS23-005]
      - kind: framing
        text: "Only some of these are in your hands. Skill and machine set-up are. Fetal position can often be dealt with by waiting or by bringing the patient back."

  - heading: "Four chambers are not enough"
    blocks:
      - text: "The four-chamber and three-vessel views need much more than a count of structures."
        claims: [IS23-007]
      - text: "Some lesions, such as transposition of the great arteries and coarctation of the aorta, may not be evident in the four-chamber plane alone. Some lesions are not discovered until later in pregnancy."
        claims: [IS23-008]
      - text: "Adding the outflow-tract and great-vessel views raises detection of major malformations above the four-chamber view alone. It allows detection of tetralogy of Fallot, transposition, double-outlet right ventricle and truncus arteriosus."
        claims: [IS23-009, IS23-019]
      - text: "Complete transposition, tetralogy of Fallot, double-outlet right ventricle, common arterial trunk and pulmonary atresia with a ventricular septal defect can all have a four-chamber view that looks normal. They are typically abnormal in the three-vessel view."
        claims: [IS23-067]
      - text: "The same standard sweep can also pick up aortic and pulmonary valve stenosis, which may become more severe as pregnancy advances."
        claims: [IS23-020]

  - heading: "What a good screening service does"
    blocks:
      - text: "A screening programme performs better with continuous training based on feedback, a low threshold for referral for echocardiography, standardised protocols and easy access to fetal heart specialists."
        claims: [IS23-006]
      - text: "Each practice is encouraged to audit its stored images or clips against set quality criteria, to review its own detection rates and diagnostic accuracy every year, and to provide further training where needed."
        claims: [IS23-089]

  - heading: "What this course asks of you"
    blocks:
      - kind: framing
        text: "Learn one sweep and do it the same way on every patient. Learn the criteria for each plane until a normal heart is boring. Drill on clips until a heart that is not normal catches your eye within a few beats. Refer early when a plane fails."

missing_claims:
  - "Detection rates in India and by lesion type - needs an Indian source."
  - "Outcome benefit of prenatal diagnosis for specific lesions (why detection matters for the baby) - needs a source beyond this guideline."

drills:
  - id: D0-Q01
    question: "About how common is congenital heart disease?"
    options:
      - "About 8 in every 1000 live births"
      - "About 8 in every 100 live births"
      - "About 8 in every 10 000 live births"
      - "About 8 in every 100 000 live births"
    answer: 0
    explanation: "The guideline gives a prevalence of 8.2 per 1000 live births."
    claims: [IS23-003]

  - id: D0-Q02
    question: "Overall, what share of cardiac anomalies is identified before birth?"
    options:
      - "Fewer than half"
      - "Nearly all"
      - "About three quarters"
      - "Almost none"
    answer: 0
    explanation: "Detection varies by region and lesion, but fewer than half of cardiac anomalies are identified before birth."
    claims: [IS23-004]

  - id: D0-Q03
    question: "A colleague proposes examining the heart in detail only when the pregnancy has a risk factor. What is wrong with this?"
    options:
      - "A high proportion of detectable heart disease occurs in pregnancies with no risk factor"
      - "Nothing; heart disease is rare without a risk factor"
      - "Risk factors cannot be identified before the scan"
      - "Detailed examination is only possible in the third trimester"
    answer: 0
    explanation: "Much of the heart disease that can be detected before birth is in pregnancies with no risk factor and no other anomaly, so every routine scan must be done to standard."
    claims: [IS23-080]

  - id: D0-Q04
    question: "In a study of missed prenatal diagnoses, what contributed to about half of the misses?"
    options:
      - "Views that did not meet technical criteria"
      - "Lesions that developed only after birth"
      - "Machines without colour Doppler"
      - "Patients who did not attend the scan"
    answer: 0
    explanation: "Failure to meet technical criteria contributed to about 50% of misses."
    claims: [IS23-088]

  - id: D0-Q05
    question: "In the same study, a technically adequate view was obtained but the diagnosis was still missed in nearly a third of cases. Why?"
    options:
      - "The abnormal anatomy was not recognised"
      - "The lesion was too small to be seen by any examiner"
      - "The stored images were lost"
      - "The scan was done too late in pregnancy"
    answer: 0
    explanation: "Failure to recognise abnormal anatomy on an adequate view accounted for 31% of misses. Recognition is a trainable skill."
    claims: [IS23-088]

  - id: D0-Q06
    question: "Which pair of lesions may show nothing abnormal in the four-chamber plane alone?"
    options:
      - "Transposition of the great arteries and coarctation of the aorta"
      - "Atrioventricular septal defect and a single ventricle"
      - "A large pericardial effusion and severe cardiomegaly"
      - "Dextrocardia and an abnormal cardiac axis"
    answer: 0
    explanation: "The guideline names transposition and coarctation as lesions that may not be evident in the four-chamber plane alone."
    claims: [IS23-008]

  - id: D0-Q07
    question: "The four-chamber view looks normal. Which view is typically abnormal in tetralogy of Fallot, transposition and common arterial trunk?"
    options:
      - "The three-vessel view"
      - "The upper-abdomen view"
      - "No axial view; these are found only after birth"
      - "The four-chamber view repeated with colour"
    answer: 0
    explanation: "These lesions can pass the four-chamber view but are typically abnormal in the three-vessel view."
    claims: [IS23-067]

  - id: D0-Q08
    question: "Which of these is a feature of a screening programme that performs better?"
    options:
      - "A low threshold for referring for fetal echocardiography"
      - "Referring only when the diagnosis is certain"
      - "Leaving each examiner to choose their own protocol"
      - "Limiting the scan to the four-chamber view to save time"
    answer: 0
    explanation: "Better programmes have feedback-based training, a low referral threshold, standardised protocols and easy access to fetal heart specialists."
    claims: [IS23-006]

  - id: D0-Q09
    question: "How often is a practice encouraged to review its own detection rates and diagnostic accuracy?"
    options:
      - "Every year"
      - "Only after a complaint"
      - "Every five years"
      - "Once, when the service starts"
    answer: 0
    explanation: "Annual review of local detection rates and accuracy is encouraged, with further training as needed."
    claims: [IS23-089]

  - id: D0-Q10
    question: "Which of these factors that affect detection is most directly within the examiner's control?"
    options:
      - "Transducer frequency and examiner skill"
      - "Maternal body habitus"
      - "Abdominal scars"
      - "Amniotic fluid volume"
    answer: 0
    explanation: "The guideline lists examiner ability and transducer frequency alongside patient factors such as habitus, scars, fluid volume and fetal position."
    claims: [IS23-005]

checklist:
  title: "Habits that close the gap"
  items:
    - text: "Every patient gets the full sweep: situs, four-chamber, outflow tracts and great-vessel views"
      claims: [IS23-018]
    - text: "Each plane is judged against its criteria, not by counting structures"
      claims: [IS23-007]
    - text: "A normal four-chamber view is never taken as proof of a normal heart"
      claims: [IS23-008, IS23-067]
    - text: "Low threshold to refer for fetal echocardiography"
      claims: [IS23-006, IS23-078]
    - text: "Own images audited and detection reviewed every year"
      claims: [IS23-089]

