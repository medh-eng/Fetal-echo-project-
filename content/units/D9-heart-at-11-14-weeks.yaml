# Unit D9. Every text block and drill lists the claim IDs it rests on.
# A block with no claims must be `kind: framing` (orientation only, no clinical facts).
# IS23 claims are from the ISUOG screening guideline; AS23 claims are from the ASE
# fetal echocardiography guideline and are not yet cross-checked.

id: D9
title: "The heart at 11 to 14 weeks"
tier: Detect
version: 0.2
summary: "What can and cannot be checked in the fetal heart at the early scan, how to do it safely, and when to refer."
drafted_by: "Claude (15 Nov 2026)"
audited_by: "ChatGPT (Codex), 16 Nov 2026, against the ledger only; findings applied by Claude (Fable)."
signed_by: null

objectives:
  - "State the place of early cardiac screening in low-risk pregnancies: shown to be effective, but not routine or mandatory."
  - "Give the minimum cardiac check at the early scan."
  - "List the components of a detailed early cardiac screen."
  - "Apply the Doppler safety limits for early pregnancy."
  - "Say which nuchal translucency measurements lead to cardiac referral."

sections:

  - heading: "Where early screening stands"
    blocks:
      - text: "The screening guideline is written for low-risk pregnancies in the second trimester. It also considers screening in the late first and early second trimester where this is technically feasible."
        claims: [IS23-001]
      - text: "First-trimester cardiac screening has been shown to be effective in low-risk populations. It is neither routine nor mandatory. Where possible, it can be done at the nuchal translucency scan."
        claims: [IS23-090]
      - text: "The cardiac screening examination is performed optimally between 18 and 22 weeks."
        claims: [IS23-010]

  - heading: "The minimum"
    blocks:
      - text: "The minimum requirements at an early screen are to see the heart within the chest and to confirm a regular rhythm."
        claims: [IS23-091]
      - text: "Cardiac structures are seen successfully significantly more often after 12 weeks and 3 days."
        claims: [IS23-091]

  - heading: "Equipment"
    blocks:
      - text: "High-frequency transabdominal transducers are recommended for early screening; a transvaginal transducer may be used. Colour Doppler, or high-quality power Doppler with bidirectional flow mapping, or both, are used in addition to grey-scale."
        claims: [IS23-092]
      - text: "The echocardiography guideline notes that frequencies of 5 to 12 MHz may help in the late first and early second trimesters."
        claims: [AS23-004]

  - heading: "Safety"
    blocks:
      - text: "In early screening, use Doppler mainly for the four-chamber view and the three-vessel-and-trachea view. Keep the thermal index at 1.0 or less. Keep exposure as short as possible, usually no more than 5 to 10 minutes."
        claims: [IS23-093]
      - text: "For early fetal echocardiography, which is a different examination, the echocardiography guideline says to keep the thermal and mechanical indices at or below 1.0 and to use Doppler sparingly."
        claims: [AS23-006]

  - heading: "A detailed early cardiac screen"
    blocks:
      - text: "When a detailed early screen is done, three components are recommended."
        claims: [IS23-094]
        table:
          columns: ["Component", "Mode", "What to show"]
          rows:
            - ["Situs and cardiac axis", "Grey-scale", "Situs and cardiac axis"]
            - ["Four-chamber view", "Grey-scale, and colour and/or bidirectional power Doppler", "The four-chamber view on both"]
            - ["Three-vessel-and-trachea view", "Colour and/or bidirectional power Doppler", "Aortic and ductal arches, both on the left"]
      - text: "Two practical points for the early four-chamber view with colour: a posterior fetal spine is the preferred position for showing inflow into both ventricles, and the balance between colour and grey-scale is adjusted to favour the flow signal in the small structures."
        claims: [IS23-102, IS23-101]

  - heading: "Limits of the early scan"
    blocks:
      - text: "Outflow-tract views are often difficult in early gestation and are prone to both false-negative and false-positive diagnosis."
        claims: [IS23-095]
      - text: "Suspicion of congenital heart disease at the early scan should lead to referral for early fetal echocardiography."
        claims: [IS23-095]
      - text: "Some lesions are not discovered until later in pregnancy."
        claims: [IS23-008]

  - heading: "What the echocardiography guideline adds"
    blocks:
      - kind: framing
        text: "These points come from the guideline on fetal echocardiography, the specialist examination. They are included so the screener knows what happens after an early referral."
      - text: "Suspicion of a cardiac anomaly in the late first trimester should prompt consideration of an early fetal echocardiogram, depending on available expertise and resources. Evidence is insufficient to recommend fetal echocardiography before 16 weeks for low-risk pregnancies."
        claims: [AS23-102, AS23-103]
      - text: "Early imaging has limits. Assessment of the pulmonary and systemic veins is limited, and limited resolution can hide subtle defects, including valve lesions."
        claims: [AS23-106, AS23-107]
      - text: "When early findings are uncertain or suspicious, a repeat examination within 1 to 2 weeks is suggested. Even after a normal detailed early examination, a repeat study is recommended at 18 to 20 weeks."
        claims: [AS23-108, AS23-109]
      - text: "Early counselling and reporting should mention the possibility of missed diagnoses and of lesions that progress later."
        claims: [AS23-110]

  - heading: "Nuchal translucency and the heart"
    blocks:
      - text: "A nuchal translucency of 3.5 mm or more at 11 to 14 weeks is an indication for detailed cardiac evaluation. This holds even if the measurement later falls into the normal range."
        claims: [IS23-081]
      - text: "With a nuchal translucency of 3.0 to 3.4 mm, fetal echocardiography may be considered."
        claims: [IS23-084]

missing_claims:
  - "An explicit statement, for screening, that a normal early cardiac scan does not replace the second-trimester screen. The echocardiography guideline says this for early fetal echocardiography (claim AS23-109); the editor to decide whether the course states it for screening (question Q2)."
  - "Other first-trimester markers linked to heart disease (tricuspid regurgitation, ductus venosus flow) - not in the screening guideline; needs a source."
  - "Which lesions can and cannot be detected at 11 to 14 weeks, with detection rates - needs a source."
  - "Transvaginal technique for the early heart - needs a source."

drills:
  - id: D9-Q01
    question: "What is the status of first-trimester cardiac screening in low-risk pregnancies?"
    options:
      - "Shown to be effective, but neither routine nor mandatory"
      - "Mandatory at every nuchal translucency scan"
      - "Not possible before 18 weeks"
      - "Shown to be ineffective in low-risk populations"
    answer: 0
    explanation: "Early screening has been shown to be effective in low-risk populations but is neither routine nor mandatory; where possible it can be done at the nuchal translucency scan."
    claims: [IS23-090]

  - id: D9-Q02
    question: "What are the minimum cardiac requirements at an early screen?"
    options:
      - "The heart is within the chest and the rhythm is regular"
      - "All five screening planes with colour Doppler"
      - "Both outflow tracts shown crossing"
      - "Pulsed-wave Doppler across all four valves"
    answer: 0
    explanation: "The minimum is seeing the heart within the chest and confirming a regular rhythm."
    claims: [IS23-091]

  - id: D9-Q03
    question: "After what gestation is success in seeing cardiac structures significantly higher?"
    options:
      - "After 12 weeks and 3 days"
      - "After 10 weeks"
      - "After 11 weeks exactly"
      - "Gestation makes no difference within the 11 to 14 week window"
    answer: 0
    explanation: "Success in visualising cardiac structures is significantly higher after 12+3 weeks."
    claims: [IS23-091]

  - id: D9-Q04
    question: "Which three components make up a detailed early cardiac screen?"
    options:
      - "Situs and axis; four-chamber view; three-vessel-and-trachea view"
      - "Four-chamber view; sagittal aortic arch; ductus venosus"
      - "Both outflow tracts; pulmonary veins; aortic isthmus"
      - "Upper abdomen; LVOT; RVOT"
    answer: 0
    explanation: "Situs and cardiac axis on grey-scale; four-chamber view on grey-scale and on colour and/or bidirectional power Doppler; three-vessel-and-trachea view on colour and/or bidirectional power Doppler."
    claims: [IS23-094]

  - id: D9-Q05
    question: "At a detailed early screen, what should the three-vessel-and-trachea view show on colour or bidirectional power Doppler?"
    options:
      - "Aortic and ductal arches, both on the left"
      - "One arch on each side of the trachea"
      - "The pulmonary veins entering the left atrium"
      - "The moderator band"
    answer: 0
    explanation: "The early three-vessel-and-trachea view is used to show left-sided aortic and ductal arches."
    claims: [IS23-094]

  - id: D9-Q06
    question: "What is the thermal index limit when Doppler is used at an early cardiac screen?"
    options:
      - "1.0 or less"
      - "1.5 or less"
      - "3.0 or less"
      - "No limit applies to colour Doppler"
    answer: 0
    explanation: "The thermal index should be 1.0 or less, with exposure as short as possible."
    claims: [IS23-093]

  - id: D9-Q07
    question: "How long should Doppler exposure usually last at an early cardiac screen?"
    options:
      - "As short as possible, usually no more than 5 to 10 minutes"
      - "As long as is needed to see every structure"
      - "At least 20 minutes for a complete study"
      - "Time is not relevant if the thermal index is below 2.0"
    answer: 0
    explanation: "Exposure should be as short as possible, usually no more than 5 to 10 minutes."
    claims: [IS23-093]

  - id: D9-Q08
    question: "At 12 weeks the outflow tracts look possibly abnormal but the view is difficult. What next?"
    options:
      - "Refer for early fetal echocardiography: heart disease is suspected"
      - "Report a definite outflow-tract anomaly"
      - "Report the heart as normal, because early outflow views are unreliable"
      - "Wait until the third trimester"
    answer: 0
    explanation: "Early outflow-tract views are prone to false-positive and false-negative diagnosis; suspicion of congenital heart disease at the early scan should lead to referral for early fetal echocardiography."
    claims: [IS23-095]

  - id: D9-Q09
    question: "Nuchal translucency was 3.8 mm at 12 weeks. A later measurement fell within the normal range. Is detailed cardiac evaluation still indicated?"
    options:
      - "Yes: 3.5 mm or more is an indication even if the measurement later becomes normal"
      - "No: the measurement has resolved"
      - "Only if another anomaly is found"
      - "Only if the family requests it"
    answer: 0
    explanation: "A nuchal translucency of 3.5 mm or more at 11 to 14 weeks is an indication for detailed cardiac evaluation even if it later falls within the normal range."
    claims: [IS23-081]

  - id: D9-Q10
    question: "At the 11 to 14 week scan nuchal translucency is 3.2 mm. What does the guideline say about fetal echocardiography?"
    options:
      - "It may be considered"
      - "It is not relevant at this measurement"
      - "It is contraindicated before 20 weeks"
      - "It replaces the anomaly scan"
    answer: 0
    explanation: "With a nuchal translucency of 3.0 to 3.4 mm, fetal echocardiography may be considered; 3.5 mm or more is a listed indication."
    claims: [IS23-084, IS23-081]

  - id: D9-Q11
    question: "Which transducers are recommended for early cardiac screening?"
    options:
      - "High-frequency transabdominal transducers; transvaginal may be used"
      - "Low-frequency transducers for better penetration"
      - "Transvaginal transducers only"
      - "Any transducer; frequency does not matter early in pregnancy"
    answer: 0
    explanation: "High-frequency transabdominal transducers are recommended and a transvaginal transducer may be used."
    claims: [IS23-092]

