  title: "Early cardiac screen"
  items:
    - text: "Minimum: heart within the chest"
      claims: [IS23-091]
    - text: "Minimum: rhythm regular"
      claims: [IS23-091]
    - text: "If a detailed early screen is done: situs and cardiac axis on grey-scale"
      claims: [IS23-094]
    - text: "If a detailed early screen is done: four-chamber view on grey-scale and on colour and/or bidirectional power Doppler"
      claims: [IS23-094]
    - text: "If a detailed early screen is done: three-vessel-and-trachea view on colour and/or bidirectional power Doppler, both arches on the left"
      claims: [IS23-094]
    - text: "When Doppler is used: thermal index 1.0 or less; exposure kept short"
      claims: [IS23-093]
    - text: "Nuchal translucency 3.5 mm or more at 11 to 14 weeks: detailed cardiac evaluation arranged"
      claims: [IS23-081]
    - text: "Suspicion of heart disease: referred for early fetal echocardiography"
      claims: [IS23-095]

video:
  title: "An early look at the heart"
  target_minutes: 5
  beats:
    - shot: "Presenter to camera"
      narration: "In a low-risk pregnancy, a look at the heart at the early scan can be done where possible. It is not compulsory. The least you confirm is a heart inside the chest, beating regularly."
      claims: [IS23-090, IS23-091]
    - shot: "Machine console: transducer selection and thermal index display"
      narration: "High-frequency transabdominal probe; a transvaginal probe can be used. Thermal index one or less. Doppler mainly on two views, and briefly."
      claims: [IS23-092, IS23-093]
    - shot: "Early four-chamber clip, grey-scale then colour"
      narration: "Situs and axis on grey-scale. Four chambers on grey-scale, then with colour or bidirectional power Doppler."
      claims: [IS23-094]
    - shot: "Early three-vessel-and-trachea clip in colour"
      narration: "The three-vessel-and-trachea view with colour or bidirectional power Doppler. Two arches, both on the left. Keep Doppler time short."
      claims: [IS23-094, IS23-093]
    - shot: "Presenter"
      narration: "Outflow tracts are hard this early and easy to get wrong. If you suspect heart disease, refer for an early fetal echocardiogram."
      claims: [IS23-095]
