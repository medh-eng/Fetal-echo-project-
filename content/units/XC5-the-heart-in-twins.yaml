# Unit XC5. Every text block and drill lists the claim IDs it rests on.
# Built only from ai-cross-checked claims (AHA 2014 twin-twin transfusion section, extracted by Claude,
# cross-checked by ChatGPT on 19 Nov 2026). Thin first version: no treatment detail, no staging table.
# AHA 2014 is twelve years old; newer series and staging are not in any claim held.

id: XC5
title: "The heart in twins: twin-twin transfusion"
tier: Diagnose
version: 0.1
summary: "How twin-twin transfusion affects the fetal heart, what the echocardiogram adds, and when to repeat it."
drafted_by: "Claude (Sonnet 5.5, 22 Nov 2026)"
audited_by: null
signed_by: null

objectives:
  - "State how often twin-twin transfusion occurs and why it matters."
  - "Describe the cardiac findings in the recipient twin."
  - "Explain what Quintero staging leaves out."
  - "Say when a fetal echocardiogram is part of the care."

sections:

  - heading: "The problem"
    blocks:
      - text: "AHA 2014 reported that twin-twin transfusion syndrome occurs in about 10% to 20% of monochorionic twin pregnancies, and that untreated, fetal mortality approaches 90% to 100%. These are historical estimates from a US statement, not current counselling figures or a prognosis once fetal therapy is available."
        claims: [AH14-215]

  - heading: "What the heart shows"
    blocks:
      - text: "The recipient twin often shows ventricular dysfunction, chamber enlargement, hypertrophy and atrioventricular valve regurgitation. Right ventricular outflow abnormalities can develop and may persist after laser therapy."
        claims: [AH14-216]
      - text: "Quintero staging is the system most used clinically, but it does not include cardiac findings. Cardiac scoring systems (Cincinnati, CHOP) have been proposed."
        claims: [AH14-217]
      - text: "Whether cardiac findings predict outcome is controversial."
        claims: [AH14-219]

  - heading: "The role of fetal echocardiography"
    blocks:
      - text: "A fetal echocardiogram should be part of the diagnostic assessment and initial management of twin-twin transfusion syndrome."
        claims: [AH14-218]
      - text: "As suggested in AHA 2014, after laser treatment a fetal echocardiogram 24 to 48 hours later should be considered for surviving twins. It is a suggestion to be considered, not a rule, and must be confirmed against the current fetal therapy protocol."
        claims: [AH14-220]

missing_claims:
  - "Quintero stages and the Cincinnati and CHOP scores in detail (Tables 17 and 18 of AHA 2014) - not harvested."
  - "Treatment of twin-twin transfusion, timing and referral to a fetal therapy centre - needs a source; Dr Kunda's own practice."
  - "Cardiac findings in the donor twin, and discordant growth in twins without transfusion - no claim held."
  - "Anything newer than 2014, and Indian practice - needs a newer source. In particular, the 2014 mortality and prevalence figures and the post-laser timing need a current source and the editor's review before release."

drills:
  - id: XC5-Q01
    question: "Which twin pregnancies are at risk of twin-twin transfusion syndrome?"
    options:
      - "Monochorionic twins"
      - "All twin pregnancies equally"
      - "Dichorionic twins only"
      - "Only twins with a heart defect"
    answer: 0
    explanation: "AHA 2014 reported that the syndrome occurs in about 10% to 20% of monochorionic twin pregnancies. This is a historical estimate, not a current prognosis."
    claims: [AH14-215]

  - id: XC5-Q02
    question: "Which cardiac findings are often seen in the recipient twin?"
    options:
      - "Ventricular dysfunction, chamber enlargement, hypertrophy and atrioventricular valve regurgitation"
      - "A normal heart in almost every case"
      - "Small ventricles with thin walls"
      - "Isolated pericardial effusion and nothing else"
    answer: 0
    explanation: "These are the recipient's usual findings. Right ventricular outflow abnormalities can also develop."
    claims: [AH14-216]

  - id: XC5-Q03
    question: "What is true of Quintero staging?"
    options:
