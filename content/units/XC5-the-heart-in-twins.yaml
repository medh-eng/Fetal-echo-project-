      - "It is based on the fetal echocardiogram"
      - "It has been replaced by the Cincinnati score"
      - "It predicts outcome from cardiac findings"
    answer: 0
    explanation: "Quintero staging is the most used system and has no cardiac component. Cardiac scores have been proposed."
    claims: [AH14-217]

  - id: XC5-Q04
    question: "Do cardiac findings reliably predict outcome in twin-twin transfusion?"
    options:
      - "That is controversial"
      - "Yes, in all cases"
      - "No, they never do"
      - "Only in the donor twin"
    answer: 0
    explanation: "AHA 2014 calls the value of cardiac findings for predicting outcome controversial."
    claims: [AH14-219]

  - id: XC5-Q05
    question: "After laser treatment, what does AHA 2014 say about the surviving twins?"
    options:
      - "Consider a fetal echocardiogram 24 to 48 hours later"
      - "A fetal echocardiogram is never needed"
      - "Repeat the study only at birth"
      - "Repeat the study after 2 weeks"
    answer: 0
    explanation: "AHA 2014 suggests that a fetal echocardiogram 24 to 48 hours after laser treatment should be considered. Confirm against the current fetal therapy protocol."
    claims: [AH14-220]

