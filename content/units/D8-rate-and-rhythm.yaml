# Unit D8. Every text block and drill lists the claim IDs it rests on.
# A block with no claims must be `kind: framing` (orientation only, no clinical facts).
# IS23 claims are from the ISUOG screening guideline; AS23 claims are from the ASE
# fetal echocardiography guideline and are not yet cross-checked.

id: D8
title: "Rate and rhythm for the screener"
tier: Detect
version: 0.1
summary: "The normal fetal heart rate, and the irregular, slow and fast findings that the guideline says need further assessment."
drafted_by: "Claude (15 Nov 2026)"
audited_by: "ChatGPT (Codex), 16 Nov 2026, against the ledger only; findings applied by Claude (Fable)."
signed_by: null

objectives:
  - "Give the normal fetal heart rate at screening."
  - "State when ectopic beats or an irregular rhythm need further assessment."
  - "Tell transient slowing from persistent bradycardia, and transient speeding from persistent tachycardia."
  - "Name the rhythm findings that are indications for fetal echocardiography."
  - "Describe in outline how a specialist works out the mechanism of an arrhythmia."

sections:

  - heading: "Normal"
    blocks:
      - text: "The normal heart rate is 120 to 160 beats per minute, and the rhythm should be regular."
        claims: [IS23-033]
      - kind: framing
        text: "The screener's task is not to name the arrhythmia. It is to recognise the findings that the guideline lists as needing further assessment. The guideline does not give a rule for every pattern in between; see the missing claims for this unit."

  - heading: "The irregular beat"
    blocks:
      - text: "Ectopic beats, seen as skipped beats, are the most common rhythm disturbance. They are often benign and resolve on their own. In low-risk populations they are not linked to a higher risk of structural heart disease."
        claims: [IS23-034]
      - text: "Further assessment is indicated when ectopic episodes are frequent, meaning more often than every three to five beats, or when the rhythm stays irregular for more than one to two weeks."
        claims: [IS23-035]

  - heading: "The slow heart"
    blocks:
      - text: "Transient bradycardia is seen in normal second-trimester fetuses and is associated with pressure from the transducer."
        claims: [IS23-036]
      - text: "A rate that stays at 110 beats per minute or below in a fetus that is otherwise well needs timely evaluation by a fetal cardiac specialist. Possible causes include frequent blocked atrial ectopic beats, atrioventricular block and sinus bradycardia."
        claims: [IS23-036]
      - text: "Recurrent decelerations of the fetal heart rate in the third trimester can reflect fetal hypoxia."
        claims: [IS23-098]

  - heading: "The fast heart"
    blocks:
      - text: "A mild, brief rise to 160 to 180 beats per minute can be a normal variant during fetal movement."
        claims: [IS23-037]
      - text: "A rate that stays at 180 beats per minute or above should be evaluated further for a tachyarrhythmia or fetal hypoxia."
        claims: [IS23-037]

  - heading: "At a glance"
    blocks:
      - table:
          columns: ["Finding", "Meaning for the screener"]
          rows:
            - ["120 to 160 per minute, regular", "Normal"]
            - ["Occasional skipped beats", "The most common rhythm disturbance; often benign"]
            - ["Skipped beats more often than every three to five beats, or irregular for more than one to two weeks", "Further assessment"]
            - ["Transient slowing, associated with probe pressure, in the second trimester", "Seen in normal fetuses"]
            - ["Stays at 110 per minute or below in a well fetus", "Timely specialist evaluation"]
            - ["Brief rise to 160 to 180 per minute with movement", "Can be a normal variant"]
            - ["Stays at 180 per minute or above", "Further evaluation"]
        text: "Rate and rhythm findings and what each means at screening."
        claims: [IS23-033, IS23-034, IS23-035, IS23-036, IS23-037]

  - heading: "Rhythm findings that are indications for fetal echocardiography"
    blocks:
      - text: "The guideline lists these among the fetal indications for fetal echocardiography: persistent tachycardia at 180 beats per minute or more, suspected heart block or persistent bradycardia at 110 or less, and a rhythm that is frequently or persistently irregular."
        claims: [IS23-082]

  - heading: "How the echocardiography guideline words it"
    blocks:
      - text: "The echocardiography guideline describes a sustained rate below 120 beats per minute as abnormal at any gestation, and a sustained rate above 160 to 180 as abnormal. The screening guideline sets its thresholds for referral at 110 or less and 180 or more. This unit teaches the screening thresholds."
        claims: [AS23-071, AS23-072, IS23-036, IS23-037]

  - heading: "What the specialist will do"
    blocks:
      - text: "Every fetal echocardiogram must document the heart rate and rhythm."
        claims: [AS23-073]
      - text: "Repeated blocked premature atrial beats can look like second- or third-degree heart block and must be told apart from it."
        claims: [AS23-084]
      - text: "When the rhythm is irregular, slow or fast, the mechanism should be documented with M-mode, pulsed-wave Doppler or tissue Doppler, alone or together."
        claims: [AS23-016]
      - text: "M-mode times the atria against the ventricles: the cursor passes through an atrial wall and the free wall of a ventricle together."
        claims: [AS23-017]
      - text: "Pulsed-wave Doppler does the same by sampling two flows at once: superior vena cava with ascending aorta, mitral inflow with aortic outflow, or pulmonary artery with pulmonary vein."
        claims: [AS23-018]
      - kind: framing
        text: "Knowing what these techniques are helps you explain to the family why they are being referred."

missing_claims:
  - "How urgently each rhythm finding should be seen (same day, within a week) - not stated in the screening guideline; needs a source and the editor's decision."
  - "Signs that a fetus with an arrhythmia is unwell (hydrops, effusions) and what the screener should record - needs a source."
  - "How to count the fetal heart rate reliably at screening (M-mode or Doppler method) - needs a source."
  - "What to do with patterns the guideline does not grade (for example a rate between 110 and 120, or occasional ectopic beats at a single visit): a complete triage scheme needs a source or the editor's teaching."
  - "Maternal conditions linked to heart block and how they change follow-up - planned for XC4."

drills:
  - id: D8-Q01
    question: "What is the normal fetal heart rate at a screening scan?"
    options:
      - "120 to 160 beats per minute, regular"
      - "100 to 140 beats per minute, regular"
      - "140 to 180 beats per minute, regular"
      - "Any rate above 100, regular or not"
    answer: 0
    explanation: "Normal is 120 to 160 beats per minute with a regular rhythm."
    claims: [IS23-033]

  - id: D8-Q02
    question: "You see an occasional skipped beat in an otherwise normal heart in a low-risk pregnancy. What does the guideline say about this finding?"
    options:
      - "It is the most common rhythm disturbance, often benign, and usually resolves on its own"
      - "It indicates structural heart disease until proven otherwise"
      - "It is a sign of fetal hypoxia"
      - "It always needs a fetal echocardiogram the same day"
    answer: 0
    explanation: "Ectopic beats are common, often benign and resolve spontaneously; in low-risk populations they are not associated with increased risk of structural heart disease."
    claims: [IS23-034]

  - id: D8-Q03
    question: "Every other beat is an ectopic beat, throughout the scan. What next?"
    options:
      - "Arrange further assessment: ectopic beats this frequent are an indication"
      - "Reassure; all ectopic beats are benign"
      - "Record a normal rhythm"
      - "Repeat the scan only if the mother notices reduced movement"
    answer: 0
    explanation: "Frequent ectopic episodes, more often than every three to five beats, are an indication for further assessment."
    claims: [IS23-035]

  - id: D8-Q04
    question: "Ectopic beats were first seen three weeks ago. The rhythm has been irregular at every visit since, including today. What next?"
    options:
      - "Arrange further assessment: the rhythm has stayed irregular for more than one to two weeks"
      - "Review again in another month"
      - "No action; duration does not matter"
      - "Stop checking the rhythm at later scans"
    answer: 0
    explanation: "A rhythm that stays irregular for more than one to two weeks is an indication for further assessment."
    claims: [IS23-035]

  - id: D8-Q05
    question: "At a second-trimester scan the heart slows for a few seconds while you press to improve the view, then returns to 140. How does the guideline describe this pattern?"
    options:
      - "Transient bradycardia, associated with transducer pressure, which is seen in normal second-trimester fetuses"
      - "Atrioventricular block"
      - "Persistent bradycardia needing urgent referral"
      - "A sign of a structural heart defect"
    answer: 0
    explanation: "Transient bradycardia associated with transducer pressure is seen in normal second-trimester fetuses. A rate that stays at 110 or below in a well fetus needs timely specialist evaluation."
    claims: [IS23-036]

  - id: D8-Q06
    question: "The rate stays at 100 beats per minute for the whole examination. The fetus is otherwise well. What next?"
    options:
      - "Timely evaluation by a fetal cardiac specialist"
      - "Nothing; this is normal"
      - "Recheck at the next routine visit"
      - "Record it as probe-pressure bradycardia"
    answer: 0
    explanation: "Persistent bradycardia at 110 or below in a well fetus needs timely evaluation by a fetal cardiac specialist."
    claims: [IS23-036]

  - id: D8-Q07
    question: "Which of these is a possible cause of persistent fetal bradycardia?"
    options:
      - "Frequent blocked atrial ectopic beats"
      - "Fetal movement"
      - "A cardiac axis of 45 degrees"
      - "A thin rim of pericardial fluid"
    answer: 0
    explanation: "Possible causes named in the guideline are frequent blocked atrial ectopic beats, atrioventricular block and sinus bradycardia."
    claims: [IS23-036]

  - id: D8-Q08
    question: "During active fetal movement the rate rises to 170 beats per minute for a short time and then returns to 150. How is this read?"
    options:
      - "It can be a normal variant"
      - "Persistent tachycardia; refer"
      - "A tachyarrhythmia"
      - "A sign of fetal hypoxia"
    answer: 0
    explanation: "Mild transient tachycardia of 160 to 180 can be a normal variant during fetal movement."
    claims: [IS23-037]

  - id: D8-Q09
    question: "The rate stays at 190 beats per minute. What should be considered?"
    options:
      - "A tachyarrhythmia or fetal hypoxia; evaluate further"
      - "A normal response to movement"
      - "Probe pressure"
      - "Nothing, if the four-chamber view is normal"
    answer: 0
    explanation: "Persistent tachycardia at 180 or more should be evaluated further for tachyarrhythmia or fetal hypoxia."
    claims: [IS23-037]

  - id: D8-Q10
    question: "Which rhythm finding is listed as an indication for fetal echocardiography?"
    options:
      - "Persistent bradycardia at 110 beats per minute or less"
      - "A rate of 150 beats per minute"
      - "A single ectopic beat seen once"
      - "Brief slowing with probe pressure"
    answer: 0
    explanation: "Persistent tachycardia (180 or more), suspected heart block or persistent bradycardia (110 or less) and frequent or persistently irregular rhythm are listed fetal indications."
    claims: [IS23-082]

  - id: D8-Q11
    question: "How does M-mode help the specialist work out the mechanism of an arrhythmia?"
    options:
      - "It times atrial against ventricular contraction with one cursor through an atrial wall and a ventricular free wall"
      - "It measures the peak velocity across a valve"
      - "It shows the direction of flow in the arches"
      - "It measures the size of the heart against the chest"
    answer: 0
    explanation: "M-mode times atrial against ventricular contraction; the cursor passes through an atrial wall and the free wall of a ventricle together."
    claims: [AS23-017]

checklist:
  title: "Rate and rhythm at every screen"
  items:
    - text: "Rate between 120 and 160 per minute"
      claims: [IS23-033]
    - text: "Rhythm regular"
      claims: [IS23-033]
    - text: "Rate stays at 110 or below in a well fetus: timely specialist evaluation arranged"
      claims: [IS23-036]
    - text: "Persistent rate of 180 or above: further evaluation arranged"
      claims: [IS23-037]
    - text: "Ectopic beats more often than every three to five beats: further assessment arranged"
      claims: [IS23-035]
    - text: "Rhythm irregular for more than one to two weeks: further assessment arranged"
      claims: [IS23-035]

video:
  title: "Rate and rhythm in one minute of scanning"
  target_minutes: 4
  beats:
    - shot: "Four-chamber clip, normal rhythm, with rate displayed"
      narration: "At screening, assess rate and regularity on the four-chamber view. One-twenty to one-sixty beats per minute, and regular."
      claims: [IS23-033]
    - shot: "Clip with an occasional early beat and a pause"
      narration: "A skipped beat now and then is the commonest rhythm finding. It is often benign and often settles. But count them."
      claims: [IS23-034, IS23-035]
    - shot: "Graphic: counting beats between pauses"
      narration: "Ectopic beats more often than every three to five beats need further assessment. So does a rhythm that stays irregular for more than one to two weeks."
      claims: [IS23-035]
    - shot: "Clip: rate slowing briefly, then recovering"
      narration: "A brief slow rate that goes with probe pressure is seen in normal second-trimester fetuses. A rate that stays at one-ten or below in a well fetus needs timely review by a fetal cardiac specialist."
      claims: [IS23-036]
    - shot: "Clip of a fast regular rhythm with rate displayed"
      narration: "A brief rise to between one-sixty and one-eighty with movement can be a normal variant. A rate that stays at one-eighty or above needs further evaluation."
      claims: [IS23-037]
