# Unit D13. Every text block and drill lists the claim IDs it rests on.
# A block with no claims must be `kind: framing` (orientation only, no clinical facts).
# IS23 claims are from the ISUOG screening guideline; AS23 claims are from the ASE
# fetal echocardiography guideline and are not yet cross-checked.

id: D13
title: "Quality assurance and audit"
tier: Detect
version: 0.1
summary: "What makes a screening examination good enough, what to store, how to audit your own work, and a one-page checklist."
drafted_by: "Claude (15 Nov 2026)"
audited_by: null
signed_by: null

objectives:
  - "Name the four things by which the quality of a screening examination is judged."
  - "Say what should be stored from every cardiac screen, and why."
  - "Set up a simple audit of your own images and detection."
  - "Use a checklist for the five planes on every patient."

sections:

  - heading: "What quality means"
    blocks:
      - text: "The quality of a screening examination is judged on four things: image quality, acquisition of the standard planes, appropriate interpretation of the views, and complete documentation."
        claims: [IS23-087]
      - text: "The 2023 guideline added sections on quality assurance and on the use of a checklist."
        claims: [IS23-002]

  - heading: "Why it matters"
    blocks:
      - text: "In one retrospective study of missed diagnoses, failure to meet technical criteria contributed to about half of the misses. Failure to recognise abnormal anatomy on an adequate view accounted for nearly a third more."
        claims: [IS23-088]

  - heading: "Image quality starts with set-up"
    blocks:
      - text: "Use settings that favour a high frame rate with more contrast and high resolution: low persistence, a single focal zone and a fairly narrow image field. Cardiac presets usually include these."
        claims: [IS23-014]
      - text: "Magnify until the heart fills at least a third to a half of the screen."
        claims: [IS23-015]

  - heading: "What to store"
    blocks:
      - text: "Still frames and video clips of the recommended structures and views should be archived, so that the examination can be reviewed later for adequacy. Identify the patient appropriately in the clinical record, label laterality and orientation where appropriate, and take local or national archiving standards into account."
        claims: [IS23-017]
      - text: "The views of the right ventricular outflow tract, the branch pulmonary arteries and the two arches form a continuum. They are likely to be judged more reliably live or on a clip than from still images alone."
        claims: [IS23-063]
      - text: "For a full fetal echocardiogram, the echocardiography guideline asks for stills, moving clips and a structured report. It requires a sweep from the stomach to the upper mediastinum, and two-dimensional and colour clips of the individual views, including the three-vessel view and the three-vessel-and-trachea view."
        claims: [AS23-008]
      - text: "The same guideline says images should be kept in a secure digital archive that allows retrieval for review, that local legal requirements decide how long they are kept, and that a study which stays non-diagnostic after optimisation should have its limitations stated in the report."
        claims: [AS23-113, AS23-114, AS23-117]

  - heading: "Auditing yourself"
    blocks:
      - text: "Audit of stored stills or clips against quality criteria set in advance is encouraged."
        claims: [IS23-089]
      - text: "Each practice is encouraged to review its own detection rates and diagnostic accuracy every year, and to arrange further training where the review shows a need."
        claims: [IS23-089]
      - text: "Continuous training based on feedback, standardised protocols, a low threshold for referral and easy access to fetal heart specialists can all improve a programme. For fetal echocardiography services, ongoing quality improvement should be documented."
        claims: [IS23-006, AS23-112]
      - kind: framing
        text: "How a practice samples its studies and scores them is a local decision. The guideline gives no method, and none is taught here; see the missing claims for this unit."

  - heading: "The checklist"
    blocks:
      - kind: framing
        text: "The checklist below gathers the main criteria for the five planes, for learning and for audit. It is a selection. Completing it does not by itself establish a complete normal examination."

missing_claims:
  - "A scoring system for image quality of each cardiac plane (published criteria with points) - needs a source."
  - "A target or benchmark detection rate to audit against - needs a source; none is stated in the guideline claims held."
  - "How long images must be kept and how PC-PNDT record-keeping applies to stored clips in India - the echocardiography guideline only says to follow local legal requirements (AS23-114); needs an Indian legal source and the advisor's input."
  - "A method for sampling studies, scoring them and working out a practice's own detection rate and accuracy - not given in the guideline; needs a source or the editor's design."
  - "How to obtain outcome feedback after delivery in Indian practice - needs the editor's input."

drills:
  - id: D13-Q01
    question: "By which four things is the quality of a cardiac screening examination judged?"
    options:
      - "Image quality, acquisition of the standard planes, interpretation of the views, and documentation"
      - "Scan duration, machine model, transducer type and gestational age"
      - "Number of images, colour Doppler use, 3D use and report length"
      - "Patient satisfaction, waiting time, cost and report turnaround"
    answer: 0
    explanation: "Quality assessment covers image quality, acquisition of the standard planes, appropriate interpretation and complete documentation."
    claims: [IS23-087]

  - id: D13-Q02
    question: "Why should stills and clips of the cardiac views be archived?"
    options:
      - "So the examination can be reviewed later for adequacy"
      - "Only to give copies to the family"
      - "Because clips replace the written report"
      - "There is no recommendation to store them"
    answer: 0
    explanation: "Still frames and clips of the recommended views should be archived so the examination can later be reviewed for adequacy."
    claims: [IS23-017]

  - id: D13-Q03
    question: "What should be labelled on stored images where appropriate?"
    options:
      - "Laterality and orientation"
      - "The examiner's opinion of the family history"
      - "The thermal index only"
      - "Nothing; labels reduce image quality"
    answer: 0
    explanation: "Stored images should carry labelling of laterality and orientation where appropriate."
    claims: [IS23-017]

  - id: D13-Q04
    question: "For the right ventricular outflow tract and arch views, which is likely to be the more reliable basis for assessment?"
    options:
      - "A cine clip"
      - "A single still frame of each"
      - "A written description alone"
      - "A measurement of each vessel"
    answer: 0
    explanation: "These views form a continuum that varies with probe orientation and fetal lie; assessment is likely to be more reliable live or on cine-loop than from stills alone."
    claims: [IS23-063]

  - id: D13-Q05
    question: "How often is a practice encouraged to review its detection rates and diagnostic accuracy?"
    options:
      - "Every year"
      - "Every ten years"
      - "Only when a diagnosis is missed"
      - "Never; this is the job of the referral centre"
    answer: 0
    explanation: "Annual review of local detection rates and accuracy is encouraged."
    claims: [IS23-089]

  - id: D13-Q06
    question: "What is audit of stored images measured against?"
    options:
      - "Quality criteria set in advance"
      - "The examiner's memory of the scan"
      - "The length of the examination"
      - "The number of images stored"
    answer: 0
    explanation: "Audit against predetermined quality criteria for still images or clips is encouraged."
    claims: [IS23-089]

  - id: D13-Q07
    question: "Your annual review shows that outflow-tract views were often not stored or not adequate. What does the guideline encourage?"
    options:
      - "Further training targeted at the gap"
      - "Dropping outflow-tract views from the protocol"
      - "No action unless a baby was harmed"
      - "Replacing the machine"
    answer: 0
    explanation: "Practices are encouraged to review their results and provide further training as needed; outflow-tract views are an integral part of the screen."
    claims: [IS23-089, IS23-048]

  - id: D13-Q08
    question: "How large should the heart appear on the screen for a good-quality image?"
    options:
      - "At least a third to a half of the screen"
      - "About a tenth of the screen"
      - "Size on screen does not matter"
      - "The whole fetus should be in view with the heart"
    answer: 0
    explanation: "The image should be magnified until the heart fills at least one third to one half of the screen."
    claims: [IS23-015]

  - id: D13-Q09
    question: "Which settings does the guideline recommend for the cardiac image?"
    options:
      - "High frame rate, low persistence, a single focal zone and a narrow image field"
      - "Low frame rate, high persistence and a wide image field"
      - "Multiple focal zones and maximum depth"
      - "Maximum depth with the whole fetus in view"
    answer: 0
    explanation: "Settings should emphasise high frame rate, contrast and resolution, with low persistence, a single focal zone and a relatively narrow field; cardiac presets usually include these."
    claims: [IS23-014]

  - id: D13-Q10
    question: "What did the 2023 screening guideline add?"
    options:
      - "Sections on quality assurance and on use of a checklist"
      - "A requirement for 3D imaging in every screen"
      - "Removal of the outflow-tract views"
      - "A requirement for pulsed-wave Doppler in every screen"
    answer: 0
    explanation: "The 2023 update encourages colour flow Doppler and adds sections on quality assurance and on use of a checklist."
    claims: [IS23-002]

checklist:
  title: "Five-plane screening checklist (main criteria)"
  items:
    - text: "Fetal left and right worked out first"
      claims: [IS23-021]
    - text: "Upper abdomen at the abdominal circumference level: stomach on the left; descending aorta left of the spine; inferior vena cava right of the spine"
      claims: [IS23-024]
    - text: "Heart mainly in the left chest; usually no larger than a third of the chest area"
      claims: [IS23-026, IS23-028]
    - text: "Axis about 45 degrees to the left (plus or minus 20) of the front-to-back axis of the chest"
      claims: [IS23-028]
    - text: "Rate 120 to 160 per minute, regular"
      claims: [IS23-033]
    - text: "Atria similar in size; foramen ovale flap moving within the left atrium; septum primum present"
      claims: [IS23-038]
    - text: "At least one pulmonary vein seen entering the left atrium on grey-scale, where technically feasible"
      claims: [IS23-040]
    - text: "Ventricles similar in size, walls not thick; moderator band near the apex marks the right ventricle. Asymmetry in mid-gestation needs further examination; mild disproportion can be a third-trimester variant"
      claims: [IS23-042, IS23-043]
    - text: "Ventricular septum examined from apex to crux, with the adequacy of the view recorded"
      claims: [IS23-044, IS23-045]
    - text: "Two atrioventricular valves opening separately and freely; septal leaflet of the tricuspid valve inserted nearer the apex"
      claims: [IS23-047]
    - text: "LVOT: vessel from the left ventricle, anterior wall continuous with the septum, not dividing; valve not thickened, moving freely"
      claims: [IS23-052, IS23-059, IS23-060]
    - text: "RVOT: vessel from the right ventricle, dividing after a short course; valve not thickened, moving freely"
      claims: [IS23-052, IS23-064]
    - text: "Great arteries cross and are approximately equal in size"
      claims: [IS23-051, IS23-052]
    - text: "Three-vessel view: number, size, alignment and arrangement of the three vessels"
      claims: [IS23-066]
    - text: "Three-vessel-and-trachea view: V shape, both arches left of the trachea, arches similar in size"
      claims: [IS23-069, IS23-096]
    - text: "Stills and clips of the recommended views stored; laterality and orientation labelled where appropriate"
      claims: [IS23-017]

video:
  title: "Audit your own hearts"
  target_minutes: 4
  beats:
    - shot: "Presenter to camera"
      narration: "A good screen has four parts. Good images. All the planes. The right reading. And a complete record."
      claims: [IS23-087]
    - shot: "Screen recording: storing a clip of each plane"
      narration: "Store stills and clips of the recommended views. The outflow and arch views especially are likely to be judged better moving than still."
      claims: [IS23-017, IS23-063]
    - shot: "Desk shot: reviewing stored studies against a printed checklist"
      narration: "Auditing your stored images against criteria set in advance is encouraged."
      claims: [IS23-089]
    - shot: "Presenter"
      narration: "Once a year, review your detection rates and your diagnostic accuracy. Where there is a gap, train for it."
      claims: [IS23-089]
