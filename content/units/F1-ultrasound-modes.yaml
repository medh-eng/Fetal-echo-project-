# Unit F1. Requested by the editor-in-chief on 13 Nov 2026.
# Every text block, table, drill and checklist item lists the claim IDs it rests on.
# A block with no claims must be `kind: framing` (orientation only, no clinical facts).

id: F1
title: "Ultrasound modes used in fetal echocardiography"
tier: Foundation
version: 0.1
public: true
summary: "Which modes are used to examine the fetal heart, what each one answers, and which are essential, optional or still research."
drafted_by: "Claude (13 Nov 2026)"
audited_by: null
signed_by: null

objectives:
  - "Name the modes a machine must have for a fetal echocardiogram."
  - "Say what question each mode answers about the heart."
  - "Tell apart the modes that are required, those used when needed, and those still under study."
  - "Choose the right mode to work out an abnormal rhythm."
  - "Apply the safety rules for Doppler, especially in early pregnancy."

sections:

  - heading: "One heart, several ways of looking"
    blocks:
      - kind: framing
        text: "No single mode shows everything. Each one answers a different question: what does the heart look like, where is blood going, how fast, and in what order do the chambers contract. Knowing which mode answers which question is the first step in a complete examination."
      - text: "A fetal echocardiogram should use two-dimensional imaging, colour Doppler and spectral Doppler together, with the settings adjusted for the fetal heart."
        claims: [AS23-001]
      - text: "The machine must have at least four modes: two-dimensional (B-mode), M-mode, colour flow and pulsed-wave Doppler."
        claims: [AS23-002]

  - heading: "The modes at a glance"
    blocks:
      - text: "Modes used in fetal echocardiography and the place of each."
        claims: [AS23-001, AS23-002, AS23-009, AS23-011, AS23-012, AS23-015, AS23-017, AS23-019, AS23-020, AS23-021, AS23-022]
        table:
          columns: ["Mode", "What it answers", "Place in the examination"]
          rows:
            - ["Two-dimensional (B-mode, grey-scale)", "Structure: chambers, septa, valves, vessels", "Essential"]
            - ["Colour Doppler", "Is there flow, and in which direction", "Essential"]
            - ["Pulsed-wave (spectral) Doppler", "Flow profile and direction at one chosen site", "Essential"]
            - ["M-mode", "Timing of atrial and ventricular contraction; shortening and annular movement", "Machine must have it; used for rhythm and function"]
            - ["Power Doppler", "Small vessels, slow flow, septal defects", "Helpful addition to colour"]
            - ["Continuous-wave Doppler", "High velocities and gradients", "Only when flow is abnormal"]
            - ["Tissue Doppler", "Movement of the heart muscle; time intervals", "Optional; may help with rhythm"]
            - ["3D / 4D and STIC", "Extra anatomical and functional detail", "Not validated for clinical use"]
            - ["Strain and speckle tracking", "Subtle change in muscle function", "Under investigation"]

  - heading: "Two-dimensional imaging"
    blocks:
      - text: "Grey-scale imaging is the base of the examination. It needs a high frame rate: above 30 to 40 Hz, and higher still for fast heart rates. A narrow sector and the right depth help reach it."
        claims: [AS23-007]
      - text: "Cardiac presets usually build these in: high frame rate, more contrast, low persistence, one focal zone and a narrow field. Harmonic imaging helps when the abdominal wall is thick and late in pregnancy."
        claims: [IS23-014, IS23-013]
      - text: "Record moving clips as well as stills. The clips should cover the sweep, the four-chamber view, both outflow tracts, the three-vessel views and the long-axis views of both arches. Cine-loop lets you follow the valves through the whole cycle."
        claims: [AS23-008, IS23-016]

  - heading: "Colour Doppler"
    blocks:
      - text: "Colour shows whether blood is flowing and which way. Use it to look for narrowed or leaking valves, flow across the foramen ovale, gaps in the septa and whether a vessel is open."
        claims: [AS23-009]
      - text: "Set the velocity scale to the flow you are looking at. Adjust gain and persistence so the colour fills the chamber or vessel without covering the grey-scale picture."
        claims: [AS23-010]
      - text: "For a mid-pregnancy screen, a scale of about 50 to 70 cm/s suits the heart and arteries and about 15 to 25 cm/s suits veins. Keep the colour box narrow and only over the area of interest, so the frame rate holds."
        claims: [IS23-076, IS23-077]
      - text: "Show colour beside the grey-scale image, not instead of it. In a normal heart colour shows forward flow through all four valves and both arches."
        claims: [IS23-041, IS23-074]
      - text: "In routine screening colour is encouraged but not compulsory. In a fetal echocardiogram it is part of the standard examination."
        claims: [IS23-073, AS23-001]

  - heading: "Power Doppler"
    blocks:
      - text: "Power Doppler shows the strength of the Doppler signal rather than its frequency shift. It is useful for small vessels, slow flow such as in veins, and septal defects. The directional form also shows which way the blood moves."
        claims: [AS23-011]
      - text: "In early cardiac screening, colour or good-quality power Doppler is used alongside grey-scale."
        claims: [IS23-092]

  - heading: "Pulsed-wave Doppler"
    blocks:
      - text: "Pulsed-wave Doppler gives the pattern and direction of flow at one chosen point. Line the beam up with the flow, or within 20 degrees of it. Keep the sample gate small so that only one site is sampled."
        claims: [AS23-012]
      - text: "Sites that must be sampled in a fetal echocardiogram: umbilical vein, ductus venosus, a pulmonary vein on each side, tricuspid and mitral inflow, aortic and pulmonary outflow, the far end of the ductus arteriosus and the umbilical artery."
        claims: [AS23-013]
      - text: "Sites sampled when needed: hepatic vein, the venae cavae, branch pulmonary arteries, middle cerebral artery, and left ventricular inflow and outflow together."
        claims: [AS23-014]

  - heading: "Continuous-wave Doppler"
    blocks:
      - text: "A normal heart does not need continuous-wave Doppler. It is used when flow is abnormally fast: to measure high velocities and valve gradients, and to estimate pressure from a leaking atrioventricular valve. The beam must lie along the jet."
        claims: [AS23-003, AS23-015]

  - heading: "M-mode"
    blocks:
      - text: "M-mode shows the exact timing of atrial and ventricular contraction. Place the cursor so that it crosses an atrial wall and a ventricular free wall at once."
        claims: [AS23-017]
      - text: "It is also used for systolic function: shortening fraction of the ventricles and the movement of the tricuspid and mitral valve rings."
        claims: [AS23-020]

  - heading: "Working out an abnormal rhythm"
    blocks:
      - text: "If the rhythm is irregular, too slow or too fast, record how it arises. Use M-mode, pulsed-wave Doppler or tissue Doppler, or more than one of them."
        claims: [AS23-016]
      - text: "With pulsed-wave Doppler, sample two flows at once so that atrial and ventricular events appear on one trace: superior vena cava with ascending aorta, mitral inflow with aortic outflow, or pulmonary artery with pulmonary vein."
        claims: [AS23-018]
      - text: "Tissue Doppler at the outer edge of the mitral or tricuspid ring records the speed and timing of muscle movement and may help, for example in a slow rhythm."
        claims: [AS23-019]

  - heading: "Newer modes: 3D, 4D, STIC, strain"
    blocks:
      - text: "Three-dimensional imaging and STIC can add detail on anatomy and function, but STIC has not been validated for clinical use."
        claims: [AS23-021]
      - text: "Tissue Doppler and strain imaging, including speckle tracking, are well studied after birth and may pick up subtle dysfunction. Their routine use in the fetus is not established. Speckle tracking needs very high frame rates."
        claims: [AS23-022, AS23-007]

  - heading: "Probe and safety"
    blocks:
      - text: "A curvilinear probe is preferred; linear and sector probes can also be used. Frequencies of 2 to 7 MHz suit the later second and third trimesters, and 5 to 12 MHz may help earlier. Use the highest frequency that still penetrates."
        claims: [AS23-004, IS23-012]
      - text: "Keep exposure as low as reasonably achievable. This decides which modes you use and for how long. Know the thermal and mechanical index on your screen."
        claims: [AS23-005]
      - text: "In early pregnancy keep both indices at or below 1.0, use Doppler sparingly and keep exposure short, usually no more than 5 to 10 minutes."
        claims: [AS23-006, IS23-093]

  - heading: "Screening scan or fetal echocardiogram"
    blocks:
      - text: "A screening scan rests on grey-scale views, with colour encouraged. A fetal echocardiogram adds colour and spectral Doppler as standard, and M-mode and the other modes as the findings require."
        claims: [IS23-018, IS23-073, AS23-001, AS23-016]

