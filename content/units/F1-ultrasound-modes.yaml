# Unit F1. Requested by the editor-in-chief on 13 Nov 2026.
# Every text block, table, drill and checklist item lists the claim IDs it rests on.
# A block with no claims must be `kind: framing` (orientation only, no clinical facts).

id: F1
title: "Ultrasound modes used in fetal echocardiography"
tier: Foundation
version: 0.2
public: true
summary: "Which modes are used to examine the fetal heart, what each one answers, and which are essential, optional or still research."
drafted_by: "Claude (13 Nov 2026)"
audited_by: "ChatGPT (Codex), 16 Nov 2026, against the ledger only; findings applied by Claude (Fable)."
signed_by: null

objectives:
  - "Name the modes a machine must have for a fetal echocardiogram."
  - "Say what question each mode answers about the heart."
  - "Tell apart the modes that are required, those used when needed, and those still under study."
  - "Choose the right mode to work out an abnormal rhythm."
  - "Apply the safety rules for Doppler, especially in early pregnancy."

sections:

  - heading: "One heart, several ways of looking"
    blocks:
      - kind: framing
        text: "This unit compares the modes by what each is used for: structure, flow, velocity and timing. It describes the modes; it does not set the order in which they are used."
      - text: "A fetal echocardiogram should use two-dimensional imaging, colour Doppler and spectral Doppler together, with the settings adjusted for the fetal heart."
        claims: [AS23-001]
      - text: "The machine must have at least four modes: two-dimensional (B-mode), M-mode, colour flow and pulsed-wave Doppler."
        claims: [AS23-002]

  - heading: "The modes at a glance"
    blocks:
      - text: "Modes used in fetal echocardiography and the place of each."
        claims: [AS23-001, AS23-002, AS23-003, AS23-009, AS23-011, AS23-012, AS23-013, AS23-014, AS23-015, AS23-017, AS23-019, AS23-020, AS23-021, AS23-022]
        table:
          columns: ["Mode", "What it answers", "Place in the examination"]
          rows:
            - ["Two-dimensional (B-mode, grey-scale)", "Structure", "Part of every examination"]
            - ["Colour Doppler", "Is there flow, and in which direction", "Part of every examination"]
            - ["Pulsed-wave (spectral) Doppler", "Flow profile and direction at a chosen site", "Part of every examination; required sites are listed in the guideline"]
            - ["M-mode", "Timing of atrial and ventricular contraction; shortening and annular movement", "Machine must have it; used for rhythm and function"]
            - ["Power Doppler", "Small vessels, slow flow, septal defects", "Can help to show these"]
            - ["Continuous-wave Doppler", "High velocities, valve gradients, pressure from a regurgitant jet", "Where the machine has it; not needed when the heart is normal"]
            - ["Tissue Doppler", "Movement of the heart muscle; time intervals", "Optional at the lateral valve annulus; may help with rhythm"]
            - ["Three-dimensional imaging and STIC", "Extra anatomical and functional detail", "Can add information; STIC is not validated for clinical use"]
            - ["Strain and speckle tracking", "May detect subclinical dysfunction", "Use in pregnancy needs further investigation"]

  - heading: "Two-dimensional imaging"
    blocks:
      - text: "Frame rates above 30 to 40 Hz are recommended for scanning the fetal heart. Rates of 80 to 100 Hz may be needed to capture important events at heart rates above 140 beats per minute. A narrow sector and an appropriate depth help to reach these."
        claims: [AS23-007]
      - text: "From the screening guideline: cardiac presets usually build in a high frame rate, more contrast, low persistence, one focal zone and a narrow field. Harmonic imaging helps when the abdominal wall is thick and in the third trimester."
        claims: [IS23-014, IS23-013]
      - text: "The study should include stills, moving clips and a structured report. A sweep from the stomach to the upper mediastinum is required, with two-dimensional and colour clips of the individual views, including the three-vessel view and the three-vessel-and-trachea view. Cine-loop lets you follow the valves through the whole cycle."
        claims: [AS23-008, IS23-016]

  - heading: "Colour Doppler"
    blocks:
      - text: "Colour shows whether blood is flowing and which way. Use it to look for narrowed or leaking valves, flow across the foramen ovale, gaps in the septa and whether a vessel is open."
        claims: [AS23-009]
      - text: "Set the velocity scale to the velocities of interest. Adjust gain and persistence so the colour fills the chamber or vessel without covering the grey-scale picture."
        claims: [AS23-010]
      - text: "The screening guideline gives starting values for a second-trimester screen: a scale of about 50 to 70 cm/s for the heart and arteries and about 15 to 25 cm/s for veins. It also says to keep the colour box narrow and only over the area of interest, which preserves frame rate."
        claims: [IS23-076, IS23-077]
      - text: "The screening guideline advises showing colour beside the grey-scale image when demonstrating the pulmonary veins. In a normal heart colour shows forward flow across the atrioventricular valves, the semilunar valves and the great arteries."
        claims: [IS23-041, IS23-074]
      - text: "In routine screening colour is encouraged but not compulsory. In a fetal echocardiogram it is part of the standard examination."
        claims: [IS23-073, AS23-001]

  - heading: "Power Doppler"
    blocks:
      - text: "Power Doppler shows the strength of the Doppler signal rather than its frequency shift. It helps to show small vessels, slow flow such as in veins, and septal defects. The directional form also shows which way the blood moves."
        claims: [AS23-011]
      - text: "In early cardiac screening, colour Doppler, or high-quality power Doppler with bidirectional flow mapping, or both, are used alongside grey-scale."
        claims: [IS23-092]

  - heading: "Pulsed-wave Doppler"
    blocks:
      - text: "Pulsed-wave Doppler gives the pattern and direction of flow at a chosen point. Line the beam up with the flow, or keep the angle below 20 degrees. A small sample gate reduces the chance of sampling more than one site. (Rhythm assessment is the exception: there, two flows are sampled together on purpose.)"
        claims: [AS23-012, AS23-018]
      - text: "The guideline's table of pulsed-wave sites lists as required: umbilical vein, ductus venosus, at least one pulmonary vein on each side, tricuspid and mitral inflow, aortic and pulmonary outflow, the distal ductus arteriosus and the umbilical artery."
        claims: [AS23-013]
      - text: "The same table marks as optional: hepatic vein, the venae cavae, branch pulmonary arteries, middle cerebral artery, a combined left ventricular inflow and outflow recording, and tissue Doppler at the lateral tricuspid and mitral annulus."
        claims: [AS23-014]
      - text: "Not settled: the table also marks the transverse aortic arch and isthmus as optional, while the guideline's text includes 'arches' in its minimum pulsed-wave assessment. The guideline does not reconcile the two. This course does not yet teach either reading as the rule; the editor's decision is awaited."
        claims: [AS23-014]

  - heading: "Continuous-wave Doppler"
    blocks:
      - text: "Continuous-wave Doppler is not needed when the heart is normal. Where the machine has it, it can be used to characterise high velocities and valve gradients, and to estimate pressure from a regurgitant jet through an atrioventricular valve, with the beam aligned along the jet."
        claims: [AS23-003, AS23-015]

  - heading: "M-mode"
    blocks:
      - text: "M-mode shows the exact timing of atrial and ventricular contraction. Place the cursor so that it crosses an atrial wall and a ventricular free wall at once."
        claims: [AS23-017]
      - text: "It is also used for systolic function: shortening fraction of the ventricles and the movement of the tricuspid and mitral valve rings."
        claims: [AS23-020]

  - heading: "Working out an abnormal rhythm"
    blocks:
      - text: "If the rhythm is irregular, too slow or too fast, record how it arises. Use M-mode, pulsed-wave Doppler or tissue Doppler, or more than one of them."
        claims: [AS23-016]
      - text: "With pulsed-wave Doppler, sample two flows at once so that atrial and ventricular events appear on one trace: superior vena cava with ascending aorta, mitral inflow with aortic outflow, or pulmonary artery with pulmonary vein."
        claims: [AS23-018]
      - text: "Tissue Doppler at the outer edge of the mitral or tricuspid ring records the speed and timing of muscle movement and may help, for example in a slow rhythm."
        claims: [AS23-019]

  - heading: "Newer modes: 3D, 4D, STIC, strain"
    blocks:
      - text: "Three-dimensional imaging and STIC can add detail on anatomy and function. STIC has not been validated for clinical use."
        claims: [AS23-021]
      - text: "Tissue Doppler and strain imaging are ways of assessing how the heart muscle moves and deforms. Two-dimensional strain, also called speckle tracking, may detect subclinical dysfunction. Their application in pregnancy needs further investigation. Frame rates of 80 to 100 Hz may be needed for speckle tracking."
        claims: [AS23-022, AS23-007]

  - heading: "Probe and safety"
    blocks:
      - text: "A curvilinear probe is preferred; linear and sector probes can also be used. A range of 2 to 7 MHz is recommended for the late second and third trimesters, and 5 to 12 MHz may help in the late first and early second trimesters. The screening guideline adds: use the highest frequency that still penetrates."
        claims: [AS23-004, IS23-012]
      - text: "Fetal echocardiography follows the principle of keeping exposure as low as reasonably achievable. Be aware of the thermal and mechanical indices, and limit power output and exposure time."
        claims: [AS23-005]
      - text: "For early fetal echocardiography, keep the thermal and mechanical indices at or below 1.0 and use Doppler sparingly. The soft-tissue thermal index is monitored before 10 weeks and the bone thermal index from 10 weeks onward."
        claims: [AS23-006, AS23-119]
      - text: "For early cardiac screening, a different examination, the screening guideline says: thermal index 1.0 or less, and Doppler exposure as short as possible, usually no more than 5 to 10 minutes. This is not a time allowance for a whole fetal echocardiogram."
        claims: [IS23-093]

  - heading: "Screening scan or fetal echocardiogram"
    blocks:
      - text: "A screening scan rests on grey-scale views, with colour encouraged. A fetal echocardiogram uses two-dimensional imaging, colour Doppler and spectral Doppler as standard. When the rhythm is abnormal, its mechanism is documented with M-mode, pulsed-wave Doppler or tissue Doppler."
        claims: [IS23-018, IS23-073, AS23-001, AS23-016]

missing_claims:
  - "How each mode forms its image (basic physics, aliasing, Nyquist limit explained) - needs a physics source; planned for unit XA4."
  - "Arch and isthmus as pulsed-wave sites: the unit states the disagreement inside the guideline and teaches neither reading as the rule. The cross-check of 16 Nov confirmed the disagreement is real. Editor to decide (question Q1)."
  - "Colour M-mode: the harvest of 16 Nov found no separate recommendation for it in the ASE guideline."
  - "ISUOG fetal echocardiography guideline and AIUM practice parameter on modes - not yet harvested; add to compare with ASE."
  - "High-definition (HD) flow and other machine-specific modes on the Voluson - needs a source and the editor's input."

drills:
  - id: F1-Q01
    question: "Which three modalities should every fetal echocardiogram use together?"
    options:
      - "Two-dimensional imaging, colour Doppler and spectral Doppler"
      - "Two-dimensional imaging, 3D imaging and STIC"
      - "M-mode, continuous-wave Doppler and strain imaging"
      - "Two-dimensional imaging alone"
    answer: 0
    explanation: "Two-dimensional, colour Doppler and spectral Doppler imaging are used together, with settings optimised for the fetal heart."
    claims: [AS23-001]

  - id: F1-Q02
    question: "Which set of modes is the minimum a machine needs for fetal echocardiography?"
    options:
      - "B-mode, M-mode, colour flow and pulsed-wave Doppler"
      - "B-mode, colour flow and 4D"
      - "B-mode, continuous-wave Doppler and tissue Doppler"
      - "B-mode and power Doppler"
    answer: 0
    explanation: "The minimum is two-dimensional (B-mode), M-mode, colour flow and pulsed-wave Doppler."
    claims: [AS23-002]

  - id: F1-Q03
    question: "You want the flow pattern at one exact point, such as the ductus venosus. Which mode?"
    options:
      - "Pulsed-wave Doppler"
      - "Continuous-wave Doppler"
      - "M-mode"
      - "Power Doppler"
    answer: 0
    explanation: "Pulsed-wave Doppler gives the flow profile and direction at a chosen site."
    claims: [AS23-012, AS23-013]

  - id: F1-Q04
    question: "Which use of continuous-wave Doppler does the guideline describe?"
    options:
      - "Characterising high velocities and valve gradients"
      - "Routine recording in every normal heart"
      - "To time atrial and ventricular contraction"
      - "To show small veins with slow flow"
    answer: 0
    explanation: "It is not needed when the heart is normal. Where available it can characterise high velocities and gradients and help estimate pressure from a regurgitant jet."
    claims: [AS23-015]

  - id: F1-Q05
    question: "What does power Doppler display?"
    options:
      - "The amplitude of the Doppler signal"
      - "The frequency shift of the Doppler signal"
      - "Movement of one line of tissue over time"
      - "Deformation of the heart muscle"
    answer: 0
    explanation: "Power Doppler shows signal amplitude rather than frequency shift, which makes it useful for small vessels and slow flow."
    claims: [AS23-011]

  - id: F1-Q06
    question: "Where do you place the M-mode cursor to work out a rhythm?"
    options:
      - "Through an atrial wall and a ventricular free wall together"
      - "Through the ventricular septum only"
      - "Along the aortic arch"
      - "Across both ventricles only"
    answer: 0
    explanation: "Crossing an atrial and a ventricular wall puts both contractions on one trace, so their timing can be compared."
    claims: [AS23-017]

  - id: F1-Q07
    question: "Which pair of flows, sampled together with pulsed-wave Doppler, shows atrial and ventricular timing on one trace?"
    options:
      - "Superior vena cava and ascending aorta"
      - "Umbilical artery and umbilical vein"
      - "Middle cerebral artery and ductus venosus"
      - "Right and left branch pulmonary arteries"
    answer: 0
    explanation: "Recognised pairs are superior vena cava with ascending aorta, mitral inflow with aortic outflow, and pulmonary artery with pulmonary vein."
    claims: [AS23-018]

  - id: F1-Q08
    question: "During a fetal echocardiogram the rhythm is irregular. What should the examination record?"
    options:
      - "The mechanism, using M-mode, pulsed-wave Doppler or tissue Doppler"
      - "The heart rate only"
      - "A 3D volume of the heart"
      - "Nothing further if the four-chamber view is normal"
    answer: 0
    explanation: "With an irregular, slow or fast rhythm, the mechanism should be documented using one or more of these modes."
    claims: [AS23-016]

  - id: F1-Q09
    question: "How should the beam lie for a pulsed-wave Doppler recording?"
    options:
      - "Along the flow, or at an angle of less than 20 degrees to it"
      - "At right angles to the flow"
      - "At 45 to 60 degrees to the flow"
      - "The angle does not matter"
    answer: 0
    explanation: "Align with the flow or keep the angle below 20 degrees. A small sample gate reduces the chance of sampling more than one site."
    claims: [AS23-012]

  - id: F1-Q10
    question: "Which of these is a required pulsed-wave Doppler site in a fetal echocardiogram?"
    options:
      - "Ductus venosus"
      - "Middle cerebral artery"
      - "Hepatic vein"
      - "Branch pulmonary arteries"
    answer: 0
    explanation: "The table of required sites includes the umbilical vein, ductus venosus, at least one pulmonary vein on each side, both inflows, both outflows, the distal ductus arteriosus and the umbilical artery. The other three options are marked optional in the same table."
    claims: [AS23-013, AS23-014]

  - id: F1-Q11
    question: "What is the current standing of STIC in fetal echocardiography?"
    options:
      - "It can add information but is not validated for clinical use"
      - "It is required in every examination"
      - "It has replaced two-dimensional imaging"
      - "It is used only to measure heart rate"
    answer: 0
    explanation: "Three-dimensional imaging and STIC can add anatomical and functional detail, but STIC has not been validated for clinical use."
    claims: [AS23-021]

  - id: F1-Q12
    question: "What frame rate is recommended for grey-scale imaging of the fetal heart?"
    options:
      - "Above 30 to 40 Hz"
      - "About 5 to 10 Hz"
      - "About 15 Hz"
      - "Frame rate is not important"
    answer: 0
    explanation: "Above 30 to 40 Hz. Rates of 80 to 100 Hz may be needed at heart rates above 140 beats per minute or for speckle tracking."
    claims: [AS23-007]

  - id: F1-Q13
    question: "For early fetal echocardiography, what limit applies to the thermal and mechanical indices?"
    options:
      - "1.0 or less, with Doppler used sparingly"
      - "2.0 or less"
      - "No limit applies before the second trimester"
      - "3.0 or less if the scan is short"
    answer: 0
    explanation: "Keep both indices at or below 1.0 and use Doppler sparingly."
    claims: [AS23-006, IS23-093]

  - id: F1-Q14
    question: "In a routine mid-pregnancy cardiac screen, what is the place of colour Doppler?"
    options:
      - "Encouraged, but not mandatory"
      - "Mandatory in every scan"
      - "Not allowed"
      - "Only used after 32 weeks"
    answer: 0
    explanation: "Colour is not mandatory for screening; becoming familiar with it and adding it to routine screening is encouraged."
    claims: [IS23-073]

  - id: F1-Q15
    question: "Which transducer type is preferred for fetal echocardiography?"
    options:
      - "Curvilinear"
      - "Endocavity only"
      - "Linear only"
      - "Pencil (blind) probe"
    answer: 0
    explanation: "Curvilinear probes are preferred; linear and sector probes may also be used."
    claims: [AS23-004]

checklist:
  title: "Modes checklist for a fetal echocardiogram"
  items:
    - text: "Sector narrow and depth appropriate; frame rate above 30 to 40 Hz"
      claims: [AS23-007, IS23-014]
    - text: "Stills, clips and a structured report; sweep from stomach to upper mediastinum; two-dimensional and colour clips of the individual views"
      claims: [AS23-008]
    - text: "Colour Doppler used, with scale set to the velocities of interest and gain and persistence adjusted"
      claims: [AS23-001, AS23-010]
    - text: "Pulsed-wave Doppler at the sites the guideline table marks required (arch and isthmus: not settled, see the unit text)"
      claims: [AS23-013, AS23-014]
    - text: "Single-site recordings: beam along the flow (angle below 20 degrees); small sample gate"
      claims: [AS23-012]
    - text: "Power Doppler can help with small vessels and slow flow"
      claims: [AS23-011]
    - text: "Continuous-wave Doppler, where available, to characterise high velocities and gradients"
      claims: [AS23-015]
    - text: "Abnormal rhythm: mechanism recorded with M-mode, pulsed-wave or tissue Doppler"
      claims: [AS23-016]
    - text: "Thermal and mechanical indices known; power output and exposure time limited"
      claims: [AS23-005]

