    - text: "High frame rate, low persistence, single focal zone, relatively narrow field (usually the cardiac preset)"
      claims: [IS23-014]
    - text: "Heart magnified to at least a third to a half of the screen"
      claims: [IS23-015]
    - text: "Cine-loop used to review valve movement"
      claims: [IS23-016]
    - text: "If colour is used: narrow box; scale about 50 to 70 cm/s for heart and arteries, about 15 to 25 cm/s for veins (second trimester)"
      claims: [IS23-076, IS23-077]
    - text: "Stills and clips of the recommended views stored"
      claims: [IS23-017]
    - text: "Unfavourable lie: more time or a second examination"
      claims: [IS23-056]

