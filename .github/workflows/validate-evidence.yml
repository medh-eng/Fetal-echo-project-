name: Validate evidence-ledger and course builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Validate source ledgers and unit references
        run: python tools/build.py --check
      - name: Build all draft outputs
        run: python tools/build.py
      - name: Verify round-five claims and the study-answer keys
        run: python tools/check_round5.py
