<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#9b2c3f">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Fetal Echo Course</title>
<style>
:root{--ink:#1c2430;--mute:#5d6b7a;--line:#d9dee5;--bg:#f6f4ef;--card:#fff;--accent:#9b2c3f;--ok:#1f6f4a;--bad:#a23b2a}
*{box-sizing:border-box}body{margin:0;font:17px/1.55 Georgia,'Times New Roman',serif;color:var(--ink);background:var(--bg)}
main{max-width:720px;margin:0 auto;padding:16px 16px 90px}
header.top{display:flex;align-items:center;gap:10px;font:600 15px system-ui,sans-serif;color:var(--accent);margin-bottom:6px}
header.top button{background:none;border:0;font:15px system-ui,sans-serif;color:var(--accent);cursor:pointer;padding:6px 0}
h1{font-size:1.6rem;line-height:1.2;margin:.3em 0 .2em}h2{font-size:1.15rem;margin:1.6em 0 .4em}
.small,.meta{font:13px/1.4 system-ui,sans-serif;color:var(--mute)}
.banner{font:14px/1.4 system-ui,sans-serif;background:#fff3cd;border:1px solid #e0c97a;padding:10px 12px;border-radius:6px;margin:12px 0}
.banner.ok{background:#e3f3ea;border-color:#9ccdb3}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.unit{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;color:inherit}
.unit:hover{border-color:var(--ink)}
.pill{display:inline-block;font:12px system-ui,sans-serif;border-radius:20px;padding:2px 9px;background:#fff3cd;border:1px solid #e0c97a;margin-left:6px}
.pill.ok{background:#e3f3ea;border-color:#9ccdb3}
nav.tabs{display:flex;gap:6px;margin:14px 0;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{font:15px system-ui,sans-serif;background:none;border:0;border-bottom:3px solid transparent;padding:8px 4px;margin-right:10px;cursor:pointer;color:var(--mute);white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent);font-weight:600}
sup{font:11px system-ui,sans-serif;color:var(--accent)}
.opt{display:block;width:100%;text-align:left;font:16px/1.4 system-ui,sans-serif;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ink)}.opt.right{border-color:var(--ok);background:#e3f3ea}.opt.wrong{border-color:var(--bad);background:#f7e4e0}
.btn{font:15px system-ui,sans-serif;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;margin:8px 8px 0 0}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
ol.refs{font:14px/1.45 system-ui,sans-serif;color:var(--mute);padding-left:22px}
ul{padding-left:22px}[hidden]{display:none}
table{border-collapse:collapse;width:100%;font:14px/1.4 system-ui,sans-serif;margin:10px 0}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:#eee}
label.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font:16px/1.4 system-ui,sans-serif}
label.chk input{width:22px;height:22px;margin-top:2px;flex:none}
.bar{height:8px;background:#e5e5e5;border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent)}
.beat{border-left:3px solid var(--accent);padding:2px 12px;margin:14px 0}
</style></head><body><main>
<header class="top"><button id="home" hidden>&larr; All units</button><span>Fetal Echo Course</span></header>
<div id="view"></div>
</main>
<script>
const DATA = __DATA__;
const $ = s => document.querySelector(s);
const view = $('#view');
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs||{})){ if (k === 'class') e.className = attrs[k]; else if (k.startsWith('on')) e[k] = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
// ---- saved progress (on this device only) ----
const KEY = 'fetal-echo-course-v1';
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
S.drills = S.drills || {}; S.checks = S.checks || {};
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
// ---- scheduling: simple box system (1 day, 3, 7, 16, 35). Wrong answers return to box 0 (due again today).
const DAY = 86400000, GAPS = [0, 1, 3, 7, 16, 35].map(d => d * DAY);
function due(id){ const r = S.drills[id]; return !r || r.due <= Date.now(); }
function grade(id, ok){
  const r = S.drills[id] || { box: 0, seen: 0, right: 0 };
  r.seen++; if (ok) { r.right++; r.box = Math.min(r.box + 1, 5); } else r.box = 0;
  r.due = Date.now() + GAPS[r.box]; S.drills[id] = r; save();
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pill(status){ return el('span', { class: 'pill' + (status === 'expert-verified' ? ' ok' : '') }, status === 'expert-verified' ? 'verified' : 'draft'); }
function banner(u){ return el('div', { class: 'banner' + (u.status === 'expert-verified' ? ' ok' : '') }, u.banner); }
function unitStats(u){
  const ids = u.drills.items.map(i => i.id);
  const known = ids.filter(i => (S.drills[i] || {}).box >= 3).length;
  const checks = Object.keys(S.checks).filter(k => k.startsWith(u.id + ':') && S.checks[k]).length;
  return { total: ids.length, known, dueNow: ids.filter(due).length, checks };
}
// ---- home ----
function showHome(){
  $('#home').hidden = true; location.hash = '';
  const kids = [el('h1', {}, 'Fetal echocardiography'),
    el('p', { class: 'small' }, 'Detect and foundation units. Progress is saved on this device. Works offline once opened.')];
  for (const u of DATA.units){
    const st = unitStats(u);
    kids.push(el('button', { class: 'card unit', onclick: () => showUnit(u.id) },
      el('div', { class: 'meta' }, u.id + ' · ' + u.tier + ' tier'),
      el('div', {}, el('strong', {}, u.title), pill(u.status)),
      u.summary ? el('div', { class: 'small' }, u.summary) : null,
      el('div', { class: 'small' }, st.known + ' of ' + st.total + ' drills known · ' + st.dueNow + ' due'),
      el('div', { class: 'bar' }, el('i', { style: 'width:' + (st.total ? 100 * st.known / st.total : 0) + '%' }))));
  }
  view.replaceChildren(...kids);
}
// ---- unit ----
function showUnit(id, tab){
  const u = DATA.units.find(x => x.id === id); if (!u) return showHome();
  location.hash = id; $('#home').hidden = false; window.scrollTo(0, 0);
  const tabs = ['Read', 'Watch', 'Drill', 'Checklist'];
  const body = el('div');
  const nav = el('nav', { class: 'tabs', role: 'tablist' }, tabs.map(t =>
    el('button', { 'aria-selected': String(t === (tab || 'Read')), onclick: () => showUnit(id, t) }, t)));
  view.replaceChildren(
    el('div', { class: 'meta' }, 'Unit ' + u.id + ' · ' + u.tier + ' tier · v' + u.version),
    el('h1', {}, u.title), banner(u), nav, body);
  ({ Read: () => readTab(u, body), Watch: () => watchTab(u, body), Drill: () => drillTab(u, body), Checklist: () => checkTab(u, body) })[tab || 'Read']();
}
function readTab(u, body){
  body.append(el('h2', {}, 'You will be able to'), el('ul', {}, u.objectives.map(o => el('li', {}, o))));
  for (const s of u.sections){
    body.append(el('h2', {}, s.heading));
    for (const b of s.blocks){
      body.append(el('p', {}, b.text, b.refs.length ? el('sup', {}, b.refs.join(',')) : null));
      if (b.table) body.append(el('table', {}, el('tr', {}, b.table.columns.map(c => el('th', {}, c))),
        b.table.rows.map(r => el('tr', {}, r.map(c => el('td', {}, c))))));
    }
  }
  if (u.missing.length) body.append(el('h2', {}, 'Still to be written'), el('ul', { class: 'small' }, u.missing.map(m => el('li', {}, m))));
  body.append(el('h2', {}, 'References'), el('ol', { class: 'refs' }, u.references.map(r => el('li', {}, r))));
}
function watchTab(u, body){
  if (!u.video){ body.append(el('p', {}, 'No video planned for this unit yet.')); return; }
  body.append(el('div', { class: 'banner' }, 'Film not yet recorded. This is the planned script and shot list.'),
    el('h2', {}, u.video.title + ' (about ' + u.video.minutes + ' min)'));
  u.video.beats.forEach((b, i) => body.append(el('div', { class: 'beat' },
    el('div', { class: 'small' }, 'Shot ' + (i + 1) + ': ' + b.shot), el('div', {}, b.narration))));
}
function checkTab(u, body){
  const items = u.checklist ? u.checklist.items : null;
  const title = u.checklist ? u.checklist.title : 'Self-check';
  body.append(el('h2', {}, title));
  if (!items) body.append(el('p', { class: 'small' }, 'A scan-room checklist for this unit is still to be written. Until then, tick what you can now do.'));
  const list = items ? items.map(i => i.text) : u.objectives;
  list.forEach((t, i) => {
    const k = u.id + ':' + (items ? 'c' : 'o') + i;
    const box = el('input', { type: 'checkbox' }); box.checked = !!S.checks[k];
    box.onchange = () => { S.checks[k] = box.checked; save(); };
    body.append(el('label', { class: 'chk' }, box, el('span', {}, t)));
  });
  body.append(el('p', { class: 'small' }, 'Ticks are saved on this device only. This checklist is a teaching aid, not a clinical record.'));
}
function drillTab(u, body){
  const items = u.drills.items;
  const st = unitStats(u);
  const dueItems = items.filter(i => due(i.id));
  if (!dueItems.length){
    body.append(el('div', { class: 'card' }, el('strong', {}, 'Nothing due right now.'),
      el('p', { class: 'small' }, 'You have seen all ' + items.length + ' questions and the next ones come back on schedule.'),
      el('button', { class: 'btn alt', onclick: () => run(items) }, 'Practise all anyway')));
    return;
  }
  body.append(el('p', { class: 'small' }, st.dueNow + ' due of ' + items.length + '. Missed questions return first.'),
    el('button', { class: 'btn', onclick: () => run(dueItems) }, 'Start'));
  function run(set){
    let queue = shuffle(set), pos = 0, score = 0;
    (function show(){
      if (pos >= queue.length){
        body.replaceChildren(el('div', { class: 'card' }, el('h2', { style: 'margin-top:0' }, score + ' of ' + queue.length + ' correct'),
          el('button', { class: 'btn', onclick: () => showUnit(u.id, 'Drill') }, 'Done')));
        return;
      }
      const it = queue[pos];
      const opts = shuffle(it.options.map((text, i) => ({ text, correct: i === it.answer })));
      const fb = el('div'), box = el('div');
      const buttons = opts.map(o => el('button', { class: 'opt', onclick: ev => {
        buttons.forEach((b, k) => { b.disabled = true; if (opts[k].correct) b.classList.add('right'); });
        if (o.correct) score++; else ev.currentTarget.classList.add('wrong');
        grade(it.id, o.correct);
        fb.append(el('p', {}, it.explanation), el('div', { class: 'small' }, 'Rests on ' + it.claims.join(', ') + ' (' + it.status + ')'),
          el('button', { class: 'btn', onclick: () => { pos++; show(); } }, 'Next'));
      } }, o.text));
      box.append(...buttons);
      body.replaceChildren(el('div', { class: 'card' }, el('div', { class: 'small' }, 'Question ' + (pos + 1) + ' of ' + queue.length),
        el('p', {}, el('strong', {}, it.question)), box, fb));
    })();
  }
}
$('#home').onclick = showHome;
const start = (location.hash || '').slice(1);
if (start && DATA.units.some(u => u.id === start)) showUnit(start); else showHome();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script></body></html>
