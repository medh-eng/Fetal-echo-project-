.unit{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;color:inherit}

.bar{height:8px;background:#e5e5e5;border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent)}

<script>
const DATA = {"units": [{"id": "D0", "title": "Why hearts are missed", "tier": "Detect", "version": 0.2, "summary": "How often heart disease is missed before birth, where the miss happens, and what a screening service can do about it.", "public": false, "status": "ai-cross-checked", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-cross-checked' that no clinician has verified.", "objectives": ["State how common congenital heart disease is and how much of it is found before birth.", "Name the two failures that one study of missed diagnoses found most often.", "Explain why the four-chamber view alone is not enough.", "List the features of a screening service that detects more."], "sections": [{"heading": "The size of the gap", "blocks": [{"text": "Congenital heart disease affects about 8 in every 1000 live births and is a leading cause of illness and death in infancy.", "refs": [1], "table": null}, {"text": "Detection before birth varies widely between regions and between lesions. Overall, fewer than half of cardiac anomalies are identified before birth.", "refs": [2], "table": null}]}, {"heading": "You cannot screen by risk factor", "blocks": [{"text": "A high proportion of the heart disease that could be detected before birth occurs in pregnancies with no risk factor and no extracardiac anomaly. This is why a quality routine screen of every pregnancy, and timely referral, matter.", "refs": [3], "table": null}]}, {"heading": "Where the miss happens", "blocks": [{"text": "In one retrospective study of missed diagnoses, views that did not meet technical criteria contributed to about half of the misses. In nearly a third, the view was technically adequate but the abnormal anatomy was not recognised.", "refs": [4], "table": null}, {"text": "These are two different failures. This course practises both skills: obtaining every plane to a standard, and knowing what each normal plane looks like.", "refs": [], "table": null}]}, {"heading": "Why detection varies", "blocks": [{"text": "Part of the variation is explained by the examiner's ability, transducer frequency, maternal body habitus, abdominal scars, gestational age, amniotic fluid volume and fetal position.", "refs": [5], "table": null}, {"text": "When the fetus is lying unfavourably, extra examination time or a second examination may be needed.", "refs": [6], "table": null}]}, {"heading": "Four chambers are not enough", "blocks": [{"text": "The four-chamber and three-vessel views need much more than a count of structures.", "refs": [7], "table": null}, {"text": "Some lesions, such as transposition of the great arteries and coarctation of the aorta, may not be evident in the four-chamber plane alone. Some lesions are not discovered until later in pregnancy.", "refs": [8], "table": null}, {"text": "Adding the outflow-tract and great-vessel views raises detection of major malformations above the four-chamber view alone. It allows detection of tetralogy of Fallot, transposition, double-outlet right ventricle and truncus arteriosus.", "refs": [9, 10], "table": null}, {"text": "Complete transposition, tetralogy of Fallot, double-outlet right ventricle, common arterial trunk and pulmonary atresia with a ventricular septal defect can all have a four-chamber view that looks normal. They are typically abnormal in the three-vessel view.", "refs": [11], "table": null}, {"text": "The same standard sweep can also pick up aortic and pulmonary valve stenosis, which may become more severe as pregnancy advances.", "refs": [12], "table": null}]}, {"heading": "What a good screening service does", "blocks": [{"text": "Four things can improve the performance of a screening programme: continuous training based on feedback, a low threshold for referral for echocardiography, standardised protocols and easy access to fetal heart specialists.", "refs": [13], "table": null}, {"text": "Each practice is encouraged to audit its stored images or clips against set quality criteria, to review its own detection rates and diagnostic accuracy every year, and to provide further training where needed.", "refs": [14], "table": null}]}, {"heading": "What this course asks of you", "blocks": [{"text": "Learn one sweep and do it the same way on every patient. Learn the criteria for each plane. Use the clip drills to practise telling, quickly, whether a plane meets them. The few-second limit in the drills is a training exercise, not a clinical standard.", "refs": [], "table": null}, {"text": "Keep two situations apart. A view that could not be obtained is an incomplete examination: with an unfavourable lie, more time or a second examination may be needed. A view that looks abnormal is a suspected abnormality, and that fetus is a candidate for fetal echocardiography.", "refs": [6, 15], "table": null}]}], "checklist": {"title": "Habits that close the gap", "items": [{"text": "Routine second-trimester screen includes situs, four-chamber, outflow-tract and great-vessel views", "refs": [16, 17]}, {"text": "Four-chamber and three-vessel views judged against their criteria, not by counting structures", "refs": [7]}, {"text": "A normal four-chamber view is never taken as proof of a normal heart", "refs": [8, 11]}, {"text": "Suspected abnormality: fetus is a candidate for fetal echocardiography", "refs": [15]}, {"text": "View not obtained: more time or a second examination", "refs": [6]}, {"text": "Stored images audited against criteria set in advance", "refs": [14]}, {"text": "Detection rates and diagnostic accuracy reviewed every year", "refs": [14]}]}, "drills": {"items": [{"id": "D0-Q01", "question": "About how common is congenital heart disease?", "options": ["About 8 in every 1000 live births", "About 8 in every 100 live births", "About 8 in every 10 000 live births", "About 8 in every 100 000 live births"], "answer": 0, "explanation": "The guideline gives a prevalence of 8.2 per 1000 live births.", "claims": ["IS23-003"], "status": "expert-verified"}, {"id": "D0-Q02", "question": "Overall, what share of cardiac anomalies is identified before birth?", "options": ["Fewer than half", "Nearly all", "About three quarters", "Exactly half"], "answer": 0, "explanation": "Detection varies by region and lesion, but fewer than half of cardiac anomalies are identified before birth.", "claims": ["IS23-004"], "status": "expert-verified"}, {"id": "D0-Q03", "question": "A colleague proposes doing the full routine cardiac screen only when the pregnancy has a risk factor. What is wrong with this?", "options": ["A high proportion of detectable heart disease occurs in pregnancies with no risk factor", "Nothing; heart disease is rare without a risk factor", "Risk factors cannot be identified before the scan", "Detailed examination is only possible in the third trimester"], "answer": 0, "explanation": "A high proportion of prenatally detectable heart disease is in pregnancies with no risk factor and no extracardiac anomaly. That is why quality screening of every pregnancy matters.", "claims": ["IS23-080"], "status": "expert-verified"}, {"id": "D0-Q04", "question": "In a study of missed prenatal diagnoses, what contributed to about half of the misses?", "options": ["Views that did not meet technical criteria", "Lesions that developed only after birth", "Machines without colour Doppler", "Patients who did not attend the scan"], "answer": 0, "explanation": "Failure to meet technical criteria contributed to about 50% of misses.", "claims": ["IS23-088"], "status": "expert-verified"}, {"id": "D0-Q05", "question": "In one retrospective study of missed prenatal diagnoses, the view was technically adequate in nearly a third of misses. What went wrong in those?", "options": ["The abnormal anatomy was not recognised", "The lesion was too small to be seen by any examiner", "The stored images were lost", "The scan was done too late in pregnancy"], "answer": 0, "explanation": "Failure to recognise abnormal anatomy on an adequate view accounted for 31% of misses in that study.", "claims": ["IS23-088"], "status": "expert-verified"}, {"id": "D0-Q06", "question": "Which pair of lesions does the guideline name as possibly not evident in the four-chamber plane alone?", "options": ["Transposition of the great arteries and coarctation of the aorta", "Atrioventricular septal defect and a single ventricle", "A large pericardial effusion and severe cardiomegaly", "Dextrocardia and an abnormal cardiac axis"], "answer": 0, "explanation": "The guideline names transposition and coarctation as lesions that may not be evident in the four-chamber plane alone.", "claims": ["IS23-008"], "status": "expert-verified"}, {"id": "D0-Q07", "question": "The four-chamber view looks normal. Which view is typically abnormal in tetralogy of Fallot, complete transposition and common arterial trunk?", "options": ["The three-vessel view", "The upper-abdomen view", "No axial view; these are found only after birth", "The four-chamber view repeated with colour"], "answer": 0, "explanation": "These lesions can pass the four-chamber view but are typically abnormal in the three-vessel view.", "claims": ["IS23-067"], "status": "expert-verified"}, {"id": "D0-Q08", "question": "Which of these can improve the performance of a screening programme?", "options": ["A low threshold for referring for fetal echocardiography", "Referring only when the diagnosis is certain", "Leaving each examiner to choose their own protocol", "Limiting the scan to the four-chamber view to save time"], "answer": 0, "explanation": "Feedback-based training, a low referral threshold, standardised protocols and easy access to fetal heart specialists can all improve programme performance.", "claims": ["IS23-006"], "status": "ai-cross-checked"}, {"id": "D0-Q09", "question": "How often is a practice encouraged to review its own detection rates and diagnostic accuracy?", "options": ["Every year", "Only after a complaint", "Every five years", "Once, when the service starts"], "answer": 0, "explanation": "Annual review of local detection rates and accuracy is encouraged, with further training as needed.", "claims": ["IS23-089"], "status": "ai-cross-checked"}, {"id": "D0-Q10", "question": "Which of these does the guideline list among the factors that partly explain variation in detection?", "options": ["Examiner ability and transducer frequency", "Maternal blood group", "Number of previous pregnancies", "Position of the placenta"], "answer": 0, "explanation": "The guideline lists examiner ability and transducer frequency alongside patient factors such as habitus, scars, fluid volume and fetal position.", "claims": ["IS23-005"], "status": "ai-cross-checked"}]}, "video": {"title": "Why hearts are missed", "minutes": 4, "beats": [{"shot": "Presenter to camera", "narration": "Fewer than half of heart anomalies are found before birth. And a high proportion of the detectable ones are in pregnancies with no risk factor."}, {"shot": "Graphic: two boxes, 'view not good enough' and 'abnormality not recognised'", "narration": "In one study of missed diagnoses, two failures stood out. In about half, the views did not meet technical criteria. In nearly a third, the view was adequate and the abnormal anatomy was not recognised."}, {"shot": "Diagram: four-chamber plane, then the planes above it lighting up", "narration": "Four chambers are not enough. Transposition and coarctation may not be evident in that plane. Complete transposition is typically abnormal on the three-vessel view, and the three-vessel-and-trachea view is particularly useful for coarctation."}, {"shot": "Presenter", "narration": "One sweep, the same way, every patient. Know the criteria for each plane. If a view cannot be obtained because of the lie, more time or a second examination may be needed. If a view looks abnormal, the fetus is a candidate for a fetal echocardiogram."}]}, "missing": ["Detection rates in India and by lesion type - needs an Indian source.", "Outcome benefit of prenatal diagnosis for specific lesions (why detection matters for the baby) - needs a source beyond this guideline."], "references": ["Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Introduction, p. 788. (IS23-003, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Introduction, p. 788. (IS23-004, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Fetal echocardiography, p. 796. (IS23-080, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Quality assurance, p. 797. (IS23-088, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Introduction, p. 788. (IS23-005, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Outflow tracts: Sonographic technique, p. 793. (IS23-056, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – General considerations, p. 788. (IS23-007, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – General considerations, p. 788. (IS23-008, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – General considerations, p. 788. (IS23-009, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Cardiac examination, p. 789. (IS23-019, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – RVOT view, 3VV and 3VTV, p. 794. (IS23-067, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Cardiac examination, p. 789. (IS23-020, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Introduction, p. 788. (IS23-006, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Quality assurance, p. 797. (IS23-089, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Fetal echocardiography, p. 796. (IS23-078, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Introduction, p. 788. (IS23-001, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Cardiac examination, p. 789. (IS23-018, expert-verified)"]}, {"id": "D1", "title": "The normal heart in five views", "tier": "Detect", "version": 0.4, "summary": "", "public": false, "status": "ai-cross-checked", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-cross-checked' that no clinician has verified.", "objectives": ["Perform the five-plane sweep in order and say what each plane must show.", "Set up the machine for a cardiac screen.", "Give the normal values for heart size, axis and rate, and the rates that need referral.", "List the criteria that make a four-chamber view normal.", "Confirm normal outflow tracts and a normal three-vessel-and-trachea view."], "sections": [{"heading": "Why five views", "blocks": [{"text": "A screening scan does not need to name the lesion. This unit teaches one systematic assessment of five views, done in the same order every time.", "refs": [], "table": null}, {"text": "Congenital heart disease affects about 8 in every 1000 live births, and fewer than half of cardiac anomalies are found before birth.", "refs": [1, 2], "table": null}, {"text": "Most detectable heart disease occurs in pregnancies with no risk factor at all. That is why the routine scan matters more than the referral list.", "refs": [3], "table": null}, {"text": "Some lesions, such as transposition and coarctation, may show nothing in the four-chamber plane. Adding the outflow-tract and great-vessel views raises detection above the four-chamber view alone.", "refs": [4, 5, 6], "table": null}, {"text": "The examination should include situs, the four-chamber view, and the outflow-tract and great-vessel views, ideally between 18 and 22 weeks.", "refs": [7, 8], "table": null}]}, {"heading": "Set up before you scan", "blocks": [{"text": "Use the highest transducer frequency that still penetrates. Harmonic imaging helps when the abdominal wall is thick and in the third trimester.", "refs": [9, 10], "table": null}, {"text": "Choose the cardiac preset: high frame rate, more contrast, low persistence, a single focal zone and a narrow sector.", "refs": [11], "table": null}, {"text": "Zoom until the heart fills at least a third to a half of the screen. Use cine-loop to watch the valves through the whole cycle.", "refs": [12, 13], "table": null}, {"text": "Store stills and clips of each view so the examination can be reviewed later.", "refs": [14], "table": null}]}, {"heading": "The sweep", "blocks": [{"text": "The examination is one continuous transverse sweep towards the fetal head through five planes: upper abdomen, four-chamber view, left ventricular outflow tract, right ventricular outflow tract with the three-vessel view, and the three-vessel-and-trachea view.", "refs": [15, 16, 17], "table": null}, {"text": "The upper planes are a continuum, not fixed pictures. They are likely to be judged more reliably live or on a clip than from stills alone.", "refs": [18], "table": null}, {"text": "If the fetus is lying badly, more examination time or a second examination may be needed.", "refs": [19], "table": null}]}, {"heading": "Plane I: left, right and situs", "blocks": [{"text": "First work out which side of the fetus is left and which is right from its position in the uterus. Only then confirm that stomach and heart are both on the left.", "refs": [20], "table": null}, {"text": "At the level of the abdominal circumference: stomach on the left, descending aorta to the left of the spine, inferior vena cava to the right.", "refs": [21], "table": null}, {"text": "Normal abdominal situs stands in for normal atrial arrangement. If heart or stomach is not on the left, suspect a situs abnormality.", "refs": [22, 23], "table": null}]}, {"heading": "Plane II: size, position, axis, rate", "blocks": [{"text": "A normal heart is usually no larger than a third of the chest area.", "refs": [24], "table": null}, {"text": "It lies mainly in the left chest with its axis pointing left at about 45 degrees, 20 degrees either way. You can judge axis and position even when the rest of the view is poor.", "refs": [25, 26], "table": null}, {"text": "An abnormal axis raises the chance of a heart defect, especially of the outflow tracts. A heart that is pushed out of place points to something beside it: diaphragmatic hernia, a lung mass, or a small or absent lung.", "refs": [27, 28], "table": null}, {"text": "Rate is 120 to 160 beats per minute and regular. Skipped (ectopic) beats are the most common rhythm disturbance and are often benign; in low-risk populations they are not linked to a higher risk of structural heart disease. Further assessment is indicated when they come more often than every three to five beats, or when the rhythm stays irregular for more than 1 to 2 weeks.", "refs": [29, 30, 31], "table": null}, {"text": "A brief slow rate, associated with probe pressure, is seen in normal second-trimester fetuses. A rate that stays at 110 or below in a well fetus, or at 180 or above, needs specialist assessment.", "refs": [32, 33], "table": null}]}, {"heading": "Plane II: the four-chamber criteria", "blocks": [{"text": "Seeing four chambers is not the same as a normal four-chamber view. The view is judged against specific criteria.", "refs": [34], "table": null}, {"text": "Atria: similar in size, foramen ovale flap moving in the left atrium, septum primum present. Where you can, show at least one pulmonary vein entering the left atrium.", "refs": [35, 36], "table": null}, {"text": "Ventricles: similar in size, walls not thick. The moderator band marks the right ventricle; the smooth left ventricle forms the apex.", "refs": [37, 38], "table": null}, {"text": "One ventricle clearly smaller than the other in mid-pregnancy is not a variant. Think of coarctation, an evolving hypoplastic left heart, and anomalous pulmonary veins.", "refs": [38], "table": null}, {"text": "Septum: follow it from apex to crux. It is best seen with the beam at right angles; with the beam along the septum, drop-out can fake a defect near the crux.", "refs": [39, 40], "table": null}, {"text": "Valves: two, opening separately and freely, with the tricuspid attached slightly nearer the apex than the mitral. Abnormal alignment of the two valves can be a key finding in anomalies such as atrioventricular septal defect.", "refs": [41], "table": null}, {"text": "A thin rim of pericardial fluid, up to 2 mm, is normal.", "refs": [42], "table": null}]}, {"heading": "Plane III: left ventricular outflow tract", "blocks": [{"text": "A vessel leaves the left ventricle. Its front wall runs straight on from the ventricular septum, and it does not divide. The valve is thin and opens freely.", "refs": [43, 44, 45], "table": null}, {"text": "This view shows outlet septal defects and conotruncal and aortic valve problems that the four-chamber view hides.", "refs": [46], "table": null}]}, {"heading": "Plane IV: right ventricular outflow tract and three vessels", "blocks": [{"text": "A vessel leaves the right ventricle, crosses in front of the aorta almost at a right angle, and divides after a short course. It is usually slightly larger than the aorta. Its valve is thin and opens freely.", "refs": [43, 47, 48], "table": null}, {"text": "At the least, the two great arteries should be about the same size. A clear difference needs further assessment.", "refs": [49], "table": null}, {"text": "Three vessels in a line: pulmonary artery, aorta, superior vena cava, from left to right and from front to back, each smaller than the one before. Check number, size, alignment and arrangement.", "refs": [50], "table": null}, {"text": "Transposition, tetralogy of Fallot, double-outlet right ventricle, common arterial trunk and pulmonary atresia with a septal defect can all pass the four-chamber view. They typically fail this one.", "refs": [51], "table": null}]}, {"heading": "Plane V: three vessels and trachea", "blocks": [{"text": "The ductal arch and the aortic arch both pass to the left of the trachea and meet in a V. The two arches are similar in size. The trachea is a bright ring around a small dark centre.", "refs": [52, 53, 54], "table": null}, {"text": "This is the view for the arch: coarctation, right arch, double arch, vascular rings and an aberrant right subclavian artery.", "refs": [55, 56], "table": null}]}, {"heading": "Colour Doppler", "blocks": [{"text": "Colour is not mandatory for screening but is encouraged once you are competent with it.", "refs": [57], "table": null}, {"text": "Keep the colour box small and over the area of interest. Set the scale to about 50 to 70 cm/s for the heart and arteries, and about 15 to 25 cm/s for veins.", "refs": [58, 59], "table": null}, {"text": "Normal colour shows forward flow through all four valves and both arches. It makes the V easier to see and exposes leaking valves and reversed flow in an arch.", "refs": [60], "table": null}]}, {"heading": "When the screen is not normal", "blocks": [{"text": "Any fetus with a suspected abnormality on screening should have a fetal echocardiogram.", "refs": [61], "table": null}, {"text": "About half of missed diagnoses in one study came from views that did not meet technical standards, and nearly a third from not recognising the abnormality on an adequate view. Both are trainable.", "refs": [62], "table": null}]}], "checklist": null, "drills": {"items": [{"id": "D1-Q01", "question": "Which is the correct order of the five screening planes, moving towards the fetal head?", "options": ["Upper abdomen, four-chamber, LVOT, RVOT / three-vessel, three-vessel-and-trachea", "Four-chamber, upper abdomen, RVOT, LVOT, three-vessel-and-trachea", "Upper abdomen, LVOT, four-chamber, three-vessel-and-trachea, RVOT", "Four-chamber, LVOT, RVOT, upper abdomen, three-vessel"], "answer": 0, "explanation": "One transverse sweep from the upper abdomen to the upper mediastinum.", "claims": ["IS23-023"], "status": "expert-verified"}, {"id": "D1-Q02", "question": "What is the normal cardiac axis?", "options": ["About 45 degrees to the left, 20 degrees either way", "About 20 degrees to the left, 10 degrees either way", "About 90 degrees to the left", "Midline"], "answer": 0, "explanation": "45 degrees plus or minus 20, measured against the front-to-back axis of the chest.", "claims": ["IS23-028"], "status": "expert-verified"}, {"id": "D1-Q03", "question": "How much of the chest area does a normal heart occupy?", "options": ["No more than about one third", "About one tenth", "About two thirds", "About one half"], "answer": 0, "explanation": "Usually no larger than a third of the chest area.", "claims": ["IS23-026"], "status": "expert-verified"}, {"id": "D1-Q04", "question": "The fetal heart rate stays at 105 beats per minute throughout the scan in an otherwise well fetus. What next?", "options": ["Timely review by a fetal cardiac specialist", "Nothing; this is within the normal range", "Repeat the anomaly scan in the third trimester", "Record it as transient probe-pressure bradycardia"], "answer": 0, "explanation": "Normal is 120 to 160. Persistent bradycardia at 110 or below needs specialist evaluation; transient slowing associated with probe pressure is seen in normal second-trimester fetuses.", "claims": ["IS23-033", "IS23-036"], "status": "ai-cross-checked"}, {"id": "D1-Q05", "question": "You can count four chambers. Is the four-chamber view normal?", "options": ["Not yet: the view has specific criteria beyond the count", "Yes: four chambers means the view is normal", "Yes, provided the heart rate is normal", "Only colour Doppler can tell"], "answer": 0, "explanation": "The four-chamber and three-vessel views need much more than a count of structures.", "claims": ["IS23-007"], "status": "expert-verified"}, {"id": "D1-Q06", "question": "In normal situs, where are the great vessels in the upper-abdomen plane?", "options": ["Aorta left of the spine, inferior vena cava right of the spine", "Aorta right of the spine, inferior vena cava left of the spine", "Both on the left of the spine", "Both on the right of the spine"], "answer": 0, "explanation": "Stomach left; aorta left; vena cava right.", "claims": ["IS23-024"], "status": "expert-verified"}, {"id": "D1-Q07", "question": "What must be established before assessing situs?", "options": ["Which side is the fetal left and right", "The cardiac axis", "The heart rate", "The size of the great arteries"], "answer": 0, "explanation": "Laterality first, from the fetal position in the uterus.", "claims": ["IS23-021"], "status": "expert-verified"}, {"id": "D1-Q08", "question": "When is mid-trimester cardiac screening best performed?", "options": ["18 to 22 weeks", "11 to 14 weeks", "24 to 28 weeks", "After 32 weeks"], "answer": 0, "explanation": "18 to 22 weeks is the optimal window.", "claims": ["IS23-010"], "status": "expert-verified"}, {"id": "D1-Q09", "question": "How far should you zoom for the cardiac views?", "options": ["Until the heart fills at least a third to a half of the screen", "Until the whole fetus is on screen", "Until the heart fills about a tenth of the screen", "Zoom does not matter if the frame rate is high"], "answer": 0, "explanation": "Magnify until the heart fills at least one third to one half of the screen.", "claims": ["IS23-015"], "status": "expert-verified"}, {"id": "D1-Q10", "question": "Which group of settings suits a cardiac screen?", "options": ["High frame rate, low persistence, single focal zone, narrow sector", "Low frame rate, high persistence, multiple focal zones, wide sector", "High frame rate, high persistence, multiple focal zones, wide sector", "Low frame rate, low persistence, single focal zone, wide sector"], "answer": 0, "explanation": "These are usually built into the cardiac preset.", "claims": ["IS23-014"], "status": "expert-verified"}, {"id": "D1-Q11", "question": "At 20 weeks the left ventricle looks clearly smaller than the right. How should you treat this?", "options": ["As abnormal until proven otherwise: arrange further examination", "As a normal variant at this stage", "As an artefact of the beam angle", "As normal if the heart rate is regular"], "answer": 0, "explanation": "Mild disproportion can be a variant in the third trimester, but asymmetry in mid-pregnancy warrants further examination. Causes include coarctation, evolving hypoplastic left heart and anomalous pulmonary veins.", "claims": ["IS23-043"], "status": "expert-verified"}, {"id": "D1-Q12", "question": "Which structure marks the morphological right ventricle in the four-chamber view?", "options": ["The moderator band near the apex", "The smooth wall forming the apex of the heart", "The foramen ovale flap", "The pulmonary veins"], "answer": 0, "explanation": "The moderator band identifies the right ventricle; the smooth left ventricle forms the apex.", "claims": ["IS23-042"], "status": "expert-verified"}, {"id": "D1-Q13", "question": "The two atrioventricular valves appear to attach to the septum at exactly the same level. What does this suggest?", "options": ["Possible atrioventricular septal defect", "A normal crux", "Tricuspid regurgitation", "A normal third-trimester variant"], "answer": 0, "explanation": "Normally the tricuspid septal leaflet inserts nearer the apex than the mitral. Abnormal alignment is a key finding in atrioventricular septal defect.", "claims": ["IS23-047"], "status": "ai-cross-checked"}, {"id": "D1-Q14", "question": "With the beam running along the ventricular septum, you see a gap near the crux. What is the first thing to do?", "options": ["Re-image with the beam at right angles to the septum", "Report a ventricular septal defect", "Report an atrioventricular septal defect", "Ignore it"], "answer": 0, "explanation": "A beam parallel to the septum can produce drop-out that mimics a defect near the crux. The septum is best seen perpendicular to the beam.", "claims": ["IS23-045"], "status": "expert-verified"}, {"id": "D1-Q15", "question": "What confirms a normal left ventricular outflow tract view?", "options": ["The vessel's front wall is continuous with the septum and the vessel does not divide", "The vessel divides into two branches soon after its origin", "The vessel runs parallel to the other great artery", "The vessel is clearly larger than the other great artery"], "answer": 0, "explanation": "Septal continuity and no bifurcation identify the aorta leaving the left ventricle.", "claims": ["IS23-052", "IS23-059"], "status": "expert-verified"}, {"id": "D1-Q16", "question": "How do the two great arteries normally relate as they leave the heart?", "options": ["They cross, the pulmonary artery passing in front almost at a right angle", "They run side by side in parallel", "The aorta passes in front of the pulmonary artery", "They arise from a single common vessel"], "answer": 0, "explanation": "Normal crossover: the pulmonary artery crosses the ascending aorta at nearly a right angle.", "claims": ["IS23-052", "IS23-065"], "status": "expert-verified"}, {"id": "D1-Q17", "question": "In the normal three-vessel view, what is the order from fetal left to right?", "options": ["Pulmonary artery, aorta, superior vena cava", "Aorta, pulmonary artery, superior vena cava", "Superior vena cava, aorta, pulmonary artery", "Pulmonary artery, superior vena cava, aorta"], "answer": 0, "explanation": "Pulmonary artery (largest, most anterior), aorta, superior vena cava (smallest, most posterior).", "claims": ["IS23-066"], "status": "expert-verified"}, {"id": "D1-Q18", "question": "The four-chamber view is normal. Which view is most likely to expose transposition of the great arteries?", "options": ["The outflow-tract and three-vessel views", "The upper-abdomen view", "A repeat four-chamber view with more zoom", "None; it cannot be detected on screening"], "answer": 0, "explanation": "Transposition can have a normal-looking four-chamber view but is typically abnormal in the three-vessel view.", "claims": ["IS23-008", "IS23-067"], "status": "expert-verified"}, {"id": "D1-Q19", "question": "What is the normal appearance of the three-vessel-and-trachea view?", "options": ["Both arches to the left of the trachea, meeting in a V", "One arch on each side of the trachea", "Both arches to the right of the trachea", "The arches running parallel without meeting"], "answer": 0, "explanation": "The ductal and aortic arches both pass left of the trachea and form a V.", "claims": ["IS23-069"], "status": "expert-verified"}, {"id": "D1-Q20", "question": "What colour velocity scale suits the heart and great arteries in a mid-trimester screen?", "options": ["About 50 to 70 cm/s", "About 5 to 10 cm/s", "About 15 to 25 cm/s", "About 150 to 200 cm/s"], "answer": 0, "explanation": "About 50 to 70 cm/s for intracardiac structures and vessels; about 15 to 25 cm/s is for veins.", "claims": ["IS23-077"], "status": "ai-cross-checked"}, {"id": "D1-Q21", "question": "You notice occasional skipped beats in an otherwise normal low-risk scan. What is the usual significance?", "options": ["Often benign; further assessment if more often than every three to five beats, or if the rhythm stays irregular for more than 1 to 2 weeks", "Always a sign of structural heart disease", "An indication for immediate delivery planning", "A sign of heart block"], "answer": 0, "explanation": "Ectopic beats are the commonest rhythm disturbance and are often benign. Frequent episodes or persistent irregularity need further assessment.", "claims": ["IS23-034", "IS23-035"], "status": "expert-verified"}, {"id": "D1-Q22", "question": "A thin rim of pericardial fluid, under 2 mm, is seen at 28 weeks. How do you interpret it?", "options": ["A normal finding", "A pericardial effusion needing urgent referral", "A sign of hydrops", "A sign of infection"], "answer": 0, "explanation": "A small amount of pericardial fluid, 2 mm or less at end-systole, is common in the second and third trimesters and is normal.", "claims": ["IS23-027"], "status": "expert-verified"}]}, "video": {"title": "The five-view sweep", "minutes": 8, "beats": [{"shot": "Presenter to camera", "narration": "You do not have to name the lesion. You have to notice that the heart is not normal. Five planes, one sweep."}, {"shot": "Machine console and screen", "narration": "Cardiac preset. Narrow the sector. One focal zone at the heart. Zoom until the heart fills at least a third to a half of the screen."}, {"shot": "Diagram: fetus with five stacked planes", "narration": "From the upper abdomen towards the head: abdomen, four chambers, left outflow, right outflow with three vessels, three vessels and trachea."}, {"shot": "Split screen: hand on abdomen / ultrasound screen", "narration": "Work out fetal left and right first. Abdomen: stomach left, aorta left of the spine, vena cava right."}, {"shot": "Four-chamber clip with overlay of thorax outline and axis line", "narration": "Usually no more than a third of the chest area. Mostly on the left. Axis forty-five degrees, give or take twenty. Rate one-twenty to one-sixty, regular."}, {"shot": "Four-chamber clip, labels appearing one by one", "narration": "Two atria the same size, flap in the left. Two ventricles the same size, moderator band on the right. Septum examined from apex to crux, with the beam across it where you can: with the beam along it, drop-out can mimic a defect near the crux. Two valves, the tricuspid a little nearer the apex."}, {"shot": "Split screen: small tilt of the hand / LVOT clip", "narration": "Slide up. A vessel from the left ventricle, its wall continuous with the septum. It does not divide."}, {"shot": "RVOT and three-vessel clip with overlay", "narration": "Up again. A vessel from the right ventricle crosses in front and divides. Three vessels in a line, big to small, left to right."}, {"shot": "Three-vessel-and-trachea clip, grey-scale then colour", "narration": "Last plane. Two arches, both left of the trachea, meeting in a V. Colour helps to show the V and can highlight reversed flow in the duct or the aortic arch."}, {"shot": "Presenter", "narration": "If a plane looks abnormal, the fetus is a candidate for a fetal echocardiogram. If a plane cannot be obtained because of the lie, more time or a second examination may be needed."}]}, "missing": ["How to work out fetal laterality in practice (named methods) - needs a source beyond this guideline.", "Normal variants and artefacts beyond those named here (e.g. echogenic focus appearance) - unit D10.", "Indian referral pathways and timing in relation to local law - needs an Indian source and the editor's input."], "references": ["Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Introduction, p. 788. (IS23-003, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Introduction, p. 788. (IS23-004, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Fetal echocardiography, p. 796. (IS23-080, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – General considerations, p. 788. (IS23-008, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – General considerations, p. 788. (IS23-009, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Cardiac examination, p. 789. (IS23-019, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Gestational age, p. 789. (IS23-010, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Cardiac examination, p. 789. (IS23-018, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Technical factors: Ultrasound transducer, p. 789. (IS23-012, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Technical factors: Ultrasound transducer, p. 789. (IS23-013, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.262 fs": [6], "table": null}]}, {"heading": "The cardiac image", "blocks": [{"text": "Settings should favour a high frame rate with increased contrast and high resolution. That means low persistence, a single focal zone and a relatively narrow image field. Cardiac presets usually have these built in.", "refs": [7], "table": null}, {"text": "For fetal echocardiography, frame rates above 30 to 40 Hz are recommended. Narrowing the sector and choosing an appropriate depth help to achieve them.", "refs": [8], "table": null}, {"text": "The screening settings at a glance.", "refs": [7, 9], "table": {"columns": ["Setting", "For the heart"], "rows": [["Frame rate", "High"], ["Persistence", "Low"], ["Focal zones", "One"], ["Image field (sector)", "Relatively narrow"], ["Contrast and resolution", "Increased contrast, high resolution"], ["Magnification", "Heart fills at least a third to a half of the screen"]]}}]}, {"heading": "Zoom and cine-loop", "blocks": [{"text": "Magnify the image until the heart fills at least one third to one half of the screen.", "refs": [9], "table": null}, {"text": "Use cine-loop to help the real-time assessment, for example to confirm that the valve leaflets move through the whole cardiac cycle.", "refs": [10], "table": null}]}, {"heading": "Colour, when you use it", "blocks": [{"text": "Keep the colour box narrow and only over the area of interest. This preserves frame rate and the quality of the colour image.", "refs": [11], "table": null}, {"text": "For a second-trimester screen, set the velocity scale to about 50 to 70 cm/s for the heart and arteries and about 15 to 25 cm/s for veins. Low colour persistence is ordinarily built into cardiac presets.", "refs": [12], "table": null}, {"text": "Unit D7 covers colour in full.", "refs": [], "table": null}]}, {"heading": "Safety", "blocks": [{"text": "Fetal echocardiography follows the principle of keeping exposure as low as reasonably achievable. Operators should be aware of the thermal and mechanical indices and limit power output and exposure time.", "refs": [13], "table": null}, {"text": "At an early cardiac screen with Doppler, the thermal index should be 1.0 or less and exposure as short as possible.", "refs": [14], "table": null}]}, {"heading": "Store what you see", "blocks": [{"text": "Archive still frames and clips of the recommended structures and views so that the examination can be reviewed later for adequacy, labelling laterality and orientation where appropriate.", "refs": [15], "table": null}]}, {"heading": "When the view is poor", "blocks": [{"text": "Several things affect what can be seen: transducer frequency, maternal body habitus, abdominal scars, gestational age, amniotic fluid volume and fetal position, as well as the examiner's ability.", "refs": [16], "table": null}, {"text": "When the fetal lie is unfavourable, extra examination time or a second examination may be needed.", "refs": [17], "table": null}, {"text": "In a fetal echocardiogram, if diagnostic images cannot be obtained after optimisation, the report should state the limitation.", "refs": [18], "table": null}]}], "checklist": {"title": "Before the sweep", "items": [{"text": "Highest frequency that still penetrates; harmonics on if the wall is thick or the pregnancy is late", "refs": [4, 6]}, {"text": "High frame rate, low persistence, single focal zone, relatively narrow field (usually the cardiac preset)", "refs": [7]}, {"text": "Heart magnified to at least a third to a half of the screen", "refs": [9]}, {"text": "Cine-loop used to review valve movement", "refs": [10]}, {"text": "If colour is used: narrow box; scale about 50 to 70 cm/s for heart and arteries, about 15 to 25 cm/s for veins (second trimester)", "refs": [11, 12]}, {"text": "Stills and clips of the recommended views stored", "refs": [15]}, {"text": "Unfavourable lie: more time or a second examination", "refs": [17]}]}, "drills": {"items": [{"id": "D2-Q01", "question": "When is the cardiac screening examination optimally etal left.", "refs": [1], "table": null}, {"text": "The order matters. If you decide that the stomach is 'on the left' because that is where the stomach usually is, you have assumed the answer.", "refs": [], "table": null}]}, {"heading": "The upper-abdomen plane", "blocks": [{"text": "A transverse sweep, moving the transducer towards the fetal head from the abdomen to the chest, shows the abdominal situs first and then the four-chamber view.", "refs": [2], "table": null}, {"text": "Abdominal situs is assessed at the level of the standard abdominal circumference. Normal: stomach on the left, descending aorta to the left of the spine, inferior vena cava to the right of the spine.", "refs": [3], "table": {"columns": ["Structure", "Normal position in the upper-abdomen plane"], "rows": [["Stomach", "Fetal left"], ["Descending aorta", "Left of the spine"], ["Inferior vena cava", "Right of the spine"]]}}]}, {"heading": "What normal abdominal situs tells you", "blocks": [{"text": "Normal abdominal situs is a surrogate for normal atrial situs: right atrium on the right, left atrium on the left.", "refs": [4], "table": null}]}, {"heading": "Then the heart", "blocks": [{"text": "The heart lies mainly in the left chest, with its long axis pointing to the left at about 45 degrees, plus or minus 20 degrees, relative to the front-to-back axis of the chest.", "refs": [5], "table": null}, {"text": "Position and axis can be judged even when the four-chamber view itself is not seen well.", "refs": [6], "table": null}]}, {"heading": "When something is not on the left", "blocks": [{"text": "Suspect a situs abnormality when the heart, the stomach, or both are not on the left.", "refs": [7], "table": null}, {"text": "A fetus with a suspected abnormality on cardiac screening is a candidate for fetal echocardiography.", "refs": [8], "table": null}]}, {"heading": "A displaced heart is a different problem", "blocks": [{"text": "A heart can be pushed or pulled out of its normal position by something next to it: a diaphragmatic hernia, a space-occupying lesion such as a congenital pulmonary airway malformation, or a lung that is small or absent. A leftward shift of the axis may also occur with gastroschisis and omphalocele.", "refs": [9], "table": null}, {"text": "An abnormal cardiac axis raises the risk of a cardiac malformation, especially of the outflow tracts, and may be associated with a chromosomal anomaly.", "refs": [10], "table": null}]}, {"heading": "What the fetal echocardiogram adds", "blocks": [{"text": "These points are from the echocardiography guideline. They describe the specialist examination, not the screen.", "refs": [], "table": null}, {"text": "To assign abdominal situs, the examiner evaluates an upper abdominal cross-section showing the stomach, the liver, the descending aorta and the systemic veins, with careful attention to fetal lie and transducer orientation.", "refs": [11], "table": null}, {"text": "Two-dimensional imaging is required for visceral and atrial situs; colour Doppler is optional for it.", "refs": [12], "table": null}, {"text": "A sagittal view of the two venae cavae establishes whether the inferior vena cava is continuous and whether both venae cavae lie on the same side.", "refs": [13, 14], "table": null}]}, {"heading": "Record it", "blocks": [{"text": "Stored images should carry labels for laterality and orientation where appropriate.", "refs": [15], "table": null}]}], "checklist": {"title": "Plane I checklist", "items": [{"text": "Fetal left and right established from the position of the fetus", "refs": [1]}, {"text": "Stomach on the fetal left", "refs": [3]}, {"text": "Descending aorta left of the spine; inferior vena cava right of the spine", "refs": [3]}, {"text": "Heart mainly in the left chest; axis about 45 degrees to the left (plus or minus 20)", "refs": [5]}, {"text": "Heart or stomach not on the left: situs abnormality suspected", "refs": [7]}, {"text": "Laterality and orientation labelled on stored images where appropriate", "refs": [15]}]}, "drills": {"items": [{"id": "D3-Q01", "question": "What must be established before deciding that the stomach is on the fetal left?", "options": ["Fetal laterality, from the position of the fetus in the uterus", "The cardiac axis", "The heart rate", "The position of the placenta"], "answer": 0, "explanation": "Fetal right and left are determined first, from the position of the fetus in utero; only then are stomach and heart confirmed on the left.", "claims": ["IS23-021"], "status": "expert-verified"}, {"id": "D3-Q02", "question": "At which level is abdominal situs assessed?", "options": ["The level of the standard abdominal circumference", "The level of the bladder", "The level of the kidneys", "The level of the four-chamber view"], "answer": 0, "explanation": "Abdominal situs is assessed at the level of the standard abdominal circumference.", "claims": ["IS23-024"], "status": "expert-verified"}, {"id": "D3-Q03", "question": "In normal situs, where do the great vessels lie in the upper-abdomen plane?", "options": ["Descending aorta left of the spine; inferior vena cava right of the spine", "Descending aorta right of the spine; inferior vena cava left of the spine", "Both in front of the spine in the midline", "Both to the left of the spine"], "answer": 0, "explanation": "Stomach on the left, descending aorta on the left and inferior vena cava on the right side of the spine.", "claims": ["IS23-024"], "status": "expert-verified"}, {"id": "D3-Q04", "question": "Why does normal abdominal situs matter for the heart?", "options": ["It is a surrogate for normal atrial situs", "It proves the outflow tracts are normal", "It shows the heart rate is regular", "It rules out all heart disease"], "answer": 0, "explanation": "Normal abdominal situs stands in for normal atrial situs: right atrium to the right, left atrium to the left.", "claims": ["IS23-025"], "status": "expert-verified"}, {"id": "D3-Q05", "question": "After working out fetal lines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Technical factors: Zoom, cine-loop and image storage, p. 789. (IS23-017, ai-cross-checked)"]}, {"id": "D4", "title": "The four-chamber view in depth", "tier": "Detect", "version": 0.2, "summary": "Every criterion of the four-chamber view, one structure at a time: size, position, axis, atria, veins, ventricles, septum and valves, with the traps.", "public": false, "status": "ai-extracted", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-extracted' that no clinician has verified.", "objectives": ["Judge heart size, position and axis.", "Apply the criteria for the atria, pulmonary veins, ventricles, septum and atrioventricular valves.", "Avoid the common false alarms: a pericardial rim and septal drop-out.", "Say what a normal four-chamber view does not exclude."], "sections": [{"heading": "More than a count", "blocks": [{"text": "The four-chamber view requires much more than counting four chambers.", "refs": [1], "table": null}, {"text": "Work through it in the same order every time: size, position and axis, then atria, veins, ventricles, septum, valves.", "refs": [], "table": null}]}, {"heading": "Size and the rim of fluid", "blocks": [{"text": "A normal heart is usually no larger than one third of the area of the chest.", "refs": [2], "table": null}, {"text": "A small amount of pericardial fluid, 2 mm or less in thickness at end-systole, is common in the second and third trimesters and is normal. A thin dark rim around the heart should not be mistaken for an effusion.", "refs": [3], "table": null}]}, {"heading": "Position and axis", "blocks": [{"text": "The heart lies mainly in the left chest. Its long axis normally points to the left at about 45 degrees, plus or minus 20 degrees, relative to the front-to-back axis of the chest.", "refs": [4], "table": null}, {"text": "An abnormal axis raises the risk of a cardiac malformation, especially of the outflow tracts, and may be associated with a chromosomal anomaly.", "refs": [5], "table": null}, {"text": "A heart displaced from its normal position may point to a diaphragmatic hernia, a space-occupying lesion in the chest, or a small or absent lung.", "refs": [6], "table": null}]}, {"heading": "Atria", "blocks": [{"text": "The two atria normally look similar in size. The flap of the foramen ovale moves within the left atrium. The septum primum, the lower rim of the atrial septum, should be present.", "refs": [7], "table": null}, {"text": "The crux of the heart is the point where the lower atrial septum meets the upper ventricular septum and where the atrioventricular valves insert.", "refs": [8], "table": null}]}, {"heading": "Pulmonary veins", "blocks": [{"text": "Where technically feasible, at least one pulmonary vein should be seen entering the left atrium on grey-scale. Colour can help but is not mandatory for this.", "refs": [9], "table": null}, {"text": "If colour is used to show the veins, display it alongside the grey-scale image to help avoid false-negative findings.", "refs": [10], "table": null}]}, {"heading": "Ventricles", "blocks": [{"text": "The moderator band near the apex identifies the morphological right ventricle. The left ventricular apex looks smooth and forms the apex of the heart.", "refs": [11], "table": null}, {"text": "The ventricles should look similar in size, with no thickening of the walls.", "refs": [12], "table": null}, {"text": "Mild disproportion can be a normal variant in the third trimester. Right-left asymmetry in mid-gestation is different: it warrants further examination. Important causes are coarctation of the aorta, an evolving hypoplastic left heart and anomalous pulmonary venous return.", "refs": [12], "table": null}]}, {"heading": "Ventricular septum", "blocks": [{"text": "Examine the septum from apex to crux and, if possible, sweep from its most posterior part towards the outflow tracts.", "refs": [13], "table": null}, {"text": "The septum is seen best with the beam perpendicular to it. With the beam parallel to the septum, acoustic drop-out can falsely suggest a defect near the crux.", "refs": [14], "table": null}, {"text": "Small septal defects of 1 to 2 mm can be very difficult to confirm, particularly when fetal size and position are unfavourable. Most are of limited clinical significance and may close on their own before birth.", "refs": [15, 16], "table": null}]}, {"heading": "Atrioventricular valves", "blocks": [{"text": "There should be two separate atrioventricular valves that open separately and freely. The septal leaflet of the tricuspid valve inserts closer to the apex than the mitral valve: the normal offset.", "refs": [17], "table": null}, {"text": "Abnormal alignment of the two valves can be a key finding in anomalies such as atrioventricular septal defect.", "refs": [17], "table": null}]}, {"heading": "Rate and rhythm", "blocks": [{"text": "Normal rate is 120 to 160 beats per minute, with a regular rhythm.", "refs": [18], "table": null}, {"text": "Unit D8 covers rate and rhythm in full.", "refs": [], "table": null}]}, {"heading": "What a normal four-chamber view does not exclude", "blocks": [{"text": "Some lesions, for example transposition of the great arteries and coarctation of the aorta, may not be evident in the four-chamber plane alone.", "refs": [19], "table": null}, {"text": "Complete transposition, tetralogy of Fallot, double-outlet right ventricle, common arterial trunk and pulmonary atresia with a ventricular septal defect can have a four-chamber view that looks normal.", "refs": [20], "table": null}]}, {"heading": "What the fetal echocardiogram adds", "blocks": [{"text": "These points are from the echocardiography guideline. They describe the specialist examination, not the screen.", "refs": [], "table": null}, {"text": "The fetal heart should be examined from at least two orthogonal planes, depending on the size, thickness and orientation of the structure.", "refs": [21], "table": null}, {"text": "The cardiac axis must be assessed; measuring the angle is optional. A complete study requires a measured ratio of cardiac to thoracic area.", "refs": [22, 23], "table": null}, {"text": "Pulmonary venous connections must be shown from at least one vein on each side, with two-dimensional and colour imaging.", "refs": [24], "table": null}, {"text": "Both two-dimensional and colour images are required to assess the ventricular septum and to locate any defect.", "refs": [25], "table": null}]}], "checklist": {"title": "Four-chamber view checklist", "items": [{"text": "Heart usually no larger than a third of the chest area", "refs": [2]}, {"text": "Mainly in the left chest; axis about 45 degrees to the left (plus or minus 20)", "refs": [4]}, {"text": "Rate 120 to 160 per minute, regular", "refs": [18]}, {"text": "Atria similar in size; foramen ovale flap moving in the left atrium; septum primum present", "refs": [7]}, {"text": "At least one pulmonary vein entering the left atrium, where technically feasible", "refs": [9]}, {"text": "Ventricles similar in size; walls not thick; moderator band near the apex of the right ventricle", "refs": [11, 12]}, {"text": "Septum examined from apex to crux, beam perpendicular where possible", "refs": [13, 14]}, {"text": "Two atrioventricular valves opening separately and freely; normal offset", "refs": [17]}, {"text": "Pericardial fluid no more than a thin rim (2 mm or less)", "refs": [3]}]}, "drills": {"items": [{"id": "D4-Q01", "question": "How large is a normal heart in the four-chamber plane?", "options": ["Usually no larger than one third of the area of the chest", "About two thirds of the area of the chest", "About half the area of the chest", "About one tenth of the area of the chest"], "answer": 0, "explanation": "A normal heart is usually no larger than one third of the chest area.", "claims": ["IS23-026"], "status": "expert-verified"}, {"id": "D4-Q02", "question": "A ly inserts closer to the apex?", "options": ["The septal leaflet of the tricuspid valve", "The anterior leaflet of the mitral valve", "Both insert at exactly the same level", "The aortic valve"], "answer": 0, "explanation": "The septal leaflet of the tricuspid valve inserts closer to the apex than the mitral valve; this is the normal offset.", "claims": ["IS23-047"], "status": "ai-cross-checked"}, {"id": "D4-Q07", "question": "At 20 weeks the left ventricle is clearly smaller than the right. Which of these is named as an important cause?", "options": ["Coarctation of the aorta", "A normal third-trimester variant", "An echogenic intracardiac focus", "Benign ectopic beats"], "answer": 0, "explanation": "Asymmetry in mid-gestation warrants further examination; important causes are coarctation, evolving hypoplastic left heart syndrome and anomalous pulmonary venous return.", "claims": ["IS23-043"], "status": "expert-verified"}, {"id": "D4-Q08", "question": "What does the guideline say about a 1 to 2 mm ventricular septal defect?", "options": ["It can be very difficult to confirm, and most are of limited clinical significance", "It is always visible on grey-scale", "It is always a sign of a chromosomal anomaly", "It never closes before birth"], "answer": 0, "explanation": "Small septal defects (1 to 2 mm) can be very difficult to confirm; most are of limited clinical significance and may close spontaneously in utero.", "claims": ["IS23-046"], "status": "ai-cross-checked"}, {"id": "D4-Q09", "question": "Is colour Doppler required to show a pulmonary vein entering the left atrium at screening?", "options": ["No: grey-scale where feasible; colour can help but is not mandatory", "Yes: always", "Yes: with pulsed-wave Doppler as well", "Pulmonary veins are not part of the four-chamber criteria"], "answer": 0, "explanation": "At least one pulmonary vein should be seen entering the left atrium on B-mode when technically feasible; colour can help but is not mandatory.", "claims": ["IS23-040"], "status": "expert-verified"}, {"id": "D4-Q10", "question": "The four-chamber view meets every criterion. Which lesion may still be present?", "options": ["Transposition of the great arteries", "A common atrioventricular valve", "A heart filling two thirds of the chest", "A single ventricle"], "answer": 0, "explanation": "Transposition and coarctation may not be evident in the four-chamber plane alone. The other three would break a four-chamber criterion.", "claims": ["IS23-008", "IS23-047", "IS23-026", "IS23-043"], "status": "ai-cross-checked"}]}, "video": {"title": "The four-chamber view, structure by structure", "minutes": 7, "beats": [{"shot": "Four-chamber clip with chest outline overlaid", "narration": "Size first. The heart is usually no more than a third of the chest."}, {"shot": "Same clip with axis line", "narration": "Mostly in the left chest. Axis about forty-five degrees to the left, give or take twenty."}, {"shot": "Clip zoomed on atria, flap labelled", "narration": "Two atria of similar size. The flap of the foramen ovale moves in the left atrium. The lower rim of the atrial septum is there."}, {"shot": "Clip zoomed on ventricles, moderator band labelled", "narration": "Two ventricles of similar size. The moderator band near the apex marks the right ventricle. The smooth left ventricle forms the apex."}, {"shot": "Two clips: beam along the septum with apparent gap; beam across the septum, intact", "narration": "Follow the septum from apex to crux. With the beam along it, drop-out can fake a defect. Look again with the beam across it."}, {"shot": "Clip zoomed on the crux, offset marked", "narration": "Two valves, opening separately. The tricuspid sits a little nearer the apex than the mitral."}, {"shot": "Presenter", "narration": "A normal four-chamber view is not a normal heart. Transposition and coarctation may not be evident here. Keep sweeping."}]}, "missing": ["How to measure the cardiac axis and the cardiothoracic ratio step by step
