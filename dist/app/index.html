 must show, and which lesions they reveal.", "public": false, "status": "ai-cross-checked", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-cross-checked' that no clinician has verified.", "objectives": ["Obtain both outflow-tract views by the sweep or the rotational technique.", "Confirm the three things that make the outflow tracts normal.", "Identify the aorta and the pulmonary artery by their features.", "Name the lesions that outflow-tract views reveal."], "sections": [{"heading": "Why these views are not optional", "blocks": [{"text": "The left and right outflow-tract views, with the three-vessel and three-vessel-and-trachea views, are an integral part of the cardiac screening examination.", "refs": [1], "table": null}, {"text": "Including outflow-tract and great-vessel views raises detection of major malformations above the four-chamber view alone. It allows detection of tetralogy of Fallot, transposition of the great arteries, double-outlet right ventricle and truncus arteriosus.", "refs": [2], "table": null}, {"text": "The same views can identify aortic and pulmonary valve stenosis, which may become more severe as pregnancy advances.", "refs": [3], "table": null}, {"text": "In a survey of more than 18 000 fetuses, 93% of examinations with an adequate four-chamber view also achieved a satisfactory outflow-tract evaluation.", "refs": [4], "table": null}]}, {"heading": "What to establish", "blocks": [{"text": "For the two great arteries, establish four things: each is connected to the correct ventricle; their size; their position relative to each other; and that the semilunar valves look normal and open normally.", "refs": [5], "table": null}, {"text": "Alongside those four checks, three features of continuity and crossing are confirmed; they do not replace the four. The vessel leaving the left ventricle has its anterior wall continuous with the ventricular septum and does not divide: the aorta. The vessel leaving the right ventricle divides: the pulmonary artery. The two great arteries cross each other.", "refs": [6, 7, 8], "table": {"columns": ["Feature", "Aorta", "Pulmonary artery"], "rows": [["Arises from", "Left ventricle", "Right ventricle"], ["Divides early", "No", "Yes, after a short course"], ["Wall continuity", "Anterior wall continuous with the ventricular septum", "-"], ["Relative size", "Usually slightly smaller", "Usually slightly larger"], ["Course, each relative to the other", "The ascending aorta is the more posterior", "Runs to the left of the ascending aorta and crosses it at almost a right angle"]]}}]}, {"heading": "Two ways to get there", "blocks": [{"text": "Sweep technique: from the four-chamber view, sweep transversely towards the fetal head. The left outflow, the right outflow, the three-vessel view and the three-vessel-and-trachea view appear in sequence.", "refs": [9], "table": null}, {"text": "Rotational technique: from the four-chamber view, rotate the transducer towards the fetal right shoulder. It is easier when the septum is perpendicular to the beam and may need slightly more skill. It optimises the left outflow tract, especially the outlet septum in continuity with the anterior wall of the aorta.", "refs": [10], "table": null}, {"text": "Once the left outflow tract is obtained, angle towards the head until the pulmonary artery is seen running almost at right angles to the aorta. The relation of the two outflow tracts is shown best on cine clips, not stills.", "refs": [11], "table": null}, {"text": "When the fetal lie is unfavourable, extra examination time or a second examination may be needed.", "refs": [12], "table": null}]}, {"heading": "Left ventricular outflow tract", "blocks": [{"text": "The view confirms a great vessel arising from the morphological left ventricle. Document the continuity between the ventricular septum and the anterior wall of the vessel.", "refs": [13], "table": null}, {"text": "Strictly, only the head and neck vessels arising from it confirm that the vessel is the aorta.", "refs": [13], "table": null}, {"text": "The aortic valve should move freely and should not be thickened.", "refs": [14], "table": null}, {"text": "This view helps to identify outlet ventricular septal defects, conotruncal abnormalities and aortic valve abnormalities that are not visible in the four-chamber view.", "refs": [15], "table": null}]}, {"heading": "Right ventricular outflow tract", "blocks": [{"text": "The view confirms the pulmonary artery arising from the morphological right ventricle and branching after a short course. The pulmonary valve should move freely and should not be thickened.", "refs": [7], "table": null}, {"text": "The normal pulmonary artery runs to the left of the more posterior ascending aorta, is usually slightly larger than the ascending aorta in fetal life, and crosses it at almost a right angle.", "refs": [8], "table": null}]}, {"heading": "Size", "blocks": [{"text": "At the least, show that the two great arteries are approximately equal in size. A major discrepancy should lead to further evaluation.", "refs": [16], "table": null}]}, {"heading": "What is not part of the screen", "blocks": [{"text": "Sagittal views of the aortic and ductal arches, and assessment of the neck vessels, are not currently part of the routine cardiac screening examination.", "refs": [17], "table": null}]}, {"heading": "What the fetal echocardiogram adds", "blocks": [{"text": "These points are from the echocardiography guideline. They describe the specialist examination, not the screen.", "refs": [], "table": null}, {"text": "The normal left outflow view shows the outflow below the aortic valve, the valve, the region above it and the ascending aorta.", "refs": [18], "table": null}, {"text": "The normal right outflow view shows the tract below the pulmonary valve, the valve and the proximal pulmonary trunk; the bifurcation may come into the plane.", "refs": [19], "table": null}, {"text": "The origins of the right and left pulmonary arteries need two-dimensional and colour imaging; measuring them is optional.", "refs": [20], "table": null}]}], "checklist": {"title": "Outflow tracts checklist", "items": [{"text": "Vessel from the left ventricle; anterior wall continuous with the septum; does not divide", "refs": [6, 13]}, {"text": "Aortic valve moving freely, not thickened", "refs": [14]}, {"text": "Vessel from the right ventricle; divides after a short course", "refs": [6, 7]}, {"text": "Pulmonary valve moving freely, not thickened", "refs": [7]}, {"text": "The two great arteries cross", "refs": [6]}, {"text": "Great arteries approximately equal in size", "refs": [16]}, {"text": "Clip of the outflow tracts stored", "refs": [11, 21]}]}, "drills": {"items": [{"id": "D5-Q01", "question": "Which finding identifies the vessel leaving the left ventricle as the aorta at screening?", "options": ["Its anterior wall is continuous with the ventricular septum and it does not divide", "It divides after a short course", "It is larger than the other great artery", "It runs to the left of the other great artery"], "answer": 0, "explanation": "The vessel from the left ventricle has its anterior wall continuous with the septum and does not bifurcate.", "claims": ["IS23-052"], "status": "expert-verified"}, {"id": "D5-Q02", "question": "Which finding identifies the pulmonary artery?", "options": ["It arises from the right ventricle and divides after a short course", "It gives off the head and neck vessels", "Its wall is continuous with the ventricular septum", "It is always smaller than the aorta"], "answer": 0, "explanation": "The pulmonary artery arises from the right ventricle and branches after a short course.", "claims": ["IS23-064"], "status": "expert-verified"}, {"id": "D5-Q03", "question": "How do the two great arteries normally relate to each other as they leave the heart?", "options": ["They cross, the pulmonary artery almost at right angles to the aorta", "They run parallel, side by side", "They join into one trunk", "The aorta lies in front and to the left"], "answer": 0, "explanation": "The great arteries cross each other; the pulmonary artery crosses the ascending aorta at almost a right angle.", "claims": ["IS23-052", "IS23-065"], "status": "expert-verified"}, {"id": "D5-Q04", "question": "Which great artery is usually slightly larger in fetal life?", "options": ["The pulmonary artery", "The aorta", "They are always exactly equal", "It alternates through the cardiac cycle"], "answer": 0, "explanation": "The pulmonary artery is usually slightly larger than the ascending aorta in fetal life.", "claims": ["IS23-065"], "status": "expert-verified"}, {"id": "D5-Q05", "question": "One great artery is clearly much smaller than the other. What does the guideline say?", "options": ["A major discrepancy should lead to further evaluation", "This is the normal slight difference", "It matters only if the four-chamber view is abnormal", "It should be rechecked after birth"], "answer": 0, "explanation": "The great arteries should be approximately equal in size; a major discrepancy should lead to further evaluation.", "claims": ["IS23-051"], "status": "expert-verified"}, {"id": "D5-Q06", "question": "In the rotational technique, which way is the transducer rotated from the four-chamber view to open the left outflow tract?", "options": ["Towards the fetal right shoulder", "Towards the fetal left hip", "Towards the fetal spine", "It is not rotated; it is slid towards the feet"], "answer": 0, "explanation": "From the four-chamber view the transducer is rotated towards the fetal right shoulder.", "claims": ["IS23-057"], "status": "ai-cross-checked"}, {"id": "D5-Q07", "question": "What is the best record of the relationship between the two outflow tracts?", "options": ["A cine clip", "One still frame", "A measurement of each valve", "A written note"], "answer": 0, "explanation": "The relationship of the two outflow tracts is best shown on cine clips, not still frames.", "claims": ["IS23-058"], "status": "ai-cross-checked"}, {"id": "D5-Q08", "question": "Which lesions does the left outflow-tract view help to identify that the four-chamber view does not show?", "options": ["Outlet septal defects, conotruncal abnormalities and aortic valve abnormalities", "Abnormal abdominal situs", "Atrial size discrepancy", "Pericardial effusion"], "answer": 0, "explanation": "The LVOT view helps identify outlet ventricular septal defects, conotruncal abnormalities and aortic valve abnormalities not visible in the four-chamber view.", "claims": ["IS23-062"], "status": "expert-verified"}, {"id": "D5-Q09", "question": "Are sagittal views of the aortic and ductal arches part of the routine cardiac screen?", "options": ["No: they are not currently part of the routine screening examination", "Yes: both are mandatory", "Yes: the aortic arch only", "Only when colour Doppler is used"], "answer": 0, "explanation": "Sagittal arch views and assessment of the neck vessels are not currently part of the routine cardiac screening examination.", "claims": ["IS23-061"], "status": "ai-cross-checked"}, {"id": "D5-Q10", "question": "What should the aortic and pulmonary valves look like?", "options": ["Moving freely and not thickened", "Thick and bright", "Fixed in the open position", "Not visible at screening"], "answer": 0, "explanation": "Each semilunar valve should move freely and should not be thickened.", "claims": ["IS23-060", "IS23-064"], "status": "expert-verified"}]}, "video": {"title": "Two outflow tracts, one crossing", "minutes": 6, "beats": [{"shot": "Split screen: hand sliding the probe towards the head / clip moving from four-chamber to LVOT", "narration": "From the four chambers, sweep towards the head. The first vessel you meet leaves the left ventricle."}, {"shot": "LVOT clip with septum and anterior aortic wall traced", "narration": "Its front wall runs straight on from the septum. It does not divide. The valve is thin and opens freely."}, {"shot": "Split screen: small rotation of the hand / LVOT opening out", "narration": "The other way in: from the four chambers, rotate towards the fetal right shoulder."}, {"shot": "RVOT clip with bifurcation labelled", "narration": "Tilt towards the head again. A second vessel, from the right ventricle, crossing the first almost at right angles, and dividing."}, {"shot": "Side-by-side stills of both arteries with calipers hidden", "narration": "About the same size, the pulmonary artery slightly larger. A major difference needs further evaluation."}]}, "missing": ["What each conotruncal lesion looks like in these views (overriding aorta, parallel great arteries, single trunk) - planned for the lesion atlas; needs a source and a cardiology co-editor.", "Normal sizes of the great arteries by gestation - planned for XA6; needs a source.", "Hand movements for each technique described for the Voluson probe - the editor's own teaching."], "references": ["Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Outflow-tract, three-vessel and three-vessel-and-trachea views, p. 793. (IS23-048, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Cardiac examination, p. 789. (IS23-019, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Cardiac examination, p. 789. (IS23-020, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Outflow-tract, three-vessel and three-vessel-and-trachea views, p. 793. (IS23-050, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Outflow-tract, three-vessel and three-vessel-and-trachea views, p. 793. (IS23-049, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Outflow-tract, three-vessel and three-vessel-and-trachea views, p. 793; Appendix 1. (IS23-052, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – RVOT view, 3VV and 3VTV, p. 794; Figure 7, p. 795. (IS23-064, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – RVOT view, 3VV and 3VTV, p. 794. (IS23-065, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Outflow tracts: Sonographic technique, p. 793. (IS23-055, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Outflow tracts: Sonographic technique, p. 793. (IS23-057, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Outflow tracts: Sonographic technique, p. 793. (IS23-058, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Outflow tracts: Sonographic technique, p. 793. (IS23-056, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – LVOT view, p. 794; Figure 6. (IS23-059, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – LVOT view, p. 794; Appendix 1. (IS23-060, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – LVOT view, p. 794. (IS23-062, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Outflow-tract, three-vessel and three-vessel-and-trachea views, p. 793. (IS23-051, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – LVOT view, p. 794. (IS23-061, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – III.E. Standard Views and Imaging Planes, LV outflow tract, Figure 5, pp. 687–688. (AS23-052, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – III.E. Standard Views and Imaging Planes, RV outflow tract, pp. 688–689; Figure 6, p. 687. (AS23-053, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – III.E. Standard Views and Imaging Planes, Table 3, proximal branch pulmonary arteries row, p. 686. (AS23-054, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Technical factors: Zoom, cine-loop and image storage, p. 789. (IS23-017, ai-cross-checked)"]}, {"id": "D6", "title": "Three-vessel and three-vessel-and-trachea views", "tier": "Detect", "version": 0.3, "summary": "The two highest planes of the sweep: which vessels, in what order and size, where the arches lie against the trachea, and what goes wrong here.", "public": false, "status": "ai-extracted", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-extracted' that no clinician has verified.", "objectives": ["Assess the three-vessel view for number, size, alignment and arrangement.", "Describe the normal three-vessel-and-trachea view: the V, its side, and the trachea.", "Name the lesions these two views help to detect.", "Explain how a finding here changes what happens next."], "sections": [{"heading": "A continuum, not two pictures", "blocks": [{"text": "The axial appearances of the right outflow tract, the branch pulmonary arteries and the ductal and aortic arches form a continuum of views. What you see varies with the orientation of the transducer and the lie of the fetus.", "refs": [1], "table": null}, {"text": "Assessment is likely to be more reliable live or on cine-loop than from still images alone.", "refs": [1], "table": null}]}, {"heading": "The three-vessel view", "blocks": [{"text": "Assess four things: the number of vessels, their size, their alignment and their arrangement.", "refs": [2], "table": null}, {"text": "From left to right the vessels are the pulmonary artery, the aorta and the right superior vena cava. The pulmonary artery is the most anterior and the vena cava the most posterior. The diameters decrease from left to right.", "refs": [2], "table": {"columns": ["Vessel", "Side", "Front to back", "Size"], "rows": [["Pulmonary artery", "Left", "Most anterior", "Largest"], ["Aorta", "Middle", "Middle", "Middle"], ["Superior vena cava", "Right", "Most posterior", "Smallest"]]}}, {"text": "The pulmonary artery is usually slightly larger than the ascending aorta in fetal life. The superior vena cava lies to the right of the aorta.", "refs": [3], "table": null}]}, {"heading": "The three-vessel-and-trachea view", "blocks": [{"text": "This is a slightly oblique transverse plane, towards the head from the three-vessel view. It shows the main pulmonary artery continuing into the ductus arteriosus, with the transverse aortic arch just to its right.", "refs": [4], "table": null}, {"text": "The trachea appears as a bright ring around a small fluid-filled space.", "refs": [4], "table": null}, {"text": "Normally the ductus arteriosus and the aortic arch both run to the left of the trachea and meet at an acute angle, forming a V. The right superior vena cava and the thymus are also seen in this plane.", "refs": [5], "table": null}, {"text": "The screening checklist asks for two things here: the V-sign, with both arches to the left of the trachea, and ductal and aortic arches of similar size.", "refs": [6], "table": null}, {"text": "The thymus appears as a relatively dark area between the great vessels and the front of the chest.", "refs": [7], "table": null}, {"text": "The aortic arch lies slightly nearer the head than the ductal arch, so showing both together may need a small adjustment away from a true axial plane.", "refs": [8], "table": null}]}, {"heading": "Adding colour", "blocks": [{"text": "Colour helps to show the V-sign and can highlight reversed flow in the ductus arteriosus or the aortic arch.", "refs": [9], "table": null}]}, {"heading": "What these views detect", "blocks": [{"text": "The two views help to detect anomalies of the outflow tracts, the aortic arch and the systemic veins, including a persistent left superior vena cava, and anomalies of the thymus.", "refs": [10], "table": null}, {"text": "The three-vessel-and-trachea view is particularly useful for abnormalities of the aortic arch such as coarctation, vascular rings and an aberrant right subclavian artery. It is likely to enable detection of coarctation, right aortic arch and double aortic arch.", "refs": [11, 12], "table": null}, {"text": "Complete transposition, tetralogy of Fallot, double-outlet right ventricle, common arterial trunk and pulmonary atresia with a ventricular septal defect can have a four-chamber view that looks normal. They are typically abnormal in the three-vessel view.", "refs": [13], "table": {"columns": ["Check", "Normal", "Question to ask if not"], "rows": [["Number", "Three vessels", "Is there a fourth vessel, or only two?"], ["Size", "Decreasing from left to right; arches similar in size", "Is one great artery or one arch much smaller?"], ["Alignment and arrangement", "Pulmonary artery, aorta, vena cava in a line from left-front to right-back", "Is the order or the line wrong?"], ["Side of the arches", "Both left of the trachea, meeting in a V", "Does an arch pass to the right of the trachea, or on both sides?"]]}}]}, {"heading": "Why a finding here matters", "blocks": [{"text": "Anomalies found on the three-vessel views can change counselling and management. What follows depends on the anomaly found; none of these follows from every abnormal view. The guideline's examples: testing for 22q11 microdeletion; planning where delivery takes place, as in complete transposition; being ready to give prostaglandin; being ready for airway problems from vascular compression.", "refs": [14], "table": null}, {"text": "A fetus with a suspected abnormality on screening is a candidate for fetal echocardiography.", "refs": [15], "table": null}]}, {"heading": "What the fetal echocardiogram adds", "blocks": [{"text": "These points are from the echocardiography guideline. They describe the specialist examination, not the screen.", "refs": [], "table": null}, {"text": "In the three-vessel view, abnormalities of vessel number, size, alignment or arrangement should be recorded.", "refs": [16], "table": null}, {"text": "In the normal three-vessel-and-trachea view the two arches join the descending aorta on the left of the trachea. Colour Doppler should demonstrate patency and direction of flow in both arches.", "refs": [17, 18], "table": null}, {"text": "Aortic and ductal arch sidedness should be documented at every fetal echocardiogram.", "refs": [19], "table": null}, {"text": "Colour and power Doppler in the three-vessel-and-trachea view can help to identify an aberrant subclavian artery.", "refs": [20], "table": null}]}], "checklist": {"title": "Three-vessel views checklist", "items": [{"text": "Three vessels: pulmonary artery, aorta, superior vena cava, from left to right", "refs": [2]}, {"text": "Sizes decrease from left to right", "refs": [2]}, {"text": "Vessels in line, pulmonary artery most anterior, vena cava most posterior", "refs": [2]}, {"text": "Three-vessel-and-trachea view: ductal and aortic arches meet in a V", "refs": [5]}, {"text": "Both arches to the left of the trachea", "refs": [5, 6]}, {"text": "Arches similar in size", "refs": [6]}, {"text": "Clip of these views stored", "refs": [1, 21]}]}, "drills": {"items": [{"id": "D6-Q01", "question": "What are the four things assessed in the three-vessel view?", "options": ["Number, size, alignment and arrangement of the vessels", "Rate, rhythm, axis and size of the heart", "Colour, power, pulsed-wave and continuous-wave Doppler", "Atria, ventricles, septum and valves"], "answer": 0, "explanation": "The three-vessel view is assessed for vessel number, size, alignment and arrangement.", "claims": ["IS23-066"], "status": "expert-verified"}, {"id": "D6-Q02", "question": "From fetal left to right, what is the normal order of the three vessels?", "options": ["Pulmonary artery, aorta, superior vena cava", "Aorta, pulmonary artery, superior vena cava", "Superior vena cava, aorta, pulmonary artery", "Pulmonary artery, superior vena cava, aorta"], "answer": 0, "explanation": "From left to right: pulmonary artery, aorta, right superior vena cava.", "claims": ["IS23-066"], "status": "expert-verified"}, {"id": "D6-Q03", "question": "How do the vessel diameters normally compare in the three-vessel view?", "options": ["They decrease from left to right", "They increase from left to right", "All three are equal", "The vena cava is the largest"], "answer": 0, "explanation": "Diameters decrease from left to right: pulmonary artery largest, superior vena cava smallest.", "claims": ["IS23-066"], "status": "expert-verified"}, {"id": "D6-Q04", "question": "In the normal three-vessel-and-trachea view, where do the two arches lie?", "options": ["Both to the left of the trachea, meeting in a V", "One on each side of the trachea", "Both to the right of the trachea", "In front of the trachea, running parallel"], "answer": 0, "explanation": "The ductus arteriosus and aortic arch both run to the left of the trachea and meet at an acute angle (V shape).", "claims": ["IS23-069"], "status": "expert-verified"}, {"id": "D6-Q05", "question": "How is the trachea recognised in this plane?", "options": ["A bright ring around a small fluid-filled space", "A solid bright dot", "A large dark circle bigger than the aorta", "It cannot be seen on ultrasound"], "answer": 0, "explanation": "The trachea appears as a bright ring around a small fluid-filled space.", "claims": ["IS23-068"], "status": "expert-verified"}, {"id": "D6-Q06", "question": "Besides the V-sign, what does the screening checklist ask for at the three-vessel-and-trachea view?", "options": ["Ductal and aortic arches of similar size", "An aortic arch twice the size of the ductal arch", "Four vessels in a row", "Pulsed-wave Doppler of both arches"], "answer": 0, "explanation": "The checklist asks for the V-sign with both arches left of the trachea, and arches of similar size.", "claims": ["IS23-096"], "status": "expert-verified"}, {"id": "D6-Q07", "question": "For which group of abnormalities is the three-vessel-and-trachea view particularly useful?", "options": ["Aortic arch abnormalities such as coarctation and vascular rings", "Atrioventricular valve offset", "Abdominal situs", "Pericardial effusion"], "answer": 0, "explanation": "It is particularly useful for arch abnormalities such as coarctation, vascular rings and aberrant right subclavian artery.", "claims": ["IS23-054"], "status": "expert-verified"}, {"id": "D6-Q08", "question": "Which venous anomaly do the three-vessel views help to detect?", "options": ["Persistent left superior vena cava", "Absent ductus venosus", "Umbilical vein varix", "Hepatic vein thrombosis"], "answer": 0, "explanation": "These views help detect anomalies of the systemic veins, including persistent left superior vena cava.", "claims": ["IS23-053"], "status": "ai-cross-checked"}, {"id": "D6-Q09", "question": "The four-chamber view is normal. In complete transposition, which view is typically abnormal?", "options": ["The three-vessel view", "The upper-abdomen view", "None of the axial views", "Only the sagittal views"], "answer": 0, "explanation": "Lesions such as complete transposition can have a seemingly normal four-chamber view but are typically abnormal in the three-vessel view.", "claims": ["IS23-067"], "status": "expert-verified"}, {"id": "D6-Q10", "question": "An anomaly is found on the three-vessel-and-trachea view. Which of these is an example of how that can change management?", "options": ["It can prompt testing for 22q11 microdeletion", "It removes the need for fetal echocardiography", "It means the anomaly scan need not be completed", "It has no effect on counselling"], "answer": 0, "explanation": "Findings on the three-vessel views can prompt 22q11 testing, change the planned place of delivery, and prepare the team for prostaglandin or airway problems.", "claims": ["IS23-072"], "status": "ai-cross-checked"}, {"id": "D6-Q11", "question": "Both arches cannot be shown in one true axial plane. Why might that be?", "options": ["The aortic arch lies slightly nearer the head than the ductal arch", "One arch must be absent", "The trachea hides the aortic arch", "The arches are only visible in the third trimester"], "answer": 0, "explanation": "The aortic arch is more cranial than the ductal arch, so showing both together may need a slight adjustment away from a true axial plane.", "claims": ["IS23-070"], "status": "ai-cross-checked"}]}, "video": {"title": "Three vessels, then the V", "minutes": 6, "beats": [{"shot": "Sweep clip from RVOT up to the three-vessel view", "narration": "Keep sweeping towards the head. Three vessels come into line."}, {"shot": "Three-vessel clip, vessels labelled one by one", "narration": "Pulmonary artery, aorta, vena cava. Left to right, front to back, large to small."}, {"shot": "Three-vessel-and-trachea clip with trachea ringed", "narration": "A little higher. Find the trachea: a bright ring. Both arches pass to its left and meet in a V."}, {"shot": "Same view in colour", "narration": "Colour makes the V easier to see, and can show flow going the wrong way in an arch."}, {"shot": "Presenter", "narration": "Number, size, alignment, arrangement. Then the V and its side. This is where arch problems and several outflow lesions show."}]}, "missing": ["What each abnormal pattern looks like (four vessels with a left superior vena cava, U-shaped ring of a right arch with left duct, small aortic arch of coarctation) - the table above only poses the questions; the answers need a source and belong to the lesion atlas.", "Normal size ratios of the vessels and arches by gestation - planned for XA6; needs a source.", "How to recognise a small or absent thymus - needs a source.", "The third table column ('question to ask if not') is the drafter's wording of the four checks, not a guideline statement - the editor to confirm or replace."], "references": ["Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – RVOT view, 3VV and 3VTV, p. 794; Figure 8, p. 795. (IS23-063, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – RVOT view, 3VV and 3VTV, p. 794; Figure 7, p. 795. (IS23-066, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – RVOT view, 3VV and 3VTV, p. 794. (IS23-065, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – RVOT view, 3VV and 3VTV, last paragraph of p. 794 continuing on p. 796; Figure 9, p. 796. (IS23-068, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – RVOT view, 3VV and 3VTV, p. 796; Figure 9; Appendix 1. (IS23-069, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Appendix 1, p. 802. (IS23-096, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Figures 7 and 9, pp. 795-796. (IS23-100, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – RVOT view, 3VV and 3VTV, p. 796. (IS23-070, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Color flow Doppler ultrasound, p. 796. (IS23-074, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Outflow-tract, three-vessel and three-vessel-and-trachea views, p. 793. (IS23-053, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Outflow-tract, three-vessel and three-vessel-and-trachea views, p. 793. (IS23-054, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – RVOT view, 3VV and 3VTV, p. 796. (IS23-071, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – RVOT view, 3VV and 3VTV, p. 794. (IS23-067, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – RVOT view, 3VV and 3VTV, p. 796. (IS23-072, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Fetal echocardiography, p. 796. (IS23-078, expert-verified)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – III.E. Standard Views and Imaging Planes, Three-vessel view, p. 689. (AS23-056, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – III.E. Standard Views and Imaging Planes, Three-vessel-and-trachea view, p. 689; Figure 6, p. 687. (AS23-057, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – III.E. Standard Views and Imaging Planes, Three-vessel-and-trachea view, p. 689. (AS23-058, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – IV.C. Structural Heart Disease, Key Points, p. 718. (AS23-100, ai-extracted)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – IV.C. Structural Heart Disease, Isolated Arch Abnormalities, p. 717; Figure 30C, p. 718. (AS23-101, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Technical factors: Zoom, cine-loop and image storage, p. 789. (IS23-017, ai-cross-checked)"]}, {"id": "D7", "title": "Colour Doppler in screening", "tier": "Detect", "version": 0.1, "summary": "Whether colour is needed for a screening scan, what it adds on each view, and how to set it.", "public": false, "status": "ai-cross-checked", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-cross-checked' that no clinician has verified.", "objectives": ["Say whether colour Doppler is required for cardiac screening.", "Set the colour box, velocity scale and persistence for the heart and for veins.", "Describe normal colour flow through the heart and the great arteries.", "Name the abnormal patterns colour makes easier to see.", "Apply the safety limits for Doppler in early pregnancy."], "sections": [{"heading": "Is colour required?", "blocks": [{"text": "Colour flow Doppler is not mandatory in cardiac screening. The 2023 guideline encourages examiners to become familiar with it and to add it to the routine scan, and it can be used when the operator feels competent.", "refs": [1, 2], "table": null}, {"text": "Colour may be valuable in obese patients and may further improve detection of major heart disease in low-risk pregnancies.", "refs": [3], "table": null}, {"text": "This unit treats colour as an addition to the grey-scale screen taught in unit D1.", "refs": [], "table": null}]}, {"heading": "What normal colour shows", "blocks": [{"text": "In a normal heart, colour shows forward flow across both atrioventricular valves, both semilunar valves and both great arteries.", "refs": [4], "table": null}, {"text": "In the three-vessel-and-trachea view, colour helps to show the V formed by the two arches.", "refs": [4], "table": null}, {"text": "A pulmonary vein entering the left atrium should be shown on grey-scale where technically feasible. Colour can help with this but is not mandatory for it.", "refs": [5], "table": null}]}, {"heading": "What colour exposes", "blocks": [{"text": "Colour highlights abnormal flow patterns such as regurgitation through an atrioventricular valve and reversed flow in the ductus arteriosus or the aortic arch.", "refs": [4], "table": null}, {"text": "In a full fetal echocardiogram, colour is used to look for valve stenosis and regurgitation, flow across the foramen ovale, the integrity of the septa and the patency of vessels.", "refs": [6], "table": null}]}, {"heading": "Setting up colour", "blocks": [{"text": "Keep the colour box narrow and place it only over the area of interest. This preserves frame rate and the quality of the colour image.", "refs": [7], "table": null}, {"text": "For a second-trimester screen, set the colour velocity scale to about 50 to 70 cm/s for the heart and the arteries. Use a lower scale, about 15 to 25 cm/s, for veins. Low colour persistence is ordinarily built into cardiac presets.", "refs": [8], "table": null}, {"text": "For a full fetal echocardiogram, the echocardiography guideline says to set the scale to suit the velocities of interest, and to adjust colour gain and persistence so that colour fills the chamber or vessel without hiding the grey-scale image.", "refs": [9], "table": null}, {"text": "Starting settings for a second-trimester screen.", "refs": [7, 8], "table": {"columns": ["Looking at", "Colour velocity scale", "Other settings"], "rows": [["Valves, ventricles, great arteries, arches", "About 50 to 70 cm/s", "Narrow box; low persistence (ordinarily in the cardiac preset)"], ["Veins, such as the pulmonary veins", "About 15 to 25 cm/s", "Narrow box"]]}}]}, {"heading": "Colour beside grey-scale", "blocks": [{"text": "When you use colour to show the pulmonary veins entering the left atrium, display it alongside the grey-scale image. This helps to avoid false-negative findings.", "refs": [10], "table": null}]}, {"heading": "Power Doppler", "blocks": [{"text": "The echocardiography guideline describes power Doppler as showing the strength of the Doppler signal, not the frequency shift. In fetal echocardiography it helps to show small vessels, slow flow such as in veins, and septal defects. Directional power Doppler adds the direction of flow.", "refs": [11], "table": null}]}, {"heading": "Colour in early pregnancy", "blocks": [{"text": "For early cardiac screening, colour Doppler, or high-quality power Doppler with bidirectional flow mapping, or both, are recommended in addition to grey-scale.", "refs": [12], "table": null}, {"text": "In early screening, use Doppler mainly for the four-chamber view and the three-vessel-and-trachea view. Keep the thermal index at 1.0 or less and the exposure as short as possible, usually no more than 5 to 10 minutes.", "refs": [13], "table": null}, {"text": "At the early scan, the balance between colour and grey-scale is adjusted to favour the flow signal in the small cardiac structures.", "refs": [14], "table": null}, {"text": "For early fetal echocardiography, which is a different examination, the echocardiography guideline says to keep the thermal and mechanical indices at or below 1.0 and to use Doppler sparingly.", "refs": [15], "table": null}]}], "checklist": {"title": "When colour is used on a second-trimester screen", "items": [{"text": "Colour box narrow, over the area of interest only", "refs": [7]}, {"text": "Scale about 50 to 70 cm/s for heart and arteries; about 15 to 25 cm/s for veins", "refs": [8]}, {"text": "Pulmonary veins: colour shown beside the grey-scale image", "refs": [10]}, {"text": "Colour can show forward flow across all four valves and both great arteries", "refs": [4]}, {"text": "Colour can help to show the V of the two arches at the three-vessel-and-trachea view", "refs": [4]}, {"text": "At an early screen instead: thermal index 1.0 or less, Doppler exposure kept short", "refs": [13]}]}, "drills": {"items": [{"id": "D7-Q01", "question": "Is colour flow Doppler mandatory for a cardiac screening examination?", "options": ["No, but it is encouraged and can be used when the operator feels competent", "Yes, on every view", "Yes, but only on the four-chamber view", "No, and it should be avoided in the second trimester"], "answer": 0, "explanation": "Colour is not mandatory in screening. The guideline encourages becoming familiar with it and adding it to the routine scan.", "claims": ["IS23-073"], "status": "expert-verified"}, {"id": "D7-Q02", "question": "For a second-trimester screen, which colour velocity scale suits the heart and great arteries?", "options": ["About 50 to 70 cm/s", "About 15 to 25 cm/s", "About 5 to 10 cm/s", "About 150 to 200 cm/s"], "answer": 0, "explanation": "About 50 to 70 cm/s for intracardiac structures and vessels. The lower scale is for veins.", "claims": ["IS23-077"], "status": "ai-cross-checked"}, {"id": "D7-Q03", "question": "At a second-trimester screen you want to show a pulmonary vein with colour. Which velocity scale is appropriate?", "options": ["About 15 to 25 cm/s", "About 50 to 70 cm/s", "About 100 cm/s", "The same scale as for the aortic valve"], "answer": 0, "explanation": "Veins need a lower scale, about 15 to 25 cm/s.", "claims": ["IS23-077"], "status": "ai-cross-checked"}, {"id": "D7-Q04", "question": "How should the colour box be set?", "options": ["Narrow, and only over the area of interest", "As wide as the whole sector", "Over the whole fetal chest and abdomen", "Its size does not affect the image"], "answer": 0, "explanation": "A narrow box over the area of interest preserves frame rate and colour image quality.", "claims": ["IS23-076"], "status": "expert-verified"}, {"id": "D7-Q05", "question": "When colour is used to show the pulmonary veins, why display it alongside the grey-scale image?", "options": ["To help avoid false-negative findings", "To reduce the thermal index", "To increase the frame rate", "Because colour cannot be stored on its own"], "answer": 0, "explanation": "Displaying colour beside grey-scale when showing the pulmonary veins helps to avoid false-negative findings.", "claims": ["IS23-041"], "status": "ai-cross-checked"}, {"id": "D7-Q06", "question": "What does normal colour flow look like across the four heart valves?", "options": ["Forward flow across both atrioventricular valves and both semilunar valves", "Forward flow across the atrioventricular valves, with a small backward jet at each", "Flow in opposite directions in the two great arteries", "No visible flow across the semilunar valves at screening settings"], "answer": 0, "explanation": "A normal heart shows antegrade flow across the atrioventricular and semilunar valves and the great arteries.", "claims": ["IS23-074"], "status": "expert-verified"}, {"id": "D7-Q07", "question": "Which finding does colour Doppler make easier to see?", "options": ["Reversed flow in the aortic arch or the ductus arteriosus", "The thickness of the ventricular wall", "The size of the heart against the chest", "The cardiac axis"], "answer": 0, "explanation": "Colour highlights abnormal patterns such as atrioventricular valve regurgitation and flow reversal in the ductus arteriosus or aortic arch.", "claims": ["IS23-074"], "status": "expert-verified"}, {"id": "D7-Q08", "question": "Is colour Doppler needed to show a pulmonary vein entering the left atrium at screening?", "options": ["No: it should be shown on grey-scale where feasible; colour can help but is not mandatory", "Yes: pulmonary veins can only be shown with colour", "Yes: pulsed-wave Doppler is also required", "Pulmonary veins are not part of the screening examination"], "answer": 0, "explanation": "At least one pulmonary vein should be seen entering the left atrium on B-mode when technically feasible. Colour can help but is not mandatory.", "claims": ["IS23-040"], "status": "expert-verified"}, {"id": "D7-Q09", "question": "You are using colour Doppler at an early cardiac screen. What is the limit for the thermal index?", "options": ["1.0 or less", "2.0 or less", "There is no limit for colour Doppler", "5.0 or less"], "answer": 0, "explanation": "In early screening the thermal index should be 1.0 or less and exposure as short as possible.", "claims": ["IS23-093"], "status": "ai-cross-checked"}, {"id": "D7-Q10", "question": "At an early cardiac screen, on which views should Doppler mainly be used?", "options": ["The four-chamber view and the three-vessel-and-trachea view", "Every plane, for as long as needed", "The upper abdomen only", "The sagittal arch views only"], "answer": 0, "explanation": "In early screening Doppler is used mainly for the four-chamber and three-vessel-and-trachea views, with exposure kept short.", "claims": ["IS23-093"], "status": "ai-cross-checked"}, {"id": "D7-Q11", "question": "In the echocardiography guideline, what does power Doppler display?", "options": ["The strength of the Doppler signal, which helps with small vessels and slow flow", "The peak velocity of flow in cm/s", "The timing of atrial against ventricular contraction", "Tissue movement at the valve annulus"], "answer": 0, "explanation": "Power Doppler displays signal amplitude, not frequency shift, and helps to show small vessels, low-velocity flow and septal defects.", "claims": ["AS23-011"], "status": "ai-cross-checked"}]}, "video": {"title": "Adding colour to the sweep", "minutes": 5, "beats": [{"shot": "Presenter to camera", "narration": "Colour is not compulsory for screening. It is encouraged. In this course you practise it on normal hearts first."}, {"shot": "Machine console: colour key, box size, scale control", "narration": "For a second-trimester screen: small box, only where you are looking. Scale fifty to seventy centimetres per second for the heart and arteries. Fifteen to twenty-five for veins."}, {"shot": "Split screen: grey-scale four-chamber beside the same view in colour", "narration": "Four-chamber view: forward flow across both atrioventricular valves. For the pulmonary veins, keep grey-scale beside colour."}, {"shot": "Outflow tract clips in colour", "narration": "Forward flow through the aortic valve. Forward flow through the pulmonary valve."}, {"shot": "Three-vessel-and-trachea clip in colour", "narration": "Two arches meeting in a V. Colour makes the V easier to see, and it can show reversed flow in the ductus or the aortic arch."}, {"shot": "Screen close-up of thermal index display", "narration": "In early pregnancy, watch the thermal index. One or less. Keep it short."}]}, "missing": ["Common colour traps (aliasing, colour bleeding over a septum, wrong scale hiding a jet) with how to recognise each - needs a source; partly planned for D10 and XA4.", "How to use colour on the ventricular septum to look for a defect at screening level - not stated in the screening guideline.", "Voluson-specific colour presets and HD-flow - needs a source and the editor's input."], "references": ["Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Introduction, p. 788; Appendix 1, p. 802. (IS23-002, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Color flow Doppler ultrasound, p. 796. (IS23-073, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Color flow Doppler ultrasound, p. 796. (IS23-075, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Color flow Doppler ultrasound, p. 796. (IS23-074, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Four-chamber view, p. 792; Table 1. (IS23-040, expert-verified)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – III.E Standard views: four-chamber view, p. 687; LV outflow tract, p. 688; RV outflow, three-vessel-and-trachea, bicaval and short-axis views, p. 689; Table 3, p. 686. (AS23-009, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Color flow Doppler ultrasound, p. 796. (IS23-076, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Color flow Doppler ultrasound, p. 796. (IS23-077, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – III.D Image optimization, p. 684; III.G, p. 689. (AS23-010, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Four-chamber view, p. 792. (IS23-041, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – III.G Color and Power Doppler Ultrasound, p. 689; III.D Image Optimization, p. 684 (septal defects). (AS23-011, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Early fetal cardiac screening, p. 798. (IS23-092, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Early fetal cardiac screening, p. 798. (IS23-093, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Early fetal cardiac screening, p. 798. (IS23-101, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – Table 8 (early gestation), p. 695-696. (AS23-006, ai-cross-checked)"]}, {"id": "D8", "title": "Rate and rhythm for the screener", "tier": "Detect", "version": 0.1, "summary": "The normal fetal heart rate, and the irregular, slow and fast findings that the guideline says need further assessment.", "public": false, "status": "ai-cross-checked", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-cross-checked' that no clinician has verified.", "objectives": ["Give the normal fetal heart rate at screening.", "State when ectopic beats or an irregular rhythm need further assessment.", "Tell transient slowing from persistent bradycardia, and transient speeding from persistent tachycardia.", "Name the rhythm findings that are indications for fetal echocardiography.", "Describe in outline how a specialist works out the mechanism of an arrhythmia."], "sections": [{"heading": "Normal", "blocks": [{"text": "The normal heart rate is 120 to 160 beats per minute, and the rhythm should be regular.", "refs": [1], "table": null}, {"text": "The screener's task is not to name the arrhythmia. It is to recognise the findings that the guideline lists as needing further assessment. The guideline does not give a rule for every pattern in between; see the missing claims for this unit.", "refs": [], "table": null}]}, {"heading": "The irregular beat", "blocks": [{"text": "Ectopic beats, seen as skipped beats, are the most common rhythm disturbance. They are often benign and resolve on their own. In low-risk populations they are not linked to a higher risk of structural heart disease.", "refs": [2], "table": null}, {"text": "Further assessment is indicated when ectopic episodes are frequent, meaning more often than every three to five beats, or when the rhythm stays irregular for more than one to two weeks.", "refs": [3], "table": null}]}, {"heading": "The slow heart", "blocks": [{"text": "Transient bradycardia is seen in normal second-trimester fetuses and is associated with pressure from the transducer.", "refs": [4], "table": null}, {"text": "A rate that stays at 110 beats per minute or below in a fetus that is otherwise well needs timely evaluation by a fetal cardiac specialist. Possible causes include frequent blocked atrial ectopic beats, atrioventricular block and sinus bradycardia.", "refs": [4], "table": null}, {"text": "Recurrent decelerations of the fetal heart rate in the third trimester can reflect fetal hypoxia.", "refs": [5], "table": null}]}, {"heading": "The fast heart", "blocks": [{"text": "A mild, brief rise to 160 to 180 beats per minute can be a normal variant during fetal movement.", "refs": [6], "table": null}, {"text": "A rate that stays at 180 beats per minute or above should be evaluated further for a tachyarrhythmia or fetal hypoxia.", "refs": [6], "table": null}]}, {"heading": "At a glance", "blocks": [{"text": "Rate and rhythm findings and what each means at screening.", "refs": [1, 2, 3, 4, 6], "table": {"columns": ["Finding", "Meaning for the screener"], "rows": [["120 to 160 per minute, regular", "Normal"], ["Occasional skipped beats", "The most common rhythm disturbance; often benign"], ["Skipped beats more often than every three to five beats, or irregular for more than one to two weeks", "Further assessment"], ["Transient slowing, associated with probe pressure, in the second trimester", "Seen in normal fetuses"], ["Stays at 110 per minute or below in a well fetus", "Timely specialist evaluation"], ["Brief rise to 160 to 180 per minute with movement", "Can be a normal variant"], ["Stays at 180 per minute or above", "Further evaluation"]]}}]}, {"heading": "Rhythm findings that are indications for fetal echocardiography", "blocks": [{"text": "The guideline lists these among the fetal indications for fetal echocardiography: persistent tachycardia at 180 beats per minute or more, suspected heart block or persistent bradycardia at 110 or less, and a rhythm that is frequently or persistently irregular.", "refs": [7], "table": null}]}, {"heading": "How the echocardiography guideline words it", "blocks": [{"text": "The echocardiography guideline describes a sustained rate below 120 beats per minute as abnormal at any gestation, and a sustained rate above 160 to 180 as abnormal. The screening guideline sets its thresholds for referral at 110 or less and 180 or more. This unit teaches the screening thresholds.", "refs": [8, 9, 4, 6], "table": null}]}, {"heading": "What the specialist will do", "blocks": [{"text": "Every fetal echocardiogram must document the heart rate and rhythm.", "refs": [10], "table": null}, {"text": "Repeated blocked premature atrial beats can look like second- or third-degree heart block and must be told apart from it.", "refs": [11], "table": null}, {"text": "When the rhythm is irregular, slow or fast, the mechanism should be documented with M-mode, pulsed-wave Doppler or tissue Doppler, alone or together.", "refs": [12], "table": null}, {"text": "M-mode times the atria against the ventricles: the cursor passes through an atrial wall and the free wall of a ventricle together.", "refs": [13], "table": null}, {"text": "Pulsed-wave Doppler does the same by sampling two flows at once: superior vena cava with ascending aorta, mitral inflow with aortic outflow, or pulmonary artery with pulmonary vein.", "refs": [14], "table": null}, {"text": "Knowing what these techniques are helps you explain to the family why they are being referred.", "refs": [], "table": null}]}], "checklist": {"title": "Rate and rhythm at every screen", "items": [{"text": "Rate between 120 and 160 per minute", "refs": [1]}, {"text": "Rhythm regular", "refs": [1]}, {"text": "Rate stays at 110 or below in a well fetus: timely specialist evaluation arranged", "refs": [4]}, {"text": "Persistent rate of 180 or above: further evaluation arranged", "refs": [6]}, {"text": "Ectopic beats more often than every three to five beats: further assessment arranged", "refs": [3]}, {"text": "Rhythm irregular for more than one to two weeks: further assessment arranged", "refs": [3]}]}, "drills": {"items": [{"id": "D8-Q01", "question": "What is the normal fetal heart rate at a screening scan?", "options": ["120 to 160 beats per minute, regular", "100 to 140 beats per minute, regular", "140 to 180 beats per minute, regular", "Any rate above 100, regular or not"], "answer": 0, "explanation": "Normal is 120 to 160 beats per minute with a regular rhythm.", "claims": ["IS23-033"], "status": "expert-verified"}, {"id": "D8-Q02", "question": "You see an occasional skipped beat in an otherwise normal heart in a low-risk pregnancy. What does the guideline say about this finding?", "options": ["It is the most common rhythm disturbance, often benign, and usually resolves on its own", "It indicates structural heart disease until proven otherwise", "It is a sign of fetal hypoxia", "It always needs a fetal echocardiogram the same day"], "answer": 0, "explanation": "Ectopic beats are common, often benign and resolve spontaneously; in low-risk populations they are not associated with increased risk of structural heart disease.", "claims": ["IS23-034"], "status": "expert-verified"}, {"id": "D8-Q03", "question": "Every other beat is an ectopic beat, throughout the scan. What next?", "options": ["Arrange further assessment: ectopic beats this frequent are an indication", "Reassure; all ectopic beats are benign", "Record a normal rhythm", "Repeat the scan only if the mother notices reduced movement"], "answer": 0, "explanation": "Frequent ectopic episodes, more often than every three to five beats, are an indication for further assessment.", "claims": ["IS23-035"], "status": "expert-verified"}, {"id": "D8-Q04", "question": "Ectopic beats were first seen three weeks ago. The rhythm has been irregular at every visit since, including today. What next?", "options": ["Arrange further assessment: the rhythm has stayed irregular for more than one to two weeks", "Review again in another month", "No action; duration does not matter", "Stop checking the rhythm at later scans"], "answer": 0, "explanation": "A rhythm that stays irregular for more than one to two weeks is an indication for further assessment.", "claims": ["IS23-035"], "status": "expert-verified"}, {"id": "D8-Q05", "question": "At a second-trimester scan the heart slows for a few seconds while you press to improve the view, then returns to 140. How does the guideline describe this pattern?", "options": ["Transient bradycardia, associated with transducer pressure, which is seen in normal second-trimester fetuses", "Atrioventricular block", "Persistent bradycardia needing urgent referral", "A sign of a structural heart defect"], "answer": 0, "explanation": "Transient bradycardia associated with transducer pressure is seen in normal second-trimester fetuses. A rate that stays at 110 or below in a well fetus needs timely specialist evaluation.", "claims": ["IS23-036"], "status": "ai-cross-checked"}, {"id": "D8-Q06", "question": "The rate stays at 100 beats per minute for the whole examination. The fetus is otherwise well. What next?", "options": ["Timely evaluation by a fetal cardiac specialist", "Nothing; this is normal", "Recheck at the next routine visit", "Record it as probe-pressure bradycardia"], "answer": 0, "explanation": "Persistent bradycardia at 110 or below in a well fetus needs timely evaluation by a fetal cardiac specialist.", "claims": ["IS23-036"], "status": "ai-cross-checked"}, {"id": "D8-Q07", "question": "Which of these is a possible cause of persistent fetal bradycardia?", "options": ["Frequent blocked atrial ectopic beats", "Fetal movement", "A cardiac axis of 45 degrees", "A thin rim of pericardial fluid"], "answer": 0, "explanation": "Possible causes named in the guideline are frequent blocked atrial ectopic beats, atrioventricular block and sinus bradycardia.", "claims": ["IS23-036"], "status": "ai-cross-checked"}, {"id": "D8-Q08", "question": "During active fetal movement the rate rises to 170 beats per minute for a short time and then returns to 150. How is this read?", "options": ["It can be a normal variant", "Persistent tachycardia; refer", "A tachyarrhythmia", "A sign of fetal hypoxia"], "answer": 0, "explanation": "Mild transient tachycardia of 160 to 180 can be a normal variant during fetal movement.", "claims": ["IS23-037"], "status": "expert-verified"}, {"id": "D8-Q09", "question": "The rate stays at 190 beats per minute. What should be considered?", "options": ["A tachyarrhythmia or fetal hypoxia; evaluate further", "A normal response to movement", "Probe pressure", "Nothing, if the four-chamber view is normal"], "answer": 0, "explanation": "Persistent tachycardia at 180 or more should be evaluated further for tachyarrhythmia or fetal hypoxia.", "claims": ["IS23-037"], "status": "expert-verified"}, {"id": "D8-Q10", "question": "Which rhythm finding is listed as an indication for fetal echocardiography?", "options": ["Persistent bradycardia at 110 beats per minute or less", "A rate of 150 beats per minute", "A single ectopic beat seen once", "Brief slowing with probe pressure"], "answer": 0, "explanation": "Persi
