ardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – IV.A. Rhythm Disturbances and Tools for Assessment, Table 9, p. 698; Figure 17, p. 700. (AS23-084, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – IV.A Rhythm Disturbances and Tools for Assessment, Key Points, p. 699; tools introduced p. 697. (AS23-016, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – Figure 11F, p. 697; IV.A, p. 699. (AS23-017, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – IV.A Rhythm; Figure 11, p. 697. (AS23-018, ai-cross-checked)"]}, {"id": "D9", "title": "The heart at 11 to 14 weeks", "tier": "Detect", "version": 0.2, "summary": "What can and cannot be checked in the fetal heart at the early scan, how to do it safely, and when to refer.", "public": false, "status": "ai-extracted", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-extracted' that no clinician has verified.", "objectives": ["State the place of early cardiac screening in low-risk pregnancies: shown to be effective, but not routine or mandatory.", "Give the minimum cardiac check at the early scan.", "List the components of a detailed early cardiac screen.", "Apply the Doppler safety limits for early pregnancy.", "Say which nuchal translucency measurements lead to cardiac referral."], "sections": [{"heading": "Where early screening stands", "blocks": [{"text": "The screening guideline is written for low-risk pregnancies in the second trimester. It also considers screening in the late first and early second trimester where this is technically feasible.", "refs": [1], "table": null}, {"text": "First-trimester cardiac screening has been shown to be effective in low-risk populations. It is neither routine nor mandatory. Where possible, it can be done at the nuchal translucency scan.", "refs": [2], "table": null}, {"text": "The cardiac screening examination is performed optimally between 18 and 22 weeks.", "refs": [3], "table": null}]}, {"heading": "The minimum", "blocks": [{"text": "The minimum requirements at an early screen are to see the heart within the chest and to confirm a regular rhythm.", "refs": [4], "table": null}, {"text": "Cardiac structures are seen successfully significantly more often after 12 weeks and 3 days.", "refs": [4], "table": null}]}, {"heading": "Equipment", "blocks": [{"text": "High-frequency transabdominal transducers are recommended for early screening; a transvaginal transducer may be used. Colour Doppler, or high-quality power Doppler with bidirectional flow mapping, or both, are used in addition to grey-scale.", "refs": [5], "table": null}, {"text": "The echocardiography guideline notes that frequencies of 5 to 12 MHz may help in the late first and early second trimesters.", "refs": [6], "table": null}]}, {"heading": "Safety", "blocks": [{"text": "In early screening, use Doppler mainly for the four-chamber view and the three-vessel-and-trachea view. Keep the thermal index at 1.0 or less. Keep exposure as short as possible, usually no more than 5 to 10 minutes.", "refs": [7], "table": null}, {"text": "For early fetal echocardiography, which is a different examination, the echocardiography guideline says to keep the thermal and mechanical indices at or below 1.0 and to use Doppler sparingly.", "refs": [8], "table": null}]}, {"heading": "A detailed early cardiac screen", "blocks": [{"text": "When a detailed early screen is done, three components are recommended.", "refs": [9], "table": {"columns": ["Component", "Mode", "What to show"], "rows": [["Situs and cardiac axis", "Grey-scale", "Situs and cardiac axis"], ["Four-chamber view", "Grey-scale, and colour and/or bidirectional power Doppler", "The four-chamber view on both"], ["Three-vessel-and-trachea view", "Colour and/or bidirectional power Doppler", "Aortic and ductal arches, both on the left"]]}}, {"text": "Two practical points for the early four-chamber view with colour: a posterior fetal spine is the preferred position for showing inflow into both ventricles, and the balance between colour and grey-scale is adjusted to favour the flow signal in the small structures.", "refs": [10, 11], "table": null}]}, {"heading": "Limits of the early scan", "blocks": [{"text": "Outflow-tract views are often difficult in early gestation and are prone to both false-negative and false-positive diagnosis.", "refs": [12], "table": null}, {"text": "Suspicion of congenital heart disease at the early scan should lead to referral for early fetal echocardiography.", "refs": [12], "table": null}, {"text": "Some lesions are not discovered until later in pregnancy.", "refs": [13], "table": null}]}, {"heading": "What the echocardiography guideline adds", "blocks": [{"text": "These points come from the guideline on fetal echocardiography, the specialist examination. They are included so the screener knows what happens after an early referral.", "refs": [], "table": null}, {"text": "Suspicion of a cardiac anomaly in the late first trimester should prompt consideration of an early fetal echocardiogram, depending on available expertise and resources. Evidence is insufficient to recommend fetal echocardiography before 16 weeks for low-risk pregnancies.", "refs": [14, 15], "table": null}, {"text": "Early imaging has limits. Assessment of the pulmonary and systemic veins is limited, and limited resolution can hide subtle defects, including valve lesions.", "refs": [16, 17], "table": null}, {"text": "When early findings are uncertain or suspicious, a repeat examination within 1 to 2 weeks is suggested. Even after a normal detailed early examination, a repeat study is recommended at 18 to 20 weeks.", "refs": [18, 19], "table": null}, {"text": "Early counselling and reporting should mention the possibility of missed diagnoses and of lesions that progress later.", "refs": [20], "table": null}]}, {"heading": "Nuchal translucency and the heart", "blocks": [{"text": "A nuchal translucency of 3.5 mm or more at 11 to 14 weeks is an indication for detailed cardiac evaluation. This holds even if the measurement later falls into the normal range.", "refs": [21], "table": null}, {"text": "With a nuchal translucency of 3.0 to 3.4 mm, fetal echocardiography may be considered.", "refs": [22], "table": null}]}], "checklist": {"title": "Early cardiac screen", "items": [{"text": "Minimum: heart within the chest", "refs": [4]}, {"text": "Minimum: rhythm regular", "refs": [4]}, {"text": "If a detailed early screen is done: situs and cardiac axis on grey-scale", "refs": [9]}, {"text": "If a detailed early screen is done: four-chamber view on grey-scale and on colour and/or bidirectional power Doppler", "refs": [9]}, {"text": "If a detailed early screen is done: three-vessel-and-trachea view on colour and/or bidirectional power Doppler, both arches on the left", "refs": [9]}, {"text": "When Doppler is used: thermal index 1.0 or less; exposure kept short", "refs": [7]}, {"text": "Nuchal translucency 3.5 mm or more at 11 to 14 weeks: detailed cardiac evaluation arranged", "refs": [21]}, {"text": "Suspicion of heart disease: referred for early fetal echocardiography", "refs": [12]}]}, "drills": {"items": [{"id": "D9-Q01", "question": "What is the status of first-trimester cardiac screening in low-risk pregnancies?", "options": ["Shown to be effective, but neither routine nor mandatory", "Mandatory at every nuchal translucency scan", "Not possible before 18 weeks", "Shown to be ineffective in low-risk populations"], "answer": 0, "explanation": "Early screening has been shown to be effective in low-risk populations but is neither routine nor mandatory; where possible it can be done at the nuchal translucency scan.", "claims": ["IS23-090"], "status": "ai-cross-checked"}, {"id": "D9-Q02", "question": "What are the minimum cardiac requirements at an early screen?", "options": ["The heart is within the chest and the rhythm is regular", "All five screening planes with colour Doppler", "Both outflow tracts shown crossing", "Pulsed-wave Doppler across all four valves"], "answer": 0, "explanation": "The minimum is seeing the heart within the chest and confirming a regular rhythm.", "claims": ["IS23-091"], "status": "ai-cross-checked"}, {"id": "D9-Q03", "question": "After what gestation is success in seeing cardiac structures significantly higher?", "options": ["After 12 weeks and 3 days", "After 10 weeks", "After 11 weeks exactly", "Gestation makes no difference within the 11 to 14 week window"], "answer": 0, "explanation": "Success in visualising cardiac structures is significantly higher after 12+3 weeks.", "claims": ["IS23-091"], "status": "ai-cross-checked"}, {"id": "D9-Q04", "question": "Which three components make up a detailed early cardiac screen?", "options": ["Situs and axis; four-chamber view; three-vessel-and-trachea view", "Four-chamber view; sagittal aortic arch; ductus venosus", "Both outflow tracts; pulmonary veins; aortic isthmus", "Upper abdomen; LVOT; RVOT"], "answer": 0, "explanation": "Situs and cardiac axis on grey-scale; four-chamber view on grey-scale and on colour and/or bidirectional power Doppler; three-vessel-and-trachea view on colour and/or bidirectional power Doppler.", "claims": ["IS23-094"], "status": "ai-cross-checked"}, {"id": "D9-Q05", "question": "At a detailed early screen, what should the three-vessel-and-trachea view show on colour or bidirectional power Doppler?", "options": ["Aortic and ductal arches, both on the left", "One arch on each side of the trachea", "The pulmonary veins entering the left atrium", "The moderator band"], "answer": 0, "explanation": "The early three-vessel-and-trachea view is used to show left-sided aortic and ductal arches.", "claims": ["IS23-094"], "status": "ai-cross-checked"}, {"id": "D9-Q06", "question": "What is the thermal index limit when Doppler is used at an early cardiac screen?", "options": ["1.0 or less", "1.5 or less", "3.0 or less", "No limit applies to colour Doppler"], "answer": 0, "explanation": "The thermal index should be 1.0 or less, with exposure as short as possible.", "claims": ["IS23-093"], "status": "ai-cross-checked"}, {"id": "D9-Q07", "question": "How long should Doppler exposure usually last at an early cardiac screen?", "options": ["As short as possible, usually no more than 5 to 10 minutes", "As long as is needed to see every structure", "At least 20 minutes for a complete study", "Time is not relevant if the thermal index is below 2.0"], "answer": 0, "explanation": "Exposure should be as short as possible, usually no more than 5 to 10 minutes.", "claims": ["IS23-093"], "status": "ai-cross-checked"}, {"id": "D9-Q08", "question": "At 12 weeks the outflow tracts look possibly abnormal but the view is difficult. What next?", "options": ["Refer for early fetal echocardiography: heart disease is suspected", "Report a definite outflow-tract anomaly", "Report the heart as normal, because early outflow views are unreliable", "Wait until the third trimester"], "answer": 0, "explanation": "Early outflow-tract views are prone to false-positive and false-negative diagnosis; suspicion of congenital heart disease at the early scan should lead to referral for early fetal echocardiography.", "claims": ["IS23-095"], "status": "ai-cross-checked"}, {"id": "D9-Q09", "question": "Nuchal translucency was 3.8 mm at 12 weeks. A later measurement fell within the normal range. Is detailed cardiac evaluation still indicated?", "options": ["Yes: 3.5 mm or more is an indication even if the measurement later becomes normal", "No: the measurement has resolved", "Only if another anomaly is found", "Only if the family requests it"], "answer": 0, "explanation": "A nuchal translucency of 3.5 mm or more at 11 to 14 weeks is an indication for detailed cardiac evaluation even if it later falls within the normal range.", "claims": ["IS23-081"], "status": "ai-cross-checked"}, {"id": "D9-Q10", "question": "At the 11 to 14 week scan nuchal translucency is 3.2 mm. What does the guideline say about fetal echocardiography?", "options": ["It may be considered", "It is not relevant at this measurement", "It is contraindicated before 20 weeks", "It replaces the anomaly scan"], "answer": 0, "explanation": "With a nuchal translucency of 3.0 to 3.4 mm, fetal echocardiography may be considered; 3.5 mm or more is a listed indication.", "claims": ["IS23-084", "IS23-081"], "status": "ai-cross-checked"}, {"id": "D9-Q11", "question": "Which transducers are recommended for early cardiac screening?", "options": ["High-frequency transabdominal transducers; transvaginal may be used", "Low-frequency transducers for better penetration", "Transvaginal transducers only", "Any transducer; frequency does not matter early in pregnancy"], "answer": 0, "explanation": "High-frequency transabdominal transducers are recommended and a transvaginal transducer may be used.", "claims": ["IS23-092"], "status": "ai-cross-checked"}]}, "video": {"title": "An early look at the heart", "minutes": 5, "beats": [{"shot": "Presenter to camera", "narration": "In a low-risk pregnancy, a look at the heart at the early scan can be done where possible. It is not compulsory. The least you confirm is a heart inside the chest, beating regularly."}, { 0, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Fetal echocardiography, p. 797. (IS23-081, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Table 2, 'Other indications when fetal echo may be considered', p. 797. (IS23-084, ai-cross-checked)"]}, {"id": "D10", "title": "Normal variants, artefacts and pitfalls", "tier": "Detect", "version": 0.2, "summary": "Findings that look worrying and are usually not, findings that look harmless and are not, and the artefacts that create a false defect.", "public": false, "status": "ai-extracted", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-extracted' that no clinician has verified.", "objectives": ["Recognise the normal findings that are commonly mistaken for disease.", "Recognise the technical artefact that fakes a septal defect.", "Know which 'variants' are only variants at a certain gestation or for a certain time."], "sections": [{"heading": "How to use this unit", "blocks": [{"text": "Each item below is paired with its limit: the point at which it stops being a variant. A variant without its limit is how abnormal hearts get passed as normal.", "refs": [], "table": null}]}, {"heading": "A rim of fluid around the heart", "blocks": [{"text": "A small amount of pericardial fluid, 2 mm or less thick at end-systole, is common in the second and third trimesters and is normal. A thin dark rim around the heart should not be mistaken for an effusion.", "refs": [1], "table": null}]}, {"heading": "A gap in the septum that is not there", "blocks": [{"text": "With the beam running parallel to the ventricular septum, acoustic drop-out can falsely suggest a defect near the crux. The septum is seen best with the beam perpendicular to it.", "refs": [2], "table": null}, {"text": "Real small defects exist too. Defects of 1 to 2 mm can be very difficult to confirm, particularly when fetal size and position are unfavourable; most are of limited clinical significance and may close before birth.", "refs": [3, 4], "table": null}]}, {"heading": "Ventricles that are not quite equal", "blocks": [{"text": "Mild disproportion between the ventricles can be a normal variant in the third trimester.", "refs": [5], "table": null}, {"text": "The limit: right-left asymmetry in mid-gestation warrants further examination. Important causes are coarctation of the aorta, an evolving hypoplastic left heart and anomalous pulmonary venous return.", "refs": [5], "table": null}]}, {"heading": "Great arteries that are not quite equal", "blocks": [{"text": "The pulmonary artery is usually slightly larger than the ascending aorta in fetal life.", "refs": [6], "table": null}, {"text": "The limit: the great arteries should be approximately equal, and a major discrepancy should lead to further evaluation.", "refs": [7], "table": null}]}, {"heading": "A skipped beat", "blocks": [{"text": "Ectopic beats are the most common rhythm disturbance. They are often benign and resolve on their own, and in low-risk populations they are not associated with a higher risk of structural heart disease.", "refs": [8], "table": null}, {"text": "The limit: episodes more often than every three to five beats, or a rhythm that stays irregular for more than one to two weeks, are an indication for further assessment.", "refs": [9], "table": null}]}, {"heading": "A brief slow or fast rate", "blocks": [{"text": "Transient bradycardia, associated with transducer pressure, is seen in normal second-trimester fetuses. Mild transient tachycardia of 160 to 180 beats per minute can be a normal variant during fetal movement.", "refs": [10, 11], "table": null}, {"text": "The limit: a rate that stays at 110 or below in a well fetus needs timely specialist evaluation, and a rate that stays at 180 or above should be evaluated further.", "refs": [10, 11], "table": null}]}, {"heading": "A bright spot in a ventricle", "blocks": [{"text": "For an echogenic intracardiac focus, the guideline finds insufficient evidence that the risk of congenital heart disease is significantly above baseline.", "refs": [12], "table": null}]}, {"heading": "Two arches that will not sit in one picture", "blocks": [{"text": "The aortic arch lies slightly nearer the head than the ductal arch. Showing both together may need a small adjustment away from a true axial plane; failing to see both in one strict axial cut is not in itself abnormal.", "refs": [13], "table": null}]}, {"heading": "A dark area in front of the great vessels", "blocks": [{"text": "On the upper mediastinal views the thymus appears as a relatively dark area between the great vessels and the front of the chest.", "refs": [14], "table": null}]}, {"heading": "A poor view is not a normal view", "blocks": [{"text": "When the fetal lie is unfavourable, extra examination time or a second examination may be needed.", "refs": [15], "table": null}, {"text": "Cardiac axis and position can still be judged when the four-chamber view itself is not seen well.", "refs": [16], "table": null}]}], "checklist": {"title": "Before calling it abnormal, and before calling it a variant", "items": [{"text": "Fluid rim: 2 mm or less at end-systole is normal", "refs": [1]}, {"text": "Septal gap near the crux: re-examined with the beam perpendicular", "refs": [2]}, {"text": "Ventricular asymmetry: gestation checked (mid-gestation needs further examination)", "refs": [5]}, {"text": "Great arteries: slight difference is usual; major discrepancy needs further evaluation", "refs": [6, 7]}, {"text": "Ectopic beats: frequency and duration checked against the limits", "refs": [9]}, {"text": "Slow or fast rate: transient or persistent", "refs": [10, 11]}]}, "drills": {"items": [{"id": "D10-Q01", "question": "A dark rim 1.5 mm thick is seen around the heart at end-systole at 24 weeks. What is this?", "options": ["A normal small amount of pericardial fluid", "A pericardial effusion needing referral", "A sign of hydrops", "A sign of cardiomegaly"], "answer": 0, "explanation": "Pericardial fluid of 2 mm or less at end-systole is common in the second and third trimesters and is normal.", "claims": ["IS23-027"], "status": "expert-verified"}, {"id": "D10-Q02", "question": "A gap appears in the ventricular septum near the crux in an apical view, with the beam along the septum. What should you do before calling it a defect?", "options": ["Look again with the beam perpendicular to the septum", "Report an atrioventricular septal defect", "Measure the gap and report its size", "Ignore it; septal defects cannot be seen before birth"], "answer": 0, "explanation": "With the beam parallel to the septum, drop-out can falsely suggest a defect near the crux; the septum is best seen with the beam perpendicular.", "claims": ["IS23-045"], "status": "expert-verified"}, {"id": "D10-Q03", "question": "At 34 weeks the right ventricle looks slightly larger than the left. At 20 weeks the same degree of difference is seen in another fetus. How do the two differ?", "options": ["Mild disproportion can be a third-trimester variant; asymmetry in mid-gestation warrants further examination", "Both are normal variants", "Both always indicate coarctation", "The third-trimester finding is the more worrying"], "answer": 0, "explanation": "Mild disproportion can be a normal variant in the third trimester, but right-left asymmetry in mid-gestation warrants further examination.", "claims": ["IS23-043"], "status": "expert-verified"}, {"id": "D10-Q04", "question": "The pulmonary artery looks slightly larger than the aorta. How is this read?", "options": ["Usual in fetal life", "A sign of aortic stenosis", "A sign of transposition", "A reason for further evaluation in every case"], "answer": 0, "explanation": "The pulmonary artery is usually slightly larger than the ascending aorta in fetal life. Only a major discrepancy should lead to further evaluation.", "claims": ["IS23-065", "IS23-051"], "status": "expert-verified"}, {"id": "D10-Q05", "question": "Ectopic beats are occurring after every second normal beat. Is this still within the benign pattern the guideline describes?", "options": ["No: ectopic beats more often than every three to five beats are an indication for further assessment", "Yes: all ectopic beats are benign", "Yes, provided the four-chamber view is normal", "Yes, until the third trimester"], "answer": 0, "explanation": "Frequent ectopic episodes, more than every three to five beats, are an indication for further assessment.", "claims": ["IS23-035"], "status": "expert-verified"}, {"id": "D10-Q06", "question": "What does the guideline say about an echogenic intracardiac focus and the risk of congenital heart disease?", "options": ["Evidence is insufficient that the risk is significantly above baseline", "It doubles the risk", "It is a common indication for fetal echocardiography", "It indicates a cardiac tumour"], "answer": 0, "explanation": "Echogenic intracardiac focus is among the factors for which evidence of risk significantly above baseline is insufficient.", "claims": ["IS23-085"], "status": "ai-cross-checked"}, {"id": "D10-Q07", "question": "The heart rate rises to 170 for a few seconds during vigorous fetal movement, then settles at 145. How is this read?", "options": ["It can be a normal variant", "Persistent tachycardia", "Evidence of fetal hypoxia", "A tachyarrhythmia needing same-day referral"], "answer": 0, "explanation": "Mild transient tachycardia (160 to 180) can be a normal variant during fetal movement; persistent tachycardia at 180 or more needs further evaluation.", "claims": ["IS23-037"], "status": "expert-verified"}, {"id": "D10-Q08", "question": "On the three-vessel-and-trachea view there is a relatively dark area between the great vessels and the front of the chest. What normal structure appears like this?", "options": ["The thymus", "The oesophagus", "The left atrium", "The stomach"], "answer": 0, "explanation": "The thymus appears as a relatively dark area between the great vessels and the front of the chest.", "claims": ["IS23-100"], "status": "ai-cross-checked"}]}, "video": {"title": "Looks abnormal, is not; looks fine, is not", "minutes": 5, "beats": [{"shot": "Four-chamber clip with a thin dark rim", "narration": "A thin dark rim around the heart, two millimetres or less, is normal."}, {"shot": "Two clips: apical view with septal drop-out; lateral view, septum intact", "narration": "A gap near the crux with the beam along the septum may be drop-out. Turn the beam across the septum and look again."}, {"shot": "Two four-chamber clips, mid-gestation and third trimester, labelled", "narration": "Slightly unequal ventricles late in pregnancy can be a variant. Unequal ventricles at mid-gestation need further examination."}, {"shot": "Clip with an occasional ectopic beat, then one with frequent ectopic beats", "narration": "An occasional skipped beat is common and often benign. Frequent ones, or a rhythm still irregular after more than one to two weeks, need assessment."}]}, "missing": ["Echogenic intracardiac focus: appearance, where it lies, and how to tell it from other bright structures - needs a source.", "Other variants and look-alikes not named in the guideline: prominent moderator band, redundant foramen ovale flap, prominent coronary sinus, trivial tricuspid regurgitation, linear insertion of the valves - each needs a source.", "Artefacts beyond septal drop-out: shadowing from ribs and spine, reverberation, colour bleeding - planned with XA4; needs a physics source.", "The editor's own list of pitfalls from 14 years of practice, with example clips from the archive - this would make the unit distinctive."], "references": ["Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Four-chamber view, p. 791. (IS23-027, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Four-chamber view, p. 793. (IS23-045, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Four-chamber view, p. 793. (IS23-046, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Four-chamber view, p. 793. (IS23-099, ai-extracted)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Four-chamber view, p. 793. (IS23-043, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – RVOT view, 3VV and 3VTV, p. 794. (IS23-065, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Outflow-tract, three-vessel and three-vessel-and-trachea views, p. 793. (IS23-051, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Four-chamber view, p. 791. (IS23-034, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Four-chamber view, p. 792. (IS23-035, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Four-chamber view, p. 792. (IS23-036, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Four-chamber view, p. 792. (IS23-037, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Table 2, 'Other considerations', p. 797. (IS23-085, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – RVOT view, 3VV and 3VTV, p. 796. (IS23-070, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Figures 7 and 9, pp. 795-796. (IS23-100, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Outflow tracts: Sonographic technique, p. 793. (IS23-056, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Four-chamber view, p. 791. (IS23-029, expert-verified)"]}, {"id": "D11", "title": "When and how to refer", "tier": "Detect", "version": 0.2, "summary": "Which findings and risk factors are indications for a fetal echocardiogram, how the guideline grades the others, and who should do it.", "public": false, "status": "ai-extracted", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-extracted' that no clinician has verified.", "objectives": ["Apply the basic rule: a fetus with a suspected abnormality on screening is a candidate for fetal echocardiography.", "List the fetal findings that are indications for fetal echocardiography.", "List the maternal and family factors that are indications.", "Tell apart factors where echocardiography may be considered and factors with insufficient evidence.", "Say who should perform the fetal echocardiogram and what counselling should take into account."], "sections": [{"heading": "The basic rule", "blocks": [{"text": "A fetus with a known or suspected abnormality on cardiac screening is a candidate for fetal echocardiography.", "refs": [1], "table": null}, {"text": "The echocardiography guideline says the same from its side: fetal echocardiography is indicated when the screening ultrasound of the heart is abnormal, whether or not there are other risk factors.", "refs": [2], "table": null}, {"text": "A low threshold for referral is one of the measures that can improve a screening programme.", "refs": [3], "table": null}, {"text": "You do not need to name the lesion: suspicion on an adequate view is enough. A view that could not be obtained is a different situation. With an unfavourable fetal lie, extra examination time or a second examination may be needed.", "refs": [1, 4], "table": null}]}, {"heading": "Risk factors add to screening; they do not replace it", "blocks": [{"text": "When there is a significant risk factor for congenital heart disease, fetal echocardiography is indicated in addition to routine screening, depending on local resources, the setting, the availability of examiners and the screening results.", "refs": [5], "table": null}, {"text": "A high proportion of detectable heart disease occurs in pregnancies with no risk factor and no extracardiac anomaly. This is why quality screening and timely referral matter.", "refs": [6], "table": null}]}, {"heading": "Fetal indications", "blocks": [{"text": "The guideline lists these fetal factors as common indications for fetal echocardiography.", "refs": [7, 8], "table": {"columns": ["Fetal factor", "Detail"], "rows": [["Suspected structural anomaly of the heart", ""], ["Extracardiac structural anomaly", "With a known association with congenital heart disease"], ["Suspected abnormal function or a large heart", ""], ["Hydrops", ""], ["Persistent tachycardia", "180 beats per minute or more"], ["Suspected heart block", ""], ["Persistent bradycardia", "110 beats per minute or less"], ["Irregular rhythm", "Frequent or persistent"], ["Increased nuchal translucency", "3.5 mm or more at 11 to 14 weeks"], ["Genetic abnormality", "Confirmed or suspected"], ["Monochorionic twins", "If resources allow"]]}}, {"text": "A nuchal translucency of 3.5 mm or more at 11 to 14 weeks remains an indication even if the measurement later becomes normal.", "refs": [8], "table": null}]}, {"heading": "Findings on the screen that should not be passed", "blocks": [{"text": "Right-left asymmetry of the ventricles in mid-gestation warrants further examination. Important causes are coarctation of the aorta, an evolving hypoplastic left heart and anomalous pulmonary venous return.", "refs": [9], "table": null}, {"text": "A major difference in size between the two great arteries should lead to further evaluation.", "refs": [10], "table": null}, {"text": "An abnormal cardiac axis raises the risk of a cardiac malformation, especially of the outflow tracts, and may be associated with a chromosomal anomaly.", "refs": [11], "table": null}, {"text": "If the heart or the stomach is not on the left, suspect a situs abnormality.", "refs": [12], "table": null}]}, {"heading": "Maternal and family indications", "blocks": [{"text": "The guideline lists these maternal, family and exposure factors as common indications.", "refs": [13], "table": {"columns": ["Factor", "Detail"], "rows": [["Congenital heart disease in a first-degree relative of the fetus", "Parents, siblings and half-siblings"], ["Mendelian disease with childhood cardiac manifestations", "In a first- or second-degree relative"], ["Pregestational diabetes", "Whatever the HbA1c"], ["Anti-Ro/SSA antibodies", ""], ["Phenylketonuria", "Unknown status, or periconceptional phenylalanine above 10 mg/dL"], ["Retinoid exposure", ""], ["Confirmed fetal infection", "TORCH or parvovirus B19"]]}}]}, {"heading": "May be considered", "blocks": [{"text": "For some factors the guideline says fetal echocardiography may be considered.", "refs": [14], "table": {"columns": ["Factor", "Detail"], "rows": [["Congenital heart disease in a second-degree relative", ""], ["Gestational diabetes", "Diagnosed in the first or early second trimester"], ["Nuchal translucency", "3.0 to 3.4 mm"], ["Selected teratogens", "For example paroxetine, carbamazepine, lithium, sodium valproate"], ["Conception by IVF", "Including ICSI"], ["ACE inhibitor use", ""]]}}]}, {"heading": "Not enough evidence of raised risk", "blocks": [{"text": "For each of these factors, taken on its own, the guideline finds insufficient evidence that the risk of congenital heart disease is significantly above baseline.", "refs": [15], "table": {"columns": ["Factor", "Detail"], "rows": [["Obesity", "BMI 35 kg/m2 or more"], ["SSRI exposure", "Other than paroxetine"], ["Non-cardiac soft markers", "For aneuploidy"], ["Abnormal serum analytes", ""], ["Single umbilical artery", "Isolated"], ["Gestational diabetes", "Diagnosed after the second trimester"], ["Warfarin or alcohol exposure", ""], ["Echogenic intracardiac focus", ""], ["Prenatal fever, or viral infection with seroconversion only", ""], ["Congenital heart disease in a distant relative", "Isolated; more distant than second degree"]]}}, {"text": "This is a statement about the factor alone. A suspected abnormality on the screen makes the fetus a candidate for fetal echocardiography whatever the history, and a significant risk factor that is also present still counts.", "refs": [1, 5], "table": null}, {"text": "These pregnancies have the same routine cardiac screen as every other: situs, four-chamber view, outflow tracts and great-vessel views.", "refs": [16], "table": null}]}, {"heading": "How the echocardiography guideline compares", "blocks": [{"text": "The American echocardiography guideline has its own table of indications. Most entries agree with the screening guideline. The points below are where its wording adds something.", "refs": [], "table": null}, {"text": "It lists as indications: pregestational diabetes, maternal SSA/SSB antibodies, congenital heart disease in a first-degree relative, hydrops, an extracardiac anomaly, monochorionic twins, and a nuchal translucency of 3.5 mm or more.", "refs": [17, 18, 19, 20, 21, 22, 23], "table": null}, {"text": "After IVF, or with a nuchal translucency of 3.0 to 3.4 mm, it says fetal echocardiography may be considered, and that after a normal cardiac screen the decision should take the accuracy of local screening into account.", "refs": [24, 25], "table": null}, {"text": "An isolated single umbilical artery does not by itself indicate fetal echocardiography when the second-trimester cardiac screen is normal.", "refs": [26], "table": null}]}, {"heading": "Who does the echocardiogram, and what families need", "blocks": [{"text": "Fetal echocardiography is best performed by a trained specialist who is familiar with prenatal diagnosis and with the course, management and prognosis after birth.", "refs": [27], "table": null}, {"text": "Counselling after a heart problem is detected should take into account the high prevalence of psychological distress in the mother.", "refs": [27], "table": null}, {"text": "Findings on the three-vessel views can change what happens next: testing for 22q11 microdeletion, the planned place of delivery as in complete transposition, readiness to give prostaglandin, or readiness for airway problems from vascular compression.", "refs": [28], "table": null}]}], "checklist": {"title": "Before you close the report: common reasons to refer (not a complete list)", "items": [{"text": "Suspected cardiac abnormality on any plane. (A view that could not be obtained is an incomplete scan: more time or a second examination.)", "refs": [1, 4]}, {"text": "Rate stays at 110 or below, or at 180 or above; suspected heart block; frequent or persistently irregular rhythm", "refs": [7]}, {"text": "Ventricles asymmetric in mid-gestation: further examination. Major difference in size between the great arteries: further evaluation", "refs": [9, 10]}, {"text": "Heart or stomach not on the left: suspect a situs abnormality. Abnormal axis: raised risk of a cardiac malformation", "refs": [12, 11]}, {"text": "Extracardiac structural anomaly known to go with heart disease; hydrops; confirmed or suspected genetic abnormality; monochorionic twins if resources allow", "refs": [7]}, {"text": "Nuchal translucency was 3.5 mm or more at 11 to 14 weeks, even if it later became normal", "refs": [8]}, {"text": "Maternal or family indication: check the full table in this unit (examples: congenital heart disease in a parent, sibling or half-sibling; pregestational diabetes; anti-Ro/SSA antibodies)", "refs": [13]}]}, "drills": {"items": [{"id": "D11-Q01", "question": "On a technically adequate view, the anatomy in one plane looks abnormal, but you cannot say what the lesion is. What next?", "options": ["The fetus is a candidate for fetal echocardiography: a suspected abnormality is enough", "Wait until you can name the lesion", "Report the heart as normal if the four-chamber view is normal", "Repeat the scan after delivery"], "answer": 0, "explanation": "Fetuses with a known or suspected abnormality on cardiac screening are candidates for fetal echocardiography.", "claims": ["IS23-078"], "status": "expert-verified"}, {"id": "D11-Q02", "question": "The mother has pregestational diabetes with a good HbA1c. How does the guideline list this?", "options": ["As an indication for fetal echocardiography, whatever the HbA1c", "As an indication only if the HbA1c is raised", "Among factors with insufficient evidence of raised risk", "Among factors where echocardiography may be considered"], "answer": 0, "explanation": "Pregestational diabetes is listed as an indication regardless of HbA1c.", "claims": ["IS23-083"], "status": "ai-cross-checked"}, {"id": "D11-Q03", "question": "Gestational diabetes was diagnosed in the third trimester. How does the guideline class this factor?", "options": ["Insufficient evidence that risk is significantly above baseline", "A common indication, like all diabetes", "A factor where echocardiography may be considered", "Not mentioned in the guideline"], "answer": 0, "explanation": "Gestational diabetes diagnosed after the second trimester is among the factors with insufficient evidence of raised risk. Pregestational diabetes is different.", "claims": ["IS23-085", "IS23-083"], "status": "ai-cross-checked"}, {"id": "D11-Q04", "question": "An isolated echogenic intracardiac focus is seen and the heart is otherwise normal on screening. What does the guideline say about risk?", "options": ["Evidence is insufficient that risk of heart disease is significantly above baseline", "It is a common indication for fetal echocardiography", "It indicates a ventricular septal defect", "It indicates an arrhythmia"], "answer": 0, "explanation": "Echogenic intracardiac focus is listed among factors with insufficient evidence of risk significantly above baseline.", "claims": ["IS23-085"], "status": "ai-cross-checked"}, {"id": "D11-Q05", "question": "The fetus's older sibling had surgery for congenital heart disease. How does the guideline list this?", "options": ["As an indication: congenital heart disease in a first-degree relative of the fetus", "Not listed: only parents count as first-degree relatives", "Among factors where echocardiography may be considered", "Among factors with insufficient evidence of raised risk"], "answer": 0, "explanation": "Congenital heart disease in a first-degree relative of the fetus (parents, siblings and half-siblings) is a listed indication. A second-degree relative falls under 'may be considered'.", "claims": ["IS23-083", "IS23-084"], "status": "ai-cross-checked"}, {"id": "D11-Q06", "question": "The pregnancy was conceived by IVF with ICSI. What does the guideline say?", "options": ["Fetal echocardiography may be considered", "Fetal echocardiography is a firm indication", "Evidence is insufficient that risk is raised", "The routine cardiac screen can be omitted"], "answer": 0, "explanation": "Conception by IVF, including ICSI, is in the group where fetal echocardiography may be considered.", "claims": ["IS23-084"], "status": "ai-cross-checked"}, {"id": "D11-Q07", "question": "Which of these is a listed fetal indication for fetal echocardiography?", "options": ["Hydrops", "Isolated single umbilical artery", "A non-cardiac soft marker", "Abnormal serum analytes"], "answer": 0, "explanation": "Hydrops is a listed fetal indication. The other three are among factors with insufficient evidence of raised risk.", "claims": ["IS23-082", "IS23-085"], "status": "ai-cross-checked"}, {"id": "D11-Q08", "question": "The mother takes paroxetine. Another mother takes a different SSRI. How does the guideline treat them?", "options": ["Paroxetine: echocardiography may be considered. Other SSRIs: insufficient evidence of raised risk", "Both are firm indications", "Neither is mentioned", "Other SSRIs are an indication; paroxetine is not"], "answer": 0, "explanation": "Paroxetine is named among selected teratogens where echocardiography may be considered. SSRI exposure other than paroxetine is in the insufficient-evidence group.", "claims": ["IS23-084", "IS23-085"], "status": "ai-cross-checked"}, {"id": "D11-Q09", "question": "The mother is known to have anti-Ro/SSA antibodies. How does the guideline list this?", "options": ["As an indication for fetal echocardiography", "As an indication only once the fetal heart rate is slow", "Among factors with insufficient evidence of raised risk", "It is not mentioned"], "answer": 0, "explanation": "Anti-Ro/SSA antibodies are among the listed maternal indications.", "claims": ["IS23-083"], "status": "ai-cross-checked"}, {"id": "D11-Q10", "question": "At 20 weeks the left ventricle is clearly smaller than the right. What is the correct reading?", "options": ["It warrants further examination; causes include coarctation and an evolving hypoplastic left heart", "A normal variant at this gestation", "Normal if the heart rate is regular", "Recheck only in the third trimester"], "answer": 0, "explanation": "Mild disproportion can be a variant in the third trimester, but right-left asymmetry in mid-gestation warrants further examination.", "claims": ["IS23-043"], "status": "expert-verified"}, {"id": "D11-Q11", "question": "Who is best placed to perform the fetal echocardiogram?", "options": ["A trained specialist familiar with prenatal diagnosis and with postnatal course, management and prognosis", "Any sonologist with a machine that has colour Doppler", "A general paediatrician after delivery", "Whoever made the referral, with or without specialist training"], "answer": 0, "explanation": "Fetal echocardiography is best performed by a trained specialist familiar with prenatal diagnosis, postnatal course, postnatal management and prognosis.", "claims": ["IS23-086"], "status": "ai-cross-checked"}, {"id": "D11-Q12", "question": "Which observation explains why quality routine screening of every pregnancy matters?", "options": ["A high proportion of prenatally detectable heart disease occurs in pregnancies with no risk factor", "Risk factors are rarely recorded correctly", "Fetal echocardiography is unreliable when a risk factor is present", "Heart disease cannot be detected before birth unless a risk factor is present"], "answer": 0, "explanation": "A high proportion of prenatally detectable heart disease occurs in pregnancies with no risk factor or extracardiac anomaly, so quality screening and timely referral matter.", "claims": ["IS23-080"], "status": "expert-verified"}]}, "video": {"title": "Refer or not?", "minutes": 5, "beats": [{"shot": "Presenter to camera", "narration": "You do not need a diagnosis to refer. A suspicion is enough."}, {"shot": "Graphic: list of fetal indications appearing one by one", "narration": "Examples from the scan: a suspected structural heart anomaly; an anomaly outside the heart that is known to go with heart disease; suspected poor function or a large heart; hydrops; a rate that stays at one-ten or below, or at one-eighty or above; a frequent or persistently irregular rhythm; a nuchal translucency of three and a half millimetres or more."}, {"shot": "Graphic: list of maternal and family indications", "narration": "Examples from the history: congenital heart disease in a parent, sibling or half-sibling of this fetus; diabetes before pregnancy; anti-Ro antibodies. The full list is in the unit."}, {"shot": "Graphic: 'not enough evidence' list", "narration": "Some factors, taken alone, lack enough evidence of a clearly raised risk: an isolated bright spot in the heart, a single umbilical artery on its own, soft markers for aneuploidy outside the heart. A suspicious screen still counts, whatever the history."}, {"shot": "Presenter", "narration": "A high proportion of detectable heart disease is in pregnancies with no risk factor. Quality screening of every pregnancy, and timely referral, are what matter."}]}, "missing": ["What a referral letter should contain (views obtained, what failed, gestation, stored clips) - needs a source or the editor's template.", "How urgently each kind of finding should be seen - not in the screening guideline; needs a source and the editor's decision.", "Indian referral pathways, and timing in relation to the legal limits for termination of pregnancy - needs an Indian source and the editor's input.", "What to tell the parents at the moment of referral - unit D12."], "references": ["Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Fetal echocardiography, p. 796. (IS23-078, expert-verified)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – II. Indications, Table 1 footnote, p. 681; Key Points, p. 682. (AS23-023, ai-extracted)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Introduction, p. 788. (IS23-006, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Outflow tracts: Sonographic technique, p. 793. (IS23-056, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guideli MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – II. Indications, Table 1, ASE column, p. 681. (AS23-026, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – II. Indications, Table 1, ASE column, p. 681. (AS23-028, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – II. Indications, Table 1, ASE column, p. 681. (AS23-029, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – II. Indications, Table 1, ASE column, p. 681. (AS23-030, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – II. Indications, Table 1, ASE column, p. 681. (AS23-032, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – II. Indications, Table 1, ASE column and referral footnote, p. 681. (AS23-027, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – II. Indications, Table 1, ASE column and referral footnote, p. 681. (AS23-031, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – II. Indications, Table 1, ASE column and table footnote, p. 681. (AS23-033, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Fetal echocardiography, p. 797. (IS23-086, ai-cross-checked)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – RVOT view, 3VV and 3VTV, p. 796. (IS23-072, ai-cross-checked)"]}, {"id": "D13", "title": "Quality assurance and audit", "tier": "Detect", "version": 0.1, "summary": "What makes a screening examination good enough, what to store, how to audit your own work, and a one-page checklist.", "public": false, "status": "ai-cross-checked", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-cross-checked' that no clinician has verified.", "objectives": ["Name the four things by which the quality of a screening examination is judged.", "Say what should be stored from every cardiac screen, and why.", "Set up a simple audit of your own images and detection.", "Use a checklist for the five planes on every patient."], "sections": [{"heading": "What quality means", "blocks": [{"text": "The quality of a screening examination is judged on four things: image quality, acquisition of the standard planes, appropriate interpretation of the views, and complete documentation.", "refs": [1], "table": null}, {"text": "The 2023 guideline added sections on quality assurance and on the use of a checklist.", "refs": [2], "table": null}]}, {"heading": "Why it matters", "blocks": [{"text": "In one retrospective study of missed diagnoses, failure to meet technical criteria contributed to about half of the misses. Failure to recognise abnormal anatomy on an adequate view accounted for nearly a third more.", "refs": [3], "table": null}]}, {"heading": "Image quality starts with set-up", "blocks": [{"text": "Use settings that favour a high frame rate with more contrast and high resolution: low persistence, a single focal zone and a fairly narrow image field. Cardiac presets usually include these.", "refs": [4], "table": null}, {"text": "Magnify until the heart fills at least a third to a half of the screen.", "refs": [5], "table": null}]}, {"heading": "What to store", "blocks": [{"text": "Still frames and video clips of the recommended structures and views should be archived, so that the examination can be reviewed later for adequacy. Identify the patient appropriately in the clinical record, label laterality and orientation where appropriate, and take local or national archiving standards into account.", "refs": [6], "table": null}, {"text": "The views of the right ventricular outflow tract, the branch pulmonary arteries and the two arches form a continuum. They are likely to be judged more reliably live or on a clip than from still images alone.", "refs": [7], "table": null}, {"text": "For a full fetal echocardiogram, the echocardiography guideline asks for stills, moving clips and a structured report. It requires a sweep from the stomach to the upper mediastinum, and two-dimensional and colour clips of the individual views, including the three-vessel view and the three-vessel-and-trachea view.", "refs": [8], "table": null}, {"text": "The same guideline says images should be kept in a secure digital archive that allows retrieval for review, that local legal requirements decide how long they are kept, and that a study which stays non-diagnostic after optimisation should have its limitations stated in the report.", "refs": [9, 10, 11], "table": null}]}, {"heading": "Auditing yourself", "blocks": [{"text": "Audit of stored stills or clips against quality criteria set in advance is encouraged.", "refs": [12], "table": null}, {"text": "Each practice is encouraged to review its own detection rates and diagnostic accuracy every year, and to arrange further training where the review shows a need.", "refs": [12], "table": null}, {"text": "Continuous training based on feedback, standardised protocols, a low threshold for referral and easy access to fetal heart specialists can all improve a programme. For fetal echocardiography services, ongoing quality improvement should be documented.", "refs": [13, 14], "table": null}, {"text": "How a practice samples its studies and scores them is a local decision. The guideline gives no method, and none is taught here; see the missing claims for this unit.", "refs": [], "table": null}]}, {"heading": "The checklist", "blocks": [{"text": "The checklist below gathers the main criteria for the five planes, for learning and for audit. It is a selection. Completing it does not by itself establish a complete normal examination.", "refs": [], "table": null}]}], "checklist": {"title": "Five-plane screening checklist (main criteria)", "items": [{"text": "Fetal left and right worked out first", "refs": [15]}, {"text": "Upper abdomen at the abdominal circumference level: stomach on the left; descending aorta left of the spine; inferior vena cava right of the spine", "refs": [16]}, {"text": "Heart mainly in the left chest; usually no larger than a third of the chest area", "refs": [17, 18]}, {"text": "Axis about 45 degrees to the left (plus or minus 20) of the front-to-back axis of the chest", "refs": [18]}, {"text": "Rate 120 to 160 per minute, regular", "refs": [19]}, {"text": "Atria similar in size; foramen ovale flap moving within the left atrium; septum primum present", "refs": [20]}, {"text": "At least one pulmonary vein seen entering the left atrium on grey-scale, where technically feasible", "refs": [21]}, {"text": "Ventricles similar in size, walls not thick; moderator band near the apex marks the right ventricle. Asymmetry in mid-gestation needs further examination; mild disproportion can be a third-trimester variant", "refs": [22, 23]}, {"text": "Ventricular septum examined from apex to crux, with the adequacy of the view recorded", "refs": [24, 25]}, {"text": "Two atrioventricular valves opening separately and freely; septal leaflet of the tricuspid valve inserted nearer the apex", "refs": [26]}, {"text": "LVOT: vessel from the left ventricle, anterior wall continuous with the septum, not dividing; valve not thickened, moving freely", "refs": [27, 28, 29]}, {"text": "RVOT: vessel from the right ventricle, dividing after a short course; valve not thickened, moving freely", "refs": [27, 30]}, {"text": "Great arteries cross and are approximately equal in size", "refs": [31, 27]}, {"text": "Three-vessel view: number, size, alignment and arrangement of the three vessels", "refs": [32]}, {"text": "Three-vessel-and-trachea view: V shape, both arches left of the trachea, arches similar in size", "refs": [33, 34]}, {"text": "Stills and clips of the recommended views stored; laterality and orientation labelled where appropriate", "refs": [6]}]}, "drills": {"items": [{"id": "D13-Q01", "question": "By which four things is the quality of a cardiac screening examination judged?", "options": ["Image quality, acquisition of the standard planes, interpretation of the views, and documentation", "Scan duration, machine model, transducer type and gestational age", "Number of images, colour Doppler use, 3D use and report length", "Patient satisfaction, waiting time, cost and report turnaround"], "answer": 0, "explanation": "Quality assessment covers image quality, acquisition of the standard planes, appropriate interpretation and complete documentation.", "claims": ["IS23-087"], "status": "ai-cross-checked"}, {"id": "D13-Q02", "question": "Why should stills and clips of the cardiac views be archived?", "options": ["So the examination can be reviewed later for adequacy", "Only to give copies to the family", "Because clips replace the written report", "There is no recommendation to store them"], "answer": 0, "explanation": "Still frames and clips of the recommended views should be archived so the examination can later be reviewed for adequacy.", "claims": ["IS23-017"], "status": "ai-cross-checked"}, {"id": "D13-Q03", "question": "What should be labelled on stored images where appropriate?", "options": ["Laterality and orientation", "The examiner's opinion of the family history", "The thermal index only", "Nothing; labels reduce image quality"], "answer": 0, "explanation": "Stored images should carry labelling of laterality and orientation where appropriate.", "claims": ["IS23-017"], "status": "ai-cross-checked"}, {"id": "D13-Q04", "question": "For the right ventricular outflow tract and arch views, which is likely to be the more reliable basis for assessment?", "options": ["A cine clip", "A single still frame of each", "A written description alone", "A measurement of each vessel"], "answer": 0, "explanation": "These views form a continuum that varies with probe orientation and fetal lie; assessment is likely to be more reliable live or on cine-loop than from stills alone.", "claims": ["IS23-063"], "status": "ai-cross-checked"}, {"id": "D13-Q05", "question": "How often is a practice encouraged to review its detection rates and diagnostic accuracy?", "options": ["Every year", "Every ten years", "Only when a diagnosis is missed", "Never; this is the job of the referral centre"], "answer": 0, "explanation": "Annual review of local detection rates and accuracy is encouraged.", "claims": ["IS23-089"], "status": "ai-cross-checked"}, {"id": "D13-Q06", "question": "What is audit of stored images measured against?", "options": ["Quality criteria set in advance", "The examiner's memory of the scan", "The length of the examination", "The number of images stored"], "answer": 0, "explanation": "Audit against predetermined quality criteria for still images or clips is encouraged.", "claims": ["IS23-089"], "status": "ai-cross-checked"}, {"id": "D13-Q07", "question": "Your annual review shows that outflow-tract views were often not stored or not adequate. What does the guideline encourage?", "options": ["Further training targeted at the gap", "Dropping outflow-tract views from the protocol", "No action unless a baby was harmed", "Replacing the machine"], "answer": 0, "explanation": "Practices are encouraged to review their results and provide further training as needed; outflow-tract views are an integral part of the screen.", "claims": ["IS23-089", "IS23-048"], "status": "ai-cross-checked"}, {"id": "D13-Q08", "question": "How large should the heart appear on the screen for a good-quality image?", "options": ["At least a third to a half of the screen", "About a tenth of the screen", "Size on screen does not matter", "The whole fetus should be in view with the heart"], "answer": 0, "explanation": "The image should be magnified until the heart fills at least one third to one half of the screen.", "claims": ["IS23-015"], "status": "expert-verified"}, {"id": "D13-Q09", "question": "Which settings does the guideline recommend for the cardiac image?", "options": ["High frame rate, low persistence, a single focal zone and a narrow image field", "Low frame rate, high persistence and a wide image field", "Multiple focal zones and maximum depth", "Maximum depth with the whole fetus in view"], "answer": 0, "explanation": "Settings should emphasise high frame rate, contrast and resolution, with low persistence, a single focal zone and a relatively narrow field; cardiac presets usually include these.", "claims": ["IS23-014"], "status": "expert-verified"}, {"id": "D13-Q10", "question": "What did the 2023 screening guideline add?", "options": ["Sections on quality assurance and on use of a checklist", "A requirement for 3D imaging in every screen", "Removal of the outflow-tract views", "A requirement for pulsed-wave Doppler in every screen"], "answer": 0, "explanation": "The 2023 update encourages colour flow Doppler and adds sections on quality assurance and on use of a checklist.", "claims": ["IS23-002"], "status": "ai-cross-checked"}]}, "video": {"title": "Audit your own hearts", "minutes": 4, "beats": [{"shot": "Presenter to camera", "narration": "A good screen has four parts. Good images. All the planes. The right reading. And a complete record."}, {"shot": "Screen recording: storing a clip of each plane", "narration": "Store stills and clips of the recommended views. The outflow and arch views especially are likely to be judged better moving than still."}, {"shot": "Desk shot: reviewing stored studies against a printed checklist", "narration": "Auditing your stored images against criteria set in advance is encouraged."}, {"shot": "Presenter", "narration": "Once a year, review your detection rates and your diagnostic accuracy. Where there is a gap, train for it."}]}, "missing": ["A scoring system for image quality of each cardiac plane (published criteria with points) - needs a source.", "A target or benchmark detection rate to audit against - needs a source; none is stated in the guideline claims held.", "How long images must be kept and
