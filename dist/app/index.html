 "sections": [{"heading": "Why counselling matters", "blocks": [{"text": "Referral for fetal echocardiography is associated with increased maternal anxiety, which rises further when heart disease is found. Distress is greater after a prenatal diagnosis than after a postnatal one.", "refs": [1], "table": null}]}, {"heading": "What counselling must cover", "blocks": [{"text": "The limits of the examination, such as maternal habitus, fetal position and gestational age.", "refs": [2], "table": null}, {"text": "Natural history, prognosis and genetic associations - and helping to relieve parental guilt.", "refs": [3], "table": null}, {"text": "Long-term outcome: information should be current, and what is not known should be stated with its caveats.", "refs": [4], "table": null}, {"text": "Genetic results can inform recurrence risk and decisions on termination or palliative care. Before microarray testing, disclose that it may find variants of unknown significance.", "refs": [5, 6], "table": null}, {"text": "The option of termination should be discussed, including the time limits set by the law that applies.", "refs": [7], "table": null}]}, {"heading": "Staying neutral", "blocks": [{"text": "Counsellors should avoid personal bias and support whatever decision the parents make.", "refs": [8], "table": null}]}, {"heading": "Counselling about fetal procedures", "blocks": [{"text": "Families considering fetal aortic valvuloplasty should receive extensive counselling on the risks to mother and fetus and the expected course compared with standard care, including the lack of long-term outcome data. Technical success of a fetal procedure does not always mean clinical success after birth.", "refs": [9, 10], "table": null}]}], "checklist": {"title": "Counselling: essentials", "items": [{"text": "Limits of the examination explained", "refs": [2]}, {"text": "Natural history, prognosis and genetic associations covered; guilt addressed", "refs": [3]}, {"text": "Outcome information current; uncertainty stated", "refs": [4]}, {"text": "All options discussed, including termination within the legal limits", "refs": [7]}, {"text": "No personal bias; the parents' decision supported", "refs": [8]}]}, "drills": {"items": [{"id": "Z1-Q01", "question": "What does the evidence say about maternal anxiety around fetal echocardiography?", "options": ["Referral raises anxiety, and diagnosis raises it further", "Referral lowers anxiety", "Anxiety is the same after prenatal and postnatal diagnosis", "Diagnosis has no effect on anxiety"], "answer": 0, "explanation": "Referral is associated with increased anxiety, which rises further with a diagnosis; distress is greater after prenatal than postnatal diagnosis.", "claims": ["AH14-130"], "status": "ai-cross-checked"}, {"id": "Z1-Q02", "question": "The image quality was poor because of maternal habitus. Should this be mentioned in counselling?", "options": ["Yes: the limits of the examination should be discussed", "No: it will only worry the parents", "Only if the parents ask", "Only in the written report"], "answer": 0, "explanation": "Counselling should discuss the limits of the examination, such as maternal habitus, fetal position and gestational age.", "claims": ["AH14-123"], "status": "ai-cross-checked"}, {"id": "Z1-Q03", "question": "A mother asks whether something she did caused the defect. Which element of counselling applies?", "options": ["Helping to relieve parental guilt, alongside natural history and genetic associations", "Avoid the question", "Refer her to another clinic", "Tell her the cause is unknowable and move on"], "answer": 0, "explanation": "Counselling should cover natural history, prognosis and genetic associations, and help relieve parental guilt.", "claims": ["AH14-124"], "status": "ai-cross-checked"}, {"id": "Z1-Q04", "question": "Long-term outcome data for the lesion are limited. What should counselling do?", "options": ["Give current information and state what is not known, with caveats", "Give the best-case outcome only", "Avoid discussing the long term", "Quote outcomes from decades ago without comment"], "answer": 0, "explanation": "Outcome information should be current, and the unknown stated with caveats.", "claims": ["AH14-125"], "status": "ai-cross-checked"}, {"id": "Z1-Q05", "question": "The counsellor would personally choose to continue the pregnancy. How should this affect the counselling?", "options": ["It should not: avoid personal bias and support the parents' decision", "Share the personal view to help them decide", "Encourage the parents towards that choice", "Withhold information on termination"], "answer": 0, "explanation": "Counsellors should avoid personal bias and support whatever decision the parents make.", "claims": ["AH14-129"], "status": "ai-cross-checked"}, {"id": "Z1-Q06", "question": "Should the option of termination be discussed?", "options": ["Yes, including the time limits set by the applicable law", "Never", "Only if the parents raise it", "Only for lethal lesions"], "answer": 0, "explanation": "The option of termination should be discussed, including the legal time limits.", "claims": ["AH14-128"], "status": "ai-cross-checked"}]}, "video": null, "missing": ["Awaiting re-check after rewording on 21 Nov (round 5, task J): the aims of counselling and the care team (AH14-121); timing - offered soon after the scan, ideally the same day (AH14-122); evidence on counselling techniques (AH14-126); checking understanding, avoiding overload, several sessions (AH14-127); visual aids and online information (AH14-331, new); evaluating on fetal echocardiography before discussing prognosis (AS23-305).", "Indian law on termination of pregnancy (MTP Act and its amendments), the gestational limits, and the role of medical boards - needs an Indian legal source (tasks/results/task-s1.md, topic 15) and the legal advisor. The course must state the limits exactly as the law does.", "PC-PNDT obligations during counselling - needs an Indian l he American Heart Association. Circulation. 2014 129(21):2183-2242. doi:10.1161/01.cir.0000437597.44550.5d – Extracardiac Assessment of the Fetus With CHD, p. 2207. (AH14-104, ai-cross-checked)", "Donofrio MT, Moon-Grady AJ, Hornberger LK, Copel JA, Sklansky MS, Abuhamad A, et al.. Diagnosis and Treatment of Fetal Cardiac Disease: A Scientific Statement From the American Heart Association. Circulation. 2014 129(21):2183-2242. doi:10.1161/01.cir.0000437597.44550.5d – Extracardiac Assessment of the Fetus With CHD, Available Genetic Testing, pp. 2206-2207. (AH14-105, ai-cross-checked)", "Donofrio MT, Moon-Grady AJ, Hornberger LK, Copel JA, Sklansky MS, Abuhamad A, et al.. Diagnosis and Treatment of Fetal Cardiac Disease: A Scientific Statement From the American Heart Association. Circulation. 2014 129(21):2183-2242. doi:10.1161/01.cir.0000437597.44550.5d – Prenatal Counseling and Parental Stress, Techniques, p. 2210. (AH14-128, ai-cross-checked)", "Donofrio MT, Moon-Grady AJ, Hornberger LK, Copel JA, Sklansky MS, Abuhamad A, et al.. Diagnosis and Treatment of Fetal Cardiac Disease: A Scientific Statement From the American Heart Association. Circulation. 2014 129(21):2183-2242. doi:10.1161/01.cir.0000437597.44550.5d – Prenatal Counseling and Parental Stress, Decision Making, p. 2210. (AH14-129, ai-cross-checked)", "Donofrio MT, Moon-Grady AJ, Hornberger LK, Copel JA, Sklansky MS, Abuhamad A, et al.. Diagnosis and Treatment of Fetal Cardiac Disease: A Scientific Statement From the American Heart Association. Circulation. 2014 129(21):2183-2242. doi:10.1161/01.cir.0000437597.44550.5d – Fetal Cardiac Catheter Intervention / Cardiac Lesions Amenable to Fetal Intervention, AS With Evolving HLHS, p. 2218. (AH14-207, ai-cross-checked)", "Donofrio MT, Moon-Grady AJ, Hornberger LK, Copel JA, Sklansky MS, Abuhamad A, et al.. Diagnosis and Treatment of Fetal Cardiac Disease: A Scientific Statement From the American Heart Association. Circulation. 2014 129(21):2183-2242. doi:10.1161/01.cir.0000437597.44550.5d – Fetal Cardiac Catheter Intervention / Cardiac Lesions Amenable to Fetal Intervention, Overview, p. 2217. (AH14-202, ai-cross-checked)"]}, {"id": "Z2", "title": "Surveillance plans by lesion", "tier": "Decide", "version": 0.1, "summary": "Who needs a repeat fetal echocardiogram, how often, and what each repeat study must look at, organised by the risk the lesion carries.", "public": false, "status": "ai-cross-checked", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-cross-checked' that no clinician has verified.", "objectives": ["Say when a normal mid-trimester study needs no follow-up, and when it does.", "Group lesions by the risk that drives their follow-up: heart failure, arrhythmia, cyanosis, pulmonary venous obstruction, airway compromise.", "For each group, name the suggested interval and the findings to record.", "List the measurements that must be repeated at every study for the main progressive lesions."], "sections": [{"heading": "Why a plan is needed", "blocks": [{"text": "Some heart disease that looks mild at first evolves before birth. A repeat study is planned around what could change and what would change care at birth.", "refs": [], "table": null}, {"text": "An abnormal fetal heart is usually reassessed every 2-8 weeks until about 34-36 weeks. The interval is guided by the lesion and the clinical concerns.", "refs": [1], "table": null}, {"text": "Reassessment near term is aimed at the findings that could change care immediately after birth.", "refs": [2], "table": null}, {"text": "Serial follow-up is indicated for diagnoses at risk of haemodynamic compromise after birth.", "refs": [3], "table": null}]}, {"heading": "After a normal study", "blocks": [{"text": "A normal mid-trimester fetal echocardiogram generally needs no follow-up, unless there is concern for a progressive lesion.", "refs": [4], "table": null}, {"text": "If a progressive lesion is suspected despite a normal mid-trimester study, repeat assessment is recommended at intervals of up to 2-4 weeks.", "refs": [5], "table": null}]}, {"heading": "Plans by risk group", "blocks": [{"text": "The guideline's follow-up table groups lesions by the risk they carry. The intervals are suggestions; the cardiology and obstetric providers decide.", "refs": [6], "table": null}, {"text": "Suggested follow-up by risk group.", "refs": [7, 8, 9, 10, 11, 12, 13, 14], "table": {"columns": ["Risk", "Examples", "Suggested interval", "What to assess"], "rows": [["Heart failure", "Hypoplastic left heart with mitral regurgitation; tetralogy with absent pulmonary valve; Ebstein anomaly; AVSD with valve regurgitation; cardiac tumours", "Every 2-4 weeks", "Comprehensive function assessment"], ["Arrhythmia", "Long-QT syndrome; congenitally corrected transposition; left atrial isomerism", "Every 2-4 weeks", "Rate and rhythm"], ["Atrioventricular block", "Congenitally corrected transposition; left atrial isomerism; others", "Every 2-4 weeks", "Atrioventricular interval; atrial and ventricular rates; hydrops; extracardiac Doppler"], ["Tachycardia", "Atrial flutter; supraventricular tachycardia", "Every 2 weeks unless well controlled", "Rate and rhythm; heart size; hydrops and heart failure"], ["Extracardiac cause of hydrops", "CPAM; sacrococcygeal teratoma; twin-twin transfusion; arteriovenous malformation; TRAP sequence; fetal anaemia", "Every 2-4 weeks", "Comprehensive function assessment"], ["Cyanosis after birth", "Transposition with intact septum or VSD; DORV with subpulmonary VSD; tetralogy", "Every 4-8 weeks and late in the third trimester", "Atrial septal excursion; foramen opening; ductal shunting; consider maternal hyperoxygenation testing"], ["Pulmonary venous obstruction after birth", "Hypoplastic left heart with restrictive atrial septum; obstructed anomalous pulmonary venous return; cor triatriatum", "Every 4-8 weeks and late in the third trimester", "Pulmonary venous forward-to-reverse ratio; atrial septal position and thickness; vertical vein Doppler; consider maternal hyperoxygenation testing"], ["Respiratory compromise after birth", "Tetralogy with absent pulmonary valve; Ebstein anomaly; hypoplastic left heart with restrictive atrial septum", "Every 4-8 weeks and late in the third trimester", "Mediastinal shift; cardiothoracic area ratio; ventricular function; consider fetal MRI of the lungs"]]}}, {"text": "After fetal intervention, follow-up is every 4 weeks in the third trimester. After intervention for aortic stenosis with evolving hypoplastic left heart: aortic outflow, arch flow direction, atrial septal flow, left ventricular size and function, mitral regurgitation and endocardial brightness. After intervention for hypoplastic left heart with a restrictive atrial septum: patency of the atrial communication and the pulmonary venous forward-to-reverse ratio.", "refs": [15, 16], "table": null}]}, {"heading": "What every repeat study must record, lesion by lesion", "blocks": [{"text": "Semilunar valve stenosis: serial evaluation, including ventricular size and function and endocardial fibroelastosis.", "refs": [17], "table": null}, {"text": "Semilunar valve stenosis: flow direction in the ductal and aortic arches at every examination, because abnormal direction heralds critical obstruction after birth; and flow direction at the atrial septum at every examination.", "refs": [18, 19], "table": null}, {"text": "Atrioventricular valve abnormality: a complete Doppler assessment at each examination, including valve stenosis and regurgitation and flow at the atrial septum and ductus.", "refs": [20], "table": null}, {"text": "Valve regurgitation: follow serially, because it may worsen as pregnancy advances; progressive cardiomegaly is common when it is significant.", "refs": [21, 22], "table": null}, {"text": "Severe tricuspid disease with pulmonary atresia, structural or functional: ductal flow direction documented serially, because retrograde ductal flow can develop at any point.", "refs": [23], "table": null}, {"text": "Hypoplastic left heart syndrome: the pulmonary venous forward-to-reverse velocity-time integral ratio at every study, with the last measurement near term. Maternal hyperoxygenation testing late in the third trimester may be considered in selected cases.", "refs": [24, 25], "table": null}, {"text": "D-transposition: the foramen ovale assessed late in gestation in every fetus.", "refs": [26], "table": null}, {"text": "Congenitally corrected transposition: serial studies offered, to find progressive atrioventricular valve regurgitation and rhythm problems, including complete heart block.", "refs": [27], "table": null}, {"text": "Tetralogy of Fallot: ductal flow direction at 28 weeks predicts the need for neonatal intervention.", "refs": [28], "table": null}]}, {"heading": "From surveillance to the delivery plan", "blocks": [{"text": "Certain critical lesions need cardiac intervention immediately after birth. A coordinated perinatal plan of care has the greatest potential to influence outcome.", "refs": [29, 30], "table": null}, {"text": "Once heart disease is diagnosed, maternal, fetal and neonatal providers must work together on its implications, the follow-up visits and the level of neonatal care expected. Image-based risk stratification paired with level-of-care plans is recommended. Unit Z3 covers the delivery plan.", "refs": [31, 32], "table": null}]}], "checklist": {"title": "Planning surveillance", "items": [{"text": "Risk group named: heart failure, arrhythmia or block, tachycardia, cyanosis, pulmonary venous obstruction, respiratory compromise", "refs": [7, 8, 10, 11, 12, 13, 14]}, {"text": "Suggested interval chosen and agreed with the obstetric team", "refs": [6]}, {"text": "Measurements to repeat at each study listed in the report", "refs": [20, 18, 19, 24]}, {"text": "Near-term study planned for findings that could change care at birth", "refs": [2]}, {"text": "Delivery-planning discussion started with maternal, fetal and neonatal providers", "refs": [31]}]}, "drills": {"items": [{"id": "Z2-Q01", "question": "A mid-trimester fetal echocardiogram is normal and there is no concern for a progressive lesion. What follow-up does the guideline suggest?", "options": ["Generally none", "Every 2-4 weeks until delivery", "One repeat study at 28 weeks for everyone", "A repeat study near term in every case"], "answer": 0, "explanation": "A normal mid-trimester study generally needs no follow-up unless a progressive lesion is a concern.", "claims": ["AS23-037"], "status": "ai-cross-checked"}, {"id": "Z2-Q02", "question": "Why is the near-term study done in an abnormal heart?", "options": ["To look for findings that could change care immediately after birth", "To confirm the diagnosis made at mid-trimester, as a routine", "To decide whether the pregnancy should continue", "Only to measure fetal growth"], "answer": 0, "explanation": "Near-term reassessment is targeted to findings that could change care immediately after birth.", "claims": ["AS23-036"], "status": "ai-cross-checked"}, {"id": "Z2-Q03", "question": "A fetus has Ebstein anomaly. Which risk group and suggested interval apply?", "options": ["Heart failure: every 2-4 weeks with comprehensive function assessment", "Cyanosis: every 4-8 weeks with atrial septal assessment only", "No follow-up until birth", "Tachycardia: every 2 weeks with rhythm only"], "answer": 0, "explanation": "Ebstein anomaly is one of the examples at risk of heart failure, followed every 2-4 weeks with comprehensive function assessment. It also appears in the respiratory-compromise group.", "claims": ["AS23-606", "AS23-612"], "status": "ai-cross-checked"}, {"id": "Z2-Q04", "question": "D-transposition with intact ventricular septum. What must be assessed late in gestation?", "options": ["The foramen ovale", "The ductus venosus only", "Nuchal translucency", "Nothing; transposition does not change before birth"], "answer": 0, "explanation": "Every fetus with D-transposition should have the foramen ovale assessed late in gestation. The cyanosis group also includes atrial septal excursion and ductal shunting.", "claims": ["AS23-330", "AS23-609"], "status": "ai-cross-checked"}, {"id": "Z2-Q05", "question": "Fetal aortic stenosis is being followed. What must be documented at every study?", "options": ["Flow direction in the ductal and aortic arches, and at the atrial septum", "Only the peak aortic velocity", "Only the cardiac axis", "Flow direction at the first study only"], "answer": 0, "explanation": "With semilunar stenosis, arch flow direction and atrial septal flow direction must be documented at every examination. Abnormal arch flow heralds critical obstruction after birth.", "claims": ["AS23-409", "AS23-410"], "status": "ai-cross-checked"}, {"id": "Z2-Q06", "question": "Hypoplastic left heart syndrome. Which measurement is repeated at every study, with the last one near term?", "options": ["The pulmonary venous forward-to-reverse velocity-time integral ratio", "The cardiac axis", "The umbilical artery pulsatility index only", "The nuchal translucency"], "answer": 0, "explanation": "In HLHS the pulmonary venous forward-to-reverse VTI ratio should be measured at every study, the last near term.", "claims": ["AS23-220"], "status": "ai-cross-checked"}, {"id": "Z2-Q07", "question": "Fetal supraventricular tachycardia that is not yet controlled. What interval does the follow-up table suggest?", "options": ["Every 2 weeks", "Every 4-8 weeks", "Only near term", "No follow-up is needed"], "answer": 0, "explanation": "Tachycardia is followed every 2 weeks unless well controlled, assessing rate and rhythm, heart size, hydrops and heart failure.", "claims": ["AS23-611"], "status": "ai-cross-checked"}, {"id": "Z2-Q08", "question": "Congenitally corrected transposition. What are serial studies looking for?", "options": ["Progressive atrioventricular valve regurgitation and rhythm problems, including complete heart block", "Closure of the ductus venosus", "Growth of the aortic arch only", "Nothing; serial studies are not offered"], "answer": 0, "explanation": "Serial studies are offered to find progressive atrioventricular valve regurgitation and rhythm abnormalities, including complete heart block.", "claims": ["AS23-339"], "status": "ai-cross-checked"}, {"id": "Z2-Q09", "question": "Tetralogy of Fallot. Which finding at 28 weeks predicts the need for neonatal intervention?", "options": ["Ductal flow direction", "Fetal heart rate", "Size of the left atrium", "Presence of an echogenic focus"], "answer": 0, "explanation": "In tetralogy, ductal direction at 28 weeks predicts the need for neonatal intervention.", "claims": ["AS23-316"], "status": "ai-cross-checked"}, {"id": "Z2-Q10", "question": "Are the intervals in the guideline's follow-up table fixed rules?", "options": ["No: they are suggestions, at the discretion of the cardiology and obstetric providers", "Yes: they must be followed exactly", "Yes, for heart failure only", "They apply only after fetal intervention"], "answer": 0, "explanation": "The intervals are suggestions; the cardiology and obstetric providers decide.", "claims": ["AS23-605"], "status": "ai-cross-checked"}]}, "video": null, "missing": ["AS23-039 (follow-up interval decided by the fetal cardiology and obstetric teams) is not yet cross-checked; the same point is made here through AS23-605.", "Follow-up plans for lesions not named in Table 15 (for example isolated ventricular septal defect, coarctation suspected on arch discrepancy) - need a source and the co-editor.", "How surveillance should be adapted where the patient lives far from a fetal cardiology centre (Indian practice) - the editor's input.", "Video outline not yet written."], "references": ["Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am So – IV.C.iii Key Points, p. 715. (AS23-339, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – Table 13 (lesion-specific evaluation), p. 707. (AS23-316, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – IV.D Imaging-Based Risk Assessment and Delivery Planning, p. 718. (AS23-602, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – IV.D Imaging-Based Risk Assessment and Delivery Planning, p. 718. (AS23-604, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – IV.D Key Points, p. 718; IV.D Imaging-Based Risk Assessment and Delivery Planning, p. 718. (AS23-600, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – IV.D Key Points, p. 718; IV.D Imaging-Based Risk Assessment and Delivery Planning, p. 718. (AS23-603, ai-cross-checked)"]}, {"id": "Z3", "title": "Planning delivery: place, timing, mode, first-hour needs", "tier": "Decide", "version": 0.1, "summary": "Assigning a level of care before birth, choosing where and when to deliver, and the fetal findings that predict trouble in the first hour for each lesion.", "public": false, "status": "ai-cross-checked", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-cross-checked' that no clinician has verified.", "objectives": ["Explain why a coordinated perinatal plan matters and who makes it.", "Assign a level of care (P, 1 to 5) from the fetal diagnosis.", "State the guidance on timing and mode of delivery.", "Name the fetal findings that call for a specialist team in the delivery room."], "sections": [{"heading": "Why plan, and who plans", "blocks": [{"text": "Prenatal diagnosis of critical heart disease affects illness in the newborn, and survival to a lesser extent; studies showing improved survival are sparse. Infants with ductal-dependent lesions diagnosed before birth are less compromised before surgery.", "refs": [1, 2], "table": null}, {"text": "A coordinated perinatal plan of care has the greatest potential to influence outcome. Certain critical lesions need cardiac intervention immediately after birth.", "refs": [3, 4], "table": null}, {"text": "Maternal, fetal and neonatal providers must work together once heart disease is diagnosed. Intrapartum care should be coordinated among the obstetric, neonatal and cardiology teams.", "refs": [5, 6], "table": null}, {"text": "The fetal diagnostic team should assign an anticipated level of care, and plans for the delivery room and the newborn should be made before delivery. Image-based risk stratification paired with level-of-care plans is recommended.", "refs": [7, 8], "table": null}]}, {"heading": "Levels of care", "blocks": [{"text": "The AHA 2014 level-of-care scheme. Many newborns with heart disease need no specialised delivery room care.", "refs": [9, 10, 11, 12, 13, 14, 15], "table": {"columns": ["Level", "Meaning", "Examples", "Delivery plan"], "rows": [["P", "Palliative care planned, with a severe or fatal chromosomal or multisystem disease", "-", "Family support and palliative care; normal delivery at the local hospital"], ["1", "No predicted instability in the delivery room or first days", "VSD, AVSD, mild tetralogy", "Normal delivery at the local hospital; routine care; later cardiology review"], ["2", "Minimal risk in the delivery room, but catheter or surgery needed after birth", "Ductal-dependent lesions: HLHS, critical coarctation, severe aortic stenosis, interrupted arch, PA/IVS, severe tetralogy", "Consider planned induction near term; hospital with a neonatologist and accessible cardiology; prostaglandin if indicated; then transfer"], ["3", "Likely instability needing immediate specialist stabilisation", "d-TGA with concerning septum primum (all d-TGA without an atrial septal defect may reasonably be treated as at risk); uncontrolled arrhythmia; complete heart block with heart failure", "Planned induction at 38-39 weeks; caesarean if needed to coordinate; neonatologist and cardiac specialist in the delivery room"], ["4", "Instability at placental separation; immediate catheter or surgery in the delivery room", "HLHS or d-TGA with severely restrictive or intact atrial septum (d-TGA also with abnormal ductus); obstructed TAPVR; Ebstein with hydrops; absent pulmonary valve with severe airway obstruction; uncontrolled arrhythmia with hydrops; complete heart block with low rate, fibroelastosis or hydrops", "Caesarean in a cardiac facility, usually at 38-39 weeks, specialists in the delivery room"], ["5", "Transplantation planned", "HLHS with intact atrial septum, or severe Ebstein or cardiomyopathy with severe ventricular dysfunction", "Listing after 35 weeks; caesarean when a heart is available; specialised cardiac team in the delivery room"]]}}]}, {"heading": "Place, timing and mode", "blocks": [{"text": "Place: for heart disease at risk, plan delivery near a cardiac centre with the resources needed. Ductal-dependent lesions need a prostaglandin infusion soon after birth; delivery at a centre with a neonatologist and access to paediatric cardiology is recommended.", "refs": [16, 17], "table": null}, {"text": "Timing: elective induction before 39 weeks is not recommended unless there are obstetric, logistic or fetal well-being reasons.", "refs": [18], "table": null}, {"text": "The transition: the ductus usually closes over 12 to 72 hours after birth. Infants with ventricular or atrioventricular septal defects are stable until pulmonary resistance falls, usually weeks after birth, and need no specialised delivery room care.", "refs": [19, 20], "table": null}]}, {"heading": "Recommendations on specialised delivery room care", "blocks": [{"text": "Recommended (Class I): for d-TGA, and for sustained or uncontrolled tachyarrhythmia with heart failure or hydrops.", "refs": [21], "table": null}, {"text": "Reasonable (Class IIa): for HLHS with a restrictive or intact atrial septum and abnormal pulmonary vein flow (forward-to-reverse ratio below 3) or an abnormal third-trimester hyperoxia test; and for complete heart block with low ventricular rate, dysfunction or hydrops.", "refs": [22], "table": null}, {"text": "May be considered (Class IIb): tetralogy with absent pulmonary valve, or Ebstein anomaly with hydrops.", "refs": [23], "table": null}, {"text": "Not needed (Class III): shunt lesions, most ductal-dependent lesions, and controlled arrhythmias.", "refs": [24], "table": null}]}, {"heading": "Fetal predictors, lesion by lesion", "blocks": [{"text": "Ductal-dependent circulation: pulmonary flow is ductal-dependent when ductal flow runs from aorta to pulmonary artery or the duct is reversed in orientation (inferior angle below 90°); systemic flow is ductal-dependent with left-to-right atrial flow. For these, prostaglandin E1 is started and no specialised delivery room care is needed.", "refs": [25], "table": null}, {"text": "HLHS with restrictive or intact atrial septum: a pulmonary vein forward-to-reverse VTI ratio below 3, or no change in branch pulmonary artery pulsatility with third-trimester maternal hyperoxygenation, should lead to a plan for possible urgent decompression of the left atrium.", "refs": [26], "table": null}, {"text": "D-transposition: septum primum angle below 30° to the atrial septum, bowing more than 50% into the left atrium, loss of normal swinging motion, or a hypermobile septum primum have been reported to predict restriction. These call for planned urgent balloon atrial septostomy, on site if possible, and prostaglandin E1. A small or abnormal ductus with foramen concerns means high risk; deliver where hypoxia and pulmonary hypertension can be managed.", "refs": [27, 28], "table": null}, {"text": "Obstructed TAPVR: a decompressing vein below the diaphragm, or accelerated flow in it, should lead to consideration of ECMO.", "refs": [29], "table": null}, {"text": "Tetralogy with absent pulmonary valve: lobar emphysema (fluid trapping) on MRI suggests planning specialised ventilation and considering ECMO.", "refs": [30], "table": null}, {"text": "Ebstein anomaly with hydrops or uncontrolled arrhythmia: early delivery may be considered, with measures to lower pulmonary resistance, treat arrhythmia and support output.", "refs": [31], "table": null}, {"text": "Tachyarrhythmia with rapid rate, reduced function, effusion or hydrops: consider early delivery if gestation is appropriate, with urgent cardioversion or medical therapy in the delivery room. For uncontrolled tachycardia, planned cardioversion or antiarrhythmic therapy in the delivery room is indicated.", "refs": [32, 33], "table": null}, {"text": "Complete heart block: a falling cardiovascular profile score (to below 7), a very low ventricular rate, reduced function or fibroelastosis, or hydrops should lead to consideration of early delivery and of chronotropic drugs or temporary pacing in the delivery room. Planned chronotropic drugs or pacing in the early newborn period is reasonable.", "refs": [34, 33], "table": null}]}, {"heading": "Monitoring before delivery", "blocks": [{"text": "Cardiotocography is unlikely to be useful in fetal bradycardia or complete heart block.", "refs": [35], "table": null}]}], "checklist": {"title": "Delivery plan before 36 weeks", "items": [{"text": "Level of care assigned and written in the report", "refs": [7, 10, 11, 12, 13, 14, 15]}, {"text": "Obstetric, neonatal and cardiology teams agree the plan", "refs": [6, 5]}, {"text": "Place of delivery fits the level; transfer arranged if needed", "refs": [16, 17]}, {"text": "Timing: no elective induction before 39 weeks without a reason", "refs": [18]}, {"text": "Lesion-specific predictors checked and first-hour needs listed (septostomy, ECMO, pacing, cardioversion, ventilation)", "refs": [26, 27, 29, 34, 30, 32]}]}, "drills": {"items": [{"id": "Z3-Q01", "question": "Who should assign the anticipated level of care, and when?", "options": ["The fetal diagnostic team, before delivery", "The neonatologist, after birth", "The obstetrician, in labour", "No one; it is decided at birth"], "answer": 0, "explanation": "The fetal diagnostic team should assign a level of care, and plans should be made before delivery.", "claims": ["AH14-306"], "status": "ai-cross-checked"}, {"id": "Z3-Q02", "question": "A fetus has an isolated ventricular septal defect. Which level of care fits?", "options": ["Level 1: normal delivery at the local hospital, later cardiology review", "Level 4: caesarean in a cardiac facility", "Level 5: transplantation planned", "Level 3: planned induction at a specialist centre"], "answer": 0, "explanation": "VSD is a level 1 example; these infants are stable until pulmonary resistance falls, weeks after birth.", "claims": ["AH14-318", "AH14-309"], "status": "ai-cross-checked"}, {"id": "Z3-Q03", "question": "Hypoplastic left heart syndrome with an open atrial septum. Which level, and what is needed at birth?", "options": ["Level 2: delivery with a neonatologist and accessible cardiology; prostaglandin if indicated; then transfer", "Level 1: routine care at a local hospital", "Level 4: catheter intervention in the delivery room", "Level P: palliative care only"], "answer": 0, "explanation": "Ductal-dependent lesions such as HLHS fall under level 2.", "claims": ["AH14-319"], "status": "ai-cross-checked"}, {"id": "Z3-Q04", "question": "D-transposition without an atrial septal defect. How may it reasonably be regarded?", "options": ["At risk: level 3, with specialists in the delivery room", "Level 1: no risk at birth", "Level P", "Level 2 only if the ductus is large"], "answer": 0, "explanation": "All d-TGA without an atrial septal defect may reasonably be considered at risk (level 3).", "claims": ["AH14-320"], "status": "ai-cross-checked"}, {"id": "Z3-Q05", "question": "HLHS with a restrictive atrial septum: pulmonary vein forward-to-reverse VTI ratio below 3. What should be planned?", "options": ["Possible urgent decompression of the left atrium", "Routine delivery at the local hospital", "Delivery before 34 weeks", "No change in plan"], "answer": 0, "explanation": "A ratio below 3, or no response to maternal hyperoxygenation, should lead to a plan for urgent left atrial decompression.", "claims": ["AH14-312"], "status": "ai-cross-checked"}, {"id": "Z3-Q06", "question": "What does AHA 2014 say about elective induction before 39 weeks?", "options": ["Not recommended unless there are obstetric, logistic or fetal well-being reasons", "Recommended for all heart disease", "Required for ductal-dependent lesions", "It gives no guidance"], "answer": 0, "explanation": "Elective induction before 39 weeks is not recommended without obstetric, logistic or fetal well-being reasons.", "claims": ["AH14-304"], "status": "ai-cross-checked"}, {"id": "Z3-Q07", "question": "Which group needs no specialised delivery room care, according to the recommendations?", "options": ["Shunt lesions, most ductal-dependent lesions and controlled arrhythmias", "d-TGA", "Uncontrolled tachyarrhythmia with hydrops", "HLHS with intact atrial septum"], "answer": 0, "explanation": "Class III: specialised delivery room care is not needed for these.", "claims": ["AH14-027"], "status": "ai-cross-checked"}, {"id": "Z3-Q08", "question": "Fetal Doppler shows aorta-to-pulmonary flow in the ductus. What does this predict?", "options": ["Ductal-dependent pulmonary circulation; prostaglandin E1 after birth", "Ductal-dependent systemic circulation", "A normal transition", "Complete heart block"], "answer": 0, "explanation": "Aorta-to-PA ductal flow predicts ductal-dependent pulmonary circulation; PGE1 is started.", "claims": ["AH14-311"], "status": "ai-cross-checked"}, {"id": "Z3-Q09", "question": "Complete heart block with fibroelastosis and a falling cardiovascular profile score. What should be considered?", "options": ["Early delivery, with chronotropic drugs or temporary pacing in the delivery room", "Cardiotocography to guide timing", "Routine delivery at term without plans", "Delivery at home"], "answer": 0, "explanation": "These findings should lead to consideration of early delivery and of chronotropic drugs or pacing. Cardiotocography is unlikely to help in heart block.", "claims": ["AH14-324", "AH14-119"], "status": "ai-cross-checked"}, {"id": "Z3-Q10", "question": "When does the ductus usually close after birth?", "options": ["Over 12 to 72 hours", "Within one minute", "After several months", "Never in a normal baby"], "answer": 0, "explanation": "The ductus usually closes over 12 to 72 hours, which is why ductal-dependent lesions present then.", "claims": ["AH14-308"], "status": "ai-cross-checked"}]}, "video": null, "missing": ["Awaiting re-check after rewording on 21 Nov (round 5, task J): caesarean against vaginal birth (AH14-305); hydrops in complex heart disease and delivery (AH14-316); septum primum criteria in a later study (AH14-314); ductal flow and pulmonary hypertension therapy in d-TGA (AH14-326); fetal wellness testing (AH14-017, 118, 120).", "Mode of delivery: without AH14-305 the unit says nothing on caesarean against vaginal birth beyond the level-of-care table.", "Indian adaptation: where level 3 and 4 care is available, transport distances, and how the levels map to Indian hospitals - the editor's input and an Indian source.", "Prostaglandin dosing and newborn drug doses - held back until the cardiology co-editor signs (Claude task rule 3).", "Newer guidance than AHA 2014 on delivery planning, where it exists - source search.", "Video outline not yet written."], "references": ["Donofrio MT, Moon-Grady AJ, Hornberger LK, Copel JA, Sklansky MS, Abuhamad A, et al.. Diagnosis and Treatment of Fetal Cardiac Disease: A Scientific Statement From the American Heart Association. Circulation. 2014 129(21):2183-2242. doi:10.1161/01.cir.0000437597.44550.5d – Perinatal Management and Outcome of Fetuses With CHD, Impact on Morbidity / Survival, pp. 2221-2222. (AH14-300, ai-cross-checked)", "Donofrio MT, Moon-Grady AJ, Hornberger LK, Copel JA, Sklansky MS, Abuhamad A, et al.. Diagnosis and Treatment of Fetal Cardiac Disease: A Scientific Statement From the American Heart Association. Circulation. 2014 129(21):2183-2242. doi:10.1161/01.cir.0000437597.44550.5d – Perinatal Management and Outcome of Fetuses With CHD, Impact on Morbidity, pp. 2221-2222. (AH14-301, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – IV.D Imaging-Based Risk Assessment and Delivery Planning, p. 718. (AS23-604, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et a hy and Nonstress Testing, p. 2209. (AH14-119, ai-cross-checked)"]}, {"id": "Z5", "title": "Fetal cardiac intervention", "tier": "Decide", "version": 0.1, "summary": "Why some lesions are treated before birth, which fetuses may be candidates, what the procedures aim to do, and how to counsel and follow up.", "public": false, "status": "ai-cross-checked", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-cross-checked' that no clinician has verified.", "objectives": ["State the rationale for fetal cardiac intervention and its main limit.", "Name the signs of evolving hypoplastic left heart in aortic stenosis and the candidacy criteria for valvuloplasty.", "Describe the problem of the restrictive atrial septum in HLHS, and the role of intervention in pulmonary atresia with intact septum.", "Describe counselling and follow-up after a fetal procedure."], "sections": [{"heading": "The idea, and its limit", "blocks": [{"text": "Fetal cardiac intervention rests on the idea that some lesions progress in utero, and that there may be a limited window when their effects on growth and function can still be reversed.", "refs": [1], "table": null}, {"text": "Technical success of a fetal procedure does not always translate into clinical success after birth.", "refs": [2], "table": null}, {"text": "Any fetal therapy must be weighed against the risk to the mother and the chance of successful treatment after birth. In 2014 there were no randomised trials of fetal cardiac therapy.", "refs": [3], "table": null}]}, {"heading": "Aortic stenosis with evolving hypoplastic left heart", "blocks": [{"text": "Signs of evolution: retrograde transverse arch flow, severe left ventricular dysfunction, monophasic short mitral inflow, and left-to-right flow at the foramen ovale.", "refs": [4], "table": null}, {"text": "Aim of valvuloplasty: open the valve, promote antegrade flow and left heart growth, and make a biventricular repair possible.", "refs": [5], "table": null}, {"te     body.append(el('div', { class: 'card' }, el('strong', {}, 'Nothing due right now.'),
      el('p', { class: 'small' }, 'You have seen all ' + items.length + ' questions and the next ones come back on schedule.'),
      el('button', { class: 'btn alt', onclick: () => run(items) }, 'Practise all anyway')));
    return;
  }
  body.append(el('p', { class: 'small' }, st.dueNow + ' due of ' + items.length + '. Missed questions return first.'),
    el('button', { class: 'btn', onclick: () => run(dueItems) }, 'Start'));
  function run(set){
    let queue = shuffle(set), pos = 0, score = 0;
    (function show(){
      if (pos >= queue.length){
        body.replaceChildren(el('div', { class: 'card' }, el('h2', { style: 'margin-top:0' }, score + ' of ' + queue.length + ' correct'),
          el('button', { class: 'btn', onclick: () => showUnit(u.id, 'Drill') }, 'Done')));
        return;
      }
      const it = queue[pos];
      const opts = shuffle(it.options.map((text, i) => ({ text, correct: i === it.answer })));
      const fb = el('div'), box = el('div');
      const buttons = opts.map(o => el('button', { class: 'opt', onclick: ev => {
        buttons.forEach((b, k) => { b.disabled = true; if (opts[k].correct) b.classList.add('right'); });
        if (o.correct) score++; else ev.currentTarget.classList.add('wrong');
        grade(it.id, o.correct);
        fb.append(el('p', {}, it.explanation), el('div', { class: 'small' }, 'Rests on ' + it.claims.join(', ') + ' (' + it.status + ')'),
          el('button', { class: 'btn', onclick: () => { pos++; show(); } }, 'Next'));
      } }, o.text));
      box.append(...buttons);
      body.replaceChildren(el('div', { class: 'card' }, el('div', { class: 'small' }, 'Question ' + (pos + 1) + ' of ' + queue.length),
        el('p', {}, el('strong', {}, it.question)), box, fb));
    })();
  }
}
// ---- clip drills: clips and media.json sit in ./media/ on the hosting server, never in the code repository ----
let CLIPS = [];
function showClips(){
  $('#home').hidden = false; location.hash = 'clips'; window.scrollTo(0, 0);
  const body = el('div');
  view.replaceChildren(el('h1', {}, 'Clip drills'),
    el('div', { class: 'banner' }, 'Answers come from the labels given at the clinic when each clip was prepared. Every clip was checked by two people before it was listed.'), body);
  const dueC = CLIPS.filter(c => due('clip:' + c.code));
  let queue = shuffle(dueC.length ? dueC : CLIPS).slice(0, 10), pos = 0, score = 0;
  (function show(){
    if (pos >= queue.length){
      body.replaceChildren(el('div', { class: 'card' }, el('h2', { style: 'margin-top:0' }, score + ' of ' + queue.length + ' fully correct'),
        el('button', { class: 'btn', onclick: showClips }, 'More clips'), el('button', { class: 'btn alt', onclick: showHome }, 'Done')));
      return;
    }
    const c = queue[pos], pick = {};
    let media;
    if (c.kind === 'still') media = el('img', { src: 'media/' + c.file, alt: '' });
    else { media = el('video', { src: 'media/' + c.file, playsinline: '' }); media.autoplay = media.loop = media.muted = true; }
    const fb = el('div'), go = el('button', { class: 'btn', disabled: '' }, 'Check');
    const whereBox = el('div', { hidden: '' });
    function group(name, map){
      const bs = Object.entries(map).map(([code, label]) => el('button', { class: 'opt', onclick: ev => {
        pick[name] = code; bs.forEach(b => b.classList.remove('on')); ev.currentTarget.classList.add('on');
        whereBox.hidden = pick.normal !== 'no';
        go.disabled = !(pick.plane && pick.normal && (pick.normal === 'yes' || pick.region));
      } }, label));
      return el('div', { class: 'choices' }, bs);
    }
    whereBox.append(el('strong', {}, 'Where is the problem?'), group('region', DATA.regions));
    go.onclick = () => {
      const okPlane = pick.plane === c.plane, okNormal = (pick.normal === 'yes') === c.normal;
      const okRegion = c.normal || pick.region === c.region, ok = okPlane && okNormal && okRegion;
      if (ok) score++; grade('clip:' + c.code, ok);
      body.querySelectorAll('.opt').forEach(b => b.disabled = true); go.hidden = true;
      const line = (good, text) => el('p', { style: 'color:' + (good ? 'var(--ok)' : 'var(--bad)') }, (good ? 'Right. ' : 'Not right. ') + text);
      fb.append(...[line(okPlane, DATA.planes[c.plane] || c.plane), line(okNormal, c.normal ? 'Normal.' : 'Not normal: ' + c.finding + '.'),
        c.normal ? null : line(okRegion, 'Region: ' + (DATA.regions[c.region] || c.region) + '.'),
        c.note ? el('p', {}, c.note) : null,
        el('div', { class: 'small' }, 'Clip ' + c.code + ' · ' + c.weeks + ' weeks · ' + c.mode),
        el('button', { class: 'btn', onclick: () => { pos++; show(); } }, 'Next')].filter(Boolean));
    };
    body.replaceChildren(el('div', { class: 'card' }, el('div', { class: 'small' }, 'Clip ' + (pos + 1) + ' of ' + queue.length),
      el('div', { class: 'clip' }, media),
      el('strong', {}, 'Which plane is this?'), group('plane', DATA.planes),
      el('strong', {}, 'Normal or not normal?'), group('normal', { yes: 'Normal', no: 'Not normal' }),
      whereBox, go, fb));
  })();
}
$('#home').onclick = showHome;
const start = (location.hash || '').slice(1);
if (start && DATA.units.some(u => u.id === start)) showUnit(start); else showHome();
fetch('media/media.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(m => {
  if (m && Array.isArray(m.clips)){ CLIPS = m.clips; if (!location.hash) showHome(); }
}).catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script></body></html>
