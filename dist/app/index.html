<style>
:root{--ink:#1c2430;--mute:#5d6b7a;--line:#d9dee5;--bg:#f6f4ef;--card:#fff;--accent:#9b2c3f;--ok:#1f6f4a;--bad:#a23b2a}
*{box-sizing:border-box}body{margin:0;font:17px/1.55 Georgia,'Times New Roman',serif;color:var(--ink);background:var(--bg)}
main{max-width:720px;margin:0 auto;padding:16px 16px 90px}
header.top{display:flex;align-items:center;gap:10px;font:600 15px system-ui,sans-serif;color:var(--accent);margin-bottom:6px}
header.top button{background:none;border:0;font:15px system-ui,sans-serif;color:var(--accent);cursor:pointer;padding:6px 0}
h1{font-size:1.6rem;line-height:1.2;margin:.3em 0 .2em}h2{font-size:1.15rem;margin:1.6em 0 .4em}
.small,.meta{font:13px/1.4 system-ui,sans-serif;color:var(--mute)}
.banner{font:14px/1.4 system-ui,sans-serif;background:#fff3cd;border:1px solid #e0c97a;padding:10px 12px;border-radius:6px;margin:12px 0}
.banner.ok{background:#e3f3ea;border-color:#9ccdb3}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.unit{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;color:inherit}
.unit:hover{border-color:var(--ink)}
.pill{display:inline-block;font:12px system-ui,sans-serif;border-radius:20px;padding:2px 9px;background:#fff3cd;border:1px solid #e0c97a;margin-left:6px}
.pill.ok{background:#e3f3ea;border-color:#9ccdb3}
nav.tabs{display:flex;gap:6px;margin:14px 0;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{font:15px system-ui,sans-serif;background:none;border:0;border-bottom:3px solid transparent;padding:8px 4px;margin-right:10px;cursor:pointer;color:var(--mute);white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent);font-weight:600}
sup{font:11px system-ui,sans-serif;color:var(--accent)}
.opt{display:block;width:100%;text-align:left;font:16px/1.4 system-ui,sans-serif;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ink)}.opt.right{border-color:var(--ok);background:#e3f3ea}.opt.wrong{border-color:var(--bad);background:#f7e4e0}
.btn{font:15px system-ui,sans-serif;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;margin:8px 8px 0 0}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
ol.refs{font:14px/1.45 system-ui,sans-serif;color:var(--mute);padding-left:22px}
ul{padding-left:22px}[hidden]{display:none}
table{border-collapse:collapse;width:100%;font:14px/1.4 system-ui,sans-serif;margin:10px 0}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:#eee}
label.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font:16px/1.4 system-ui,sans-serif}
label.chk input{width:22px;height:22px;margin-top:2px;flex:none}
.bar{height:8px;background:#e5e5e5;border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent)}
.beat{border-left:3px solid var(--accent);padding:2px 12px;margin:14px 0}

<script>
const DATA = {"units": [{"id": "D0", "title": "Why hearts are missed", "tier": "Detect", "version": 0.1, "summary": "How often heart disease is missed before birth, where the miss happens, and what a screening service can do about it.", "public": false, "status": "ai-extracted", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-extracted' that no clinician has verified.", "objectives": ["State how common congenital heart disease is and how much of it is found before birth.", "Name the two main ways a heart lesion is missed on a screening scan.", "Explain why the four-chamber view alone is not enough.", "List the features of a screening service that detects more."], "sections": [{"heading": "The size of the gap", "blocks": [{"text": "Congenital heart disease affects about 8 in every 1000 live births and is a leading cause of illness and death in infancy.", "refs": [1], "table": null}, {"text": "Detection before birth varies widely between regions and between lesions. Overall, fewer than half of cardiac anomalies are identified before birth.", "refs": [2], "table": null}]}, {"heading": "You cannot screen by risk factor", "blocks": [{"text": "A high proportion of the heart disease that could be detected before birth occurs in pregnancies with no risk factor and no other anomaly. The routine scan, done well on every patient, is what finds it.", "refs": [3], "table": null}]}, {"heading": "Where the miss happens", "blocks": [{"text": "In one retrospective study of missed diagnoses, views that did not meet technical criteria contributed to about half of the misses. In nearly a third, the view was technically adequate but the abnormal anatomy was not recognised.", "refs": [4], "table": null}, {"text": "These are two different failures and they need two different habits. The first is fixed by obtaining every plane to a standard. The second is fixed by knowing exactly what normal looks like, so that anything else stands out. This course trains both.", "refs": [], "table": null}]}, {"heading": "Why detection varies", "blocks": [{"text": "Part of the variation is explained by the examiner's ability, transducer frequency, maternal body habitus, abdominal scars, gestational age, amniotic fluid volume and fetal position.", "refs": [5], "table": null}, {"text": "Only some of these are in your hands. Skill and machine set-up are. Fetal position can often be dealt with by waiting or by bringing the patient back.", "refs": [], "table": null}]}, {"heading": "Four chambers are not enough", "blocks": [{"text": "The four-chamber and three-vessel views need much more than a count of structures.", "refs": [6], "table": null}, {"text": "Some lesions, such as transposition of the great arteries and coarctation of the aorta, may not be evident in the four-chamber plane alone. Some lesions are not discovered until later in pregnancy.", "refs": [7], "table": null}, {"text": "Adding the outflow-tract and great-vessel views raises detection of major malformations above the four-chamber view alone. It allows detection of tetralogy of Fallot, transposition, double-outlet right ventricle and truncus arteriosus.", "refs": [8, 9], "table": null}, {"text": "Complete transposition, tetralogy of Fallot, double-outlet right ventricle, common arterial trunk and pulmonary atresia with a ventricular septal defect can all have a four-chamber view that looks normal. They are typically abnormal in the three-vessel view.", "refs": [10], "table": null}, {"text": "The same standard sweep can also pick up aortic and pulmonary valve stenosis, which may become more severe as pregnancy advances.", "refs": [11], "table": null}]}, {"heading": "What a good screening service does", "blocks": [{"text": "A screening programme performs better with continuous training based on feedback, a low threshold for referral for echocardiography, standardised protocols and easy access to fetal heart specialists.", "refs": [12], "table": null}, {"text": "Each practice is encouraged to audit its stored images or clips against set quality criteria, to review its own detection rates and diagnostic accuracy every year, and to provide further training where needed.", "refs": [13], "table": null}]}, {"heading": "What this course asks of you", "blocks": [{"text": "Learn one sweep and do it the same way on every patient. Learn the criteria for each plane until a normal heart is boring. Drill on clips until a heart that is not normal catches your eye within a few beats. Refer early when a plane fails.", "refs": [], "table": null}]}], "checklist": {"title": "Habits that close the gap", "items": [{"text": "Every patient gets the full sweep: situs, four-chamber, outflow tracts and great-vessel views", "refs": [14]}, {"text": "Each plane is judged against its criteria, not by counting structures", "refs": [6]}, {"text": "A normal four-chamber view is never taken as proof of a normal heart", "refs": [7, 10]}, {"text": "Low threshold to refer for fetal echocardiography", "refs": [12, 15]}, {"text": "Own images audited and detection reviewed every year", "refs": [13]}]}, "drills": {"items": [{"id": "D0-Q01", "question": "About how common is congenital heart disease?", "options": ["About 8 in every 1000 live births", "About 8 in every 100 live births", "About 8 in every 10 000 live births", "About 8 in every 100 000 live births"], "answer": 0, "explanation": "The guideline gives a prevalence of 8.2 per 1000 live births.", "claims": ["IS23-003"], "status": "expert-verified"}, {"id": "D0-Q02", "question": "Overall, what share of cardiac anomalies is identified before birth?", "options": ["Fewer than half", "Nearly all", "About three quarters", "Almost none"], "answer": 0, "explanation": "Detection varies by region and lesion, but fewer than half of cardiac anomalies are identified before birth.", "claims": ["IS23-004"], "status": "expert-verified"}, {"id": "D0-Q03", "question": "A colleague proposes examining the heart in detail only when the pregnancy has a risk factor. What is wrong with this?", "options": ["A high proportion of detectable heart disease occurs in pregnancies with no risk factor", "Nothing; heart disease is rare without a risk factor", "Risk factors cannot be identified before the scan", "Detailed examination is only possible in the third trimester"], "answer": 0, "explanation": "Much of the heart disease that can be detected before birth is in pregnancies with no risk factor and no other anomaly, so every routine scan must be done to standard.", "claims": ["IS23-080"], "status": "expert-verified"}, {"id": "D0-Q04", "question": "In a study of missed prenatal diagnoses, what contributed to about half of the misses?", "options": ["Views that did not meet technical criteria", "Lesions that developed only after birth", "Machines without colour Doppler", "Patients who did not attend the scan"], "answer": 0, "explanation": "Failure to meet technical criteria contributed to about 50% of misses.", "claims": ["IS23-088"], "status": "expert-verified"}, {"id": "D0-Q05", "question": "In the same study, a technically adequate view was obtained but the diagnosis was still missed in nearly a third of cases. Why?", "options": ["The abnormal anatomy was not recognised", "The lesion was too small to be seen by any examiner", "The stored images were lost", "The scan was done too late in pregnancy"], "answer": 0, "explanation": "Failure to recognise abnormal anatomy on an adequate view accounted for 31% of misses. Recognition is a trainable skill.", "claims": ["IS23-088"], "status": "expert-verified"}, {"id": "D0-Q06", "question": "Which pair of lesions may show nothing abnormal in the four-chamber plane alone?", "options": ["Transposition of the great arteries and coarctation of the aorta", "Atrioventricular septal defect and a single ventricle", "A large pericardial effusion and severe cardiomegaly", "Dextrocardia and an abnormal cardiac axis"], "answer": 0, "explanation": "The guideline names transposition and coarctation as lesions that may not be evident in the four-chamber plane alone.", "claims": ["IS23-008"], "status": "expert-verified"}, {"id": "D0-Q07", "question": "The four-chamber view looks normal. Which view is typically abnormal in tetralogy of Fallot, transposition and common arterial trunk?", "options": ["The three-vessel view", "The upper-abdomen view", "No axial view; these are found only after birth", "The four-chamber view repeated with colour"], "answer": 0, "explanation": "These lesions can pass the four-chamber view but are typically abnormal in the three-vessel view.", "claims": ["IS23-067"], "status": "expert-verified"}, {"id": "D0-Q08", "question": "Which of these is a feature of a screening programme that performs better?", "options": ["A low threshold for referring for fetal echocardiography", "Referring only when the diagnosis is certain", "Leaving each examiner to choose their own protocol", "Limiting the scan to the four-chamber view to save time"], "answer": 0, "explanation": "Better programmes have feedback-based training, a low referral threshold, standardised protocols and easy access to fetal heart specialists.", "claims": ["IS23-006"], "status": "ai-extracted"}, {"id": "D0-Q09", "question": "How often is a practice encouraged to review its own detection rates and diagnostic accuracy?", "options": ["Every year", "Only after a complaint", "Every five years", "Once, when the service starts"], "answer": 0, "explanation": "Annual review of local detection rates and accuracy is encouraged, with further training as needed.", "claims": ["IS23-089"], "status": "ai-extracted"}, {"id": "D0-Q10", "question": "Which of these factors that affect detection is most directly within the examiner's control?", "options": ["Transducer frequency and examiner skill", "Maternal body habitus", "Abdominal scars", "Amniotic fluid volume"], "answer": 0, "explanation": "The guideline lists examiner ability and transducer frequency alongside patient factors such as habitus, scars, fluid volume and fetal position.", "claims": ["IS23-005"], "status": "ai-extracted"}]}, "video": {"title": "Why hearts are missed", "minutes": 4, "beats": [{"shot": "Presenter to camera", "narration": "Fewer than half of heart anomalies are found before birth. Most of those babies had no risk factor."}, {"shot": "Graphic: two boxes, 'view not good enough' and 'abnormality not recognised'", "narration": "When a diagnosis is missed, it is usually for one of two reasons. The view was not good enough. Or the view was good and nobody saw the problem."}, {"shot": "Diagram: four-chamber plane, then the planes above it lighting up", "narration": "Four chambers are not enough. Transposition and coarctation can hide in that plane. The outflow tracts and the three-vessel views are where they show."}, {"shot": "Presenter", "narration": "One sweep, the same way, every patient. Know normal so well that anything else stops you. And refer early."}]}, "missing": ["Detection rates in India and by lesion type - needs an Indian source.", "Outcome benefit of prenatal diagnosis for specific lesions (why detection matters for the baby) - needs a source beyond this guideline."], "references": ["Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Introduction, p. 788. (IS23-003, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Introduction, p. 788. (IS23-004, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Fetal echocardiography, p. 796. (IS23-080, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Quality assurance, p. 797. (IS23-088, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Introduction, p. 788. (IS23-005, ai-extracted)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – General considerations, p. 788. (IS23-007, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – General considerations, p. 788. (IS23-008, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – General considerations, p. 788. (IS23-009, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Cardiac examination, p. 789. (IS23-019, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – RVOT view, 3VV and 3VTV, p. 794. (IS23-067, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Cardiac examination, p. 789. (IS23-020, ai-extracted)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Introduction, p. 788. (IS23-006, ai-extracted)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Quality assurance, p. 797. (IS23-089, ai-extracted)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Cardiac examination, p. 789. (IS23-018, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Fetal echocardiography, p. 796. (IS23-078, expert-verified)"]}, {"id": "D1", "title": "The normal heart in five views", "tier": "Detect", "version": 0.2, "summary": "", "public": false, "status": "expert-verified", "banner": "Verified content.", "objectives": ["Perform the five-plane sweep in order and say what each plane must show.", "Set up the machine for a cardiac screen.", "Give the normal values for heart size, axis and rate, and the rates that need referral.", "List the criteria that make a four-chamber view normal.", "Confirm normal outflow tracts and a normal three-vessel-and-trachea view."], "sections": [{"heading": "Why five views", "blocks": [{"text": "A screening scan does not need to name the lesion. It needs to answer one question reliably: is this heart normal? The five-view sweep is the shortest route to that answer.", "refs": [], "table": null}, {"text": "Congenital heart disease affects about 8 in every 1000 live births, and fewer than half of cardiac anomalies are found before birth.", "refs": [1, 2], "table": null}, {"text": "Most detectable heart disease occurs in pregnancies with no risk factor at all. That is why the routine scan matters more than the referral list.", "refs": [3], "table": null}, {"text": "Some lesions, such as transposition and coarctation, may show nothing in the four-chamber plane. Adding the outflow-tract and great-vessel views raises detection above the four-chamber view alone.", "refs": [4, 5, 6], "table": null}, {"text": "The examination should include situs, the four-chamber view, and the outflow-tract and great-vessel views, ideally between 18 and 22 weeks.", "refs": [7, 8], "table": null}]}, {"heading": "Set up before you scan", "blocks": [{"text": "Use the highest transducer frequency that still penetrates. Harmonic imaging helps when the abdominal wall is thick and in the third trimester.", "refs": [9, 10], "table": null}, {"text": "Choose the cardiac preset: high frame rate, more contrast, low persistence, a single focal zone and a narrow sector.", "refs": [11], "table": null}, {"text": "Zoom until the heart fills a third to a half of the screen. Use cine-loop to watch the valves through the whole cycle.", "refs": [12, 13], "table": null}, {"text": "Store stills and clips of each view so the examination can be reviewed later.", "refs": [14], "table": null}]}, {"heading": "The sweep", "blocks": [{"text": "The examination is one continuous transverse sweep towards the fetal head through five planes: upper abdomen, four-chamber view, left ventricular outflow tract, right ventricular outflow tract with the three-vessel view, and the three-vessel-and-trachea view.", "refs": [15, 16, 17], "table": null}, {"text": "The upper planes are a continuum, not fixed pictures. They are judged more reliably live or on a clip than from stills.", "refs": [18], "table": null}, {"text": "If the fetus is lying badly, take more time or bring the patient back.", "refs": [19], "table": null}]}, {"heading": "Plane I: left, right and situs", "blocks": [{"text": "First work out which side of the fetus is left and which is right from its position in the uterus. Only then confirm that stomach and heart are both on the left.", "refs": [20], "table": null}, {"text": "At the level of the abdominal circumference: stomach on the left, descending aorta to the left of the spine, inferior vena cava to the right.", "refs": [21], "table": null}, {"text": "Normal abdominal situs stands in for normal atrial arrangement. If heart or stomach is not on the left, suspect a situs abnormality.", "refs": [22, 23], "table": null}]}, {"heading": "Plane II: size, position, axis, rate", "blocks": [{"text": "A normal heart is no larger than a third of the chest area.", "refs": [24], "table": null}, {"text": "It lies mainly in the left chest with its axis pointing left at about 45 degrees, 20 degrees either way. You can judge axis and position even when the rest of the view is poor.", "refs": [25, 26], "table": null}, {"text": "An abnormal axis raises the chance of a heart defect, especially of the outflow tracts. A heart that is pushed out of place points to something beside it: diaphragmatic hernia, a lung mass, or a small or absent lung.", "refs": [27, 28], "table": null}, {"text": "Rate is 120 to 160 beats per minute and regular. Occasional ectopic beats are common and usually harmless. Refer if they are frequent or the rhythm stays irregular for more than a week or two.", "refs": [29, 30, 31], "table": null}, {"text": "A brief slow rate from probe pressure is normal. A rate that stays at 110 or below, or at 180 or above, needs specialist assessment.", "refs": [32, 33], "table": null}]}, {"heading": "Plane II: the four-chamber criteria", "blocks": [{"text": "Seeing four chambers is not the same as a normal four-chamber view. The view is judged against specific criteria.", "refs": [34], "table": null}, {"text": "Atria: similar in size, foramen ovale flap moving in the left atrium, septum primum present. Where you can, show at least one pulmonary vein entering the left atrium.", "refs": [35, 36], "table": null}, {"text": "Ventricles: similar in size, walls not thick. The moderator band marks the right ventricle; the smooth left ventricle forms the apex.", "refs": [37, 38], "table": null}, {"text": "One ventricle clearly smaller than the other in mid-pregnancy is not a variant. Think of coarctation, an evolving hypoplastic left heart, and anomalous pulmonary veins.", "refs": [38], "table": null}, {"text": "Septum: follow it from apex to crux. It is best seen with the beam at right angles; with the beam along the septum, drop-out can fake a defect near the crux.", "refs": [39, 40], "table": null}, {"text": "Valves: two, opening separately and freely, with the tricuspid attached slightly nearer the apex than the mitral. Loss of that offset is a key sign of atrioventricular septal defect.", "refs": [41], "table": null}, {"text": "A thin rim of pericardial fluid, up to 2 mm, is normal.", "refs": [42], "table": null}]}, {"heading": "Plane III: left ventricular outflow tract", "blocks": [{"text": "A vessel leaves the left ventricle. Its front wall runs straight on from the ventricular septum, and it does not divide. The valve is thin and opens freely.", "refs": [43, 44, 45], "table": null}, {"text": "This view shows outlet septal defects and conotruncal and aortic valve problems that the four-chamber view hides.", "refs": [46], "table": null}]}, {"heading": "Plane IV: right ventricular outflow tract and three vessels", "blocks": [{"text": "A vessel leaves the right ventricle, crosses in front of the aorta almost at a right angle, and divides after a short course. It is usually slightly larger than the aorta. Its valve is thin and opens freely.", "refs": [43, 47, 48], "table": null}, {"text": "At the least, the two great arteries should be about the same size. A clear difference needs further assessment.", "refs": [49], "table": null}, {"text": "Three vessels in a line: pulmonary artery, aorta, superior vena cava, from left to right and from front to back, each smaller than the one before. Check number, size, alignment and arrangement.", "refs": [50], "table": null}, {"text": "Transposition, tetralogy of Fallot, double-outlet right ventricle, common arterial trunk and pulmonary atresia with a septal defect can all pass the four-chamber view. They typically fail this one.", "refs": [51], "table": null}]}, {"heading": "Plane V: three vessels and trachea", "blocks": [{"text": "The ductal arch and the aortic arch both pass to the left of the trachea and meet in a V. The two arches are similar in size. The trachea is a bright ring around a small dark centre.", "refs": [52, 53, 54], "table": null}, {"text": "This is the view for the arch: coarctation, right arch, double arch, vascular rings and an aberrant right subclavian artery.", "refs": [55, 56], "table": null}]}, {"heading": "Colour Doppler", "blocks": [{"text": "Colour is not mandatory for screening but is encouraged once you are competent with it.", "refs": [57], "table": null}, {"text": "Keep the colour box small and over the area of interest. Set the scale to about 50 to 70 cm/s for the heart and arteries, and about 15 to 25 cm/s for veins.", "refs": [58, 59], "table": null}, {"text": "Normal colour shows forward flow through all four valves and both arches. It makes the V easier to see and exposes leaking valves and reversed flow in an arch.", "refs": [60], "table": null}]}, {"heading": "When the screen is not normal", "blocks": [{"text": "Any fetus with a suspected abnormality on screening should have a fetal echocardiogram.", "refs": [61], "table": null}, {"text": "About half of missed diagnoses in one study came from views that did not meet technical standards, and nearly a third from not recognising the abnormality on an adequate view. Both are trainable.", "refs": [62], "table": null}]}], "checklist": null, "drills": {"items": [{"id": "D1-Q01", "question": "Which is the correct order of the five screening planes, moving towards the fetal head?", "options": ["Upper abdomen, four-chamber, LVOT, RVOT / three-vessel, three-vessel-and-trachea", "Four-chamber, upper abdomen, RVOT, LVOT, three-vessel-and-trachea", "Upper abdomen, LVOT, four-chamber, three-vessel-and-trachea, RVOT", "Four-chamber, LVOT, RVOT, upper abdomen, three-vessel"], "answer": 0, "explanation": "One transverse sweep from the upper abdomen to the upper mediastinum.", "claims": ["IS23-023"], "status": "expert-verified"}, {"id": "D1-Q02", "question": "What is the normal cardiac axis?", "options": ["About 45 degrees to the left, 20 degrees either way", "About 20 degrees to the left, 10 degrees either way", "About 90 degrees to the left", "Midline"], "answer": 0, "explanation": "45 degrees plus or minus 20, measured against the front-to-back axis of the chest.", "claims": ["IS23-028"], "status": "expert-verified"}, {"id": "D1-Q03", "question": "How much of the chest area does a normal heart occupy?", "options": ["No more than about one third", "About one tenth", "About two thirds", "About one half"], "answer": 0, "explanation": "Usually no larger than a third of the chest area.", "claims": ["IS23-026"], "status": "expert-verified"}, {"id": "D1-Q04", "question": "The fetal heart rate stays at 105 beats per minute throughout the scan in an otherwise well fetus. What next?", "options": ["Timely review by a fetal cardiac specialist", "Nothing; this is within the normal range", "Repeat the anomaly scan in the third trimester", "Record it as transient probe-pressure bradycardia"], "answer": 0, "explanation": "Normal is 120 to 160. Persistent bradycardia at 110 or below needs specialist evaluation; transient slowing from probe pressure does not persist.", "claims": ["IS23-033", "IS23-036"], "status": "expert-verified"}, {"id": "D1-Q05", "question": "You can count four chambers. Is the four-chamber view normal?", "options": ["Not yet: the view has specific criteria beyond the count", "Yes: four chambers means the view is normal", "Yes, provided the heart rate is normal", "Only colour Doppler can tell"], "answer": 0, "explanation": "The four-chamber and three-vessel views need much more than a count of structures.", "claims": ["IS23-007"], "status": "expert-verified"}, {"id": "D1-Q06", "question": "In normal situs, where are the great vessels in the upper-abdomen plane?", "options": ["Aorta left of the spine, inferior vena cava right of the spine", "Aorta right of the spine, inferior vena cava left of the spine", "Both on the left of the spine", "Both on the right of the spine"], "answer": 0, "explanation": "Stomach left; aorta left; vena cava right.", "claims": ["IS23-024"], "status": "expert-verified"}, {"id": "D1-Q07", "question": "What must be established before assessing situs?", "options": ["Which side is the fetal left and right", "The cardiac axis", "The heart rate", "The size of the great arteries"], "answer": 0, "explanation": "Laterality first, from the fetal position in the uterus.", "claims": ["IS23-021"], "status": "expert-verified"}, {"id": "D1-Q08", "question": "When is mid-trimester cardiac screening best performed?", "options": ["18 to 22 weeks", "11 to 14 weeks", "24 to 28 weeks", "After 32 weeks"], "answer": 0, "explanation": "18 to 22 weeks is the optimal window.", "claims": ["IS23-010"], "status": "expert-verified"}, {"id": "D1-Q09", "question": "How far should you zoom for the cardiac views?", "options": ["Until the heart fills a third to a half of the screen", "Until the whole fetus is on screen", "Until the heart fills about a tenth of the screen", "Zoom does not matter if the frame rate is high"], "answer": 0, "explanation": "Magnify until the heart fills at least one third to one half of the screen.", "claims": ["IS23-015"], "status": "expert-verified"}, {"id": "D1-Q10", "question": "Which group of settings suits a cardiac screen?", "options": ["High frame rate, low persistence, single focal zone, narrow sector", "Low frame rate, high persistence, multiple focal zones, wide sector", "High frame rate, high persistence, multiple focal zones, wide sector", "Low frame rate, low persistence, single focal zone, wide sector"], "answer": 0, "explanation": "These are usually built into the cardiac preset.", "claims": ["IS23-014"], "status": "expert-verified"}, {"id": "D1-Q11", "question": "At 20 weeks the left ventricle looks clearly smaller than the right. How should you treat this?", "options": ["As abnormal until proven otherwise: arrange further examination", "As a normal variant at this stage", "As an artefact of the beam angle", "As normal if the heart rate is regular"], "answer": 0, "explanation": "Mild disproportion can be a variant in the third trimester, but asymmetry in mid-pregnancy warrants further examination. Causes include coarctation, evolving hypoplastic left heart and anomalous pulmonary veins.", "claims": ["IS23-043"], "status": "expert-verified"}, {"id": "D1-Q12", "question": "Which structure marks the morphological right ventricle in the four-chamber view?", "options": ["The moderator band near the apex", "The smooth wall forming the apex of the heart", "The foramen ovale flap", "The pulmonary veins"], "answer": 0, "explanation": "The moderator band identifies the right ventricle; the smooth left ventricle forms the apex.", "claims": ["IS23-042"], "status": "expert-verified"}, {"id": "D1-Q13", "question": "The two atrioventricular valves appear to attach to the septum at exactly the same level. What does this suggest?", "options": ["Possible atrioventricular septal defect", "A normal crux", "Tricuspid regurgitation", "A normal third-trimester variant"], "answer": 0, "explanation": "Normally the tricuspid septal leaflet inserts nearer the apex than the mitral. Abnormal alignment is a key finding in atrioventricular septal defect.", "claims": ["IS23-047"], "status": "expert-verified"}, {"id": "D1-Q14", "question": "With the beam running along the ventricular septum, you see a gap near the crux. What is the first thing to do?", "options": ["Re-image with the beam at right angles to the septum", "Report a ventricular septal defect", "Report an atrioventricular septal defect", "Ignore it"], "answer": 0, "explanation": "A beam parallel to the septum can produce drop-out that mimics a defect near the crux. The septum is best seen perpendicular to the beam.", "claims": ["IS23-045"], "status": "expert-verified"}, {"id": "D1-Q15", "question": "What confirms a normal left ventricular outflow tract view?", "options": ["The vessel's front wall is continuous with the septum and the vessel does not divide", "The vessel divides into two branches soon after its origin", "The vessel runs parallel to the other great artery", "The vessel is clearly larger than the other great artery"], "answer": 0, "explanation": "Septal continuity and no bifurcation identify the aorta leaving the left ventricle.", "claims": ["IS23-052", "IS23-059"], "status": "expert-verified"}, {"id": "D1-Q16", "question": "How do the two great arteries normally relate as they leave the heart?", "options": ["They cross, the pulmonary artery passing in front almost at a right angle", "They run side by side in parallel", "The aorta passes in front of the pulmonary artery", "They arise from a single common vessel"], "answer": 0, "explanation": "Normal crossover: the pulmonary artery crosses the ascending aorta at nearly a right angle.", "claims": ["IS23-052", "IS23-065"], "status": "expert-verified"}, {"id": "D1-Q17", "question": "In the normal three-vessel view, what is the order from fetal left to right?", "options": ["Pulmonary artery, aorta, superior vena cava", "Aorta, pulmonary artery, superior vena cava", "Superior vena cava, aorta, pulmonary artery", "Pulmonary artery, superior vena cava, aorta"], "answer": 0, "explanation": "Pulmonary artery (largest, most anterior), aorta, superior vena cava (smallest, most posterior).", "claims": ["IS23-066"], "status": "expert-verified"}, {"id": "D1-Q18", "question": "The four-chamber view is normal. Which view is most likely to expose transposition of the great arteries?", "options": ["The outflow-tract and three-vessel views", "The upper-abdomen view", "A repeat four-chamber view with more zoom", "None; it cannot be detected on screening"], "answer": 0, "explanation": "Transposition can have a normal-looking four-chamber view but is typically abnormal in the three-vessel view.", "claims": ["IS23-008", "IS23-067"], "status": "expert-verified"}, {"id": "D1-Q19", "question": "What is the normal appearance of the three-vessel-and-trachea view?", "options": ["Both arches to the left of the trachea, meeting in a V", "One arch on each side of the trachea", "Both arches to the right of the trachea", "The arches running parallel without meeting"], "answer": 0, "explanation": "The ductal and aortic arches both pass left of the trachea and form a V.", "claims": ["IS23-069"], "status": "expert-verified"}, {"id": "D1-Q20", "question": "What colour velocity scale suits the heart and great arteries in a mid-trimester screen?", "options": ["About 50 to 70 cm/s", "About 5 to 10 cm/s", "About 15 to 25 cm/s", "About 150 to 200 cm/s"], "answer": 0, "explanation": "About 50 to 70 cm/s for intracardiac structures and vessels; about 15 to 25 cm/s is for veins.", "claims": ["IS23-077"], "status": "expert-verified"}, {"id": "D1-Q21", "question": "You notice occasional skipped beats in an otherwise normal low-risk scan. What is the usual significance?", "options": ["Often benign and self-resolving; refer if frequent or persisting beyond a week or two", "Always a sign of structural heart disease", "An indication for immediate delivery planning", "A sign of heart block"], "answer": 0, "explanation": "Ectopic beats are the commonest rhythm disturbance and are often benign. Frequent episodes or persistent irregularity need further assessment.", "claims": ["IS23-034", "IS23-035"], "status": "expert-verified"}, {"id": "D1-Q22", "question": "A thin rim of pericardial fluid, under 2 mm, is seen at 28 weeks. How do you interpret it?", "options": ["A normal finding", "A pericardial effusion needing urgent referral", "A sign of hydrops", "A sign of infection"], "answer": 0, "explanation": "A small amount of pericardial fluid, 2 mm or less at end-systole, is common in the second and third trimesters and is normal.", "claims": ["IS23-027"], "status": "expert-verified"}]}, "video": {"title": "The five-view sweep", "minutes": 8, "beats": [{"shot": "Presenter to camera", "narration": "You do not have to name the lesion. You have to notice that the heart is not normal. Five planes, one sweep."}, {"shot": "Machine console and screen", "narration": "Cardiac preset. Narrow the sector. One focal zone at the heart. Zoom until the heart fills a third to a half of the screen."}, {"shot": "Diagram: fetus with five stacked planes", "narration": "From the upper abdomen towards the head: abdomen, four chambers, left outflow, right outflow with three vessels, three vessels and trachea."}, {"shot": "Split screen: hand on abdomen / ultrasound screen", "narration": "Work out fetal left and right first. Abdomen: stomach left, aorta left of the spine, vena cava right."}, {"shot": "Four-chamber clip with overlay of thorax outline and axis line", "narration": "A third of the chest. Mostly on the left. Axis forty-five degrees, give or take twenty. Rate one-twenty to one-sixty, regular."}, {"shot": "Four-chamber clip, labels appearing one by one", "narration": "Two atria the same size, flap in the left. Two ventricles the same size, moderator band on the right. Septum intact from apex to crux. Two valves, the tricuspid a little nearer the apex."}, {"shot": "Split screen: small tilt of the hand / LVOT clip", "narration": "Slide up. A vessel from the left ventricle, its wall continuous with the septum. It does not divide."}, {"shot": "R r is needed for a screening scan, what it adds on each view, and how to set it.", "public": false, "status": "ai-extracted", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-extracted' that no clinician has verified.", "objectives": ["Say whether colour Doppler is required for cardiac screening.", "Set the colour box, velocity scale and persistence for the heart and for veins.", "Describe normal colour flow through the heart and the great arteries.", "Name the abnormal patterns colour makes easier to see.", "Apply the safety limits for Doppler in early pregnancy."], "sections": [{"heading": "Is colour required?", "blocks": [{"text": "Colour flow Doppler is not mandatory in cardiac screening. The 2023 guideline encourages examiners to become familiar with it and to add it to the routine scan, and it can be used when the operator feels competent.", "refs": [1, 2], "table": null}, {"text": "Colour may be valuable in obese patients and may further improve detection of major heart disease in low-risk pregnancies.", "refs": [3], "table": null}, {"text": "Grey-scale comes first. Colour is added to a plane you have already obtained properly; it does not rescue a poor view.", "refs": [], "table": null}]}, {"heading": "What normal colour shows", "blocks": [{"text": "In a normal heart, colour shows forward flow across both atrioventricular valves, both semilunar valves and both great arteries.", "refs": [4], "table": null}, {"text": "In the three-vessel-and-trachea view, colour helps to show the V formed by the two arches.", "refs": [4], "table": null}, {"text": "A pulmonary vein entering the left atrium should be shown on grey-scale where technically feasible. Colour can help with this but is not mandatory for it.", "refs": [5], "table": null}]}, {"heading": "What colour exposes", "blocks": [{"text": "Colour highlights abnormal flow patterns such as regurgitation through an atrioventricular valve and reversed flow in the ductus arteriosus or the aortic arch.", "refs": [4], "table": null}, {"text": "In a full fetal echocardiogram, colour is used to look for valve stenosis and regurgitation, flow across the foramen ovale, the integrity of the septa and the patency of vessels.", "refs": [6], "table": null}]}, {"heading": "Setting up colour", "blocks": [{"text": "Keep the colour box narrow and place it only over the area of interest. This preserves frame rate and the quality of the colour image.", "refs": [7], "table": null}, {"text": "For a second-trimester screen, set the colour velocity scale to about 50 to 70 cm/s for the heart and the arteries, with low colour persistence. Use a lower scale, about 15 to 25 cm/s, for veins.", "refs": [8], "table": null}, {"text": "Set the scale to suit the velocities you are looking at. Adjust colour gain and persistence so that colour fills the chamber or vessel without hiding the grey-scale image.", "refs": [9], "table": null}, {"text": "Starting settings for a second-trimester screen.", "refs": [7, 8], "table": {"columns": ["Looking at", "Colour velocity scale", "Other settings"], "rows": [["Valves, ventricles, great arteries, arches", "About 50 to 70 cm/s", "Narrow box, low persistence"], ["Veins, such as the pulmonary veins", "About 15 to 25 cm/s", "Narrow box"]]}}]}, {"heading": "Always beside grey-scale", "blocks": [{"text": "When colour is used, display it alongside the grey-scale image. This avoids false-negative findings.", "refs": [10], "table": null}]}, {"heading": "Power Doppler", "blocks": [{"text": "Power Doppler shows the strength of the Doppler signal, not the frequency shift. It helps to show small vessels, slow flow such as in veins, and septal defects. Directional power Doppler adds the direction of flow.", "refs": [11], "table": null}]}, {"heading": "Colour in early pregnancy", "blocks": [{"text": "For early cardiac screening, colour or high-quality power Doppler is recommended in addition to grey-scale.", "refs": [12], "table": null}, {"text": "In early screening, use Doppler mainly for the four-chamber view and the three-vessel-and-trachea view. Keep the thermal index at 1.0 or less and the exposure as short as possible, usually no more than 5 to 10 minutes.", "refs": [13], "table": null}, {"text": "The echocardiography guideline gives the same direction: in early gestation keep the thermal and mechanical indices at or below 1.0 and use Doppler sparingly.", "refs": [14], "table": null}]}], "checklist": {"title": "Colour on a screening scan", "items": [{"text": "Colour box narrow, over the area of interest only", "refs": [7]}, {"text": "Scale about 50 to 70 cm/s for heart and arteries; about 15 to 25 cm/s for veins; low persistence", "refs": [8]}, {"text": "Colour shown beside the grey-scale image", "refs": [10]}, {"text": "Forward flow across all four valves and both great arteries", "refs": [4]}, {"text": "V of the two arches shown at the three-vessel-and-trachea view", "refs": [4]}, {"text": "Early pregnancy: thermal index 1.0 or less, exposure kept short", "refs": [13]}]}, "drills": {"items": [{"id": "D7-Q01", "question": "Is colour flow Doppler mandatory for a cardiac screening examination?", "options": ["No, but it is encouraged and can be used when the operator feels competent", "Yes, on every view", "Yes, but only on the four-chamber view", "No, and it should be avoided in the second trimester"], "answer": 0, "explanation": "Colour is not mandatory in screening. The guideline encourages becoming familiar with it and adding it to the routine scan.", "claims": ["IS23-073"], "status": "expert-verified"}, {"id": "D7-Q02", "question": "For a second-trimester screen, which colour velocity scale suits the heart and great arteries?", "options": ["About 50 to 70 cm/s", "About 15 to 25 cm/s", "About 5 to 10 cm/s", "About 150 to 200 cm/s"], "answer": 0, "explanation": "About 50 to 70 cm/s for intracardiac structures and vessels, with low persistence.", "claims": ["IS23-077"], "status": "expert-verified"}, {"id": "D7-Q03", "question": "You want to show a pulmonary vein with colour. Which velocity scale is appropriate?", "options": ["About 15 to 25 cm/s", "About 50 to 70 cm/s", "About 100 cm/s", "The same scale as for the aortic valve"], "answer": 0, "explanation": "Veins need a lower scale, about 15 to 25 cm/s.", "claims": ["IS23-077"], "status": "expert-verified"}, {"id": "D7-Q04", "question": "How should the colour box be set?", "options": ["Narrow, and only over the area of interest", "As wide as the whole sector", "Over the whole fetal chest and abdomen", "Its size does not affect the image"], "answer": 0, "explanation": "A narrow box over the area of interest preserves frame rate and colour image quality.", "claims": ["IS23-076"], "status": "expert-verified"}, {"id": "D7-Q05", "question": "Why should the colour image be displayed alongside the grey-scale image?", "options": ["To avoid false-negative findings", "To reduce the thermal index", "To increase the frame rate", "Because colour cannot be stored on its own"], "answer": 0, "explanation": "Showing colour beside grey-scale avoids false-negative findings.", "claims": ["IS23-041"], "status": "ai-extracted"}, {"id": "D7-Q06", "question": "What does normal colour flow look like across the four heart valves?", "options": ["Forward flow across both atrioventricular valves and both semilunar valves", "Forward flow across the atrioventricular valves, with a small backward jet at each", "Flow in opposite directions in the two great arteries", "No visible flow across the semilunar valves at screening settings"], "answer": 0, "explanation": "A normal heart shows antegrade flow across the atrioventricular and semilunar valves and the great arteries.", "claims": ["IS23-074"], "status": "expert-verified"}, {"id": "D7-Q07", "question": "Which finding does colour Doppler make easier to see?", "options": ["Reversed flow in the aortic arch or the ductus arteriosus", "The thickness of the ventricular wall", "The size of the heart against the chest", "The cardiac axis"], "answer": 0, "explanation": "Colour highlights abnormal patterns such as atrioventricular valve regurgitation and flow reversal in the ductus arteriosus or aortic arch. Size and axis are grey-scale judgements.", "claims": ["IS23-074"], "status": "expert-verified"}, {"id": "D7-Q08", "question": "Is colour Doppler needed to show a pulmonary vein entering the left atrium at screening?", "options": ["No: it should be shown on grey-scale where feasible; colour can help but is not mandatory", "Yes: pulmonary veins can only be shown with colour", "Yes: pulsed-wave Doppler is also required", "Pulmonary veins are not part of the screening examination"], "answer": 0, "explanation": "At least one pulmonary vein should be seen entering the left atrium on B-mode when technically feasible. Colour can help but is not mandatory.", "claims": ["IS23-040"], "status": "expert-verified"}, {"id": "D7-Q09", "question": "You are using colour Doppler at an early cardiac screen. What is the limit for the thermal index?", "options": ["1.0 or less", "2.0 or less", "There is no limit for colour Doppler", "5.0 or less"], "answer": 0, "explanation": "In early screening the thermal index should be 1.0 or less and exposure as short as possible.", "claims": ["IS23-093", "AS23-006"], "status": "ai-extracted"}, {"id": "D7-Q10", "question": "At an early cardiac screen, on which views should Doppler mainly be used?", "options": ["The four-chamber view and the three-vessel-and-trachea view", "Every plane, for as long as needed", "The upper abdomen only", "The sagittal arch views only"], "answer": 0, "explanation": "In early screening Doppler is used mainly for the four-chamber and three-vessel-and-trachea views, with exposure kept short.", "claims": ["IS23-093"], "status": "ai-extracted"}, {"id": "D7-Q11", "question": "What does power Doppler display?", "options": ["The strength of the Doppler signal, which helps with small vessels and slow flow", "The peak velocity of flow in cm/s", "The timing of atrial against ventricular contraction", "Tissue movement at the valve annulus"], "answer": 0, "explanation": "Power Doppler displays signal amplitude, not frequency shift, and helps to show small vessels, low-velocity flow and septal defects.", "claims": ["AS23-011"], "status": "ai-extracted"}]}, "video": {"title": "Adding colour to the sweep", "minutes": 5, "beats": [{"shot": "Presenter to camera", "narration": "Colour is not compulsory for screening. It is encouraged. Learn it on normal hearts first."}, {"shot": "Machine console: colour key, box size, scale control", "narration": "Small box, only where you are looking. Scale fifty to seventy for the heart and arteries. Fifteen to twenty-five for veins. Persistence low."}, {"shot": "Split screen: grey-scale four-chamber beside the same view in colour", "narration": "Keep grey-scale beside colour. Two valves, two streams filling the ventricles, both going forward."}, {"shot": "Outflow tract clips in colour", "narration": "Forward flow through the aortic valve. Forward flow through the pulmonary valve."}, {"shot": "Three-vessel-and-trachea clip in colour", "narration": "Two arches meeting in a V, the same colour. If one arch is the opposite colour, flow is reversed. That is not normal."}, {"shot": "Screen close-up of thermal index display", "narration": "In early pregnancy, watch the thermal index. One or less. Keep it short."}]}, "missing": ["Common colour traps (aliasing, colour bleeding over a septum, wrong scale hiding a jet) with how to recognise each - needs a source; partly planned for D10 and XA4.", "How to use colour on the ventricular septum to look for a defect at screening level - not stated in the screening guideline.", "Voluson-specific colour presets and HD-flow - needs a source and the editor's input."], "references": ["Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynec , {"id": "D8", "title": "Rate and rhythm for the screener", "tier": "Detect", "version": 0.1, "summary": "The normal fetal heart rate, which irregular, slow and fast rhythms can be watched, and which need a specialist.", "public": false, "status": "ai-extracted", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-extracted' that no clinician has verified.", "objectives": ["Give the normal fetal heart rate at screening.", "Tell benign ectopic beats from an irregular rhythm that needs assessment.", "Tell transient slowing from persistent bradycardia, and transient speeding from persistent tachycardia.", "Name the rhythm findings that are indications for fetal echocardiography.", "Describe in outline how a specialist works out the mechanism of an arrhythmia."], "sections": [{"heading": "Normal", "blocks": [{"text": "The normal heart rate is 120 to 160 beats per minute, and the rhythm should be regular.", "refs": [1], "table": null}, {"text": "Rate and rhythm are checked on the four-chamber view as part of every screen. The screener's task is not to name the arrhythmia. It is to decide between three answers: normal, watch and re-check, or refer.", "refs": [], "table": null}]}, {"heading": "The irregular beat", "blocks": [{"text": "Ectopic beats, seen as skipped beats, are the most common rhythm disturbance. They are often benign and resolve on their own. In low-risk populations they are not linked to a higher risk of structural heart disease.", "refs": [2], "table": null}, {"text": "Further assessment is indicated when ectopic episodes are frequent, meaning more often than every three to five beats, or when the rhythm stays irregular for more than one to two weeks.", "refs": [3], "table": null}]}, {"heading": "The slow heart", "blocks": [{"text": "A brief slow rate, often caused by pressure from the transducer, is seen in normal second-trimester fetuses.", "refs": [4], "table": null}, {"text": "A rate that stays at 110 beats per minute or below in a fetus that is otherwise well needs timely evaluation by a fetal cardiac specialist. Possible causes include frequent blocked atrial ectopic beats, atrioventricular block and sinus bradycardia.", "refs": [4], "table": null}, {"text": "Transducer pressure is a common cause of brief slowing, so ease the pressure and watch the rate. What matters is whether the slow rate persists.", "refs": [4], "table": null}]}, {"heading": "The fast heart", "blocks": [{"text": "A mild, brief rise to 160 to 180 beats per minute can be a normal variant during fetal movement.", "refs": [5], "table": null}, {"text": "A rate that stays at 180 beats per minute or above should be evaluated further for a tachyarrhythmia or fetal hypoxia.", "refs": [5], "table": null}]}, {"heading": "At a glance", "blocks": [{"text": "Rate and rhythm findings and what each means at screening.", "refs": [1, 2, 3, 4, 5], "table": {"columns": ["Finding", "Meaning for the screener"], "rows": [["120 to 160 per minute, regular", "Normal"], ["Occasional skipped beats", "Common and often benign"], ["Skipped beats more often than every three to five beats, or irregular for more than one to two weeks", "Further assessment"], ["Brief slowing that recovers, often with probe pressure", "Seen in normal fetuses"], ["Stays at 110 per minute or below", "Timely specialist evaluation"], ["Brief rise to 160 to 180 per minute with movement", "Can be a normal variant"], ["Stays at 180 per minute or above", "Further evaluation"]]}}]}, {"heading": "Rhythm findings that are indications for fetal echocardiography", "blocks": [{"text": "The guideline lists these among the fetal indications for fetal echocardiography: persistent tachycardia at 180 beats per minute or more, suspected heart block or persistent bradycardia at 110 or less, and a rhythm that is frequently or persistently irregular.", "refs": [6], "table": null}]}, {"heading": "What the specialist will do", "blocks": [{"text": "When the rhythm is irregular, slow or fast, the mechanism should be documented with M-mode, pulsed-wave Doppler or tissue Doppler, alone or together.", "refs": [7], "table": null}, {"text": "M-mode times the atria against the ventricles: the cursor passes through an atrial wall and the free wall of a ventricle together.", "refs": [8], "table": null}, {"text": "Pulsed-wave Doppler does the same by sampling two flows at once: superior vena cava with ascending aorta, mitral inflow with aortic outflow, or pulmonary artery with pulmonary vein.", "refs": [9], "table": null}, {"text": "You do not need these techniques to screen. Knowing what they are helps you explain to the family why they are being referred.", "refs": [], "table": null}]}], "checklist": {"title": "Rate and rhythm at every screen", "items": [{"text": "Rate between 120 and 160 per minute", "refs": [1]}, {"text": "Rhythm regular", "refs": [1]}, {"text": "If slow: probe pressure eased and rate watched until it recovers or is shown to persist", "refs": [4]}, {"text": "Persistent rate of 110 or below: specialist evaluation arranged", "refs": [4]}, {"text": "Persistent rate of 180 or above: further evaluation arranged", "refs": [5]}, {"text": "Ectopic beats: frequency noted; re-check arranged; referred if frequent or still irregular after one to two weeks", "refs": [3]}]}, "drills": {"items": [{"id": "D8-Q01", "question": "What is the normal fetal heart rate at a screening scan?", "options": ["120 to 160 beats per minute, regular", "100 to 140 beats per minute, regular", "140 to 180 beats per minute, regular", "Any rate above 100, regular or not"], "answer": 0, "explanation": "Normal is 120 to 160 beats per minute with a regular rhythm.", "claims": ["IS23-033"], "status": "expert-verified"}, {"id": "D8-Q02", "question": "You see an occasional skipped beat in an otherwise normal heart in a low-risk pregnancy. What does the guideline say about this finding?", "options": ["It is the most common rhythm disturbance, often benign, and usually resolves on its own", "It indicates structural heart disease until proven otherwise", "It is a sign of fetal hypoxia", "It always needs a fetal echocardiogram the same day"], "answer": 0, "explanation": "Ectopic beats are common, often benign and resolve spontaneously; in low-risk populations they are not associated with increased risk of structural heart disease.", "claims": ["IS23-034"], "status": "expert-verified"}, {"id": "D8-Q03", "question": "A beat is dropped after every second or third normal beat throughout the scan. What next?", "options": ["Arrange further assessment: ectopic beats this frequent are an indication", "Reassure; all ectopic beats are benign", "Record a normal rhythm", "Repeat the scan only if the mother notices reduced movement"], "answer": 0, "explanation": "Frequent ectopic episodes, more often than every three to five beats, are an indication for further assessment.", "claims": ["IS23-035"], "status": "expert-verified"}, {"id": "D8-Q04", "question": "Occasional ectopic beats were seen two weeks ago. Today the rhythm is still irregular. What next?", "options": ["Arrange further assessment: the irregularity has persisted beyond one to two weeks", "Review again in another month", "No action; duration does not matter", "Stop checking the rhythm at later scans"], "answer": 0, "explanation": "A rhythm that stays irregular for more than one to two weeks is an indication for further assessment.", "claims": ["IS23-035"], "status": "expert-verified"}, {"id": "D8-Q05", "question": "The heart slows for a few seconds while you press to improve the view, then recovers when you ease off. What is this?", "options": ["Transient bradycardia, which is seen in normal second-trimester fetuses", "Atrioventricular block", "Persistent bradycardia needing urgent referral", "A sign of a structural heart defect"], "answer": 0, "explanation": "Transient bradycardia, often from transducer pressure, is seen in normal fetuses. Persistent bradycardia is what needs evaluation.", "claims": ["IS23-036"], "status": "expert-verified"}, {"id": "D8-Q06", "question": "The rate stays at 100 beats per minute for the whole examination. The fetus is otherwise well. What next?", "options": ["Timely evaluation by a fetal cardiac specialist", "Nothing; this is normal", "Recheck at the next routine visit", "Record it as probe-pressure bradycardia"], "answer": 0, "explanation": "Persistent bradycardia at 110 or below in a well fetus needs timely evaluation by a fetal cardiac specialist.", "claims": ["IS23-036"], "status": "expert-verified"}, {"id": "D8-Q07", "question": "Which of these is a possible cause of persistent fetal bradycardia?", "options": ["Frequent blocked atrial ectopic beats", "Fetal movement", "A cardiac axis of 45 degrees", "A thin rim of pericardial fluid"], "answer": 0, "explanation": "Possible causes named in the guideline are frequent blocked atrial ectopic beats, atrioventricular block and sinus bradycardia.", "claims": ["IS23-036"], "status": "expert-verified"}, {"id": "D8-Q08", "question": "During active fetal movement the rate rises to 170 beats per minute for a short time and then returns to 150. How is this read?", "options": ["It can be a normal variant", "Persistent tachycardia; refer", "A tachyarrhythmia", "A sign of fetal hypoxia"], "answer": 0, "explanation": "Mild transient tachycardia of 160 to 180 can be a normal variant during fetal movement.", "claims": ["IS23-037"], "status": "expert-verified"}, {"id": "D8-Q09", "question": "The rate stays at 190 beats per minute. What should be considered?", "options": ["A tachyarrhythmia or fetal hypoxia; evaluate further", "A normal response to movement", "Probe pressure", "Nothing, if the four-chamber view is normal"], "answer": 0, "explanation": "Persistent tachycardia at 180 or more should be evaluated further for tachyarrhythmia or fetal hypoxia.", "claims": ["IS23-037"], "status": "expert-verified"}, {"id": "D8-Q10", "question": "Which rhythm finding is listed as an indication for fetal echocardiography?", "options": ["Persistent bradycardia at 110 beats per minute or less", "A rate of 150 beats per minute", "A single ectopic beat seen once", "Brief slowing with probe pressure"], "answer": 0, "explanation": "Persistent tachycardia (180 or more), suspected heart block or persistent bradycardia (110 or less) and frequent or persistently irregular rhythm are listed fetal indications.", "claims": ["IS23-082"], "status": "ai-extracted"}, {"id": "D8-Q11", "question": "How does M-mode help the specialist work out the mechanism of an arrhythmia?", "options": ["It times atrial against ventricular contraction with one cursor through an atrial wall and a ventricular wall", "It measures the peak velocity across a valve", "It shows the direction of flow in the arches", "It measures the size of the heart against the chest"], "answer": 0, "explanation": "M-mode times atrial against ventricular contraction; the cursor passes through an atrial wall and the free wall of a ventricle together.", "claims": ["AS23-017"], "status": "ai-extracted"}]}, "video": {"title": "Rate and rhythm in one minute of scanning", "minutes": 4, "beats": [{"shot": "Four-chamber clip, normal rhythm, with rate displayed", "narration": "One-twenty to one-sixty, and regular. Check it on every four-chamber view."}, {"shot": "Clip with an occasional early beat and a pause", "narration": "A skipped beat now and then is the commonest rhythm finding. It is often harmless and usually settles."}, {"shot": "Graphic: counting beats between pauses", "narration": "Count the beats between the pauses. More often than every three to five beats, or still irregular after a week or two, and the fetus needs further assessment."}, {"shot": "Split screen: hand pressing then easing / rate slowing then recovering", "narration": "Slow? Ease the pressure and watch. If it recovers, that is seen in normal fetuses. If it stays at one-ten or below, a specialist needs to see this fetus."}, {"shot": "Clip of a fast regular rhythm with rate displayed", "narration": "Fast for a moment with movement, up to one-eighty, can be normal. Staying at one-eighty or above cannot be left."}]}, "missing": ["How urgently each rhythm finding should be seen (same day, within a week) - not stated in the screening guideline; needs a source and the editor's decision.", "Signs that a fetus with an arrhythmia is unwell (hydrops, effusions) and what the screener should record - needs a source.", "How to count the fetal heart rate reliably at screening (M-mode or Doppler method) - needs a source.", "Maternal conditions linked to heart block and how they change follow-up - planned for XC4."], "references": ["Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Four-chamber view, p. 791; Appendix 1. (IS23-033, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Four-chamber view, p. 791. (IS23-034, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Four-chamber view, p. 792. (IS23-035, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Four-chamber view, p. 792. (IS23-036, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Four-chamber view, p. 792. (IS23-037, expert-verified)", "Carvalho JS, Axt-Fliedner R, Chaoui R, Copel JA, Cuneo BF, Goff D, et al.. ISUOG Practice Guidelines (updated): fetal cardiac screening. Ultrasound Obstet Gynecol. 2023 61:788-803. doi:10.1002/uog.26224 – Table 2, 'Fetal factors', p. 797. (IS23-082, ai-extracted)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – Key points; IV.A Rhythm, p. 697. (AS23-016, ai-extracted)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – IV.A Rhythm; Figure 11, p. 697. (AS23-017, ai-extracted)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – IV.A Rhythm; Figure 11, p. 697. (AS23-018, ai-extracted)"]}, {"id": "D9", "title": "The heart at 11 to 14 weeks", "tier": "Detect", "version": 0.1, "summary": "What can and cannot be checked in the fetal heart at the early scan, how to do it safely, and when to refer.", "public": false, "status": "ai-extracted", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-extracted' that no clinician has verified.", "objectives": ["State the place of early cardiac screening: effective, but not routine or mandatory.", "Give the minimum cardiac check at the early scan.", "List the components of a detailed early cardiac screen.", "Apply the Doppler safety limits for early pregnancy.", "Say which nuchal translucency measurements lead to cardiac referral."], "sections": [{"heading": "Where early screening stands", "blocks": [{"text": "The screening guideline is written for the second trimester. It also considers screening in the late first and early second trimester where this is technically feasible.", "refs": [1], "table": null}, {"text": "First-trimester cardiac screening has been shown to be effective in low-risk populations. It is neither routine nor mandatory. Where possible, it can be done at the nuchal translucency scan.", "refs": [2], "table": null}, {"text": "The cardiac screening examination is performed optimally between 18 and 22 weeks.", "refs": [3], "table": null}]}, {"heading": "The minimum", "blocks": [{"text": "The minimum requirements at an early screen are to see the heart within the chest and to confirm a regular rhythm.", "refs": [4], "table": null}, {"text": "Cardiac structures are seen successfully significantly more often after 12 weeks and 3 days.", "refs": [4], "table": null}]}, {"heading": "Equipment", "blocks": [{"text": "High-frequency transabdominal transducers are recommended for early screening; a transvaginal transducer may be used. Colour Doppler, high-quality power Doppler, or both are used in addition to grey-scale.", "refs": [5], "table": null}, {"text": "The echocardiography guideline notes that frequencies of 5 to 12 MHz may help in the late first and early second trimesters.", "refs": [6], "table": null}]}, {"heading": "Safety", "blocks": [{"text": "In early screening, use Doppler mainly for the four-chamber view and the three-vessel-and-trachea view. Keep the thermal index at 1.0 or less. Keep exposure as short as possible, usually no more than 5 to 10 minutes.", "refs": [7], "table": null}, {"text": "The echocardiography guideline gives the same direction for early gestation: thermal and mechanical indices at or below 1.0, and Doppler used sparingly.", "refs": [8], "table": null}]}, {"heading": "A detailed early cardiac screen", "blocks": [{"text": "When a detailed early screen is done, three components are recommended.", "refs": [9], "table": {"columns": ["Component", "Mode", "What to show"], "rows": [["Situs and cardiac axis", "Grey-scale", "Position and axis of the heart"], ["Four-chamber view", "Grey-scale, and colour or power Doppler", "The four-chamber view on both"], ["Three-vessel-and-trachea view", "Colour or power Doppler", "Aortic and ductal arches, both on the left"]]}}]}, {"heading": "Limits of the early scan", "blocks": [{"text": "Outflow-tract views are often difficult in early gestation and are prone to both false-negative and false-positive diagnosis.", "refs": [10], "table": null}, {"text": "Any suspicion at the early scan should lead to referral for early fetal echocardiography.", "refs": [10], "table": null}, {"text": "Some lesions are not discovered until later in pregnancy.", "refs": [11], "table": null}, {"text": "Treat an early look as a first look. See the first item under missing claims: the wording on the later screen is waiting for a source or the editor.", "refs": [], "table": null}]}, {"heading": "Nuchal translucency and the heart", "blocks": [{"text": "A nuchal translucency of 3.5 mm or more at 11 to 14 weeks is an indication for detailed cardiac evaluation. This holds even if the measurement later falls into the normal range.", "refs": [12], "table": null}, {"text": "With a nuchal translucency of 3.0 to 3.4 mm, fetal echocardiography may be considered.", "refs": [13], "table": null}]}], "checklist": {"title": "Early cardiac screen", "items": [{"text": "Heart within the chest", "refs": [4]}, {"text": "Rhythm regular", "refs": [4]}, {"text": "Situs and cardiac axis on grey-scale", "refs": [9]}, {"text": "Four-chamber view on grey-scale and on colour or power Doppler", "refs": [9]}, {"text": "Three-vessel-and-trachea view on colour or power Doppler: both arches on the left", "refs": [9]}, {"text": "Thermal index 1.0 or less; Doppler time kept short", "refs": [7]}, {"text": "Nuchal translucency 3.5 mm or more: detailed cardiac evaluation arranged", "refs": [12]}, {"text": "Any suspicion: referred for early fetal echocardiography", "refs": [10]}]}, "drills": {"items": [{"id": "D9-Q01", "question": "What is the status of first-trimester cardiac screening in low-risk pregnancies?", "options": ["Shown to be effective, but neither routine nor mandatory", "Mandatory at every nuchal translucency scan", "Not possible before 18 weeks", "It replaces the second-trimester cardiac screen"], "answer": 0, "explanation": "Early screening has been shown to be effective in low-risk populations but is neither routine nor mandatory; where possible it can be done at the nuchal translucency scan.", "claims": ["IS23-090"], "status": "ai-extracted"}, {"id": "D9-Q02", "question": "What are the minimum cardiac requirements at an early screen?", "options": ["The heart is within the chest and the rhythm is regular", "All five screening planes with colour Doppler", "Both outflow tracts shown crossing", "Pulsed-wave Doppler across all four valves"], "answer": 0, "explanation": "The minimum is seeing the heart within the chest and confirming a regular rhythm.", "claims": ["IS23-091"], "status": "ai-extracted"}, {"id": "D9-Q03", "question": "After what gestation is success in seeing cardiac structures significantly higher?", "options": ["After 12 weeks and 3 days", "After 10 weeks", "After 11 weeks exactly", "Gestation makes no difference within the 11 to 14 week window"], "answer": 0, "explanation": "Success in visualising cardiac structures is significantly higher after 12+3 weeks.", "claims": ["IS23-091"], "status": "ai-extracted"}, {"id": "D9-Q04", "question": "Which three components make up a detailed early cardiac screen?", "options": ["Situs and axis; four-chamber view; three-vessel-and-trachea view", "Four-chamber view; sagittal aortic arch; ductus venosus", "Both outflow tracts; pulmonary veins; aortic isthmus", "Upper abdomen; LVOT; RVOT"], "answer": 0, "expla  better.", "refs": [2], "table": null}, {"text": "You do not need a diagnosis to refer. 'One plane did not meet its criteria' is reason enough.", "refs": [], "table": null}]}, {"heading": "Risk factors add to screening; they do not replace it", "blocks": [{"text": "When there is a significant risk factor for congenital heart disease, fetal echocardiography is indicated in addition to routine screening. How this is arranged depends on local resources, the setting, the availability of examiners and the screening results.", "refs": [3], "table": null}, {"text": "A high proportion of detectable heart disease occurs in pregnancies with no risk factor and no other anomaly. A clean history never excuses a poor screen.", "refs": [4], "table": null}]}, {"heading": "Fetal indications", "blocks": [{"text": "The guideline lists these fetal factors as common indications for fetal echocardiography.", "refs": [5], "table": {"columns": ["Fetal factor", "Detail"], "rows": [["Suspected structural heart anomaly", ""], ["Extracardiac anomaly", "Of a kind associated with heart disease"], ["Suspected abnormal function or a large heart", ""], ["Hydrops", ""], ["Persistent tachycardia", "180 beats per minute or more"], ["Suspected heart block or persistent bradycardia", "110 beats per minute or less"], ["Irregular rhythm", "Frequent or persistent"], ["Increased nuchal translucency", "3.5 mm or more"], ["Genetic abnormality", "Confirmed or suspected"], ["Monochorionic twins", "If resources allow"]]}}, {"text": "A nuchal translucency of 3.5 mm or more at 11 to 14 weeks remains an indication even if the measurement later becomes normal.", "refs": [6], "table": null}]}, {"heading": "Findings on the screen that should not be passed", "blocks": [{"text": "Right-left asymmetry of the ventricles in mid-gestation warrants further examination. Important causes are coarctation of the aorta, an evolving hypoplastic left heart and anomalous pulmonary venous return.", "refs": [7], "table": null}, {"text": "A major difference in size between the two great arteries should lead to further evaluation.", "refs": [8], "table": null}, {"text": "An abnormal cardiac axis raises the risk of a cardiac malformation, especially of the outflow tracts, and may be associated with a chromosomal anomaly.", "refs": [9], "table": null}, {"text": "If the heart or the stomach is not on the left, suspect a situs abnormality.", "refs": [10], "table": null}]}, {"heading": "Maternal and family indications", "blocks": [{"text": "The guideline lists these maternal, family and exposure factors as common indications.", "refs": [11], "table": {"columns": ["Factor", "Detail"], "rows": [["Congenital heart disease in a first-degree relative of the fetus", ""], ["Mendelian disease with childhood cardiac manifestations", "In a first- or second-degree relative"], ["Pregestational diabetes", "Whatever the HbA1c"], ["Anti-Ro/SSA antibodies", ""], ["Phenylketonuria", "Unknown status, or periconceptional phenylalanine above 10 mg/dL"], ["Retinoid exposure", ""], ["Confirmed fetal infection", "TORCH or parvovirus B19"]]}}]}, {"heading": "May be considered", "blocks": [{"text": "For some factors the guideline says fetal echocardiography may be considered.", "refs": [12], "table": {"columns": ["Factor", "Detail"], "rows": [["Congenital heart disease in a second-degree relative", ""], ["Gestational diabetes", "Diagnosed in the first or early second trimester"], ["Nuchal translucency", "3.0 to 3.4 mm"], ["Selected teratogens", "For example paroxetine, carbamazepine, lithium, sodium valproate"], ["Conception by IVF", "Including ICSI"], ["ACE inhibitor use", ""]]}}]}, {"heading": "Not enough evidence of raised risk", "blocks": [{"text": "For these factors the guideline finds insufficient evidence that risk is significantly above baseline. It does not list them as indications for fetal echocardiography.", "refs": [13], "table": {"columns": ["Factor", "Detail"], "rows": [["Obesity", "BMI 35 or more"], ["SSRI expo
