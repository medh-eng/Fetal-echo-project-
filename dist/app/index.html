can Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – Table 4 (measurements), footnote, p. 692. (AS23-156, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – III.F Cardiac Biometry and Measurement Data, p. 689. (AS23-152, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – III.F Cardiac Biometry and Measurement Data, p. 689. (AS23-153, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – Table 5, p. 693; referred to in III.F, p. 689. (AS23-154, ai-cross-checked)"]}, {"id": "XB1", "title": "Lesion atlas: septal and atrioventricular lesions (AVSD, common valve, straddling, VSD)", "tier": "Diagnose", "version": 0.1, "summary": "How to examine an abnormal atrioventricular junction, how to judge balance in AVSD, and the traps of straddling, overriding and crisscross connections.", "public": false, "status": "ai-cross-checked", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-cross-checked' that no clinician has verified.", "objectives": ["Set out the imaging approach to any atrioventricular valve abnormality.", "Describe what to examine when an atrioventricular septal defect is suspected, and how imbalance is measured.", "Define straddling and overriding valves and say why they matter for surgery.", "Name the associations and pitfalls of a common atrioventricular valve."], "sections": [{"heading": "Approach to any atrioventricular valve abnormality", "blocks": [{"text": "Lesions of the atrioventricular junction may be isolated, often with aneuploidy including trisomy 21, or complex, with several associated defects.", "refs": [1], "table": null}, {"text": "Malformed atrioventricular valves carry high rates of ventricular disproportion, ventricular septal defects and malformation of the outflows and great arteries, and may lead to single-ventricle palliation.", "refs": [2], "table": null}, {"text": "Start with the four-chamber view, the atrioventricular septum aligned perpendicular to the beam. A sagittal view of the thorax best shows valve morphology, chordae and papillary muscles in short axis. Use non-standard planes and en face imaging when the junction looks abnormal. Obtain cephalad sweeps to define the outflows and great arteries.", "refs": [3, 4, 5, 6], "table": null}, {"text": "Measure the annulus in early diastole at the hinge points.", "refs": [7], "table": null}, {"text": "Evaluate every cardiac structure, including ventricular size and function and the balance of the junction over the ventricles.", "refs": [8], "table": null}, {"text": "Doppler: pulsed-wave Doppler of inflow is essential, but peak velocity may underestimate stenosis because fetal flow can redistribute. At each study a complete Doppler assessment must cover stenosis, regurgitation and flow at the atrial septum and ductus.", "refs": [9, 10], "table": null}, {"text": "Delineate any additional lesion that affects the surgical approach, to help decide between palliation and biventricular repair.", "refs": [11], "table": null}]}, {"heading": "Atrioventricular septal defect", "blocks": [{"text": "Views: examine the left atrioventricular valve en face for a cleft or common orifice; check the atrial septum for a primum defect and the ventricular septum for an inlet defect.", "refs": [12, 13], "table": null}, {"text": "Doppler: assess valve regurgitation with colour Doppler.", "refs": [14], "table": null}, {"text": "Measuring balance: the valve area over each ventricle can be measured in diastole from a parasagittal view to give an atrioventricular valve index. The right-to-left ventricular inflow angle can be measured from an apical four-chamber view; a smaller angle means greater imbalance.", "refs": [15, 16], "table": null}, {"text": "Unbalanced AVSD: measure the right and left atrioventricular valve diameter or area; the Cohen index, valve index and inflow angle are listed. Regurgitation of the common valve may progress. Consider right or left atrial isomerism (heterotaxy).", "refs": [17, 18, 19], "table": null}]}, {"heading": "Common atrioventricular valve", "blocks": [{"text": "Views: suspected when the crux lacks offset, or the valves appear at the same level, with large atrial or ventricular septal defects.", "refs": [20], "table": null}, {"text": "Associations: bilateral superior venae cavae, an interrupted inferior vena cava, or total anomalous pulmonary venous return.", "refs": [21], "table": null}, {"text": "Pitfall: additional ventricular septal defects may be missed unless they are looked for.", "refs": [22], "table": null}]}, {"heading": "Straddling, overriding and crisscross connections", "blocks": [{"text": "Definitions: in a straddling valve, chordae pass through a ventricular septal defect and attach in the opposite ventricle. In an overriding valve, the annulus sits over the septum and opens into both ventricles.", "refs": [23, 24], "table": null}, {"text": "Suspect a complex junction when the four-chamber view does not show two separate valves with offset at the crux. Image the valves with combined two-dimensional, colour and pulsed-wave Doppler from several views; video clips and live scanning show straddling better than still images.", "refs": [25, 26, 27], "table": null}, {"text": "Associations: straddling can occur with D- or L-looped ventricles and carries a risk of heart block. If the left valve is hypoplastic, the fetus is at risk of left atrial hypertension.", "refs": [28, 29], "table": null}, {"text": "Surgery: a straddling or overriding valve may make closure of the ventricular septal defect impossible and may require a single-ventricle approach.", "refs": [30], "table": null}, {"text": "Pitfall: in a crisscross heart, foreshortening can cause confusion between one and two ventricles.", "refs": [31], "table": null}]}, {"heading": "Ventricular septal defect", "blocks": [{"text": "Evolution: a ventricular septal defect can get smaller, with less severe or resolved disease. This usually happens with simple isolated defects, including muscular ones, but can occur in other heart disease.", "refs": [32], "table": null}]}], "checklist": {"title": "Atrioventricular junction: minimum record", "items": [{"text": "Four-chamber view with the septum perpendicular; sagittal short-axis view of the valve; en face views", "refs": [3, 4, 5]}, {"text": "Annulus measured in early diastole at the hinge points", "refs": [7]}, {"text": "Balance assessed: valve index and inflow angle where an AVSD is present", "refs": [15, 16, 17]}, {"text": "Complete Doppler: stenosis, regurgitation, atrial septal and ductal flow", "refs": [10, 14]}, {"text": "Outflows defined with cephalad sweeps", "refs": [6]}, {"text": "Additional VSDs looked for; straddling recorded on clips", "refs": [22, 27]}]}, "drills": {"items": [{"id": "XB1-Q01", "question": "An atrioventricular junction lesion is found with no other defect. Which association should be considered?", "options": ["Aneuploidy, including trisomy 21", "Maternal diabetes only", "No association; isolated lesions are always sporadic", "Fetal anaemia"], "answer": 0, "explanation": "Isolated AV junction lesions are often associated with aneuploidy, including trisomy 21.", "claims": ["AS23-249"], "status": "ai-cross-checked"}, {"id": "XB1-Q02", "question": "Which view best shows atrioventricular valve morphology, chordae and papillary muscles in short axis?", "options": ["A sagittal view of the fetal thorax", "The three-vessel-and-trachea view", "The abdominal situs view", "The ductal arch view"], "answer": 0, "explanation": "A sagittal view of the thorax best shows the valve in short axis.", "claims": ["AS23-243"], "status": "ai-cross-checked"}, {"id": "XB1-Q03", "question": "Peak inflow velocity across a stenotic atrioventricular valve looks modest. Why be careful?", "options": ["Peak velocity may underestimate stenosis because fetal flow can redistribute", "Peak velocity always overestimates stenosis", "Velocity cannot be measured in the fetus", "There is no reason; modest velocity excludes stenosis"], "answer": 0, "explanation": "Fetal flow redistribution means peak velocity may underestimate severity.", "claims": ["AS23-244"], "status": "ai-cross-checked"}, {"id": "XB1-Q04", "question": "AVSD is suspected. What should be examined en face?", "options": ["The left atrioventricular valve, for a cleft or common orifice", "The pulmonary valve, for leaflet number", "The ductus venosus", "The aortic arch"], "answer": 0, "explanation": "The left AV valve should be examined en face for a cleft or common orifice.", "claims": ["AS23-251"], "status": "ai-cross-checked"}, {"id": "XB1-Q05", "question": "In AVSD, what does a smaller right-to-left ventricular inflow angle indicate?", "options": ["Greater imbalance", "A balanced defect", "A normal heart", "Heart block"], "answer": 0, "explanation": "The inflow angle is measured from an apical four-chamber view; a smaller angle indicates greater imbalance.", "claims": ["AS23-254"], "status": "ai-cross-checked"}, {"id": "XB1-Q06", "question": "Features of an unbalanced AVSD are seen. Which condition should be considered?", "options": ["Right or left atrial isomerism (heterotaxy)", "Isolated coarctation", "Ductal constriction", "Twin-twin transfusion"], "answer": 0, "explanation": "With unbalanced AVSD, right or left atrial isomerism should be considered.", "claims": ["AS23-235"], "status": "ai-cross-checked"}, {"id": "XB1-Q07", "question": "A common atrioventricular valve is seen. Which venous anomalies often accompany it?", "options": ["Bilateral superior venae cavae, interrupted inferior vena cava, total anomalous pulmonary venous return", "None; veins are always normal", "Persistent right umbilical vein only", "Agenesis of the ductus venosus only"], "answer": 0, "explanation": "These three are listed with a common AV valve.", "claims": ["AS23-259"], "status": "ai-cross-checked"}, {"id": "XB1-Q08", "question": "With a common atrioventricular valve, what may be missed unless specifically looked for?", "options": ["Additional ventricular septal defects", "A right aortic arch", "The fetal heart rate", "The pulmonary valve"], "answer": 0, "explanation": "Additional VSDs may be missed unless looked for.", "claims": ["AS23-260"], "status": "ai-cross-checked"}, {"id": "XB1-Q09", "question": "Chordae from one atrioventricular valve pass through a VSD and attach in the opposite ventricle. What is this called, and why does it matter?", "options": ["A straddling valve; closure of the VSD may be impossible", "An overriding valve; it has no surgical relevance", "A cleft valve; it always closes after birth", "A normal variant"], "answer": 0, "explanation": "This is straddling. A straddling or overriding valve may make VSD closure impossible and require a single-ventricle approach.", "claims": ["AS23-270", "AS23-277"], "status": "ai-cross-checked"}, {"id": "XB1-Q10", "question": "Straddling valve with a hypoplastic left atrioventricular valve. Which risk follows?", "options": ["Left atrial hypertension", "Pulmonary valve regurgitation", "Ductal aneurysm", "No added risk"], "answer": 0, "explanation": "With a hypoplastic left AV valve, the fetus is at risk of left atrial hypertension.", "claims": ["AS23-2 arctation and its main diagnostic limit."], "sections": [{"heading": "Suspecting left heart obstruction", "blocks": [{"text": "Progressive semilunar valve obstruction is suspected when the three-vessel view is abnormal or the four chambers are asymmetric.", "refs": [1], "table": null}, {"text": "Fetal aortic and pulmonary stenosis span a broad range of severity.", "refs": [2], "table": null}]}, {"heading": "Aortic stenosis", "blocks": [{"text": "Doppler: evaluate valve morphology, size, patency and competence with colour, pulsed-wave and continuous-wave Doppler.", "refs": [3], "table": null}, {"text": "Pitfall: aortic valve Doppler may not reflect severity when left ventricular dysfunction is severe. Reversed flow in the transverse arch predicts severe obstruction.", "refs": [4], "table": null}, {"text": "Critical obstruction: retrograde flow in the arch on the side of the obstructed valve heralds critical obstruction at any gestation. If it is absent at first, look for it again through the pregnancy.", "refs": [5], "table": null}, {"text": "Measure: ventricular size (end-diastolic diameter and length), whether the left ventricle forms the apex, hypertrophy, endocardial fibroelastosis, and systolic and diastolic function. These help judge severity and suitability for prenatal intervention. Assess the function of both ventricles.", "refs": [6, 7], "table": null}, {"text": "Associations: the arch and isthmus are at risk of coarctation and should be assessed.", "refs": [8], "table": null}, {"text": "Evolution: with longer-standing obstruction the ascending aorta can dilate or become hypoplastic, so repeat the measurements. With severe left ventricular dysfunction, the left ventricle may stop forming the apex late in pregnancy.", "refs": [9, 10], "table": null}, {"text": "Left atrial pressure: in severe aortic obstruction, raised left atrial pressure can cause left-to-right atrial shunting and atrial restriction, altering pulmonary venous flow. Assess foramen ovale size and flow.", "refs": [11], "table": null}, {"text": "Follow-up: serial evaluation from the time stenosis is suspected, including ventricular size and function and fibroelastosis. Document ductal and arch flow direction and atrial septal flow direction at every study.", "refs": [12, 13, 14], "table": null}]}, {"heading": "Hypoplastic left heart syndrome", "blocks": [{"text": "Definition: a small left ventricle on the four-chamber view, with mitral and aortic stenosis or atresia. It is the most common form of single ventricle, with an incidence of 0.26 per 1,000 live births.", "refs": [15, 16], "table": null}, {"text": "Views: assess aortic valve patency, the size of the ascending aorta, the transverse arch, and the direction of flow in the distal transverse arch. The ascending aorta diameter may predict outcome after the Norwood operation.", "refs": [17, 18], "table": null}, {"text": "Associations: tricuspid regurgitation with right ventricular dysfunction may increase the risk of fetal death and of illness and death after birth.", "refs": [19], "table": null}, {"text": "Left atrial hypertension: the pulmonary venous forward-to-reverse velocity-time integral ratio is used to detect it. Measure it at every study, the last near term. A ratio below 3 predicts inadequate left atrial egress and a greater chance of emergency atrial septoplasty in the newborn.", "refs": [20, 21, 22], "table": null}, {"text": "Maternal hyperoxygenation: may be considered late in the third trimester in selected cases. Lack of pulmonary vasoreactivity - a fall of less than 10% in pulmonary artery pulsatility index - is associated with neonatal instability and urgent opening of the atrial septum after birth.", "refs": [23, 24], "table": null}, {"text": "Evolution: foramen ovale restriction can lead to pulmonary congestion (nutmeg lung) and, in HLHS, to hypoxaemia, left atrial hypertension and the need for urgent balloon atrial septostomy after birth.", "refs": [25], "table": null}, {"text": "Pitfall: isolated restriction of the foramen ovale may make the left-sided structures look small, with no consequence after birth.", "refs": [26], "table": null}]}, {"heading": "Mitral valve abnormalities", "blocks": [{"text": "Effect: mitral valve abnormalities may reduce flow to the left heart and reverse flow at the foramen ovale.", "refs": [27], "table": null}, {"text": "Views and Doppler: image the mitral valve and atrial septum in two dimensions and colour, and use pulsed-wave Doppler of the pulmonary veins to look for raised left atrial pressure.", "refs": [28, 29], "table": null}, {"text": "Mitral stenosis: the valve may be parachute or hypoplastic; the papillary muscles and a Z-score of the valve are listed for assessment. Foramen ovale size and the pulmonary venous forward-to-reverse ratio are additional measurements. Flow direction at the foramen ovale is critical in judging whether the mitral valve is adequate.", "refs": [30, 31, 32], "table": null}, {"text": "Mitral regurgitation: isolated mitral dysplasia and mitral arcade cause significant regurgitation, and any degree of mitral regurgitation in the fetus is abnormal. When it is present, consider left ventricular outflow obstruction.", "refs": [33, 34], "table": null}]}, {"heading": "Coarctation of the aorta", "blocks": [{"text": "Views: a right ventricle larger than the left, an ascending aorta smaller than the superior vena cava, and a small transverse arch and isthmus. Isolated coarctation is suspected when the transverse aorta is smaller than the ductal arch.", "refs": [35, 36], "table": null}, {"text": "Measure: the aortic isthmus.", "refs": [37], "table": null}, {"text": "Pitfall: prenatal diagnosis of coarctation has substantial false-positive and false-negative rates.", "refs": [38], "table": null}]}], "checklist": {"title": "Left heart obstruction: each study", "items": [{"text": "Valve morphology, size, patency and competence with colour, pulsed-wave and continuous-wave Doppler", "refs": [3]}, {"text": "Arch and ductal flow direction documented", "refs": [13, 5]}, {"text": "Atrial septal flow direction documented; foramen ovale size", "refs": [14, 11]}, {"text": "Left ventricular size, apex, hypertrophy, fibroelastosis and function; both ventricles' function", "refs": [6, 7]}, {"text": "Arch and isthmus assessed for coarctation", "refs": [8, 37]}, {"text": "HLHS: pulmonary venous forward-to-reverse VTI ratio, last one near term", "refs": [21]}]}, "drills": {"items": [{"id": "XB2-Q01", "question": "A screening scan shows asymmetric four chambers and an abnormal three-vessel view. Which group of lesions does the guideline suggest?", "options": ["Progressive semilunar valve obstruction", "Normal variant; no action", "Atrial septal defect only", "Venous anomalies only"], "answer": 0, "explanation": "Progressive semilunar obstruction is suspected when the three-vessel view is abnormal or the four chambers are asymmetric.", "claims": ["AS23-356"], "status": "ai-cross-checked"}, {"id": "XB2-Q02", "question": "Fetal aortic stenosis with a poorly contracting left ventricle. The aortic valve velocity is low. What is the trap?", "options": ["Valve Doppler may not reflect severity when left ventricular dysfunction is severe", "A low velocity always means mild stenosis", "Low velocity means the valve is normal", "Velocity is the only measure that matters"], "answer": 0, "explanation": "Aortic valve Doppler may not reflect severity with severe LV dysfunction; reversed flow in the transverse arch predicts severe obstruction.", "claims": ["AS23-413"], "status": "ai-cross-checked"}, {"id": "XB2-Q03", "question": "In aortic stenosis, which arch finding heralds critical obstruction at any gestation?", "options": ["Retrograde flow in the arch on the side of the obstructed valve", "Antegrade flow in the arch", "A left-sided arch", "A large thymus"], "answer": 0, "explanation": "Retrograde ipsilateral arch flow heralds critical obstruction; if absent at first, it should be looked for repeatedly.", "claims": ["AS23-405"], "status": "ai-cross-checked"}, {"id": "XB2-Q04", "question": "Which features help judge severity and suitability for prenatal intervention in aortic stenosis?", "options": ["Ventricular size, apex formation, hypertrophy, endocardial fibroelastosis and function", "Fetal heart rate only", "Nuchal translucency", "Umbilical cord insertion"], "answer": 0, "explanation": "These ventricular features help judge severity and candidacy for prenatal intervention.", "claims": ["AS23-407"], "status": "ai-cross-checked"}, {"id": "XB2-Q05", "question": "HLHS. A pulmonary venous forward-to-reverse VTI ratio below 3 predicts what?", "options": ["Inadequate left atrial egress and greater likelihood of emergency atrial septoplasty in the newborn", "A normal transition at birth", "Complete heart block", "Coarctation"], "answer": 0, "explanation": "A ratio below 3 predicts inadequate left atrial egress and a greater likelihood of emergency septoplasty.", "claims": ["AS23-222"], "status": "ai-cross-checked"}, {"id": "XB2-Q06", "question": "HLHS with maternal hyperoxygenation testing late in pregnancy. Which result is associated with neonatal instability?", "options": ["A fall of less than 10% in pulmonary artery pulsatility index", "A fall of more than 10% in pulmonary artery pulsatility index", "A rise in fetal heart rate", "No change in umbilical artery flow"], "answer": 0, "explanation": "Lack of vasoreactivity (a fall of less than 10% in branch PA pulsatility index) is associated with neonatal instability and urgent atrial septal opening.", "claims": ["AS23-224"], "status": "ai-cross-checked"}, {"id": "XB2-Q07", "question": "The left heart looks small and the foramen ovale appears restrictive, with no other heart disease. What does the guideline warn?", "options": ["Isolated foramen restriction may make left structures look small with no consequence after birth", "This is always hypoplastic left heart syndrome", "Immediate delivery is needed", "The finding has no relevance at all"], "answer": 0, "explanation": "In isolation, foramen ovale restriction can make left-sided structures appear smaller but have no consequence after delivery.", "claims": ["AS23-283"], "status": "ai-cross-checked"}, {"id": "XB2-Q08", "question": "Mild mitral regurgitation is seen in a fetus. How should it be regarded?", "options": ["As abnormal; and consider left ventricular outflow obstruction", "As a normal finding", "As normal unless the heart rate is low", "As an artefact of colour gain"], "answer": 0, "explanation": "Any degree of fetal mitral regurgitation is abnormal; with mitral regurgitation, consider associated LV outflow obstruction.", "claims": ["AS23-264", "AS23-265"], "status": "ai-cross-checked"}, {"id": "XB2-Q09", "question": "Mitral stenosis. Which finding is critical in judging whether the mitral valve is adequate?", "options": ["Direction of flow at the foramen ovale", "Fetal heart rate", "Cardiac axis", "Thymus size"], "answer": 0, "explanation": "Flow direction at the foramen ovale is critical in judging adequacy of the mitral valve.", "claims": ["AS23-269"], "status": "ai-cross-checked"}, {"id": "XB2-Q10", "question": "Which set of findings suggests coarctation?", "options": ["Right ventricle larger than left, ascending aorta smaller than the superior vena cava, small arch and isthmus", "Left ventricle larger than right with a dilated ascending aorta", "Normal four chambers with a large isthmus", "Pericardial effusion only"], "answer": 0, "explanation": "These are the coarctation findings listed in Table 13.", "claims": ["AS23-443"], "status": "ai-cross-checked"}, {"id": "XB2-Q11", "question": "A colleague says a prenatal diagnosis of coarctation is reliable. What does the guideline say?", "options": ["It has substantial false-positive and false-negative rates", "It is never wrong", "It has false positives but no false negatives", "It is reliable if the heart rate is normal"], "answer": 0, "explanation cian has verified.", "objectives": ["Describe the four-chamber and three-vessel findings in pulmonary stenosis, including when the four-chamber view looks normal.", "Explain what reversed ductal flow means, and how coronary fistulae are looked for.", "Name the first clue to Ebstein anomaly or tricuspid dysplasia and the Doppler that separates true from functional pulmonary atresia.", "Explain why severe regurgitation leads to cardiomegaly, heart failure and hydrops."], "sections": [{"heading": "Pulmonary stenosis and atresia with intact septum", "blocks": [{"text": "Views: right atrial enlargement and a right ventricle smaller than the left, hypertrophied and with reduced function. The four-chamber view may look normal, with reversed colour flow in the ductus or main pulmonary artery on the three-vessel view.", "refs": [1], "table": null}, {"text": "Doppler: increased A-wave reversal in the systemic veins is common. Reversed ductal flow suggests ductal dependence.", "refs": [2, 3], "table": null}, {"text": "Measure: the tricuspid annulus and the pulsed-wave inflow duration.", "refs": [4], "table": null}, {"text": "Coronary fistulae: pulmonary valve atresia or near-atresia with a small right ventricle can be associated with coronary artery fistulae. Suspect them when low-velocity colour Doppler shows to-and-fro flow in the right ventricular free wall or septum. Tricuspid regurgitation greater than mild on colour Doppler is associated with a low risk of these sinusoids.", "refs": [5, 6], "table": null}, {"text": "Follow-up: serial evaluation from the time stenosis is suspected; flow direction in the ductal and aortic arches and at the atrial septum at every study; function of both ventricles.", "refs": [7, 8, 9, 10], "table": null}]}, {"heading": "Ebstein anomaly and tricuspid valve dysplasia", "blocks": [{"text": "First clue: significant right atrial dilatation, with or without right ventricular dilatation.", "refs": [11], "table": null}, {"text": "Views: tricuspid valve anatomy on the four-chamber and short-axis views clarifies the diagnosis.", "refs": [12], "table": null}, {"text": "Doppler: pulsed- and continuous-wave Doppler of the regurgitant jet is critical to exclude primary pulmonary obstruction and to gauge right ventricular systolic pressure.", "refs": [13], "table": null}, {"text": "Functional pulmonary atresia: in severe tricuspid disease the right ventricle may be unable to exceed systemic pressure and open the pulmonary valve. Structural or functional pulmonary atresia here is always associated with retrograde ductal flow, which can appear at any point, so document ductal flow serially.", "refs": [14, 15], "table": null}, {"text": "Measure: the tricuspid annulus and peak tricuspid regurgitation velocity, both listed as predicting progression. Image and measure the branch pulmonary arteries, because their hypoplasia correlates with lung hypoplasia. Assess left ventricular morphology, size and function, because left ventricular dysfunction can cause compromise.", "refs": [16, 17, 18], "table": null}, {"text": "Associations and evolution: hypoplasia of the pulmonary valve and main pulmonary artery is common, because right ventricular output is reduced. Look for other defects, including coarctation and ventricular septal defect.", "refs": [19, 20], "table": null}, {"text": "Rhythm: assess it, because atrial ectopy and supraventricular tachyarrhythmias are common.", "refs": [21], "table": null}]}, {"heading": "Why severe regurgitation is dangerous", "blocks": [{"text": "Significant atrioventricular or semilunar regurgitation imposes a volume load that the fetal circulation tolerates poorly, causing progressive cardiomegaly.", "refs": [22, 23], "table": null}, {"text": "Severe tricuspid regurgitation with progressive cardiomegaly can evolve into heart failure and hydrops. When both ventricles fail, redistribution of preload is impaired, with haemodynamic instability, raised filling pressures and hydrops.", "refs": [24, 25], "table": null}, {"text": "Pulmonary regurgitation with a patent ductus can cause a circular shunt and placental steal.", "refs": [26], "table": null}, {"text": "Regurgitation may worsen as pregnancy advances, so follow it serially.", "refs": [27], "table": null}]}], "checklist": {"title": "Right heart lesion: each study", "items": [{"text": "Ductal flow direction documented", "refs": [8, 15]}, {"text": "Atrial septal flow direction documented", "refs": [9]}, {"text": "Tricuspid annulus; tricuspid regurgitation velocity by PW and CW", "refs": [4, 16, 13]}, {"text": "Branch pulmonary arteries measured", "refs": [17]}, {"text": "Left ventricle: size and function; both ventricles' function", "refs": [18, 10]}, {"text": "Heart size and signs of hydrops; rhythm", "refs": [24, 21]}, {"text": "Pulmonary atresia with small RV: low-velocity colour for fistulae", "refs": [5]}]}, "drills": {"items": [{"id": "XB3-Q01", "question": "The four-chamber view looks normal, but the three-vessel view shows reversed flow in the ductus. Which lesion should you consider?", "options": ["Pulmonary stenosis or atresia", "Coarctation", "Normal finding at mid-trimester", "Ductal aneurysm"], "answer": 0, "explanation": "In pulmonary stenosis the four-chamber view may look normal while reversed colour flow is seen in the ductus or main PA.", "claims": ["AS23-418"], "status": "ai-cross-checked"}, {"id": "XB3-Q02", "question": "What does reversed ductal flow suggest in pulmonary stenosis?", "options": ["Ductal dependence", "Mild disease that needs no follow-up", "Ductal constriction", "A normal transition"], "answer": 0, "explanation": "Reversed ductal flow suggests ductal dependence.", "claims": ["AS23-420"], "status": "ai-cross-checked"}, {"id": "XB3-Q03", "question": "Pulmonary atresia with a small right ventricle. How do you look for coronary fistulae?", "options": ["Low-velocity colour Doppler for to-and-fro flow in the right ventricular free wall or septum", "High-velocity colour scale on the aortic arch", "M-mode of the left ventricle", "They cannot be seen before birth"], "answer": 0, "explanation": "Fistulae are suspected when low-velocity colour shows to-and-fro flow in the RV free wall or septum.", "claims": ["AS23-421"], "status": "ai-cross-checked"}, {"id": "XB3-Q04", "question": "Pulmonary stenosis with more than mild tricuspid regurgitation on colour. What does this suggest about sinusoids?", "options": ["A low risk of sinusoids", "A high risk of sinusoids", "Sinusoids are certain", "No relation"], "answer": 0, "explanation": "Tricuspid regurgitation greater than mild is associated with a low risk of sinusoids.", "claims": ["AS23-448"], "status": "ai-cross-checked"}, {"id": "XB3-Q05", "question": "What is the first clue to Ebstein anomaly or tricuspid dysplasia?", "options": ["Significant right atrial dilatation", "A small left ventricle", "A right aortic arch", "Pericardial effusion"], "answer": 0, "explanation": "Significant right atrial dilatation, with or without RV dilatation, is the first clue.", "claims": ["AS23-424"], "status": "ai-cross-checked"}, {"id": "XB3-Q06", "question": "Severe tricuspid regurgitation; the pulmonary valve does not seem to open. Why is Doppler of the regurgitant jet critical?", "options": ["To exclude primary pulmonary obstruction and gauge right ventricular pressure", "To measure the heart rate", "To confirm that the valve is normal", "It is not useful here"], "answer": 0, "explanation": "PW and CW Doppler of the TR jet exclude primary pulmonary obstruction and show whether the RV can generate pressure; the RV may fail to open the valve (functional atresia).", "claims": ["AS23-427", "AS23-428"], "status": "ai-cross-checked"}, {"id": "XB3-Q07", "question": "Severe tricuspid disease with pulmonary atresia, structural or functional. Which ductal finding is always present?", "options": ["Retrograde ductal flow", "Antegrade ductal flow", "Ductal aneurysm", "Absent ductus"], "answer": 0, "explanation": "It is always associated with retrograde ductal flow, which can develop at any point and must be documented serially.", "claims": ["AS23-429"], "status": "ai-cross-checked"}, {"id": "XB3-Q08", "question": "Ebstein anomaly. Why measure the branch pulmonary arteries?", "options": ["Their hypoplasia correlates with lung hypoplasia", "To estimate gestational age", "To predict heart block", "They are not measured"], "answer": 0, "explanation": "Branch PA hypoplasia correlates with lung hypoplasia.", "claims": ["AS23-431"], "status": "ai-cross-checked"}, {"id": "XB3-Q09", "question": "Ebstein anomaly. Which rhythm problems are common?", "options": ["Atrial ectopy and supraventricular tachyarrhythmias", "Complete heart block in every case", "None", "Ventricular fibrillation"], "answer": 0, "explanation": "Atrial ectopy and supraventricular tachyarrhythmias are common, so rhythm should be assessed.", "claims": ["AS23-434"], "status": "ai-cross-checked"}, {"id": "XB3-Q10", "question": "Pulmonary regurgitation with a patent ductus. What can result?", "options": ["A circular shunt and placental steal", "Ductal closure", "Improved cardiac output", "Coarctation"], "answer": 0, "explanation": "This combination can cause a circular shunt and placental steal.", "claims": ["AS23-442"], "status": "ai-cross-checked"}]}, "video": null, "missing": ["Awaiting re-check after rewording on 21 Nov (round 5, task J): vena contracta width relative to the annulus (AS23-426); left ventricular mechanics in severe tricuspid disease (AS23-433); ductal anatomy and left pulmonary artery stenosis in pulmonary stenosis (AS23-361, new); gradients not indicating severity (AS23-362, new).", "Displacement of the tricuspid septal leaflet as a measure separating Ebstein anomaly from dysplasia, and outcome scores (for example the Celermajer index) - not in the claims held; needs a source.", "Fetal pulmonary valvuloplasty for pulmonary atresia with intact septum - unit Z5.", "Video outline not yet written."], "reference j.echo.2023.04.014 – Table 14 (mechanisms and patterns of progression), pp. 710-711. (AS23-442, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – IV.C.iv Key Points (regurgitation), p. 717. (AS23-440, ai-cross-checked)"]}, {"id": "XB4", "title": "Lesion atlas: conotruncal lesions (tetralogy, transposition, DORV, common trunk)", "tier": "Diagnose", "version": 0.1, "summary": "How outflow tract lesions are found when the four-chamber view looks normal, and, lesion by lesion, what to image, measure, look for and plan.", "public": false, "status": "ai-cross-checked", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-cross-checked' that no clinician has verified.", "objectives": ["Explain why outflow tract lesions are missed on the four-chamber view and which views find them.", "Give the differential diagnosis of a ventricular septal defect with an overriding vessel.", "For tetralogy, absent pulmonary valve, DORV, common trunk, D-transposition and congenitally corrected transposition: name the key findings, measurements, associations and perinatal points.", "Name the conotruncal findings that change delivery planning."], "sections": [{"heading": "Finding outflow lesions", "blocks": [{"text": "Outflow tract lesions are found at screening with the outflow, three-vessel and three-vessel-and-trachea views. They often show little abnormality on the four-chamber view.", "refs": [1], "table": null}, {"text": "When the four-chamber view is normal, Table 13 of the guideline lists three clues: an abnormal cardiac axis (below 30° or above 60°), a left ventricular outflow view that is abnormal or cannot be obtained, and an abnormal three-vessel view.", "refs": [2], "table": null}, {"text": "Sweeps from the four-chamber view through the outflow, three-vessel and three-vessel-and-trachea views detail the segmental anatomy. Short-axis and coronal views help locate the ventricular septal defect and show how the great arteries relate.", "refs": [3, 4], "table": null}, {"text": "Outflow lesions are often associated with anomalies of the veins, atrioventricular valves, septum, branch pulmonary arteries and arch. A complete evaluation includes the branch pulmonary arteries at their origins.", "refs": [5, 6], "table": null}, {"text": "The aortic arch is at risk in any lesion with subaortic obstruction or a subpulmonary ventricular septal defect. Image it with two-dimensional and Doppler imaging in axial and sagittal planes.", "refs": [7], "table": null}, {"text": "Pitfall: a ventricular septal defect with an overriding great vessel has a differential diagnosis - tetralogy of Fallot, pulmonary atresia with ventricular septal defect, double-outlet right ventricle and common arterial trunk.", "refs": [8], "table": null}]}, {"heading": "Tetralogy of Fallot", "blocks": [{"text": "Definition: an overriding aorta with obstruction below or at the pulmonary valve that ranges from mild stenosis to atresia, or a dilated outflow with absent pulmonary valve.", "refs": [9], "table": null}, {"text": "Views: the branch pulmonary arteries must be identified at their origins. Discontinuity, segmental stenosis and major aortopulmonary collaterals can coexist with an outflow or ductus that looks patent.", "refs": [10], "table": null}, {"text": "Measure: the branch pulmonary arteries, the pulmonary valve annulus serially, and the infundibulum.", "refs": [11], "table": null}, {"text": "Associations: atrioventricular septal defect; bilateral superior venae cavae, a retroaortic innominate vein, right aortic arch, vascular rings and aortopulmonary window. Imaging the arch and the thymus allows counselling tailored to the risk of 22q11 deletion.", "refs": [12, 13, 14], "table": null}, {"text": "Perinatal: ductal flow direction at 28 weeks predicts the need for neonatal intervention.", "refs": [15], "table": null}]}, {"heading": "Absent pulmonary valve syndrome", "blocks": [{"text": "Definition and associations: most often with tetralogy and a subaortic ventricular septal defect, but it can occur with an intact ventricular septum. Telling these apart is critical for surgical planning and for assessing 22q11.2 deletion.", "refs": [16, 17], "table": null}, {"text": "Views: a hypoplastic pulmonary annulus with tiny leaflets and to-and-fro colour flow across the valve. Key findings: dilated main and branch pulmonary arteries, and an enlarged right atrium and ventricle.", "refs": [18, 19], "table": null}, {"text": "Doppler: the ductus is typically absent, but look for it, because its presence affects prognosis.", "refs": [20], "table": null}, {"text": "Evolution: progressive right ventricular dysfunction predicts perinatal death; left ventricular dysfunction independently predicts fetal death.", "refs": [21], "table": null}, {"text": "Pitfall and perinatal: note the side of the arch, because an aneurysmal branch pulmonary artery on the same side may compress the airway. An abnormal cardiac position from segmental fluid trapping in the lung may signal airway obstruction after birth and can predict outcome. Fetal MRI may be useful to measure lung volumes or fluid trapping.", "refs": [22, 23, 24], "table": null}]}, {"heading": "Double-outlet right ventricle", "blocks": [{"text": "Definition: the ventricular septal defect may be subaortic, subpulmonary, doubly committed or remote. Its position and the relative sizes of aorta and pulmonary artery must be determined.", "refs": [25], "table": null}, {"text": "Measure: the relationship of the defect to the great vessels and the pathway from left ventricle to aorta - the defect's size and any atrioventricular valve attachments that could prevent a biventricular repair.", "refs": [26], "table": null}, {"text": "Subaortic defect: may resemble tetralogy in anatomy and in physiology after birth.", "refs": [27], "table": null}, {"text": "Subpulmonary defect (Taussig-Bing): a posterior vessel gives rise to the pulmonary artery over the defect, with an anterior aorta. The anterior aorta may be obstructed below the valve and coarctation often accompanies it, so image the arch carefully in two dimensions and colour.", "refs": [28, 29], "table": null}, {"text": "Perinatal: with a subpulmonary defect and a straddling mitral valve, a neonatal Damus-Kaye-Stansel operation may be more feasible than an arterial switch.", "refs": [30], "table": null}]}, {"heading": "Common arterial trunk", "blocks": [{"text": "Definition: a single arterial trunk gives rise directly to the coronary arteries, the aorta and one or both pulmonary arteries. The spectrum runs from pulmonary-dominant forms (smaller aortic part, with or without arch interruption) to aortic-dominant forms.", "refs": [31, 32], "table": null}, {"text": "Views: the ductus is often absent, but one may be present in any form.", "refs": [33], "table": null}, {"text": "Measure: truncal valve velocity and regurgitation, and the proximal branch pulmonary arteries.", "refs": [34], "table": null}, {"text": "Evolution: truncal valve function, especially significant regurgitation, can affect survival in utero.", "refs": [35], "table": null}, {"text": "Associations: with a right aortic arch the risk of 22q11 deletion is above 50%.", "refs": [36], "table": null}]}, {"heading": "D-transposition of the great arteries", "blocks": [{"text": "Pitfall: a posterior pulmonary artery arising from the left ventricular outflow is seen in both D-transposition and congenitally corrected transposition.", "refs": [37], "table": null}, {"text": "Measure: the size of the foramen ovale, best defined in the sagittal view; a septal excursion index is an additional measurement.", "refs": [38], "table": null}, {"text": "Follow-up and perinatal: every fetus with D-transposition should have the foramen ovale assessed late in gestation, and delivery planned where the atrial communication can be enlarged if shunting is inadequate.", "refs": [39, 40], "table": null}, {"text": "Evolution: constriction of the ductus can be lethal in critical heart disease, and transposition is at higher risk.", "refs": [41], "table": null}, {"text": "Limits: it is still hard to predict which fetuses with a restrictive atrial septum will need intervention immediately after birth; maternal hyperoxygenation testing has been studied but the data are incomplete.", "refs": [42], "table": null}]}, {"heading": "Congenitally corrected transposition", "blocks": [{"text": "Definition: atrioventricular and ventriculoarterial discordance together give physiologically corrected flow.", "refs": [43], "table": null}, {"text": "Associations: a ventricular septal defect may be present in 60% to 70%, of variable type and site. Tricuspid valve dysplasia, Ebstein malformation and coarctation can occur with it.", "refs": [44, 45], "table": null}, {"text": "Views and measure: tricuspid displacement and regurgitation are common and affect prognosis; measure atrioventricular intervals and assess the ventricular septal defect.", "refs": [46], "table": null}, {"text": "Evolution and follow-up: rhythm problems, including congenital heart block, can arise before birth and affect survival. Serial studies should be offered to find progressive atrioventricular valve regurgitation and rhythm abnormalities.", "refs": [47, 48], "table": null}]}], "checklist": {"title": "Conotruncal lesion: minimum record", "items": [{"text": "Outflow, three-vessel and three-vessel-and-trachea views and sweeps recorded", "refs": [1, 3]}, {"text": "Position of the ventricular septal defect and relation of the great arteries defined", "refs": [4, 25]}, {"text": "Branch pulmonary arteries imaged at their origins", "refs": [6, 10]}, {"text": "Arch imaged in axial and sagittal planes when the arch is at risk", "refs": [7]}, {"text": "Arch and thymus imaged where 22q11 deletion is a concern", "refs": [14]}, {"text": "D-transposition: foramen ovale reassessed late in gestation", "refs": [39]}, {"text": "Corrected transposition: atrioventricular intervals and rhythm recorded; serial studies offered", "refs": [46, 48]}]}, "drills": {"items": [{"id": "XB4-Q01", "question": "The four-chamber view is normal. Which views find most outflow tract lesions at screening?", "options": ["Outflow, three-vessel and three-vessel-and-trachea views", "Four-chamber view at a different angle", "Abdominal situs view", "Ductus venosus Doppler"], "answer": 0, "explanation": "Outflow lesions are found with the outflow, three-vessel and three-vessel-and-trachea views and often show little on the four-chamber view.", "claims": ["AS23-300"], "status": "ai-cross-checked"}, {"id": "XB4-Q02", "question": "You see a ventricular septal defect with an overriding great vessel. Which list is the differential the guideline gives?", "options": ["Tetralogy of Fallot, pulmonary atresia with VSD, double-outlet right ventricle, common arterial trunk", "Tetralogy only", "D-transposition and corrected transposition", "Coarctation and interrupted arch"], "answer": 0, "explanation": "These four make up the differential of a VSD with an overriding vessel.", "claims": ["AS23-304"], "status": "ai-cross-checked"}, {"id": "XB4-Q03", "question": "Tetralogy of Fallot: the outflow and duct look patent. Why still image the branch pulmonary arteries at their origins?", "options": ["Discontinuity, segmental stenosis and major aortopulmonary collaterals can coexist with a patent-looking outflow", "Because the branches are always absent in tetralogy", "Only to measure the heart rate", "It is not needed when the outflow looks patent"], "answer": 0, "explanation": "The branch pulmonary arteries must be identified at their origins for exactly this reason.", "claims": ["AS23-311"], "status": "ai-cross-checked"}, {"id": "XB4-Q04", "question": "Tetralogy of Fallot. Why image the arch and the thymus?", "options": ["To tailor counselling to the risk of 22q11 deletion", "To measure the cardiac axis", "To predict heart block", "To estimate gestational age"], "answer": 0, "explanation": "Imaging the arch and the thymus allows counselling tailored to the risk of 22q11 deletion.", "claims": ["AS23-313"], "status": "ai-cross-checked"}, {"id": "XB4-Q05", "question": "Absent pulmonary valve syndrome. Which pair of findings fits?", "options": ["Hypoplastic annulus with to-and-fro flow; dilated main and branch pulmonary arteries", "Large annulus with forward flow only; small pulmonary arteries", "Normal pulmonary valve; dilated aorta", "Absent tricuspid valve; small right ventricle"], "answer": 0, "explanation": "APVS shows a hypoplastic annulus with tiny leaflets and to-and-fro flow, and dilated main and branch pulmonary arteries with an enlarged right heart.", "claims": ["AS23-319", "AS23-320"], "status": "ai-cross-checked"}, {"id": "XB4-Q06", "question": "Tetralogy with absent pulmonary valve. Why does the side of the aortic arch matter?", "options": ["An aneurysmal branch pulmonary artery on the same side may compress the airway", "It decides the mode of delivery", "It predicts heart block", "It does not matter in this lesion"], "answer": 0, "explanation": "Arch position matters because an aneurysmal ipsilateral branch pulmonary artery may compress the airway.", "claims": ["AS23-322"], "status": "ai-cross-checked"}, {"id": "XB4-Q07", "question": "Double-outlet right ventricle with a subpulmonary defect. What else must be imaged carefully, and why?", "options": ["The aortic arch, because subaortic obstruction and coarctation often accompany it", "The ductus venosus, because it is often absent", "The pulmonary veins, because they are always anomalous", "Nothing else; the defect is the whole lesion"], "answer": 0, "explanation": "The anterior aorta may be obstructed below the valve and coarctation often accompanies it, so the arch needs careful 2D and colour imaging.", "claims": ["AS23-342", "AS23-308"], "status": "ai-cross-checked"}, {"id": "XB4-Q08", "question": "Common arterial trunk with a right aortic arch. What is the stated risk of 22q11 deletion?", "options": ["Above 50%", "Below 5%", "No association", "Exactly the same as with a left arch"], "answer": 0, "explanation": "In common arterial trunk a right aortic arch is associated with a 22q11 deletion risk above 50%.", "claims": ["AS23-350"], "status": "ai-cross-checked"}, {"id": "XB4-Q09", "question": "Common arterial trunk. Which valve finding can affect survival before birth?", "options": ["Significant truncal valve regurgitation", "A bicuspid aortic valve", "Mild tricuspid regurgitation", "None; the trunk is well tolerated in every case"], "answer": 0, "explanation": "Truncal valve function, especially significant regurgitation, can affect survival in utero.", "claims": ["AS23-347"], "status": "ai-cross-checked"}, {"id": "XB4-Q10", "question": "D-transposition is diagnosed at 22 weeks. What must be assessed late in gestation?", "options": ["Patency of the foramen ovale", "Nuchal translucency", "Pulmonary valve annulus serially", "Nothing more; transposition is fixed"], "answer": 0, "explanation": "Every fetus with D-transposition should have the foramen ovale assessed late in gestation, with delivery where the atrial communication can be enlarged.", "claims": ["AS23-330", "AS23-329"], "status": "ai-cross-checked"}, {"id": "XB4-Q11", "question": "A posterior pulmonary artery arises from the left ventricular outflow. Does this alone tell you it is D-transposition?", "options": ["No: corrected transposition shows the same appearance", "Yes: it only occurs in D-transposition", "Yes, if the heart rate is normal", "No: it is a normal variant"], "answer": 0, "explanation": "Both D-transposition and congenitally corrected transposition show a posterior pulmonary artery from the left ventricular outflow.", "claims": ["AS23-328 : "Vascular rings and double aortic arch", "blocks": [{"text": "Key sign: a U shape around the trachea and oesophagus, instead of a V.", "refs": [6], "table": null}, {"text": "Next step: exclude aberrant subclavian arteries and a double aortic arch.", "refs": [7], "table": null}, {"text": "Double aortic arch: colour Doppler shows two arches encircling the trachea and oesophagus, with the innominate vein passing in front of both. Colour and power Doppler can show retrograde and antegrade flow in the smaller arch.", "refs": [8, 9], "table": null}, {"text": "Associations: a vascular ring carries an increased risk of tracheal anomalies, including complete tracheal rings.", "refs": [10], "table": null}]}, {"heading": "Aberrant subclavian artery and pulmonary artery sling", "blocks": [{"text": "Attempt to diagnose an aberrant subclavian artery, especially when the side of the arch is abnormal. An isolated aberrant right subclavian artery runs behind the oesophagus and is seen more clearly with colour Doppler.", "refs": [11, 12], "table": null}, {"text": "A pulmonary artery sling is not a vascular ring, but it may coexist with airway abnormalities. Delivery should be where assisted ventilation is available if needed.", "refs": [13], "table": null}]}, {"heading": "Ductal aneurysm", "blocks": [{"text": "Views: a pulsatile, tortuous duct late in gestation, on the three-vessel, three-vessel-and-trachea or sagittal arch views. Measure it at its widest.", "refs": [14, 15], "table": null}, {"text": "Course: it occurs at 35-40 weeks in 1%-2% of fetuses and mostly closes spontaneously, with a low risk of rupture or compression. It is generally a normal variant with no consequence for the newborn, but it is associated with connective tissue disorders.", "refs": [16, 15], "table": null}]}, {"heading": "Ductal constriction", "blocks": [{"text": "Causes: it occurs in isolation and is associated with cyclo-oxygenase inhibitors (non-steroidal anti-inflammatory drugs) and certain foods or herbal teas. It rarely occurs with structural heart disease.", "refs": [17], "table": null}, {"text": "Consequences: isolated constriction can lead to right heart failure, hydrops, and persistent pulmonary hypertension after birth. In critical heart disease it can be lethal, with transposition at higher risk.", "refs": [18, 19], "table": null}]}, {"heading": "Veins seen alongside arch and other lesions", "blocks": [{"text": "A left superior vena cava draining to the coronary sinus is listed as a common venous variation with coarctation.", "refs": [20], "table": null}]}], "checklist": {"title": "Arch and ductus: minimum record", "items": [{"text": "Three-vessel-and-trachea view: V or not; arch sizes and flow; SVC position against the trachea", "refs": [1, 4, 2]}, {"text": "Arches and head and neck vessels traced in axial, sagittal and parasagittal planes with colour", "refs": [5]}, {"text": "U sign: aberrant subclavian and double arch excluded", "refs": [6, 7]}, {"text": "Aberrant subclavian looked for when arch sidedness is abnormal", "refs": [11]}, {"text": "Ring or sling: airway risk passed on to the delivery plan", "refs": [10, 13]}, {"text": "Ductal aneurysm measured at its widest; constriction: drug and diet history", "refs": [15, 17]}]}, "drills": {"items": [{"id": "XB5-Q01", "question": "What does the normal three-vessel-and-trachea view show?", "options": ["Two arches of similar size forming a V to the left of the trachea", "Two arches forming a U around the trachea", "A single arch to the right of the trachea", "Three arches side by side"], "answer": 0, "explanation": "Normally the ductal and aortic arches form a V to the left of the trachea.", "claims": ["AS23-500"], "status": "ai-cross-checked"}, {"id": "XB5-Q02", "question": "The arches form a U around the trachea and oesophagus. What is this the key sign of?", "options": ["A vascular ring", "A normal heart", "Ductal constriction", "Tetralogy of Fallot"], "answer": 0, "explanation": "A U shape instead of a V is the key sign of a vascular ring.", "claims": ["AS23-503"], "status": "ai-cross-checked"}, {"id": "XB5-Q03", "question": "A vascular ring is suspected. What must then be excluded?", "options": ["Aberrant subclavian arteries and a double aortic arch", "Coarctation only", "Heart block", "Nothing; the diagnosis is complete"], "answer": 0, "explanation": "With a suspected vascular ring, aberrant subclavian arteries and a double arch should be excluded.", "claims": ["AS23-504"], "status": "ai-cross-checked"}, {"id": "XB5-Q04", "question": "Why does a vascular ring matter for the newborn?", "options": ["It carries an increased risk of tracheal anomalies, including complete tracheal rings", "It always needs surgery on the first day", "It causes heart failure before birth", "It has no consequence"], "answer": 0, "explanation": "A vascular ring carries an increased risk of tracheal anomalies.", "claims": ["AS23-505"], "status": "ai-cross-checked"}, {"id": "XB5-Q05", "question": "A pulmonary artery sling is diagnosed. Where should the baby be delivered?", "options": ["Where assisted ventilation is available if needed", "At home", "Anywhere; a sling has no airway relevance", "Only where fetal surgery is possible"], "answer": 0, "explanation": "A sling may coexist with airway abnormalities; delivery should be where assisted ventilation is available.", "claims": ["AS23-506"], "status": "ai-cross-checked"}, {"id": "XB5-Q06", "question": "Which tool shows an aberrant right subclavian artery behind the oesophagus more clearly?", "options": ["Colour Doppler", "M-mode", "Grey scale at high gain", "Pulsed-wave Doppler of the umbilical artery"], "answer": 0, "explanation": "An isolated aberrant right subclavian artery is seen more clearly with colour Doppler.", "claims": ["AS23-509"], "status": "ai-cross-checked"}, {"id": "XB5-Q07", "question": "A pulsatile, tortuous duct is seen at 37 weeks. What is the usual course?", "options": ["It mostly closes spontaneously, with a low risk of rupture or compression", "It always ruptures", "It needs delivery within a day", "It always causes hydrops"], "answer": 0, "explanation": "Ductal aneurysm mostly closes spontaneously with low risk, though it is associated with connective tissue disorders.", "claims": ["AS23-514"], "status": "ai-cross-checked"}, {"id": "XB5-Q08", "question": "Isolated ductal constriction is found. Which history should you ask about?", "options": ["Non-steroidal anti-inflammatory drugs and certain foods or herbal teas", "Paternal age", "Previous caesarean section", "Maternal height"], "answer": 0, "explanation": "Constriction is associated with cyclo-oxygenase inhibitors and certain foods or herbal teas.", "claims": ["AS23-515"], "status": "ai-cross-checked"}, {"id": "XB5-Q09", "question": "What can isolated ductal constriction lead to?", "options": ["Right heart failure, hydrops, and persistent pulmonary hypertension after birth", "Left heart hypoplasia", "Complete heart block", "Nothing; it is harmless"], "answer": 0, "explanation": "Isolated constriction can lead to right heart failure, hydrops and PPHN.", "claims": ["AS23-516"], "status": "ai-cross-checked"}]}, "video": null, "missing": ["Awaiting re-check after rewording on 21 Nov (round 5, task J): arch sidedness and branching pattern in outflow lesions (AS23-307).", "Right aortic arch: mirror-image against aberrant left subclavian branching, the L shape, and the association with 22q11 deletion and with intracardiac disease - needs a source (the checker's suggested Figure 30F claim was not found in the caption).", "How to report an isolated right arch or aberrant subclavian artery, and whether genetic testing is offered - needs a source and the co-editor.", "Systemic and pulmonary venous anomalies are planned for unit XB6; ASE has little on veins.", "Video outline not yet written."], "references": ["Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performan 023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – Table 14 (mechanisms and patterns of progression), pp. 710-711. (AS23-515, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – Table 14 (mechanisms and patterns of progression), pp. 710-711. (AS23-516, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – Table 14 (mechanisms and patterns of progression), pp. 710-711. (AS23-332, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – Table 13 (lesion-specific evaluation), p. 709. (AS23-519, ai-cross-checked)"]}, {"id": "XB8", "title": "Lesion atlas: univentricular hearts", "tier": "Diagnose", "version": 0.1, "summary": "The complete examination of a suspected single ventricle, segment by segment, and the findings that decide ductal dependence, surgery and prognosis.", "public": false, "status": "ai-cross-checked", "banner": "DRAFT - NOT FOR CLINICAL USE. Contains claims with status 'ai-cross-checked' that no clinician has verified.", "objectives": ["Define a univentricular atrioventricular connection and name its forms.", "Carry out the segmental examination of a suspected single ventricle.", "Name the single most powerful predictor of prostaglandin need after birth.", "Recognise tricuspid atresia and double-inlet left ventricle and their main risks."], "sections": [{"heading": "What single ventricle means", "blocks": [{"text": "In a univentricular atrioventricular connection the atria connect completely or mainly to one ventricle. It includes double-inlet left ventricle, single inlet and common inlet.", "refs": [1], "table": null}, {"text": "Single ventricle is often detected at routine screening because the four-chamber view is abnormal, and most cases are diagnosed before birth. Suspect it, or ventricular disproportion, when the axial chest view clearly lacks two symmetric ventricles.", "refs": [2, 3], "table": null}, {"text": "Hypoplastic left heart syndrome is the most common form, at 0.26 per 1,000 live births; hypoplastic right heart syndrome occurs in 0.22 per 1,000.", "refs": [4, 5], "table": null}, {"text": "Treatment is a series of palliative operations ending in a total cavopulmonary (Fontan) connection.", "refs": [6], "table": null}]}, {"heading": "The complete examination", "blocks": [{"text": "A complete fetal echocardiogram must be done before a reasonable prognosis can be given. Use a segmental approach to find the associated findings that matter.", "refs": [7, 8], "table": null}, {"text": "Assess visceroatrial situs, systemic venous connections, the atrioventricular junction, ventricular morphology and function, and heart rate and rhythm.", "refs": [9], "table": null}, {"text": "Veins: look for interruption of the inferior vena cava and for bilateral superior venae cavae. Assess the pulmonary venous connections, because anomalous drainage affects the surgical approach and outcome. Venous anatomy is needed for counselling and postnatal planning.", "refs": [10, 11, 12], "table": null}, {"text": "Atrioventricular junction: the tricuspid or mitral valve may be hypoplastic or atretic, or a common valve may be unbalanced. Measure valve diameter or area and assess regurgitation with colour Doppler. Significant regurgitation can affect fetal well-being and the outcome of surgery.", "refs": [13, 14, 15], "table": null}, {"text": "Outflows: image them thoroughly for orientation, patency, size and flow direction. When the aortic valve is stenotic or atretic, measure the ascending aorta.", "refs": [16, 17], "table": null}, {"text": "Ductal dependence: retrograde flow in the aortic or ductal arch is described as perhaps the single most powerful indicator that prostaglandin will be needed after birth.", "refs": [18], "table": null}, {"text": "Function and rhythm: function is assessed qualitatively in practice; strain imaging is not routine. Bradyarrhythmias are associated with left atrial isomerism and discordant atrioventricular connections, and that combination carries a poor prognosis and a high risk of death in utero.", "refs": [19, 20], "table": null}]}, {"heading": "Tricuspid atresia", "blocks": [{"text": "Views: no atrioventricular connection on the right, a small right ventricle and a ventricular septal defect.", "refs": [21], "table": null}, {"text": "Measure: the ventricular septal defect, in two orthogonal planes.", "refs": [22], "table": null}, {"text": "Evolution: obstruction at the defect can progress and compromise flow to the outflow arising from the right ventricle, leading to pulmonary stenosis or coarctation.", "refs": [23], "table": null}]}, {"heading": "Double-inlet left ventricle", "blocks": [{"text": "Views: both atrioventricular valves open into the morphological left ventricle; the four-chamber view shows a large ventricular septal defect or no septum.", "refs": [24], "table": null}, {"text": "Associations: with L-looped ventricles there is a risk of complete heart block.", "refs": [25], "table": null}]}, {"heading": "Heterotaxy with a single ventricle", "blocks": [{"text": "Regurgitation of the common atrioventricular valve may progress and can affect prognosis.", "refs": [26], "table": null}]}], "checklist": {"title": "Single ventricle: segmental record", "items": [{"text": "Situs, systemic veins (IVC interruption, bilateral SVC), pulmonary veins", "refs": [9, 10, 11]}, {"text": "Atrioventricular valves: diameter or area, regurgitation by colour", "refs": [14]}, {"text": "Outflows: orientation, patency, size, flow direction; ascending aorta if the aortic valve is abnormal", "refs": [16, 17]}, {"text": "Arch flow direction recorded (prostaglandin need)", "refs": [18]}, {"text": "Function (qualitative) and rate and rhythm", "refs": [19, 9]}]}, "drills": {"items": [{"id": "XB8-Q01", "question": "Which defines a univentricular atrioventricular connection?", "options": ["The atria connect completely or mainly to one ventricle", "One great artery arises from both ventricles", "There is a large ventricular septal defect with two normal valves", "One ventricle is slightly smaller than the other"], "answer": 0, "explanation": "Atria connect completely or mainly to one ventricle: double-inlet LV, single inlet and common inlet.", "claims": ["AS23-201"], "status": "ai-cross-checked"}, {"id": "XB8-Q02", "question": "Single ventricle is suspected at screening. When can a reasonable prognosis be given?", "options": ["After a complete fetal echocardiogram", "Immediately, from the four-chamber view", "Only after birth", "After genetic testing alone"], "answer": 0, "explanation": "A complete fetal echocardiogram must be performed before a reasonable prognosis can be given.", "claims": ["AS23-216"], "status": "ai-cross-checked"}, {"id": "XB8-Q03", "question": "Single ventricle. Why must the pulmonary veins be traced?", "options": ["Anomalous drainage affects the surgical approach and outcome", "They are always normal, so it confirms the diagnosis", "To measure the fetal heart rate", "They are not assessed in single ventricle"], "answer": 0, "explanation": "Anomalous pulmonary venous drainage affects surgical approach and outcome.", "claims": ["AS23-208"], "status": "ai-cross-checked"}, {"id": "XB8-Q04", "question": "Which finding is described as perhaps the single most powerful indicator that prostaglandin will be needed after birth?", "options": ["Retrograde flow in the aortic or ductal arch", "A small left atrium", "Mild tricuspid regurgitation", "A right aortic arch"], "answer": 0, "explanation": "Retrograde arch flow is perhaps the single most powerful indicator of prostaglandin need.", "claims": ["AS23-213"], "status": "ai-cross-checked"}, {"id": "XB8-Q05", "question": "Single ventricle with left atrial isomerism and slow ventricular rate. What does the guideline say about this combination?", "options": ["Poor prognosis and a high risk of death in utero", "No effect on prognosis", "The rate always recovers by term", "It improves surgical outcome"], "answer": 0, "explanation": "Bradyarrhythmias with left atrial isomerism and discordant connections carry a poor prognosis and high risk of fetal death.", "claims": ["AS23-214"], "status": "ai-cross-checked"}, {"id": "XB8-Q06", "question": "No right atrioventricular connection, a small right ventricle and a VSD. Which lesion, and what can progress?", "options": ["Tricuspid atresia; obstruction at the VSD", "Ebstein anomaly; tricuspid regurgitation", "Pulmonary atresia; ductal constriction", "AVSD; cleft mitral valve"], "answer": 0, "explanation": "These findings suggest tricuspid atresia; obstruction at the VSD can progress, leading to pulmonary stenosis or coarctation.", "claims": ["AS23-226", "AS23-227"], "status": "ai-cross-checked"}, {"id": "XB8-Q07", "question": "Double-inlet left ventricle with L-looped ventricles. Which risk should be watched for?", "options": ["Complete heart block", "Ductal aneurysm", "Pericardial effusion only", "None"], "answer": 0, "explanation": "DILV with L-looping is at risk of complete heart block.", "claims": ["AS23-230"], "status": "ai-cross-checked"}, {"id": "XB8-Q08", "question": "How is ventricular function usually assessed in single ventricle in practice?", "options": ["Qualitatively; strain imaging is not routine", "Always with strain imaging", "It is ion or output, a quantitative assessment should be performed.", "refs": [2], "table": null}]}, {"heading": "Look for fluid first", "blocks": [{"text": "When dysfunction is suspected, it is important at the first examination to assess for fetal hydrops or its component findings.", "refs": [3], "table": null}, {"text": "The initial survey of any fetal echocardiogram looks for fluid around the heart, in the pleural spaces and in the abdomen.", "refs": [4], "table": null}, {"text": "At screening, a small amount of pericardial fluid, 2 mm or less at end-systole, is common and normal.", "refs": [5], "table": null}]}, {"heading": "Signs on the valves and the inflow", "blocks": [{"text": "Regurgitation through an atrioventricular valve on Doppler may indicate systolic dysfunction.", "refs": [6], "table": null}, {"text": "As diastolic function worsens, the part of the cardiac cycle spent filling may shorten, until only a single inflow wave is seen.", "refs": [7], "table": null}]}, {"heading": "The tools the guideline names", "blocks": [{"text": "Tools for assessing function, each with the limit the guideline attaches to it.", "refs": [8, 9, 10, 11, 12, 13], "table": {"columns": ["Tool", "What it is used for", "Limit or caution"], "rows": [["M-mode", "Systolic function: ventricular shortening fraction; annular plane excursion of the tricuspid and mitral valves", "-"], ["Myocardial performance index", "Overall ventricular performance, combining systolic and diastolic timing", "-"], ["Venous Doppler: A-wave reversal", "Used as an indicator of worsening function", "Unreliable outside sinus rhythm"], ["Continuous-wave Doppler", "Estimating pressure from an atrioventricular valve regurgitant jet", "Not needed when the heart is normal"], ["Cardiovascular profile score", "May help to track cardiovascular compromise on serial examinations", "-"], ["Tissue Doppler and strain", "Myocardial mechanics; strain may detect subclinical dysfunction", "Application in pregnancy needs further investigation"]]}}]}, {"heading": "The compromised fetus", "blocks": [{"text": "A comprehensive assessment of a compromised fetus should include pulsed-wave Doppler of the umbilical artery and the middle cerebral artery, obtained at either the obstetric or the cardiac study.", "refs": [14], "table": null}, {"text": "The follow-up interval should be decided by the fetal cardiology and obstetric teams caring for the patient.", "refs": [15], "table": null}]}], "checklist": {"title": "Function: first steps", "items": [{"text": "Qualitative systolic and diastolic function recorded in every study", "refs": [1]}, {"text": "Hydrops and its component findings looked for; fluid: pericardial, pleural, abdominal", "refs": [3, 4]}, {"text": "Atrioventricular valve regurgitation looked for", "refs": [6]}, {"text": "Concern about function or output: quantitative assessment done", "refs": [2]}, {"text": "Compromised fetus: umbilical artery and middle cerebral artery Doppler included", "refs": [14]}]}, "drills": {"items": [{"id": "XC1-Q01", "question": "What assessment of function must every fetal echocardiogram include?", "options": ["A qualitative assessment of systolic and diastolic function", "A myocardial performance index for both ventricles", "Strain imaging", "None, unless the heart is structurally abnormal"], "answer": 0, "explanation": "Every fetal echocardiogram must include a qualitative assessment of systolic and diastolic function.", "claims": ["AS23-087"], "status": "ai-cross-checked"}, {"id": "XC1-Q02", "question": "When should function be assessed quantitatively?", "options": ["When findings raise concern about cardiac function or output", "In every study", "Only after birth", "Only in twin pregnancies"], "answer": 0, "explanation": "Quantitative assessment should be performed when findings raise concern about function or output.", "claims": ["AS23-088"], "status": "ai-cross-checked"}, {"id": "XC1-Q03", "question": "Dysfunction is suspected. What does the initial assessment look for?", "options": ["Fetal hydrops or its component findings", "The mechanical PR interval", "The side of the aortic arch", "An echogenic intracardiac focus"], "answer": 0, "explanation": "At initial imaging for suspected dysfunction it is important to assess for fetal hydrops or its component findings.", "claims": ["AS23-089"], "status": "ai-extracted"}, {"id": "XC1-Q04", "question": "What may atrioventricular valve regurgitation on Doppler indicate?", "options": ["Systolic dysfunction", "Normal function in every case", "Complete heart block", "A technical artefact only"], "answer": 0, "explanation": "Atrioventricular valve regurgitation on Doppler may indicate systolic dysfunction.", "claims": ["AS23-090"], "status": "ai-cross-checked"}, {"id": "XC1-Q05", "question": "As diastolic function worsens, what may happen to ventricular filling on the inflow Doppler?", "options": ["The filling time shortens until only one inflow wave is seen", "The filling time lengthens and a third wave appears", "Inflow reverses direction", "Nothing changes"], "answer": 0, "explanation": "The fraction of the cycle spent filling may shorten until only one inflow wave is seen.", "claims": ["AS23-091"], "status": "ai-cross-checked"}, {"id": "XC1-Q06", "question": "The fetus is in a tachyarrhythmia and the venous A-wave is reversed. How reliable is this as a sign of worsening function?", "options": ["Unreliable: the sign cannot be trusted outside sinus rhythm", "Fully reliable in any rhythm", "More reliable than in sinus rhythm", "It proves hydrops is present"], "answer": 0, "explanation": "Outside sinus rhythm, venous A-wave reversal is an unreliable indicator of worsening cardiac function.", "claims": ["AS23-093"], "status": "ai-cross-checked"}, {"id": "XC1-Q07", "question": "Which measurements of systolic function does the guideline list for M-mode?", "options": ["Ventricular shortening fraction and annular plane excursion", "Peak velocity across the aortic valve", "Colour velocity scale", "Cardiac axis"], "answer": 0, "explanation": "M-mode is among the tools for systolic function: shortening fraction and annular plane excursion of the tricuspid and mitral valves.", "claims": ["AS23-020"], "status": "ai-cross-checked"}, {"id": "XC1-Q08", "question": "For a compromised fetus, which Doppler recordings should a comprehensive assessment include?", "options": ["Umbilical artery and middle cerebral artery", "Hepatic vein only", "Branch pulmonary arteries only", "None beyond the heart"], "answer": 0, "explanation": "Pulsed-wave Doppler of the umbilical and middle cerebral arteries should be included, at either the obstetric or the cardiac study.", "claims": ["AS23-095"], "status": "ai-cross-checked"}]}, "video": null, "missing": ["How each measurement is made and its normal values (shortening fraction, annular excursion, myocardial performance index, inflow E and A waves) - needs sources; planned with XA6.", "The components of the cardiovascular profile score and how it is scored - not in the claims held; needs a source.", "Cardiomegaly: definition by cardiothoracic ratio and its causes - needs a source.", "Causes of fetal heart failure and hydrops, and what to do about each - planned for XC2; needs a source and a cardiology co-editor.", "This unit's ASE claims were extracted by ChatGPT and are not yet cross-checked against the PDF."], "references": ["Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echocardiography. J Am Soc Echocardiogr. 2023 36(7):679-723. doi:10.1016/j.echo.2023.04.014 – IV.B. Assessment of Fetal Cardiac Functional Abnormalities, Key Points, p. 704. (AS23-087, ai-cross-checked)", "Moon-Grady AJ, Donofrio MT, Gelehrter S, Hornberger L, Kreeger J, Lee W, et al.. Guidelines and Recommendations for Performance of the Fetal Echocardiogram: An Update from the American Society of Echoc
